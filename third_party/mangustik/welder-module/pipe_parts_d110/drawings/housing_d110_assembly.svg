<svg xmlns="http://www.w3.org/2000/svg" width="297.0mm" height="210.0mm" viewBox="0 0 297.0 210.0">
<defs>
<pattern id="hatch" patternUnits="userSpaceOnUse" width="2.2" height="2.2" patternTransform="rotate(45)">
<line x1="0" y1="0" x2="0" y2="2.2" stroke="#333" stroke-width="0.25"/>
</pattern>
</defs>
<style>
  .outline{stroke:#111;stroke-width:0.35;fill:none}
  .hatchrect{stroke:#111;stroke-width:0.35}
  .thin{stroke:#111;stroke-width:0.2;fill:none}
  .dim{stroke:#111;stroke-width:0.15;fill:none}
  .ext{stroke:#555;stroke-width:0.12;fill:none}
  .center{stroke:#933;stroke-width:0.15;stroke-dasharray:6,1.5,1,1.5;fill:none}
  .fillblk{fill:#111;stroke:none}
  .txt{fill:#111}
  .hdr{fill:#111}
  .note{fill:#333;font-style:italic}
  .border{stroke:#111;stroke-width:0.5;fill:none}
</style>
<rect x="0" y="0" width="297.0" height="210.0" fill="#fdfdf7"/>
<rect x="3.00" y="3.00" width="291.00" height="204.00" class="border" fill="none"/>
<text x="20.00" y="20.00" font-size="5.0" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-weight="bold" class="txt">Сборка корпуса d110 — модульная конфигурация</text>
<text x="20.00" y="26.00" font-size="3.2" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-weight="normal" class="txt">Вертикальная ось + два горизонтальных ответвления (эскиз)</text>
<text x="20.00" y="36.00" font-size="2.6" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-weight="normal" class="hdr">ГЛАВНАЯ ОСЬ (вертикальная, Z-направление):</text>
<text x="20.00" y="40.50" font-size="2.6" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-weight="normal" class="txt">  • Нижний сегмент трубы: 200 мм (SDR17)</text>
<text x="20.00" y="45.00" font-size="2.6" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-weight="normal" class="txt">  • Тройник на Z=200 мм (основная развилка)</text>
<text x="20.00" y="49.50" font-size="2.6" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-weight="normal" class="txt">  • Средний сегмент: 150 мм</text>
<text x="20.00" y="54.00" font-size="2.6" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-weight="normal" class="txt">  • Тройник на Z=350 мм (дополнительные ветви)</text>
<text x="20.00" y="58.50" font-size="2.6" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-weight="normal" class="txt">  • Верхний сегмент: 100 мм</text>
<text x="20.00" y="63.00" font-size="2.6" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-weight="normal" class="txt">  • Заглушка верхняя (Z=500 мм) — закрытие оси</text>
<text x="20.00" y="67.50" font-size="2.6" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-weight="normal" class="hdr"></text>
<text x="20.00" y="72.00" font-size="2.6" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-weight="normal" class="hdr">БОКОВЫЕ ВЕТВИ (горизонтальные, X/Y-направления):</text>
<text x="20.00" y="76.50" font-size="2.6" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-weight="normal" class="txt">  • Каждое ответвление выходит из тройника</text>
<text x="20.00" y="81.00" font-size="2.6" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-weight="normal" class="txt">  • Колено 90° (отвод) для переориентации</text>
<text x="20.00" y="85.50" font-size="2.6" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-weight="normal" class="txt">  • Завершение заглушкой или быстрым разъёмом</text>
<text x="20.00" y="90.00" font-size="2.6" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-weight="normal" class="hdr"></text>
<text x="20.00" y="94.50" font-size="2.6" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-weight="normal" class="hdr">ГАБАРИТЫ СБОРКИ:</text>
<text x="20.00" y="99.00" font-size="2.6" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-weight="normal" class="txt">  • Высота: 500 мм (главная ось)</text>
<text x="20.00" y="103.50" font-size="2.6" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-weight="normal" class="txt">  • Ширина (боковая): ±300 мм</text>
<text x="20.00" y="108.00" font-size="2.6" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-weight="normal" class="txt">  • Глубина: ±250 мм</text>
<text x="20.00" y="112.50" font-size="2.6" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-weight="normal" class="hdr"></text>
<text x="20.00" y="117.00" font-size="2.6" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-weight="normal" class="hdr">ЭЛЕКТРОСВАРНАЯ ИНТЕГРАЦИЯ:</text>
<text x="20.00" y="121.50" font-size="2.6" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-weight="normal" class="txt">  • Каждый элемент имеет видимые выводы (⌀4мм)</text>
<text x="20.00" y="126.00" font-size="2.6" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-weight="normal" class="txt">  • Верхний/средний/нижний ярусы — трёхполюсная схема питания</text>
<text x="20.00" y="130.50" font-size="2.6" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-weight="normal" class="txt">  • Реальная компоновка нагревателя — по ТУ производителя</text>
<rect x="167.00" y="165.00" width="120.00" height="35.00" class="border" fill="none"/>
<line x1="167.00" y1="172.00" x2="287.00" y2="172.00" class="thin"/>
<line x1="167.00" y1="179.00" x2="287.00" y2="179.00" class="thin"/>
<line x1="167.00" y1="186.00" x2="287.00" y2="186.00" class="thin"/>
<line x1="167.00" y1="193.00" x2="287.00" y2="193.00" class="thin"/>
<line x1="241.40" y1="165.00" x2="241.40" y2="200.00" class="thin"/>
<text x="169.00" y="170.70" font-size="3.0" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-weight="bold" class="txt">Обозн.: MNG-HOUSING-D110-ASM</text>
<text x="169.00" y="177.70" font-size="3.0" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-weight="bold" class="txt">Сборка корпуса d110</text>
<text x="169.00" y="184.70" font-size="2.8" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-weight="normal" class="txt">Материал: PE100, компоновка d110 PE100</text>
<text x="169.00" y="191.70" font-size="2.8" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-weight="normal" class="txt">Расчётная масса: 0.00 кг</text>
<text x="169.00" y="198.70" font-size="2.1" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-weight="normal" class="note">Упрощённая схема, масштаб условный</text>
<text x="243.40" y="170.70" font-size="2.8" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-weight="normal" class="txt">Масштаб эскиз</text>
<text x="243.40" y="177.70" font-size="2.8" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-weight="normal" class="txt">Лист 1 Листов 1</text>
<text x="243.40" y="184.70" font-size="2.6" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-weight="normal" class="txt">Мангустик / welder-module</text>
<text x="243.40" y="191.70" font-size="2.4" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-weight="normal" class="note">УПРОЩЁННЫЙ ШТАМП</text>
<text x="243.40" y="198.70" font-size="2.2" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-weight="normal" class="note">(не для юр. подачи)</text>
</svg>
