<text x="20.00" y="26.00" font-size="3.2" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-weight="normal" class="txt">по SDR11-эквивалентной стенке</text>
<text x="20.00" y="32.00" font-size="2.6" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-weight="normal" class="note">Схематичный вид — центральный узел + три ортогональных раструба</text>
