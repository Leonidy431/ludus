<text x="20.00" y="167.00" font-size="2.4" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-weight="normal" class="note">расстояния между осями — инженерные оценки. Модель упрощена: гладкая сфера вместо</text>
<text x="20.00" y="170.00" font-size="2.4" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-weight="normal" class="note">реальной конусной/пирамидальной переходной геометрии, характерной для</text>
<text x="20.00" y="173.00" font-size="2.4" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-weight="normal" class="note">электросварных тройников. Применить реальный CAD от производителя перед производством.</text>
