<text x="20.00" y="32.00" font-size="2.6" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-weight="normal" class="note">Гемисферическая герметизирующая поверхность</text>
<text x="20.00" y="164.00" font-size="2.4" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-weight="normal" class="note">ОЦЕНОЧНАЯ ГЕОМЕТРИЯ: диаметр купола (0.5×⌀110=55мм, гемисфера), глубина раструба —</text>
<text x="20.00" y="167.00" font-size="2.4" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-weight="normal" class="note">инженерные оценки. Модель: идеальная полусфера, без фаски, без шероховатости</text>
<text x="20.00" y="170.00" font-size="2.4" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-weight="normal" class="note">герметизирующей поверхности. Реальные заглушки включают камеру пазов/борозд для</text>
<text x="20.00" y="173.00" font-size="2.4" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-weight="normal" class="note">смятия уплотнителя и точные контуры края. Уточнить по даташиту производителя.</text>
