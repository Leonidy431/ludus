# Raw-material intake (CLAUDE.md TABOO 0.1): third-party art from the
# backlog list is fetched, transformed, measured against the 35 % rule and
# registered with its licence.  Results are uploaded as an artifact for
# review; nothing is committed automatically, because a licence guess must
# be confirmed by a human before any asset ships.
name: Raw asset intake (35% rule)

on:
  workflow_dispatch:
    inputs:
      only:
        description: 'owner/name filters, space separated (empty = all)'
        default: 'tmewett/BrogueCE 00-Evan/shattered-pixel-dungeon'
      max_repos:
        description: 'max repositories from backlog'
        default: '5'
      per_repo:
        description: 'max images per repository'
        default: '10'
      threshold:
        description: 'minimum alpha shape change of every variant'
        default: '0.35'
      props_slot:
        description: 'deficit id (DEF-nnn) the non-game images are taken for (TABOO 0.012); empty = only listed'
        default: ''

  # The gate also runs on every change that could ship derived art or
  # alter the pipeline; the heavy intake steps stay manual (see below).
  pull_request:
    paths:
      - 'public/ludus/art/derived/**'
      - 'scripts/raw_assets/**'
      - 'scripts/check_canon.py'
      - 'scripts/tests/**'
      - 'data/patristic-canon.json'
      - 'functions/src/api/**'
      - 'functions/src/tests/api/**'
      - 'functions/src/schemas/**'
      - 'functions/src/data/npc-dialogues-24.json'
      - 'functions/src/data/npc-dialogues-story12.json'
      - 'scripts/check_dialogues.py'
      - 'public/ludus/data/passions.json'
      - 'public/ludus/ludus-confession.js'
      - '.github/workflows/raw-asset-intake.yml'

permissions:
  contents: read

jobs:
  intake:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install tools
        # numpy: the audio pass measures envelope, T60 and spectrum.
        run: pip install pillow pycodestyle numpy

      - name: PEP 8 gate
        run: python -m pycodestyle scripts/raw_assets/

      # Alpha-form rules, the Antagonist protocol and determinism.
      - name: Pipeline unit tests
        run: python -m unittest discover scripts/raw_assets/tests -v

      # Every shipped derived sprite needs meta with shape_change >= 35 %,
      # otherwise the build fails with "Требуется Антагонист".
      - name: Shipped derived assets delta gate
        run: |
          python scripts/raw_assets/check_delta.py \
            --root public/ludus/art/derived --threshold 0.35

      # CLAUDE.md TABOO 0.32: every SVG and prompt has a Meta 3D object;
      # a gap fails with "Нет объёма для Meta".
      - name: Meta 3D coverage
        run: python scripts/meta3d/check_coverage.py

      # Front-end unit tests, including the confession-privacy guard
      # (CLAUDE.md TABOO 0.26): the confession module must never gain a
      # storage, network or logging API.
      - name: Node tests (actions, confession privacy)
        run: node --test tests/*.test.js

      # CLAUDE.md TABOO 0.37/0.39: the 24 NPC trees keep the chorus
      # contract (idiom, meaning, source, paraphrase for saints, FORM
      # gates, no church words on buttons).
      - name: Dialogue contract (24 NPCs and the people of the 12 stories)
        run: python scripts/check_dialogues.py

      # CLAUDE.md TABOO 0.35 rule 18: every teaching source (dialogue
      # nodes, passions, confession questions) comes from the closed
      # canon in data/patristic-canon.json, with chapter, step, date and
      # topic checked; the negative tests prove the checker can fail.
      # TABOO 0.35 rules 15-16: the SKU validator (no simony, cosmetic
      # only, no attribute as currency, no random reward) and the rule
      # of prayer API.  Unit tests only; the emulator tests run locally.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Functions unit tests (SKU validator, actions API, store mirror)
        run: |
          npm --prefix functions ci --no-audit --no-fund
          cd functions && npx jest src/tests/api/sku-validator.test.ts \
            src/tests/api/ludus-actions.test.ts \
            src/tests/api/ludus-router.test.ts \
            src/tests/api/server.test.ts \
            src/tests/api/store-mirror.test.ts

      - name: Patristic canon
        run: |
          python -m pycodestyle scripts/check_canon.py scripts/tests/
          python -m unittest discover scripts/tests -v

      - name: Intake (images and licences only)
        if: github.event_name == 'workflow_dispatch'
        env:
          ONLY: ${{ inputs.only }}
          MAX_REPOS: ${{ inputs.max_repos }}
          PER_REPO: ${{ inputs.per_repo }}
          PROPS_SLOT: ${{ inputs.props_slot }}
        # Non-game images go to the props store (TABOO 0.012) when a slot
        # is named; the bytes stay in the runner's temp folder and are
        # never uploaded (that would be distribution), only the register
        # lines are.
        run: |
          python scripts/raw_assets/intake.py --out build/raw \
            --max-repos "$MAX_REPOS" --per-repo "$PER_REPO" \
            --props-cache "$RUNNER_TEMP/raw-props" \
            ${PROPS_SLOT:+--props-slot $PROPS_SLOT} \
            ${ONLY:+--only $ONLY}

      - name: Transform and measure
        if: github.event_name == 'workflow_dispatch'
        env:
          THRESHOLD: ${{ inputs.threshold }}
        run: |
          python scripts/raw_assets/transform.py --raw build/raw \
            --out build/derived --threshold "$THRESHOLD"

      - name: Licence register and claim sheets
        if: github.event_name == 'workflow_dispatch'
        run: |
          python scripts/raw_assets/register.py --derived build/derived \
            --notices build/THIRD_PARTY_NOTICES.md
          cat build/THIRD_PARTY_NOTICES.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: raw-asset-intake
          path: |
            build/derived
            build/THIRD_PARTY_NOTICES.md
            build/raw/manifest.json
            build/raw/props-pending.json
            docs/RAW_PROPS_REGISTER.jsonl
          retention-days: 14
