; Export presets for the headset (CLAUDE.md TABOO 0.02).
;   Meta Quest: Android, OpenXR, godot_openxr_vendors (Meta loader),
;               arm64 only, Gradle build; CI adds the plugin and keys.
;   Web:        WebXR in the Quest browser; no threads, because GitHub
;               Pages sends no COOP/COEP headers; ETC2/ASTC textures for
;               the headset's mobile GPU.

[preset.0]

name="Meta Quest"
platform="Android"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="data/*.json"
exclude_filter="tests/*, addons/dialogic/*, addons/beehave/*, addons/tessarakkt.oceanfft/*, addons/godot-xr-tools/*"
export_path="../build/godot/ludus-dive-quest.apk"
script_export_mode=2

[preset.0.options]

gradle_build/use_gradle_build=true
gradle_build/export_format=0
gradle_build/min_sdk="29"
gradle_build/target_sdk="34"
architectures/armeabi-v7a=false
architectures/arm64-v8a=true
architectures/x86=false
architectures/x86_64=false
version/code=1
version/name="0.1.0"
package/unique_name="org.ludus.dive"
package/name="Ludus — Погружение"
package/signed=true
package/app_category=2
package/show_in_app_library=true
xr_features/xr_mode=1
xr_features/enable_meta_plugin=true
meta_xr_features/hand_tracking=0
meta_xr_features/passthrough=0
meta_xr_features/quest_1_support=false
meta_xr_features/quest_2_support=true
meta_xr_features/quest_3_support=true
meta_xr_features/quest_pro_support=true
screen/immersive_mode=true
permissions/internet=false

[preset.1]

name="Web"
platform="Web"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="data/*.json"
exclude_filter="tests/*, addons/dialogic/*, addons/beehave/*, addons/tessarakkt.oceanfft/*, addons/godot-xr-tools/*"
export_path="../build/godot/web/index.html"
script_export_mode=2

[preset.1.options]

variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=true
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=false
