<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 140" role="img" aria-label="мелик Ашот, наместник квартала">
  <rect width="100" height="140" fill="#1a0e04"/>
  <rect x="5" y="5" width="90" height="130" fill="none" stroke="#8a6a34" stroke-width="1.5"/>
  <!-- голова, строгая шапка наместника с золотым обручем -->
  <circle cx="50" cy="36" r="11" fill="#2a1808" stroke="#c8a56a" stroke-width="2"/>
  <path d="M38 30 h24 l-2 -8 h-20 Z" fill="#2a1808" stroke="#c8a56a" stroke-width="1.5"/>
  <path d="M38 30 h24" stroke="#e8c87a" stroke-width="2"/>
  <!-- кафтан с наплечной полосой -->
  <path d="M50 48 C31 54 27 80 29 118 H71 C73 80 69 54 50 48 Z" fill="#2a1808" stroke="#c8a56a" stroke-width="2"/>
  <path d="M38 54 Q50 60 62 54" fill="none" stroke="#e8c87a" stroke-width="2.5"/>
  <!-- безмен (весы) — «взвешивает каждое слово» -->
  <path d="M50 66 V76 M40 76 h20" stroke="#e8c87a" stroke-width="2"/>
  <path d="M40 76 l-3 8 h6 Z M60 76 l-3 8 h6 Z" fill="none" stroke="#e8c87a" stroke-width="1.5"/>
  <!-- свиток податей у пояса -->
  <rect x="56" y="96" width="14" height="6" rx="3" fill="#1a0e04" stroke="#c8a56a" stroke-width="1.5"/>
  <!-- перстень-печать -->
  <circle cx="34" cy="96" r="2.5" fill="#e8c87a"/>
</svg>
