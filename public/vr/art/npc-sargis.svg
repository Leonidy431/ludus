<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 140" role="img" aria-label="Саргис, караван-баши">
  <rect width="100" height="140" fill="#1a0e04"/>
  <rect x="5" y="5" width="90" height="130" fill="none" stroke="#8a6a34" stroke-width="1.5"/>
  <!-- голова в дорожном тюрбане -->
  <circle cx="50" cy="36" r="11" fill="#2a1808" stroke="#c8a56a" stroke-width="2"/>
  <path d="M38 32 Q50 22 62 32 Q58 26 50 26 Q42 26 38 32 Z" fill="#8a6a34" stroke="#c8a56a" stroke-width="1.5"/>
  <!-- борода бывалого караванщика -->
  <path d="M43 42 Q50 52 57 42 Q54 48 50 48 Q46 48 43 42 Z" fill="#c8a56a" opacity=".8"/>
  <!-- плащ -->
  <path d="M50 48 C31 54 27 80 29 118 H71 C73 80 69 54 50 48 Z" fill="#2a1808" stroke="#c8a56a" stroke-width="2"/>
  <!-- шнур с узелками — счёт дней -->
  <path d="M36 58 Q34 84 38 112" fill="none" stroke="#e8c87a" stroke-width="2"/>
  <circle cx="35" cy="68" r="2" fill="#e8c87a"/>
  <circle cx="35" cy="80" r="2" fill="#e8c87a"/>
  <circle cx="36" cy="92" r="2" fill="#e8c87a"/>
  <circle cx="37" cy="104" r="2" fill="#e8c87a"/>
  <!-- посох погонщика с крюком -->
  <path d="M72 118 V42 q0 -8 -8 -6" fill="none" stroke="#8a6a34" stroke-width="2"/>
  <!-- силуэт верблюда у подола -->
  <path d="M46 112 q4 -6 8 0 q2 -4 5 0 l3 6 h-19 Z" fill="#1a0e04" stroke="#e8c87a" stroke-width="1.2"/>
</svg>
