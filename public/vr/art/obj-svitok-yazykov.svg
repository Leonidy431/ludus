<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="Свиток языков — знак перевода панели пути">
  <!-- Арт-канон §9.0: умбра+золото, картуш-рамка, без нимбов. Объект
       II-каталога: раскрытый свиток с тремя письменами (кириллица/латиница/
       вязь) — иконка локализации панели «Свиток пути» (проход п.39,
       локализация VR gt()-словаря). -->
  <defs>
    <radialGradient id="svy-bg" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#3a2410"/>
      <stop offset="100%" stop-color="#1a0e04"/>
    </radialGradient>
    <linearGradient id="svy-parch" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e8d9a8"/>
      <stop offset="100%" stop-color="#c8a56a"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="92" height="92" rx="10" fill="url(#svy-bg)" stroke="#8a6a34" stroke-width="2"/>
  <rect x="7" y="7" width="82" height="82" rx="7" fill="none" stroke="#c8a56a" stroke-width="1" opacity=".55"/>
  <!-- Свиток: два рулона по краям, развёрнутое полотно между ними -->
  <rect x="16" y="30" width="7" height="38" rx="3.5" fill="#8a6a34" stroke="#2a1808" stroke-width="1.2"/>
  <rect x="73" y="30" width="7" height="38" rx="3.5" fill="#8a6a34" stroke="#2a1808" stroke-width="1.2"/>
  <path d="M23 32 Q48 26 73 32 L73 66 Q48 72 23 66 Z" fill="url(#svy-parch)" stroke="#8a6a34" stroke-width="1.4"/>
  <!-- Три строки письмён: кириллица, вязь, латиница — стилизованные, не буквы -->
  <g stroke="#2a1808" stroke-width="1.6" fill="none" stroke-linecap="round" opacity=".8">
    <path d="M29 41 L34 41 M37 38 L37 44 M40 38 Q43 41 40 44 M46 38 L46 44 M46 38 Q50 38 50 41 Q50 44 46 44 M53 41 L58 41 M61 38 L61 44 M64 38 L67 44 M64 44 L67 38"/>
    <path d="M29 50 Q33 47 37 50 Q41 53 45 50 Q49 47 53 50 Q57 53 61 50 Q65 47 69 50"/>
    <path d="M31 59 L35 59 M33 56 L33 62 M39 56 L39 62 M39 56 Q43 56 43 59 Q43 62 39 62 M48 56 L52 62 M52 56 L48 62 M56 56 L56 62 M56 56 Q60 56 60 59 M64 56 L64 62 M67 56 L67 62 M64 59 L67 59"/>
  </g>
  <!-- Блик пергамента -->
  <path d="M27 34 Q48 29 69 34" stroke="#fff3c0" stroke-width="1" fill="none" opacity=".45"/>
</svg>
