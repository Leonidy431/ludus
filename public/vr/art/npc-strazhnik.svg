<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 140" role="img" aria-label="Стражник-кешиктен двора хана — воин с копьём и щитом">
  <!-- Арт-канон §9.0: умбра+золото. NPC двора Герата: кешиктен — гвардеец
       ханской стражи. Проход №52; двойное назначение: аватар для ряда
       «голоса двора» (vr.js рисует npc-<id>.svg fail-open) и 2D-эталон
       силуэта/палитры под лоу-поли фигуры в сцене (реестр п.96). -->
  <defs>
    <linearGradient id="str-fon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a1808"/>
      <stop offset="100%" stop-color="#1a0e04"/>
    </linearGradient>
  </defs>
  <rect width="100" height="140" rx="10" fill="url(#str-fon)"/>
  <rect x="3" y="3" width="94" height="134" rx="8" fill="none" stroke="#8a6a34" stroke-width="1.4" opacity=".8"/>
  <!-- Копьё за спиной -->
  <path d="M76 18 V112" stroke="#8a6a34" stroke-width="2.4"/>
  <path d="M76 18 L72 28 L80 28 Z" fill="#e8c87a"/>
  <path d="M73 30 Q76 34 79 30" stroke="#a33a2a" stroke-width="1.6" fill="none"/>
  <!-- Шлем с бармицей и султаном -->
  <path d="M50 22 L52 14 L54 22" stroke="#a33a2a" stroke-width="1.8" fill="none"/>
  <path d="M36 40 Q36 22 50 22 Q64 22 64 40 Z" fill="#3a2410"/>
  <path d="M36 40 Q50 46 64 40 L64 50 Q50 58 36 50 Z" fill="#241405"/>
  <circle cx="50" cy="24" r="2.4" fill="#e8c87a"/>
  <!-- Лицо -->
  <path d="M42 36 Q50 32 58 36 Q58 46 50 48 Q42 46 42 36 Z" fill="#c8a56a"/>
  <g stroke="#241405" stroke-width="1.4" stroke-linecap="round">
    <path d="M45 38 H48 M52 38 H55"/>
    <path d="M47 44 Q50 46 53 44"/>
  </g>
  <path d="M44 47 Q50 52 56 47 L56 52 Q50 56 44 52 Z" fill="#140a02"/>
  <!-- Ламеллярный доспех -->
  <path d="M32 66 Q50 56 68 66 L70 108 Q50 116 30 108 Z" fill="#3a2410"/>
  <g stroke="#8a6a34" stroke-width="1.1" opacity=".75" fill="none">
    <path d="M34 72 Q50 64 66 72 M33 80 Q50 72 67 80 M32 88 Q50 80 68 88 M31 96 Q50 88 69 96"/>
    <path d="M42 62 V104 M50 60 V106 M58 62 V104"/>
  </g>
  <!-- Пояс с тамгой стражи -->
  <path d="M31 100 Q50 108 69 100 L69 105 Q50 113 31 105 Z" fill="#8a6a34"/>
  <circle cx="50" cy="105" r="3.4" fill="#e8c87a"/>
  <path d="M50 102.5 V107.5 M47.8 105 H52.2" stroke="#3a2410" stroke-width="1"/>
  <!-- Круглый щит в левой руке -->
  <circle cx="26" cy="88" r="12" fill="#241405" stroke="#8a6a34" stroke-width="1.6"/>
  <circle cx="26" cy="88" r="6.5" fill="none" stroke="#e8c87a" stroke-width="1.1" opacity=".85"/>
  <circle cx="26" cy="88" r="2" fill="#e8c87a"/>
  <!-- Сапоги -->
  <path d="M38 112 L36 128 H46 L46 114 M62 112 L64 128 H54 L54 114" fill="#140a02"/>
</svg>
