<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="Тамга хана — печать на свитке пути">
  <!-- Арт-канон §9.0: умбра+золото, картуш-рамка, без нимбов. Объект
       II-каталога: восковая тамга-печать хана на грамоте — иконка заголовка
       «Свитка пути» в VR-панели (проход №42): миссия скреплена печатью двора. -->
  <defs>
    <radialGradient id="tamga-bg" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#3a2410"/>
      <stop offset="100%" stop-color="#1a0e04"/>
    </radialGradient>
    <radialGradient id="tamga-wax" cx="42%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#e8c87a"/>
      <stop offset="100%" stop-color="#8a6a34"/>
    </radialGradient>
  </defs>
  <rect x="2" y="2" width="92" height="92" rx="10" fill="url(#tamga-bg)" stroke="#8a6a34" stroke-width="2"/>
  <rect x="7" y="7" width="82" height="82" rx="7" fill="none" stroke="#c8a56a" stroke-width="1" opacity=".55"/>
  <!-- Уголок свитка под печатью -->
  <path d="M18 62 Q30 56 46 58 L78 58 L78 78 Q60 82 40 79 Q26 77 18 80 Z"
        fill="#2a1808" stroke="#8a6a34" stroke-width="1.4"/>
  <path d="M22 64 Q34 59 46 61 L74 61" fill="none" stroke="#c8a56a" stroke-width=".8" opacity=".5"/>
  <!-- Печать: неровный восковой круг -->
  <path d="M48 18 Q60 16 66 24 Q74 30 71 41 Q73 51 63 55 Q55 61 45 57 Q34 57 30 47 Q25 38 31 29 Q36 19 48 18 Z"
        fill="url(#tamga-wax)" stroke="#8a6a34" stroke-width="1.6"/>
  <circle cx="49" cy="38" r="14.5" fill="none" stroke="#2a1808" stroke-width="1.2" opacity=".75"/>
  <!-- Тамга-знак: стилизованный родовой символ (дуга + трезубец + опора) -->
  <g stroke="#2a1808" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M41 46 Q49 40 57 46"/>
    <path d="M49 43 L49 30"/>
    <path d="M43 33 Q49 27 55 33"/>
    <path d="M44 46 L44 42"/><path d="M54 46 L54 42"/>
  </g>
  <!-- Блик воска -->
  <path d="M38 26 Q44 22 51 23" stroke="#fff3c0" stroke-width="1.2" fill="none" opacity=".5"/>
</svg>
