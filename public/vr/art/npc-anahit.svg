<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 140" role="img" aria-label="Анаит, хозяйка караван-сарая">
  <rect width="100" height="140" fill="#1a0e04"/>
  <rect x="5" y="5" width="90" height="130" fill="none" stroke="#8a6a34" stroke-width="1.5"/>
  <!-- лицо под платком -->
  <circle cx="50" cy="36" r="10" fill="#2a1808" stroke="#c8a56a" stroke-width="2"/>
  <!-- армянский платок-покрывало (глхашор), спадающий на плечи -->
  <path d="M38 30 Q50 16 62 30 L64 48 Q50 42 36 48 Z" fill="#3a2410" stroke="#e8c87a" stroke-width="2"/>
  <path d="M36 46 Q30 58 32 70 M64 46 Q70 58 68 70" fill="none" stroke="#c8a56a" stroke-width="1.5"/>
  <!-- платье хозяйки дома -->
  <path d="M50 50 C33 56 28 82 30 118 H70 C72 82 67 56 50 50 Z" fill="#2a1808" stroke="#c8a56a" stroke-width="2"/>
  <!-- пояс с узором -->
  <path d="M34 74 H66 M34 78 H66" stroke="#8a6a34" stroke-width="1.5"/>
  <path d="M46 74 l4 4 l4 -4" fill="none" stroke="#e8c87a" stroke-width="1.2"/>
  <!-- кувшин с водой для путников -->
  <path d="M31 94 q-4 1 -4 6 v8 q0 5 7 5 q7 0 7 -5 v-8 q0 -5 -4 -6 v-4 h-6 Z" fill="#1a0e04" stroke="#e8c87a" stroke-width="1.5"/>
  <path d="M27 100 q-4 1 -3 5" fill="none" stroke="#e8c87a" stroke-width="1.5"/>
  <!-- хлеб-лаваш на подносе -->
  <ellipse cx="63" cy="104" rx="10" ry="4" fill="#1a0e04" stroke="#c8a56a" stroke-width="1.5"/>
  <ellipse cx="63" cy="101" rx="7" ry="2.5" fill="#3a2410" stroke="#e8c87a" stroke-width="1.2"/>
</svg>
