<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="Врата знания IV — Созерцательное: сердце с лучами молитвы Иисусовой, порог Мудрости 10">
  <title>Врата IV: Созерцательное</title>
  <desc>Сердце с малым крестом внутри, от него расходятся лучи. Смысл: ум нисходит в сердце — молитва Иисусова становится дыханием, и свет рождается изнутри, а не приходит извне. Десять точек внизу — порог Мудрости 10.</desc>
  <!-- Арт-канон §9.0: умбра+золото, картуш-рамка. Врата знания, уровень 4 из 6:
       один знак в центре, всё остальное — пустота рамки. -->
  <rect x="2" y="2" width="92" height="92" rx="10" fill="#1a0e04" stroke="#8a6a34" stroke-width="2"/>
  <rect x="7" y="7" width="82" height="82" rx="7" fill="none" stroke="#c8a56a" stroke-width="1" opacity=".55"/>
  <!-- лучи молитвы: двенадцать коротких штрихов -->
  <g stroke="#c8a56a" stroke-width="1.5" stroke-linecap="round" opacity=".85">
    <path d="M48 14 V20 M48 70 V76 M18 44 H24 M72 44 H78"/>
    <path d="M27 23 l4 4 M69 23 l-4 4 M27 65 l4 -4 M69 65 l-4 -4"/>
    <path d="M36 16 l2 5 M60 16 l-2 5 M36 72 l2 -5 M60 72 l-2 -5"/>
  </g>
  <!-- сердце -->
  <path d="M48 64 C30 52 28 40 34 34 C39 29 46 31 48 37 C50 31 57 29 62 34 C68 40 66 52 48 64 Z" fill="#2a1808" stroke="#e8c87a" stroke-width="2"/>
  <!-- малый крест в сердце — Имя -->
  <path d="M48 40 V54 M42 45 H54" stroke="#e8c87a" stroke-width="2" stroke-linecap="round"/>
  <circle cx="48" cy="46" r="9" fill="#e8c87a" opacity=".12"/>
  <!-- порог Мудрости: 10 точек -->
  <g fill="#e8c87a"><circle cx="28.2" cy="83" r="1.5"/><circle cx="32.6" cy="83" r="1.5"/><circle cx="37" cy="83" r="1.5"/><circle cx="41.4" cy="83" r="1.5"/><circle cx="45.8" cy="83" r="1.5"/><circle cx="50.2" cy="83" r="1.5"/><circle cx="54.6" cy="83" r="1.5"/><circle cx="59" cy="83" r="1.5"/><circle cx="63.4" cy="83" r="1.5"/><circle cx="67.8" cy="83" r="1.5"/></g>
</svg>
