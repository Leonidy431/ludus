<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Чуйская долина — поле кайраков с процарапанными крестами">
  <title>Поле кайраков в Чуйской долине</title>
  <desc>Форма: степное поле речных валунов-кайраков с процарапанными крестами, горы Ала-Тоо на горизонте. Действие: игрок читает надгробия общины Церкви Востока и слушает её память, не разрушая и не присваивая камней. Цель: спор с несторианами ведётся словом и уважением к усопшим, а не отнятием святынь. Миссия: 59 «Конфликт с несторианами».</desc>
  <!-- Арт-канон §9.0: умбра+золото. Кайраки — исторические надгробия
       Семиречья XIII–XIV вв.; кресты даны знаком, без надписей. -->
  <defs>
    <linearGradient id="chu-nebo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0e04"/>
      <stop offset="70%" stop-color="#3a2410"/>
      <stop offset="100%" stop-color="#8a6a34"/>
    </linearGradient>
  </defs>
  <rect width="320" height="180" fill="url(#chu-nebo)"/>
  <!-- хребет Ала-Тоо со снегом -->
  <path d="M0 92 L40 60 L70 80 L104 50 L140 82 L180 58 L214 84 L252 54 L290 78 L320 66 V104 H0 Z" fill="#241405"/>
  <g fill="#e8d9b8" opacity=".75">
    <path d="M98 55 L104 50 L110 55 Z"/><path d="M246 59 L252 54 L258 59 Z"/><path d="M35 64 L40 60 L45 64 Z"/>
  </g>
  <!-- степь -->
  <path d="M0 104 Q160 94 320 104 V180 H0 Z" fill="#2a1808"/>
  <g stroke="#8a6a34" stroke-width="1.2" fill="none" opacity=".6">
    <path d="M20 170 q3 -6 6 0 M60 160 q3 -6 6 0 M290 166 q3 -6 6 0 M240 150 q3 -6 6 0 M130 172 q3 -6 6 0"/>
  </g>
  <!-- кайраки: обкатанные валуны с крестами -->
  <g fill="#3a2410" stroke="#c8a56a" stroke-width="1.8">
    <path d="M58 150 Q54 124 72 120 Q90 122 88 150 Z"/>
    <path d="M128 142 Q124 112 146 108 Q168 112 164 142 Z"/>
    <path d="M200 146 Q198 124 214 120 Q232 124 228 146 Z"/>
    <path d="M254 132 Q252 114 266 112 Q280 114 278 132 Z"/>
    <path d="M96 126 Q94 112 104 110 Q114 112 112 126 Z"/>
  </g>
  <!-- процарапанные кресты с расширенными концами -->
  <g stroke="#e8c87a" stroke-width="1.8" fill="none" stroke-linecap="round">
    <path d="M71 128 V142 M64 135 H78"/>
    <path d="M146 116 V134 M137 125 H155"/>
    <path d="M214 128 V140 M208 134 H220"/>
    <path d="M266 118 V128 M261 123 H271"/>
    <path d="M104 114 V122 M100 118 H108"/>
  </g>
  <g fill="#e8c87a">
    <circle cx="146" cy="138" r="1.5"/><circle cx="141" cy="137" r="1"/><circle cx="151" cy="137" r="1"/>
  </g>
  <!-- тропа паломника между камнями -->
  <path d="M0 168 Q90 158 150 162 Q230 168 320 156" fill="none" stroke="#8a6a34" stroke-width="1.4" stroke-dasharray="4 3"/>
  <!-- вечерняя звезда -->
  <path d="M290 24 v8 M286 28 h8" stroke="#e8c87a" stroke-width="1.5"/>
</svg>
