<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="Орарь дьякона">
  <title>Орарь дьякона</title>
  <desc>Орарь — длинная лента дьякона со словами «Свят, свят, свят»: он подобен крылам ангелов, служащих у Престола. Поднимая орарь, дьякон призывает народ к молитве — служение как связь неба и земли.</desc>
  <!-- Объект литургии: орарь, перекинутый через плечо, с тремя крестами трисвятого -->
  <defs>
    <radialGradient id="orar-bg" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#3a2410"/>
      <stop offset="100%" stop-color="#1a0e04"/>
    </radialGradient>
  </defs>
  <!-- картуш-рамка -->
  <rect x="2" y="2" width="92" height="92" rx="10" fill="url(#orar-bg)" stroke="#8a6a34" stroke-width="2"/>
  <rect x="7" y="7" width="82" height="82" rx="7" fill="none" stroke="#c8a56a" stroke-width="1" opacity=".55"/>
  <g>
    <!-- плечо-вешало -->
    <path d="M20 26 Q48 16 76 26" fill="none" stroke="#8a6a34" stroke-width="2"/>
    <!-- лента ораря, ниспадающая крылом -->
    <path d="M30 22 L40 20 L58 82 L48 84 Z" fill="#c8a56a" stroke="#8a6a34" stroke-width="1.5"/>
    <path d="M40 20 L64 22 L70 30 L46 30 Z" fill="#e8c87a" stroke="#8a6a34" stroke-width="1.5"/>
    <!-- трисвятое: три креста -->
    <g stroke="#2a1808" stroke-width="1.8">
      <path d="M40 34 v7 M37 37.5 h6"/><path d="M45 52 v7 M42 55.5 h6"/><path d="M50 70 v7 M47 73.5 h6"/>
    </g>
    <!-- кисти на конце -->
    <path d="M48 84 L47 88 M51 84 L51 88 M55 83 L56 87" stroke="#e8c87a" stroke-width="1.2"/>
    <!-- крылья ангельского служения -->
    <path d="M64 44 Q76 40 80 50 Q72 48 66 54" fill="none" stroke="#c8a56a" stroke-width="1.4" opacity=".6"/>
  </g>
</svg>
