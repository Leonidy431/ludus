<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Под водой Иссык-Куля — слой термоклина, луч подводного аппарата, затонувший крест">
  <title>Глубины Иссык-Куля</title>
  <desc>Подводная сцена: светлая вода сверху, полоса термоклина, внизу тьма; подводный аппарат светит конусом света на затонувший крест на дне. Смысл: знание добывается нисхождением во тьму — свет, опущенный в глубину, открывает то, что хранилось веками; глубина даёт мудрость наблюдения.</desc>
  <!-- Арт-канон §9.0 + подводное исключение: глубокие озёрные синие.
       Локация ROV Lake: depth → бонус Wisdom за наблюдение. -->
  <defs>
    <linearGradient id="iku-voda" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1f5a73"/>
      <stop offset="45%" stop-color="#0d2a3a"/>
      <stop offset="100%" stop-color="#1a0e04"/>
    </linearGradient>
  </defs>
  <rect width="320" height="180" fill="url(#iku-voda)"/>
  <!-- поверхность с преломлённым солнцем -->
  <g stroke="#c8a56a" stroke-width="1.2" fill="none" opacity=".5">
    <path d="M0 8 Q20 4 40 8 T80 8 T120 8 T160 8 T200 8 T240 8 T280 8 T320 8"/>
  </g>
  <g stroke="#e8c87a" stroke-width="1.5" opacity=".14">
    <path d="M60 10 L40 60 M100 10 L90 56 M140 10 L140 52"/>
  </g>
  <!-- полоса термоклина: граница тёплой и холодной воды -->
  <rect y="62" width="320" height="16" fill="#1f5a73" opacity=".35"/>
  <g stroke="#1f5a73" stroke-width="1.5" fill="none">
    <path d="M0 62 Q40 58 80 62 T160 62 T240 62 T320 62"/>
    <path d="M0 78 Q40 82 80 78 T160 78 T240 78 T320 78" stroke-dasharray="4 3"/>
  </g>
  <!-- отметки глубины на кромке -->
  <g stroke="#8a6a34" stroke-width="1.2">
    <path d="M8 30 h8 M8 70 h12 M8 110 h8 M8 150 h8"/>
  </g>
  <!-- конус света от аппарата -->
  <path d="M236 64 L150 170 L250 170 Z" fill="#e8c87a" opacity=".13"/>
  <path d="M236 64 L150 170 M236 64 L250 170" stroke="#e8c87a" stroke-width="1" opacity=".35"/>
  <!-- подводный аппарат (ROV) с кабелем -->
  <path d="M254 0 Q250 30 244 48" fill="none" stroke="#8a6a34" stroke-width="1.5"/>
  <g stroke="#c8a56a" stroke-width="1.8">
    <rect x="224" y="48" width="30" height="16" rx="3" fill="#2a1808"/>
    <path d="M224 52 h-6 v8 h6 M254 52 h6 v8 h-6" fill="#2a1808"/>
    <path d="M228 64 v4 M250 64 v4 M226 68 h26" fill="none"/>
  </g>
  <circle cx="236" cy="64" r="3" fill="#e8c87a"/>
  <circle cx="232" cy="54" r="1.8" fill="#c0392b"/>
  <!-- дно озера -->
  <path d="M0 164 Q60 154 130 162 Q200 170 260 160 Q300 154 320 160 V180 H0 Z" fill="#140a02" stroke="#8a6a34" stroke-width="1.2"/>
  <!-- затонувший крест, наклонённый в иле -->
  <g transform="rotate(-10 194 150)">
    <path d="M194 168 V126 M184 136 H204 M187 156 L201 152" stroke="#e8c87a" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>
  <!-- камни старой кладки у креста -->
  <g fill="#2a1808" stroke="#8a6a34" stroke-width="1.2">
    <rect x="164" y="160" width="12" height="6"/><rect x="210" y="158" width="14" height="7"/>
    <rect x="224" y="162" width="10" height="5"/>
  </g>
  <!-- пузырьки и взвесь -->
  <g fill="none" stroke="#c8a56a" stroke-width="1" opacity=".6">
    <circle cx="240" cy="40" r="1.6"/><circle cx="244" cy="30" r="1.2"/><circle cx="238" cy="22" r="1"/>
  </g>
  <g fill="#c8a56a" opacity=".45">
    <circle cx="60" cy="110" r="1"/><circle cx="110" cy="130" r="1"/><circle cx="84" cy="96" r="1"/>
    <circle cx="190" cy="104" r="1"/><circle cx="300" cy="120" r="1"/>
  </g>
</svg>
