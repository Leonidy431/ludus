<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="Герметичный футляр для свитков с восковой печатью">
  <title>Герметичный футляр</title>
  <desc>Форма: цилиндрический кожаный тубус, пропитанный воском, с медными обоймами, крышкой, обвязанной шнуром, и восковой печатью на узле; рядом выглядывает край свитка. Действие: укрыть рукописи от воды, огня и сырости, когда обители грозит беда. Цель: сберечь слово для тех, кто придёт после; хранитель служит памяти, а не владеет ею. Миссия: 57 Защита архивов.</desc>
  <!-- Арт-канон §9.0: умбра+золото, картуш-рамка, без нимбов. Объект: тубус архива, без священных надписей. -->
  <defs>
    <radialGradient id="futlyar-bg" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#3a2410"/>
      <stop offset="100%" stop-color="#1a0e04"/>
    </radialGradient>
  </defs>
  <rect x="2" y="2" width="92" height="92" rx="10" fill="url(#futlyar-bg)" stroke="#8a6a34" stroke-width="2"/>
  <rect x="7" y="7" width="82" height="82" rx="7" fill="none" stroke="#c8a56a" stroke-width="1" opacity=".55"/>
  <!-- корпус тубуса по диагонали -->
  <g transform="rotate(-30 48 48)">
    <rect x="18" y="38" width="56" height="20" rx="4" fill="#2a1808" stroke="#c8a56a" stroke-width="1.8"/>
    <!-- медные обоймы -->
    <g fill="#8a6a34" stroke="#e8c87a" stroke-width="1"><rect x="26" y="37" width="4" height="22"/><rect x="58" y="37" width="4" height="22"/></g>
    <!-- крышка -->
    <rect x="72" y="36" width="10" height="24" rx="3" fill="#8a6a34" stroke="#e8c87a" stroke-width="1.6"/>
    <!-- шнур обвязки через крышку -->
    <path d="M66 36 Q76 30 84 40 M66 60 Q76 66 84 56" fill="none" stroke="#c8a56a" stroke-width="1.3"/>
    <!-- донце и край свитка -->
    <ellipse cx="18" cy="48" rx="3" ry="10" fill="#1a0e04" stroke="#c8a56a" stroke-width="1.4"/>
    <path d="M16 44 Q10 46 12 50 Q14 53 16 52" fill="#e8d9b8" opacity=".6" stroke="#8a6a34" stroke-width=".8"/>
    <!-- восковой слой: блики -->
    <path d="M34 42 H54 M34 54 H54" stroke="#c8a56a" stroke-width=".8" opacity=".6"/>
  </g>
  <!-- восковая печать на узле -->
  <circle cx="70" cy="70" r="7" fill="#c0392b" stroke="#e8c87a" stroke-width="1.4"/>
  <circle cx="70" cy="70" r="3.2" fill="none" stroke="#e8c87a" stroke-width="1"/>
  <path d="M65 65 Q60 60 62 56" fill="none" stroke="#c8a56a" stroke-width="1.3"/>
  <!-- капли, скатывающиеся с воска -->
  <g fill="#1f5a73"><path d="M22 22 q2 3 0 5 q-2 -2 0 -5 Z"/><path d="M30 16 q2 3 0 5 q-2 -2 0 -5 Z"/></g>
</svg>
