<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="Компас пути — прогресс миссий кампании">
  <!-- Арт-канон §9.0: умбра+золото, картуш-рамка, без нимбов. Объект
       II-каталога: странническая роза ветров / компас пути — иконка
       прогресса кампании (проход №41, пара к HUD-чипу «🧭 путь X/N»
       в VR-панели и stats strip). -->
  <defs>
    <radialGradient id="kompas-bg" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#3a2410"/>
      <stop offset="100%" stop-color="#1a0e04"/>
    </radialGradient>
    <linearGradient id="kompas-gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8c87a"/>
      <stop offset="100%" stop-color="#c8a56a"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="92" height="92" rx="10" fill="url(#kompas-bg)" stroke="#8a6a34" stroke-width="2"/>
  <rect x="7" y="7" width="82" height="82" rx="7" fill="none" stroke="#c8a56a" stroke-width="1" opacity=".55"/>
  <!-- Внешнее кольцо с делениями -->
  <circle cx="48" cy="48" r="30" fill="none" stroke="#8a6a34" stroke-width="1.6"/>
  <circle cx="48" cy="48" r="26" fill="none" stroke="#c8a56a" stroke-width=".8" opacity=".6"/>
  <g stroke="#8a6a34" stroke-width="1.2">
    <path d="M48 15 L48 21"/><path d="M48 75 L48 81"/>
    <path d="M15 48 L21 48"/><path d="M75 48 L81 48"/>
  </g>
  <!-- Роза ветров: длинные лучи N/S/E/W -->
  <path d="M48 24 L52 44 L48 48 L44 44 Z" fill="url(#kompas-gold)" stroke="#8a6a34" stroke-width=".9"/>
  <path d="M48 72 L44 52 L48 48 L52 52 Z" fill="#2a1808" stroke="#8a6a34" stroke-width=".9"/>
  <path d="M72 48 L52 52 L48 48 L52 44 Z" fill="#2a1808" stroke="#8a6a34" stroke-width=".9"/>
  <path d="M24 48 L44 44 L48 48 L44 52 Z" fill="url(#kompas-gold)" stroke="#8a6a34" stroke-width=".9"/>
  <!-- Короткие диагональные лучи -->
  <g fill="#c8a56a" stroke="#8a6a34" stroke-width=".7" opacity=".85">
    <path d="M63 33 L52 44 L51 41 Z"/>
    <path d="M33 63 L44 52 L45 55 Z"/>
    <path d="M63 63 L52 52 L55 51 Z"/>
    <path d="M33 33 L44 44 L41 45 Z"/>
  </g>
  <!-- Сердцевина -->
  <circle cx="48" cy="48" r="4.2" fill="#e8c87a" stroke="#8a6a34" stroke-width="1.2"/>
  <circle cx="48" cy="48" r="1.4" fill="#2a1808"/>
</svg>
