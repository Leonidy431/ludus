<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="Мудрость — атрибут умного видения">
  <title>Мудрость (Wisdom)</title>
  <desc>Премудрость созда Себе дом и утверди столпов седмь (Притч 9:1): мудрость — дом, в котором ум восходит к Богу; по Григорию Нисскому, восхождение бесконечно. Атрибут открывает глубокие диалоги и ворота знания.</desc>
  <!-- Атрибут ФОРМЫ №1: Wisdom — дом Премудрости о семи столпах, над ним звезда-свет ума -->
  <defs>
    <radialGradient id="wisdom-bg" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#3a2410"/>
      <stop offset="100%" stop-color="#1a0e04"/>
    </radialGradient>
  </defs>
  <!-- картуш-рамка -->
  <rect x="2" y="2" width="92" height="92" rx="10" fill="url(#wisdom-bg)" stroke="#8a6a34" stroke-width="2"/>
  <rect x="7" y="7" width="82" height="82" rx="7" fill="none" stroke="#c8a56a" stroke-width="1" opacity=".55"/>
  <g>
    <!-- свод дома Премудрости -->
    <path d="M22 44 Q48 20 74 44" fill="none" stroke="#e8c87a" stroke-width="2"/>
    <path d="M20 44 H76" stroke="#c8a56a" stroke-width="2"/>
    <!-- семь столпов -->
    <g stroke="#c8a56a" stroke-width="2.2" stroke-linecap="round">
      <path d="M24 48 V72"/><path d="M32 48 V72"/><path d="M40 48 V72"/><path d="M48 48 V72"/>
      <path d="M56 48 V72"/><path d="M64 48 V72"/><path d="M72 48 V72"/>
    </g>
    <!-- ступени основания -->
    <path d="M20 74 H76 M16 79 H80" stroke="#8a6a34" stroke-width="2"/>
    <!-- свет ума над сводом -->
    <path d="M48 16 L50 24 L58 26 L50 28 L48 36 L46 28 L38 26 L46 24 Z" fill="#e8c87a" stroke="#8a6a34" stroke-width=".8"/>
    <circle cx="48" cy="26" r="11" fill="#e8c87a" opacity=".12"/>
  </g>
</svg>
