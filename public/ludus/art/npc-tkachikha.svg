<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 140" role="img" aria-label="Ткачиха-армянка с челноком и мотком нити">
  <title>Ткачиха</title>
  <desc>Форма: армянская мастерица в головном покрывале, с челноком в руке и мотком нити, узор на подоле. Действие: учить общину ремеслу и честной цене труда. Цель: труд рук как молитва и дар общине. Миссия: 69 Текстильные цеха.</desc>
  <rect width="100" height="140" fill="#1a0e04"/>
  <rect x="5" y="5" width="90" height="130" fill="none" stroke="#8a6a34" stroke-width="1.5"/>
  <!-- голова в покрывале -->
  <circle cx="50" cy="38" r="10" fill="#2a1808" stroke="#c8a56a" stroke-width="2"/>
  <path d="M36 44 Q34 22 50 22 Q66 22 64 44 Q66 54 70 60 Q60 50 50 50 Q40 50 30 60 Q34 54 36 44 Z" fill="#8a6a34" stroke="#c8a56a" stroke-width="1.5"/>
  <path d="M39 30 Q50 26 61 30" fill="none" stroke="#e8c87a" stroke-width="1.5"/>
  <g fill="#e8c87a"><circle cx="43" cy="29" r="1"/><circle cx="50" cy="27.5" r="1"/><circle cx="57" cy="29" r="1"/></g>
  <!-- спокойное лицо -->
  <path d="M46 37 h2.5 M51.5 37 h2.5" stroke="#c8a56a" stroke-width="1.2"/>
  <!-- платье -->
  <path d="M50 50 C34 56 30 82 28 120 H72 C70 82 66 56 50 50 Z" fill="#2a1808" stroke="#c8a56a" stroke-width="2"/>
  <!-- узор на подоле: ромбы -->
  <path d="M30 112 L34 108 L38 112 L42 108 L46 112 L50 108 L54 112 L58 108 L62 112 L66 108 L70 112" fill="none" stroke="#e8c87a" stroke-width="1.3"/>
  <path d="M30 116 H70" stroke="#c0392b" stroke-width="1.5"/>
  <!-- челнок в руке -->
  <path d="M56 70 Q66 66 76 70 Q66 74 56 70 Z" fill="#c8a56a" stroke="#e8c87a" stroke-width="1.2"/>
  <path d="M62 70 H70" stroke="#1a0e04" stroke-width="1.2"/>
  <!-- моток нити с тянущейся нитью -->
  <circle cx="36" cy="84" r="7" fill="#1a0e04" stroke="#e8c87a" stroke-width="1.5"/>
  <g fill="none" stroke="#c8a56a" stroke-width="1"><path d="M31 81 Q36 87 41 81"/><path d="M31 87 Q36 81 41 87"/></g>
  <path d="M42 84 Q52 80 58 72" fill="none" stroke="#e8c87a" stroke-width="1"/>
</svg>
