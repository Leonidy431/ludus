<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 140" role="img" aria-label="Преподобная Макрина, сестра святителей Василия и Григория">
  <title>Макрина Младшая</title>
  <desc>Преподобная Макрина Младшая, старшая сестра Василия Великого и Григория Нисского, основательница женской подвижнической общины в Анниси и наставница своих братьев. Раскрытая книга — диалог «О душе и воскресении», где Григорий записал её учение у смертного одра; простой крест — жизнь, отданная Христу; светильник — мудрая дева, чья лампада не угасает. Форма — Мудрость и Учёность; действие — наставление в беседе, сократический путь вопросов и ответов; цель — вера в воскресение, знание, ставшее надеждой. Без нимба: игровой образ — не икона; нимб принадлежит иконе, поэтому святость здесь явлена атрибутами. Фон — едва заметная золотая спираль: порядок творения, восходящий к Творцу, а не венец над главой.</desc>
  <!-- Арт-канон §9.0: умбра+золото, картуш, без нимбов; святость — в атрибутах -->
  <rect width="100" height="140" fill="#1a0e04"/>
  <rect x="5" y="5" width="90" height="130" fill="none" stroke="#8a6a34" stroke-width="1.5"/>
  <!-- фон: зеркальная золотая спираль, низко и в стороне от главы — не нимб -->
  <path d="M92 126 A47 47 0 0 0 45 79 A29 29 0 0 0 16 108 A18 18 0 0 0 34 126 A11 11 0 0 0 45 115 A7 7 0 0 0 38 108 A4 4 0 0 0 34 112 A3 3 0 0 0 37 115" fill="none" stroke="#8a6a34" stroke-width="1" opacity=".25"/>
  <!-- мафорий: покрывало на голову и плечи -->
  <path d="M50 18 C37 18 35 32 37 46 C31 54 28 80 29 118 H71 C72 80 69 54 63 46 C65 32 63 18 50 18 Z" fill="#2a1808" stroke="#c8a56a" stroke-width="2"/>
  <!-- апостольник вокруг лика -->
  <path d="M41 30 Q41 22 50 22 Q59 22 59 30 Q60 44 50 47 Q40 44 41 30 Z" fill="none" stroke="#8a6a34" stroke-width="1.5"/>
  <!-- лик, спокойный взор наставницы -->
  <circle cx="50" cy="34" r="9" fill="#1a0e04" stroke="#c8a56a" stroke-width="2"/>
  <path d="M46 34 q1.5 1.2 3 0 M51 34 q1.5 1.2 3 0" fill="none" stroke="#c8a56a" stroke-width="1"/>
  <!-- складки мафория -->
  <path d="M37 46 Q44 62 42 118 M63 46 Q56 62 58 118" fill="none" stroke="#8a6a34" stroke-width="1.2"/>
  <!-- простой деревянный крест на груди -->
  <path d="M50 54 v12 M45.5 58 h9" stroke="#e8c87a" stroke-width="2"/>
  <!-- раскрытая книга «О душе и воскресении» -->
  <path d="M34 76 L50 80 L66 76 L66 98 L50 102 L34 98 Z" fill="#1a0e04" stroke="#e8c87a" stroke-width="1.8"/>
  <path d="M50 80 V102" stroke="#c8a56a" stroke-width="1.5"/>
  <!-- строки диалога: вопрос брата слева, ответ сестры справа -->
  <g stroke="#8a6a34" stroke-width="1">
    <path d="M37 83 L47 85 M37 87 L47 89 M37 91 L44 92.5"/>
    <path d="M53 84 L63 82 M53 88 L63 86 M53 92 L63 90 M53 96 L60 94.5"/>
  </g>
  <!-- руки, держащие книгу -->
  <circle cx="33" cy="94" r="3" fill="#2a1808" stroke="#c8a56a" stroke-width="1.5"/>
  <circle cx="67" cy="94" r="3" fill="#2a1808" stroke="#c8a56a" stroke-width="1.5"/>
  <!-- светильник мудрой девы у подножия -->
  <path d="M12 122 Q18 128 28 122 L25 118 H15 Z" fill="#1a0e04" stroke="#e8c87a" stroke-width="1.4"/>
  <path d="M28 122 q4 -1 4 -4" fill="none" stroke="#c8a56a" stroke-width="1.2"/>
  <!-- пламя: единственный красный акцент — живая вера -->
  <path d="M15 117 q-3 -4 0 -9 q3 5 0 9 Z" fill="#e8c87a"/>
  <path d="M15 116 q-1.2 -2 0 -4 q1.2 2 0 4 Z" fill="#c0392b"/>
</svg>
