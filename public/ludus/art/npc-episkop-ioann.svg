<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 140" role="img" aria-label="Епископ Иоанн, миссионер Иссык-Куля">
  <title>Епископ Иоанн</title>
  <desc>Епископ Иоанн — историческая рамка кампании (XIV век, миссия у Иссык-Куля на Шёлковом пути). ФОРМА: монашеский клобук, омофор с крестами, наперсный крест, пастырский посох — власть служения, а не власти. ДЕЙСТВИЕ: рассуждает, мирит купцов, освящает воду, говорит с ханами. ЦЕЛЬ: учит, что епископ — отец общины и арбитр по правде. Не святой-икона: без нимба; свет сверху — только освещение сцены. Миссии: 1, 3, 4, 5, 13, 14, 17, 19, 21, 23, 26, 32, 43, 46, 48, 49, 52, 58, 86, 89, 96.</desc>
  <rect width="100" height="140" fill="#1a0e04"/>
  <rect x="5" y="5" width="90" height="130" fill="none" stroke="#8a6a34" stroke-width="1.5"/>
  <!-- мягкий свет сверху: освещение сцены, не нимб -->
  <path d="M40 6 L60 6 L70 60 L30 60 Z" fill="#e8c87a" opacity=".06"/>
  <!-- монашеский клобук с покрывалом (XIV век, без митры) -->
  <path d="M40 30 V18 H60 V30 Z" fill="#2a1808" stroke="#c8a56a" stroke-width="1.5"/>
  <path d="M40 22 Q34 34 36 50 L40 48 Q40 36 40 30 Z" fill="#2a1808" stroke="#c8a56a" stroke-width="1.2"/>
  <path d="M60 22 Q66 34 64 50 L60 48 Q60 36 60 30 Z" fill="#2a1808" stroke="#c8a56a" stroke-width="1.2"/>
  <!-- лик -->
  <circle cx="50" cy="38" r="9" fill="#1a0e04" stroke="#c8a56a" stroke-width="2"/>
  <!-- саккос -->
  <path d="M50 52 C31 56 27 82 29 122 H71 C73 82 69 56 50 52 Z" fill="#2a1808" stroke="#c8a56a" stroke-width="2"/>
  <!-- великий омофор с крестами -->
  <path d="M33 62 Q50 72 67 62 L63 70 Q50 78 37 70 Z" fill="#8a6a34" stroke="#e8c87a" stroke-width="1.2"/>
  <path d="M47 74 H53 L54 120 H46 Z" fill="#8a6a34" stroke="#e8c87a" stroke-width="1.2"/>
  <g stroke="#1a0e04" stroke-width="1.4">
    <path d="M50 88 v8 M47 91 h6"/>
    <path d="M50 104 v8 M47 107 h6"/>
    <path d="M38 66 v4 M36 67.5 h4 M62 66 v4 M60 67.5 h4"/>
  </g>
  <!-- седая борода поверх облачения -->
  <path d="M42 42 Q43 60 50 64 Q57 60 58 42 Q54 48 50 48 Q46 48 42 42 Z" fill="#e8c87a" opacity=".8"/>
  <!-- наперсный крест на цепи -->
  <path d="M44 58 Q50 66 56 58" fill="none" stroke="#c8a56a" stroke-width=".8"/>
  <path d="M50 64 v7 M47.5 66.5 h5" stroke="#e8c87a" stroke-width="1.6"/>
  <!-- пастырский посох с поперечиной -->
  <path d="M76 122 V40" stroke="#c8a56a" stroke-width="2"/>
  <path d="M70 42 Q72 36 76 40 Q80 36 82 42" fill="none" stroke="#e8c87a" stroke-width="2"/>
  <circle cx="76" cy="46" r="1.8" fill="#e8c87a"/>
  <!-- рука на посохе -->
  <path d="M66 74 Q72 72 76 74" fill="none" stroke="#c8a56a" stroke-width="2"/>
</svg>
