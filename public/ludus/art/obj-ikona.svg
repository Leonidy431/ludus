<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="Малая икона на доске">
  <title>Икона</title>
  <desc>Икона — окно в горний мир: образ святого в нимбе на доске с ковчегом. Честь, воздаваемая образу, восходит к Первообразу (Иоанн Дамаскин, VII Вселенский Собор). Лампада перед ней — живая молитва.</desc>
  <!-- Объект молитвы: иконная доска с ковчегом, святой в нимбе, лампада внизу -->
  <defs>
    <radialGradient id="ikona-bg" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#3a2410"/>
      <stop offset="100%" stop-color="#1a0e04"/>
    </radialGradient>
  </defs>
  <!-- картуш-рамка -->
  <rect x="2" y="2" width="92" height="92" rx="10" fill="url(#ikona-bg)" stroke="#8a6a34" stroke-width="2"/>
  <rect x="7" y="7" width="82" height="82" rx="7" fill="none" stroke="#c8a56a" stroke-width="1" opacity=".55"/>
  <g>
    <!-- доска и ковчег -->
    <rect x="24" y="12" width="48" height="62" rx="2" fill="#8a6a34" stroke="#c8a56a" stroke-width="1.8"/>
    <rect x="29" y="17" width="38" height="52" fill="#2a1808" stroke="#e8c87a" stroke-width="1"/>
    <!-- нимб святого -->
    <circle cx="48" cy="31" r="8.5" fill="#e8c87a" opacity=".9"/>
    <circle cx="48" cy="32" r="4.6" fill="#c8a56a" stroke="#8a6a34" stroke-width="1.2"/>
    <!-- ризы, фронтальная спокойная поза -->
    <path d="M48 38 C38 42 36 56 36 68 H60 C60 56 58 42 48 38 Z" fill="#2a1808" stroke="#c8a56a" stroke-width="1.4"/>
    <!-- омофор с крестами -->
    <path d="M40 46 Q48 50 56 46 M48 49 V68" fill="none" stroke="#e8c87a" stroke-width="1.8"/>
    <path d="M48 56 v4 M46 58 h4" stroke="#2a1808" stroke-width="1"/>
    <!-- благословляющая рука и закрытое Евангелие -->
    <circle cx="42" cy="53" r="1.8" fill="#e8c87a"/>
    <rect x="52" y="52" width="5" height="7" fill="#c8a56a" stroke="#8a6a34" stroke-width=".8"/>
    <!-- лампада перед образом -->
    <path d="M42 78 H54 Q53 84 48 85 Q43 84 42 78 Z" fill="#c8a56a" stroke="#8a6a34" stroke-width="1"/>
    <path d="M48 71 Q50 74 49 76 Q48 77 47 76 Q46 74 48 71 Z" fill="#e8c87a"/>
  </g>
</svg>
