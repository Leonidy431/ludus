<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="Выносливость — атрибут постоянства">
  <title>Выносливость (Constitution)</title>
  <desc>Гора с крестом и корни в скале: постоянство, пост и долгая молитва. Исаак Сирин учит, что терпение — мать утешения; кто укоренён, того не сдвинет буря. Атрибут даёт силу для поста и бдения.</desc>
  <!-- Атрибут ФОРМЫ №4: Constitution — укоренённая гора с крестом на вершине -->
  <defs>
    <radialGradient id="constitution-bg" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#3a2410"/>
      <stop offset="100%" stop-color="#1a0e04"/>
    </radialGradient>
  </defs>
  <!-- картуш-рамка -->
  <rect x="2" y="2" width="92" height="92" rx="10" fill="url(#constitution-bg)" stroke="#8a6a34" stroke-width="2"/>
  <rect x="7" y="7" width="82" height="82" rx="7" fill="none" stroke="#c8a56a" stroke-width="1" opacity=".55"/>
  <g>
    <!-- гора терпения -->
    <path d="M14 66 L38 28 L48 40 L56 30 L82 66 Z" fill="#2a1808" stroke="#c8a56a" stroke-width="2" stroke-linejoin="round"/>
    <!-- крест на вершине -->
    <path d="M38 14 V28 M33 19 H43" stroke="#e8c87a" stroke-width="2.4" stroke-linecap="round"/>
    <!-- линия земли -->
    <path d="M12 66 H84" stroke="#8a6a34" stroke-width="2"/>
    <!-- корни, уходящие в глубину -->
    <g stroke="#8a6a34" stroke-width="1.6" fill="none" stroke-linecap="round">
      <path d="M36 66 Q34 74 28 80"/><path d="M44 66 Q46 76 44 84"/><path d="M54 66 Q58 74 66 78"/>
    </g>
  </g>
</svg>
