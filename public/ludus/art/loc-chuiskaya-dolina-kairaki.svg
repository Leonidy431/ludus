<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Чуйская долина — поле кайраков с крестами">
  <title>Поле кайраков в Чуйской долине</title>
  <desc>ФОРМА: широкая долина под хребтом, пирамидальные тополя, речка Чу и поле речных валунов-кайраков с высеченными крестами (связка Л-23). ДЕЙСТВИЕ: дьякон обходит кладбище, описывает камни и молится об усопших, ничего не унося. ЦЕЛЬ: память о христианах Семиречья и знание несторианского креста на лотосе. Миссия: 17 Несторианский крест.</desc>
  <!-- Арт-канон §9.0: умбра+золото, без нимбов. Рисовано вручную: сырьё 99 репо не подходит (правило 0.15). -->
  <defs>
    <linearGradient id="chui-nebo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0e04"/>
      <stop offset="60%" stop-color="#3a2410"/>
      <stop offset="100%" stop-color="#8a6a34"/>
    </linearGradient>
  </defs>
  <rect width="320" height="180" fill="url(#chui-nebo)"/>
  <!-- хребет Киргизского Алатау со снегом -->
  <path d="M0 82 L34 50 L62 74 L98 40 L134 72 L170 48 L212 78 L250 44 L288 70 L320 56 V100 H0 Z" fill="#241405"/>
  <g fill="#e8c87a" opacity=".55">
    <path d="M28 56 L34 50 L40 56 Z"/><path d="M92 46 L98 40 L104 46 Z"/><path d="M244 50 L250 44 L256 50 Z"/>
  </g>
  <!-- долина -->
  <path d="M0 100 Q160 88 320 100 V180 H0 Z" fill="#2a1808"/>
  <!-- река Чу -->
  <path d="M320 104 Q250 112 200 108 Q150 104 100 114 Q50 122 0 118" fill="none" stroke="#1f5a73" stroke-width="3"/>
  <!-- тополя -->
  <g fill="#1a0e04" stroke="#8a6a34" stroke-width="1.2">
    <path d="M22 110 Q16 90 22 70 Q28 90 22 110 Z"/>
    <path d="M36 112 Q31 96 36 80 Q41 96 36 112 Z"/>
    <path d="M292 110 Q286 88 292 66 Q298 88 292 110 Z"/>
  </g>
  <!-- кайраки с высеченными крестами -->
  <g fill="#241405" stroke="#c8a56a" stroke-width="1.5">
    <path d="M70 156 Q66 136 80 130 Q94 136 90 156 Z"/>
    <path d="M120 164 Q114 138 132 132 Q150 140 144 164 Z"/>
    <path d="M178 158 Q174 140 188 134 Q202 140 198 158 Z"/>
    <path d="M226 166 Q222 144 238 138 Q254 146 250 166 Z"/>
    <path d="M100 136 Q98 124 106 120 Q114 124 112 136 Z"/>
    <path d="M206 132 Q204 122 211 118 Q218 122 216 132 Z"/>
    <path d="M262 140 Q260 128 268 124 Q276 128 274 140 Z"/>
  </g>
  <g stroke="#e8c87a" stroke-width="1.4" fill="none" stroke-linecap="round">
    <path d="M80 136 V148 M75 141 H85"/>
    <path d="M132 140 V154 M126 146 H138"/>
    <path d="M188 140 V152 M183 145 H193"/>
    <path d="M238 146 V158 M233 151 H243"/>
    <path d="M106 124 V132 M103 127 H109"/>
    <path d="M211 121 V129 M208 124 H214"/>
    <path d="M268 128 V136 M265 131 H271"/>
  </g>
  <!-- лотос-подножие у главного камня -->
  <path d="M126 157 Q129 153 132 156 Q135 153 138 157 Q132 160 126 157 Z" fill="none" stroke="#c8a56a" stroke-width="1.2"/>
  <!-- травы степи -->
  <g stroke="#8a6a34" stroke-width="1" fill="none">
    <path d="M40 170 l2 -6 l2 6 M160 174 l2 -6 l2 6 M280 172 l2 -6 l2 6 M300 160 l2 -5 l2 5"/>
  </g>
  <!-- бирка Л-23 на колышке -->
  <path d="M156 170 V156" stroke="#8a6a34" stroke-width="1.4"/>
  <rect x="152" y="150" width="9" height="7" rx="1" fill="#1a0e04" stroke="#c8a56a" stroke-width="1"/>
</svg>
