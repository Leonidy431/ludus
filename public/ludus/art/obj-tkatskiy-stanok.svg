<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="Ткацкий станок с натянутой основой и челноком">
  <title>Ткацкий станок</title>
  <desc>ФОРМА: деревянная рама станка, нити основы, навой с сотканным полотном с узором, челнок и бердо. ДЕЙСТВИЕ: дьякон устраивает при обители ткацкую мастерскую для вдов и беженцев. ЦЕЛЬ: труд, возвращающий человеку достоинство и хлеб. Миссия: 69 Текстильные цеха.</desc>
  <!-- Арт-канон §9.0: умбра+золото, без нимбов. Рисовано вручную: сырьё 99 репо не подходит (правило 0.15). -->
  <defs>
    <radialGradient id="ts-bg" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#3a2410"/>
      <stop offset="100%" stop-color="#1a0e04"/>
    </radialGradient>
  </defs>
  <rect x="2" y="2" width="92" height="92" rx="10" fill="url(#ts-bg)" stroke="#8a6a34" stroke-width="2"/>
  <rect x="7" y="7" width="82" height="82" rx="7" fill="none" stroke="#c8a56a" stroke-width="1" opacity=".55"/>
  <!-- рама станка -->
  <g stroke="#c8a56a" stroke-width="2" fill="none">
    <path d="M20 84 V14 M76 84 V14 M18 14 H78"/>
    <path d="M16 84 H28 M68 84 H80"/>
  </g>
  <!-- верхний навой -->
  <rect x="22" y="18" width="52" height="6" rx="3" fill="#8a6a34" stroke="#c8a56a" stroke-width="1.2"/>
  <!-- нити основы -->
  <g stroke="#e8c87a" stroke-width=".8">
    <path d="M26 24 V52 M30 24 V52 M34 24 V52 M38 24 V52 M42 24 V52 M46 24 V52 M50 24 V52 M54 24 V52 M58 24 V52 M62 24 V52 M66 24 V52 M70 24 V52"/>
  </g>
  <!-- бердо -->
  <rect x="22" y="36" width="52" height="4" fill="#2a1808" stroke="#c8a56a" stroke-width="1.2"/>
  <!-- сотканное полотно с узором -->
  <rect x="24" y="52" width="48" height="20" fill="#8a6a34" stroke="#c8a56a" stroke-width="1.2"/>
  <path d="M24 58 H72 M24 66 H72" stroke="#2a1808" stroke-width="1"/>
  <path d="M28 62 l4 -3 l4 3 l4 -3 l4 3 l4 -3 l4 3 l4 -3 l4 3 l4 -3 l4 3 l4 -3 l4 3" fill="none" stroke="#e8c87a" stroke-width="1.1"/>
  <!-- нижний навой -->
  <rect x="22" y="72" width="52" height="6" rx="3" fill="#8a6a34" stroke="#c8a56a" stroke-width="1.2"/>
  <!-- челнок с утком -->
  <path d="M30 46 Q48 42 66 46 Q48 50 30 46 Z" fill="#c8a56a" stroke="#8a6a34" stroke-width="1.2"/>
  <path d="M44 46 H52" stroke="#c0392b" stroke-width="1.6"/>
</svg>
