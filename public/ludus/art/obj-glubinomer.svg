<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="Глубиномер — циферблат глубины">
  <title>Глубиномер</title>
  <desc>Стрелка показывает глубину погружения: «Из глубины воззвах к Тебе, Господи» (Пс 129:1). Чем глубже спуск, тем больше смирения и тем больше бонус к Мудрости за наблюдение.</desc>
  <!-- Объект ROV: круглый манометр-глубиномер со стрелкой -->
  <defs>
    <radialGradient id="glubinomer-bg" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#1f5a73"/>
      <stop offset="100%" stop-color="#0d2a3a"/>
    </radialGradient>
  </defs>
  <!-- картуш-рамка -->
  <rect x="2" y="2" width="92" height="92" rx="10" fill="url(#glubinomer-bg)" stroke="#8a6a34" stroke-width="2"/>
  <rect x="7" y="7" width="82" height="82" rx="7" fill="none" stroke="#c8a56a" stroke-width="1" opacity=".55"/>
  <g>
    <!-- корпус прибора -->
    <circle cx="48" cy="50" r="30" fill="#2a1808" stroke="#c8a56a" stroke-width="2.4"/>
    <circle cx="48" cy="50" r="25" fill="#0d2a3a" stroke="#8a6a34" stroke-width="1"/>
    <!-- штуцер -->
    <rect x="44" y="12" width="8" height="8" fill="#c8a56a" stroke="#8a6a34" stroke-width="1"/>
    <!-- шкала: деления по дуге -->
    <g stroke="#e8c87a" stroke-width="1.6" stroke-linecap="round">
      <path d="M31 67 l3 -3"/><path d="M26 50 h4"/><path d="M31 33 l3 3"/>
      <path d="M48 26 v4"/><path d="M65 33 l-3 3"/><path d="M70 50 h-4"/>
    </g>
    <!-- опасная глубина — красная дуга -->
    <path d="M66 58 A20 20 0 0 1 60 66" fill="none" stroke="#c0392b" stroke-width="2.4"/>
    <!-- стрелка -->
    <path d="M48 50 L64 40" stroke="#e8c87a" stroke-width="2.2" stroke-linecap="round"/>
    <circle cx="48" cy="50" r="3" fill="#c8a56a" stroke="#8a6a34" stroke-width="1"/>
    <!-- волна под прибором -->
    <path d="M22 86 Q30 82 38 86 T54 86 T70 86" fill="none" stroke="#1f5a73" stroke-width="1.6"/>
  </g>
</svg>
