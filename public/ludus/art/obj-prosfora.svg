<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="Просфора с печатью">
  <title>Просфора</title>
  <desc>Двучастная просфора — два естества Христа, божеское и человеческое; печать «IС ХС НИ КА» — «Иисус Христос побеждает». Хлеб приношения: из многих зёрен — одно тело Церкви.</desc>
  <!-- Объект литургии: просфора сверху с печатью и сбоку двумя частями -->
  <defs>
    <radialGradient id="prosfora-bg" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#3a2410"/>
      <stop offset="100%" stop-color="#1a0e04"/>
    </radialGradient>
  </defs>
  <!-- картуш-рамка -->
  <rect x="2" y="2" width="92" height="92" rx="10" fill="url(#prosfora-bg)" stroke="#8a6a34" stroke-width="2"/>
  <rect x="7" y="7" width="82" height="82" rx="7" fill="none" stroke="#c8a56a" stroke-width="1" opacity=".55"/>
  <g>
    <!-- просфора сверху: печать -->
    <circle cx="48" cy="40" r="24" fill="#c8a56a" stroke="#8a6a34" stroke-width="2"/>
    <circle cx="48" cy="40" r="19" fill="none" stroke="#8a6a34" stroke-width="1"/>
    <rect x="36" y="28" width="24" height="24" fill="none" stroke="#2a1808" stroke-width="1.4"/>
    <path d="M48 28 V52 M36 40 H60" stroke="#2a1808" stroke-width="2.2"/>
    <!-- надпись ІС ХС НІ КА (пиктограммы букв) -->
    <g stroke="#2a1808" stroke-width="1.1" fill="none">
      <path d="M39 31 v6 M42 31 q-2 0 -2 3 q0 3 2 3"/>
      <path d="M51 31 l4 6 M55 31 l-4 6 M58 31 q-2 0 -2 3 q0 3 2 3"/>
      <path d="M38 43 v6 M42 43 v6 M38 46 h4 M44 43 v6"/>
      <path d="M51 43 v6 M51 46 l4 -3 M51 46 l4 3 M56 49 l1.5 -6 l1.5 6"/>
    </g>
    <!-- просфора сбоку: две части -->
    <path d="M30 80 Q30 72 48 72 Q66 72 66 80 Z" fill="#c8a56a" stroke="#8a6a34" stroke-width="1.5"/>
    <path d="M36 72 Q36 66 48 66 Q60 66 60 72" fill="#e8c87a" stroke="#8a6a34" stroke-width="1.5"/>
    <path d="M26 82 H70" stroke="#8a6a34" stroke-width="1.6"/>
  </g>
</svg>
