<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 140" role="img" aria-label="Откупщик податей со счётной доской">
  <title>Откупщик</title>
  <desc>Форма: сборщик в высокой шапке, со счётной доской и мешком податей, с печатью на шнуре. Действие: вместе с дьяконом пересчитать подать по мере, а не по жадности. Цель: разумный налог вместо грабежа; откупщик может обратиться, как Закхей. Миссия: 65 Рационализация налогов.</desc>
  <rect width="100" height="140" fill="#1a0e04"/>
  <rect x="5" y="5" width="90" height="130" fill="none" stroke="#8a6a34" stroke-width="1.5"/>
  <!-- голова, высокая шапка сборщика -->
  <circle cx="50" cy="38" r="11" fill="#2a1808" stroke="#c8a56a" stroke-width="2"/>
  <path d="M40 30 L44 14 H56 L60 30 Z" fill="#2a1808" stroke="#c8a56a" stroke-width="1.5"/>
  <path d="M39 30 H61" stroke="#8a6a34" stroke-width="2.5"/>
  <!-- усы, внимательный взгляд -->
  <path d="M45 37 h3 M52 37 h3" stroke="#c8a56a" stroke-width="1.3"/>
  <path d="M44 43 H56" stroke="#c8a56a" stroke-width="1.5"/>
  <!-- халат -->
  <path d="M50 50 C31 56 28 80 30 120 H70 C72 80 69 56 50 50 Z" fill="#2a1808" stroke="#c8a56a" stroke-width="2"/>
  <!-- счётная доска с рядами камешков -->
  <rect x="34" y="62" width="30" height="20" rx="2" fill="#1a0e04" stroke="#e8c87a" stroke-width="1.5"/>
  <g stroke="#8a6a34" stroke-width="1"><path d="M36 67 H62"/><path d="M36 72 H62"/><path d="M36 77 H62"/></g>
  <g fill="#e8c87a"><circle cx="40" cy="67" r="1.6"/><circle cx="44" cy="67" r="1.6"/><circle cx="52" cy="72" r="1.6"/><circle cx="40" cy="77" r="1.6"/><circle cx="56" cy="77" r="1.6"/><circle cx="60" cy="77" r="1.6"/></g>
  <!-- мешок податей у ног -->
  <path d="M60 104 Q56 118 66 120 Q78 120 76 106 Q72 100 68 100 Z" fill="#8a6a34" stroke="#c8a56a" stroke-width="1.5"/>
  <path d="M64 102 Q68 98 72 102" fill="none" stroke="#e8c87a" stroke-width="1.2"/>
  <!-- печать на шнуре -->
  <path d="M38 88 V100" stroke="#8a6a34" stroke-width="1.2"/>
  <circle cx="38" cy="103" r="3" fill="#c0392b" stroke="#e8c87a" stroke-width="1"/>
</svg>
