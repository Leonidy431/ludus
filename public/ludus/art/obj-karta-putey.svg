<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="Карта караванных путей вокруг Иссык-Куля">
  <title>Карта путей</title>
  <desc>Развёрнутая карта-свиток: озеро Иссык-Куль, хребты, пунктир караванного пути со стоянками и знак стран света. ФОРМА: знание дорог, собранное многими путниками. ДЕЙСТВИЕ: игрок отмечает станы, колодцы и опасные перевалы. ЦЕЛЬ: путь миссии, открытый для всех — купцов любых вер. Миссия: 12 «Шёлковый коридор» (реестр СГ-14).</desc>
  <defs>
    <radialGradient id="krt-bg" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#3a2410"/>
      <stop offset="100%" stop-color="#1a0e04"/>
    </radialGradient>
  </defs>
  <rect x="2" y="2" width="92" height="92" rx="10" fill="url(#krt-bg)" stroke="#8a6a34" stroke-width="2"/>
  <rect x="7" y="7" width="82" height="82" rx="7" fill="none" stroke="#c8a56a" stroke-width="1" opacity=".55"/>
  <!-- пергамент с валиками -->
  <rect x="18" y="20" width="60" height="56" fill="#c8a56a" stroke="#8a6a34" stroke-width="1.5"/>
  <rect x="14" y="17" width="6" height="62" rx="3" fill="#8a6a34" stroke="#e8c87a" stroke-width="1.2"/>
  <rect x="76" y="17" width="6" height="62" rx="3" fill="#8a6a34" stroke="#e8c87a" stroke-width="1.2"/>
  <!-- озеро -->
  <path d="M34 46 Q46 38 62 42 Q70 46 64 52 Q50 56 36 52 Q30 50 34 46 Z" fill="#1f5a73" stroke="#0d2a3a" stroke-width="1.2"/>
  <!-- хребты -->
  <g fill="none" stroke="#2a1808" stroke-width="1.3">
    <path d="M26 34 l4 -5 l4 5 l4 -5 l4 5"/><path d="M50 30 l4 -5 l4 5 l4 -5 l4 5"/>
    <path d="M40 68 l4 -5 l4 5 l4 -5 l4 5"/>
  </g>
  <!-- караванный путь со стоянками -->
  <path d="M22 60 Q30 58 32 50 Q36 40 48 36 Q62 34 70 40 Q74 50 72 62" fill="none" stroke="#c0392b" stroke-width="1.3" stroke-dasharray="2.5 2"/>
  <g fill="#2a1808"><circle cx="22" cy="60" r="2"/><circle cx="48" cy="36" r="2"/><circle cx="72" cy="62" r="2"/></g>
  <!-- знак стран света -->
  <g stroke="#2a1808" stroke-width="1"><path d="M68 24 v8 M64 28 h8"/></g>
  <path d="M68 22 l-1.5 3 h3 Z" fill="#2a1808"/>
</svg>
