<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Тайная библиотека — подземный архив со свитками и кодексами">
  <title>Тайный архив</title>
  <desc>ФОРМА: сводчатый подвал под обителью, лестница из люка, стеллажи со свитками в гнёздах и кодексами, окованный ларь, один светильник на пюпитре. ДЕЙСТВИЕ: дьякон разбирает хранилище братьев-униторов, сверяет рукописи и решает, что сохранить и кому показать. ЦЕЛЬ: хранение предания и честность перед источником. Миссия: 64 Тайный архив униторов.</desc>
  <!-- Арт-канон §9.0: умбра+золото, без нимбов. Рисовано вручную: сырьё 99 репо не подходит (правило 0.15). -->
  <defs>
    <linearGradient id="tb-nebo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0e04"/>
      <stop offset="60%" stop-color="#241405"/>
      <stop offset="100%" stop-color="#1a0e04"/>
    </linearGradient>
  </defs>
  <rect width="320" height="180" fill="url(#tb-nebo)"/>
  <!-- арки подвала -->
  <g fill="none" stroke="#8a6a34" stroke-width="2">
    <path d="M0 60 Q60 10 120 60 Q180 10 240 60 Q280 26 320 44"/>
    <path d="M120 60 V150 M240 60 V150"/>
  </g>
  <rect y="150" width="320" height="30" fill="#140a02"/>
  <path d="M0 150 H320" stroke="#8a6a34" stroke-width="1.5"/>
  <!-- стеллаж со свитками в гнёздах -->
  <rect x="14" y="66" width="96" height="84" fill="#140a02" stroke="#c8a56a" stroke-width="1.6"/>
  <path d="M14 94 H110 M14 122 H110 M46 66 V150 M78 66 V150" stroke="#8a6a34" stroke-width="1.4"/>
  <g fill="#c8a56a">
    <circle cx="24" cy="80" r="3.5"/><circle cx="34" cy="84" r="3.5"/><circle cx="58" cy="82" r="3.5"/>
    <circle cx="68" cy="78" r="3.5"/><circle cx="90" cy="84" r="3.5"/><circle cx="100" cy="80" r="3.5"/>
    <circle cx="26" cy="110" r="3.5"/><circle cx="62" cy="108" r="3.5"/><circle cx="90" cy="112" r="3.5"/>
    <circle cx="30" cy="138" r="3.5"/><circle cx="60" cy="136" r="3.5"/><circle cx="96" cy="140" r="3.5"/>
  </g>
  <g fill="#2a1808"><circle cx="24" cy="80" r="1.2"/><circle cx="68" cy="78" r="1.2"/><circle cx="62" cy="108" r="1.2"/><circle cx="96" cy="140" r="1.2"/></g>
  <!-- полка кодексов -->
  <g fill="#2a1808" stroke="#c8a56a" stroke-width="1.3">
    <rect x="130" y="80" width="8" height="24"/><rect x="140" y="82" width="10" height="22"/>
    <rect x="152" y="78" width="7" height="26"/><rect x="161" y="84" width="11" height="20"/>
    <rect x="174" y="80" width="8" height="24"/>
  </g>
  <path d="M126 104 H230" stroke="#8a6a34" stroke-width="1.8"/>
  <!-- пюпитр с раскрытым кодексом и светильником -->
  <path d="M176 150 V128 M166 150 H186" stroke="#8a6a34" stroke-width="2"/>
  <path d="M160 128 L176 122 L192 128 L176 132 Z" fill="#c8a56a" stroke="#8a6a34" stroke-width="1.2"/>
  <path d="M168 127 H174 M178 127 H184" stroke="#2a1808" stroke-width=".9"/>
  <path d="M204 118 Q210 116 212 120 H200 Q200 116 204 118 Z" fill="#c8a56a"/>
  <path d="M206 108 Q209 112 206 116 Q203 112 206 108 Z" fill="#e8c87a"/>
  <circle cx="206" cy="113" r="12" fill="#e8c87a" opacity=".13"/>
  <path d="M206 120 V150" stroke="#8a6a34" stroke-width="1.4"/>
  <!-- окованный ларь -->
  <rect x="252" y="128" width="46" height="22" fill="#2a1808" stroke="#c8a56a" stroke-width="1.6"/>
  <path d="M252 124 Q275 116 298 124 V128 H252 Z" fill="#8a6a34" stroke="#c8a56a" stroke-width="1.4"/>
  <path d="M262 124 V150 M288 124 V150" stroke="#8a6a34" stroke-width="1.6"/>
  <rect x="272" y="134" width="6" height="7" fill="#e8c87a"/>
  <!-- лестница из люка -->
  <g stroke="#8a6a34" stroke-width="1.6" fill="none">
    <path d="M254 10 L276 60 M274 10 L296 60"/>
    <path d="M258 20 H278 M263 30 H283 M267 40 H287 M272 50 H292"/>
  </g>
  <rect x="248" y="4" width="32" height="6" fill="#8a6a34" opacity=".5"/>
</svg>
