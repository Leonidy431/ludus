<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="Вера — атрибут доверия Богу">
  <title>Вера (Faith)</title>
  <desc>Якорь-крест: надежда и вера — якорь души, безопасный и крепкий (Евр 6:19). Вера (πίστις) держит душу среди волн; у Дионисия Ареопагита она — неколебимое основание верующего в истине. Атрибут даёт доверие духовных NPC.</desc>
  <!-- Атрибут ФОРМЫ №2: Faith — крест-якорь над волнами -->
  <defs>
    <radialGradient id="faith-bg" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#3a2410"/>
      <stop offset="100%" stop-color="#1a0e04"/>
    </radialGradient>
  </defs>
  <!-- картуш-рамка -->
  <rect x="2" y="2" width="92" height="92" rx="10" fill="url(#faith-bg)" stroke="#8a6a34" stroke-width="2"/>
  <rect x="7" y="7" width="82" height="82" rx="7" fill="none" stroke="#c8a56a" stroke-width="1" opacity=".55"/>
  <g>
    <!-- крест-якорь -->
    <g stroke="#e8c87a" stroke-width="3" stroke-linecap="round" fill="none">
      <path d="M48 20 V72"/>
      <path d="M38 32 H58"/>
      <path d="M28 58 Q30 74 48 74 Q66 74 68 58"/>
    </g>
    <path d="M25 60 L28 55 L31 60 M65 60 L68 55 L71 60" fill="none" stroke="#e8c87a" stroke-width="2"/>
    <circle cx="48" cy="17" r="3.4" fill="none" stroke="#c8a56a" stroke-width="1.8"/>
    <!-- волны житейского моря -->
    <g stroke="#8a6a34" stroke-width="1.6" fill="none">
      <path d="M16 80 Q22 76 28 80 T40 80"/><path d="M56 80 Q62 76 68 80 T80 80"/>
    </g>
  </g>
</svg>
