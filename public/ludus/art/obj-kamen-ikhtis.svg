<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="Прибрежный камень со знаком рыбы у воды">
  <title>Камень со знаком рыбы</title>
  <desc>ФОРМА: валун на берегу Иссык-Куля с высеченным знаком рыбы, вода лижет подножие. ДЕЙСТВИЕ: в эпилоге игрок находит знак, пережив всех, кто его высек, и ставит на нём последнюю отметку пути. ЦЕЛЬ: вода унесла город, но исповедание осталось в камне; память Церкви переживает эпохи. Миссия: 99 Эпилог воды.</desc>
  <!-- Арт-канон §9.0: умбра+золото, без нимбов. Рисовано вручную: сырьё 99 репо не подходит (правило 0.15). -->
  <defs>
    <radialGradient id="kamen-ikhtis-bg" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#3a2410"/>
      <stop offset="100%" stop-color="#1a0e04"/>
    </radialGradient>
  </defs>
  <rect x="2" y="2" width="92" height="92" rx="10" fill="url(#kamen-ikhtis-bg)" stroke="#8a6a34" stroke-width="2"/>
  <rect x="7" y="7" width="82" height="82" rx="7" fill="none" stroke="#c8a56a" stroke-width="1" opacity=".55"/>
  <!-- вода у подножия -->
  <path d="M8 70 Q20 66 32 70 T56 70 T80 70 L88 69 V87 H8 Z" fill="#0d2a3a"/>
  <g stroke="#1f5a73" stroke-width="1.3" fill="none">
    <path d="M14 77 Q22 74 30 77 M60 80 Q68 77 76 80 M36 84 Q44 81 52 84"/>
  </g>
  <!-- валун -->
  <path d="M20 72 Q15 46 33 31 Q52 20 68 32 Q82 46 76 72 Z" fill="#2a1808" stroke="#c8a56a" stroke-width="1.8"/>
  <path d="M28 40 Q34 34 40 33 M66 60 Q70 54 70 46" fill="none" stroke="#8a6a34" stroke-width="1.2"/>
  <!-- высеченный знак рыбы -->
  <path d="M33 50 Q48 38 63 58 M33 58 Q48 70 63 50" fill="none" stroke="#e8c87a" stroke-width="2.4" stroke-linecap="round"/>
  <!-- отблеск утреннего света -->
  <circle cx="48" cy="52" r="16" fill="#e8c87a" opacity=".08"/>
</svg>
