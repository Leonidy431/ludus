<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 140" role="img" aria-label="Святитель Григорий Двоеслов, папа Римский">
  <title>Григорий Двоеслов</title>
  <desc>Святитель Григорий Двоеслов (Великий), православный папа Римский неразделённой Церкви, автор «Собеседований» и Литургии Преждеосвященных Даров. Голубь у уха — Святой Дух, диктующий слово; раскрытая книга — «Пастырское правило». Смысл: пастырь пишет не от себя, а слушая Духа; власть как служение рабам рабов Божиих.</desc>
  <rect width="100" height="140" fill="#1a0e04"/>
  <rect x="5" y="5" width="90" height="130" fill="none" stroke="#8a6a34" stroke-width="1.5"/>
  <!-- нимб святителя -->
  <circle cx="50" cy="32" r="17" fill="#2a1808" stroke="#e8c87a" stroke-width="1.5"/>
  <circle cx="50" cy="32" r="14.5" fill="none" stroke="#8a6a34" stroke-width="1" stroke-dasharray="2 2"/>
  <!-- лик -->
  <circle cx="50" cy="33" r="10" fill="#1a0e04" stroke="#c8a56a" stroke-width="2"/>
  <!-- голубь Святого Духа у правого уха -->
  <g fill="#e8c87a" stroke="#8a6a34" stroke-width=".8">
    <path d="M62 26 q8 -6 14 -2 q-4 1 -6 4 q6 2 8 8 q-8 -2 -12 -6 q-3 0 -4 -4 Z"/>
    <circle cx="74" cy="24" r="1.8"/>
  </g>
  <path d="M62 28 Q60 30 60 32" fill="none" stroke="#e8c87a" stroke-width="1" stroke-dasharray="1.5 1.5"/>
  <!-- фелонь -->
  <path d="M50 48 C31 54 27 80 29 118 H71 C73 80 69 54 50 48 Z" fill="#2a1808" stroke="#c8a56a" stroke-width="2"/>
  <!-- короткая борода -->
  <path d="M41 36 Q42 50 50 52 Q58 50 59 36 Q56 44 50 44 Q44 44 41 36 Z" fill="#c8a56a" opacity=".85"/>
  <!-- омофор с крестами -->
  <path d="M33 58 Q50 70 67 58" fill="none" stroke="#c8a56a" stroke-width="4.5"/>
  <path d="M50 66 L50 80" stroke="#c8a56a" stroke-width="4.5"/>
  <g stroke="#1a0e04" stroke-width="1.2">
    <path d="M40 60 v5 M37.5 62.5 h5"/><path d="M60 60 v5 M57.5 62.5 h5"/>
  </g>
  <!-- раскрытая книга «Пастырское правило» -->
  <path d="M34 84 L50 88 L66 84 L66 104 L50 108 L34 104 Z" fill="#1a0e04" stroke="#e8c87a" stroke-width="1.8"/>
  <path d="M50 88 V108" stroke="#c8a56a" stroke-width="1.5"/>
  <g stroke="#8a6a34" stroke-width="1">
    <path d="M37 90 L47 92 M37 94 L47 96 M37 98 L47 100"/>
    <path d="M53 92 L63 90 M53 96 L63 94 M53 100 L63 98"/>
  </g>
  <!-- чаша Преждеосвященных Даров у подола -->
  <path d="M74 110 h10 q0 7 -5 8 v4 h3 v2 h-8 v-2 h3 v-4 q-5 -1 -5 -8 Z" fill="#1a0e04" stroke="#c8a56a" stroke-width="1.3"/>
</svg>
