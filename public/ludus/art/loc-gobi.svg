<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Пустыня Гоби — каменистая равнина на подходе к ставке Каракорума, дальние горы">
  <!-- Арт-канон §9.0: умбра+золото. Ландшафтный тип Л-12 (Режиссёрский реестр
       99, Дополнение №3, Гуру-проход №60) — переиспользуемый фон дальнего
       восточного плеча пути к ставке великого хана (О-02/Р-16). -->
  <defs>
    <linearGradient id="gb-nebo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#140a02"/>
      <stop offset="48%" stop-color="#3a2410"/>
      <stop offset="85%" stop-color="#8a6a34"/>
      <stop offset="100%" stop-color="#241405"/>
    </linearGradient>
    <linearGradient id="gb-plain" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5a4020"/>
      <stop offset="100%" stop-color="#1a0e04"/>
    </linearGradient>
  </defs>
  <rect width="320" height="180" fill="url(#gb-nebo)"/>
  <!-- Дальние сухие горы (граница Монголии) -->
  <path d="M0 100 L44 76 L70 92 L110 68 L150 94 L200 74 L240 96 L280 78 L320 96 L320 108 L0 108 Z" fill="#241405" opacity=".9"/>
  <!-- Низкое холодное солнце -->
  <circle cx="90" cy="70" r="12" fill="#e8c87a" opacity=".9"/>
  <circle cx="90" cy="70" r="20" fill="#e8c87a" opacity=".14"/>
  <!-- Каменистая плоская равнина Гоби -->
  <rect y="106" width="320" height="74" fill="url(#gb-plain)"/>
  <!-- Разбросанные камни/гравий -->
  <g fill="#140a02" opacity=".55">
    <ellipse cx="46" cy="132" rx="5" ry="2.4"/>
    <ellipse cx="88" cy="146" rx="4" ry="2"/>
    <ellipse cx="150" cy="128" rx="6" ry="2.6"/>
    <ellipse cx="210" cy="150" rx="5" ry="2.2"/>
    <ellipse cx="270" cy="134" rx="4.5" ry="2"/>
  </g>
  <!-- Редкий колючий кустарник -->
  <g stroke="#241405" stroke-width="1.2" fill="none" opacity=".7">
    <path d="M120 168 V158 M120 162 L115 158 M120 160 L125 156"/>
    <path d="M240 172 V160 M240 165 L235 160 M240 163 L245 159"/>
  </g>
  <!-- Двугорбые верблюды каравана силуэтом -->
  <g transform="translate(170,120)" fill="#140a02" opacity=".85">
    <path d="M0 20 Q0 12 4 12 Q5 6 8 8 Q9 4 12 8 Q15 6 16 12 Q20 12 20 20 Z"/>
    <path d="M20 22 H26 M-1 22 L-4 20"/>
  </g>
</svg>
