<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="Бубенцы каравана на ремне">
  <title>Бубенцы каравана</title>
  <desc>Верблюжье ботало и круглые бубенцы на кожаном ремне — голос каравана в пыли и тумане. ФОРМА: звук, по которому караван находит своих. ДЕЙСТВИЕ: игрок слушает, не отстал ли кто, и держит строй на Шёлковом коридоре. ЦЕЛЬ: забота о каждом в пути. Мирской сигнальный звон — не церковный колокол и не «дзинь за награду». Миссия: 12 «Шёлковый коридор» (СГ-13).</desc>
  <defs>
    <radialGradient id="bub-bg" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#3a2410"/>
      <stop offset="100%" stop-color="#1a0e04"/>
    </radialGradient>
  </defs>
  <rect x="2" y="2" width="92" height="92" rx="10" fill="url(#bub-bg)" stroke="#8a6a34" stroke-width="2"/>
  <rect x="7" y="7" width="82" height="82" rx="7" fill="none" stroke="#c8a56a" stroke-width="1" opacity=".55"/>
  <!-- кожаный ремень дугой -->
  <path d="M14 30 Q48 50 82 30" fill="none" stroke="#8a6a34" stroke-width="5" stroke-linecap="round"/>
  <path d="M14 30 Q48 50 82 30" fill="none" stroke="#c8a56a" stroke-width="1" stroke-dasharray="2 3"/>
  <!-- круглые бубенцы по ремню -->
  <g fill="#c8a56a" stroke="#8a6a34" stroke-width="1.2">
    <circle cx="26" cy="42" r="5"/><circle cx="70" cy="42" r="5"/>
  </g>
  <g stroke="#1a0e04" stroke-width="1.2"><path d="M26 42 v4 M70 42 v4"/></g>
  <g fill="#1a0e04"><circle cx="26" cy="41" r="1"/><circle cx="70" cy="41" r="1"/></g>
  <!-- большое ботало в середине -->
  <path d="M48 42 V46" stroke="#8a6a34" stroke-width="2"/>
  <path d="M38 50 H58 L62 76 H34 Z" fill="#c8a56a" stroke="#8a6a34" stroke-width="1.5"/>
  <path d="M38 58 H58" stroke="#8a6a34" stroke-width="1"/>
  <path d="M34 76 Q48 80 62 76" fill="none" stroke="#e8c87a" stroke-width="1.2"/>
  <!-- язычок -->
  <path d="M48 70 V80" stroke="#2a1808" stroke-width="1.5"/>
  <circle cx="48" cy="81" r="2" fill="#2a1808"/>
  <!-- волна звука -->
  <g fill="none" stroke="#e8c87a" stroke-width="1" opacity=".6">
    <path d="M68 60 Q72 66 68 72"/><path d="M28 60 Q24 66 28 72"/>
  </g>
</svg>
