<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 140" role="img" aria-label="Преподобный Максим Исповедник">
  <title>Максим Исповедник</title>
  <desc>Преподобный Максим Исповедник, монах-богослов, исповедавший две воли во Христе и за это лишённый языка и руки. Раскрытая книга — его учение об обожении: Бог стал человеком, чтобы человек стал богом по благодати. Крест над книгой — верность истине ценой страдания. Смысл: знание, ставшее исповеданием.</desc>
  <rect width="100" height="140" fill="#1a0e04"/>
  <rect x="5" y="5" width="90" height="130" fill="none" stroke="#8a6a34" stroke-width="1.5"/>
  <!-- нимб святого -->
  <circle cx="50" cy="32" r="17" fill="#2a1808" stroke="#e8c87a" stroke-width="1.5"/>
  <circle cx="50" cy="32" r="14.5" fill="none" stroke="#8a6a34" stroke-width="1" stroke-dasharray="2 2"/>
  <!-- лик старца, высокий лоб -->
  <circle cx="50" cy="33" r="10" fill="#1a0e04" stroke="#c8a56a" stroke-width="2"/>
  <!-- монашеская мантия -->
  <path d="M50 48 C31 54 27 80 29 118 H71 C73 80 69 54 50 48 Z" fill="#2a1808" stroke="#c8a56a" stroke-width="2"/>
  <!-- длинная раздвоенная седая борода -->
  <path d="M42 38 Q44 58 49 60 L50 55 L51 60 Q56 58 58 38 Q54 46 50 46 Q46 46 42 38 Z" fill="#e8c87a" opacity=".75"/>
  <!-- складки мантии -->
  <path d="M40 70 Q38 94 40 118 M60 70 Q62 94 60 118" fill="none" stroke="#8a6a34" stroke-width="1.2"/>
  <!-- раскрытая книга богословия -->
  <path d="M34 80 L50 84 L66 80 L66 100 L50 104 L34 100 Z" fill="#1a0e04" stroke="#e8c87a" stroke-width="1.8"/>
  <path d="M50 84 V104" stroke="#c8a56a" stroke-width="1.5"/>
  <g stroke="#8a6a34" stroke-width="1">
    <path d="M37 86 L47 88 M37 90 L47 92 M37 94 L47 96"/>
    <path d="M53 88 L63 86 M53 92 L63 90 M53 96 L63 94"/>
  </g>
  <!-- малый крест над книгой: две воли, одно Лицо -->
  <path d="M50 72 v6 M47 75 h6" stroke="#e8c87a" stroke-width="1.5"/>
</svg>
