<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Сарай на Волге — ставка Орды: дворец, юрты, река">
  <!-- Арт-канон §9.0: умбра+золото. Локация III блока кампании: Сарай —
       столица Орды на Волге. Проход №50; задел под реестр VR п.92
       (третья VR-сцена): 2D-фоллбэк/виньетка до появления saray.glb. -->
  <defs>
    <linearGradient id="sr-nebo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0e04"/>
      <stop offset="55%" stop-color="#3a2410"/>
      <stop offset="82%" stop-color="#8a6a34"/>
      <stop offset="100%" stop-color="#2a1808"/>
    </linearGradient>
    <linearGradient id="sr-volga" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8a6a34"/>
      <stop offset="100%" stop-color="#1a0e04"/>
    </linearGradient>
  </defs>
  <rect width="320" height="180" fill="url(#sr-nebo)"/>
  <!-- Низкое солнце в дымке степи -->
  <circle cx="64" cy="84" r="12" fill="#e8c87a" opacity=".9"/>
  <circle cx="64" cy="84" r="21" fill="#e8c87a" opacity=".15"/>
  <!-- Дворец хана: купол с шатровым верхом и два малых купола -->
  <g>
    <path d="M150 106 L150 78 Q170 58 190 78 L190 106 Z" fill="#241405"/>
    <path d="M168 60 L170 50 L172 60 Z" fill="#241405"/>
    <circle cx="170" cy="50" r="2.2" fill="#e8c87a"/>
    <path d="M128 106 L128 90 Q137 80 146 90 L146 106 Z" fill="#1c1004"/>
    <path d="M194 106 L194 90 Q203 80 212 90 L212 106 Z" fill="#1c1004"/>
    <!-- Арочный портал со светом очага -->
    <path d="M162 106 L162 92 Q170 84 178 92 L178 106 Z" fill="#e8c87a" opacity=".85"/>
    <g stroke="#8a6a34" stroke-width="1.2" opacity=".7">
      <path d="M154 84 H186"/><path d="M156 96 H160 M180 96 H184"/>
    </g>
  </g>
  <!-- Городская стена с зубцами -->
  <path d="M96 106 H240 M96 106 V100 H102 V106 M110 106 V100 H116 V106 M228 106 V100 H234 V106"
        stroke="#241405" stroke-width="3" fill="none"/>
  <!-- Юрты становища слева/справа -->
  <g fill="#140a02">
    <path d="M30 122 Q42 106 54 122 L54 128 L30 128 Z"/>
    <path d="M41 107 L42 102 L43 107 Z"/>
    <path d="M256 124 Q267 110 278 124 L278 129 L256 129 Z"/>
    <path d="M290 126 Q298 116 306 126 L306 130 L290 130 Z"/>
  </g>
  <circle cx="42" cy="119" r="2.2" fill="#e8c87a" opacity=".8"/>
  <!-- Волга -->
  <path d="M0 140 Q80 132 180 140 Q260 146 320 138 L320 180 L0 180 Z" fill="url(#sr-volga)"/>
  <g stroke="#e8c87a" stroke-width="1.3" fill="none" opacity=".45">
    <path d="M40 152 Q52 148 64 152"/><path d="M150 158 Q162 154 174 158"/>
    <path d="M244 150 Q256 146 268 150"/>
  </g>
  <!-- Ладья купца на реке -->
  <g transform="translate(200,146)">
    <path d="M0 4 L2 -12 L10 2 Z" fill="#e8d9b8" opacity=".85"/>
    <path d="M-8 4 Q2 9 12 4 L10 8 L-6 8 Z" fill="#140a02"/>
  </g>
</svg>
