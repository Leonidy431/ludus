<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="Начитанность — атрибут знания текстов">
  <title>Начитанность (Erudition)</title>
  <desc>Раскрытый кодекс, свиток и перо: знание Писания и Синаксаря — память Церкви, переданная через чтение. Эрудиция не цель, а ключ: она отпирает ворота знания.</desc>
  <!-- Атрибут ФОРМЫ №7: Erudition — раскрытая книга, свиток и перо переписчика -->
  <defs>
    <radialGradient id="erudition-bg" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#3a2410"/>
      <stop offset="100%" stop-color="#1a0e04"/>
    </radialGradient>
  </defs>
  <!-- картуш-рамка -->
  <rect x="2" y="2" width="92" height="92" rx="10" fill="url(#erudition-bg)" stroke="#8a6a34" stroke-width="2"/>
  <rect x="7" y="7" width="82" height="82" rx="7" fill="none" stroke="#c8a56a" stroke-width="1" opacity=".55"/>
  <g>
    <!-- раскрытый кодекс -->
    <path d="M48 36 Q36 30 18 32 V70 Q36 68 48 74 Q60 68 78 70 V32 Q60 30 48 36 Z" fill="#2a1808" stroke="#c8a56a" stroke-width="2" stroke-linejoin="round"/>
    <path d="M48 36 V74" stroke="#8a6a34" stroke-width="1.6"/>
    <!-- строки текста -->
    <g stroke="#8a6a34" stroke-width="1.4">
      <path d="M24 42 H42 M24 49 H42 M24 56 H42 M24 63 H38"/>
      <path d="M54 42 H72 M54 49 H72 M54 56 H72 M54 63 H68"/>
    </g>
    <!-- киноварная буквица -->
    <rect x="23" y="39" width="5" height="6" fill="#c0392b" opacity=".85"/>
    <!-- перо переписчика -->
    <path d="M70 14 Q82 18 76 30 L62 44 L60 42 Z" fill="#c8a56a" stroke="#8a6a34" stroke-width="1"/>
    <path d="M62 44 L58 48" stroke="#e8c87a" stroke-width="1.5"/>
    <!-- свиток Синаксаря -->
    <path d="M20 80 H76" stroke="#e8c87a" stroke-width="3" stroke-linecap="round"/>
    <circle cx="20" cy="80" r="3" fill="#c8a56a" stroke="#8a6a34" stroke-width=".8"/>
    <circle cx="76" cy="80" r="3" fill="#c8a56a" stroke="#8a6a34" stroke-width=".8"/>
  </g>
</svg>
