<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="Брачные венцы на аналое">
  <title>Брачные венцы</title>
  <desc>Форма: два брачных венца с малыми крестами наверху, лежащие на аналое, покрытом белым рушником, над ними горящая свеча. Действие: таинство Венчания соединяет двух людей, а через их брак и два рода. Цель: брак — не сделка и не залог мира между ханами и купцами, а таинство любви (Еф. 5:32); дипломатия не может купить венец. Святыня: не лут, не награда, только объект сцены (noInteract, noLoot). Миссия: 60 Брак как дипломатия.</desc>
  <!-- Арт-канон §9.0: умбра+золото, картуш-рамка, без нимбов. Святыня: собственный рисунок проекта, не из сырья (ТАБУ 0.15/0.35 п.6). -->
  <defs>
    <radialGradient id="ventsy-bg" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#3a2410"/>
      <stop offset="100%" stop-color="#1a0e04"/>
    </radialGradient>
  </defs>
  <rect x="2" y="2" width="92" height="92" rx="10" fill="url(#ventsy-bg)" stroke="#8a6a34" stroke-width="2"/>
  <rect x="7" y="7" width="82" height="82" rx="7" fill="none" stroke="#c8a56a" stroke-width="1" opacity=".55"/>
  <!-- аналой под рушником -->
  <path d="M22 84 L28 58 H68 L74 84" fill="none" stroke="#8a6a34" stroke-width="2"/>
  <path d="M24 58 H72 L70 66 H26 Z" fill="#e8d9b8" opacity=".75" stroke="#c8a56a" stroke-width="1.2"/>
  <g stroke="#c0392b" stroke-width="1"><path d="M28 63 H68"/></g>
  <!-- левый венец -->
  <g stroke="#e8c87a" stroke-width="1.5" fill="#c8a56a">
    <path d="M24 56 V44 L28 48 L32 40 L36 48 L40 40 L42 44 V56 Z"/>
    <path d="M54 56 V44 L56 40 L60 48 L64 40 L68 48 L72 44 V56 Z"/>
  </g>
  <g fill="none" stroke="#8a6a34" stroke-width="1.2"><path d="M24 52 H42 M54 52 H72"/></g>
  <g fill="#1a0e04"><circle cx="33" cy="52" r="1.2"/><circle cx="63" cy="52" r="1.2"/></g>
  <!-- малые кресты на венцах -->
  <g stroke="#e8c87a" stroke-width="1.4"><path d="M33 40 V32 M30.5 35 H35.5 M63 40 V32 M60.5 35 H65.5"/></g>
  <!-- свеча со светом сверху -->
  <path d="M48 50 V30" stroke="#e8d9b8" stroke-width="3"/>
  <path d="M48 20 Q51 25 48 29 Q45 25 48 20 Z" fill="#e8c87a"/>
  <circle cx="48" cy="25" r="9" fill="#e8c87a" opacity=".14"/>
</svg>
