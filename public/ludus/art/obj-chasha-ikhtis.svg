<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="Глиняная чаша со знаком рыбы">
  <title>Чаша со знаком рыбы</title>
  <desc>Форма: простая глиняная чаша на низкой ножке, по стенке процарапан знак рыбы — древний тайный знак христиан. Действие: гончар мастерской ставит знак на бытовой посуде общины, которую игрок учится обжигать и раздавать. Цель: вера входит в повседневный труд; чаша бытовая, не богослужебная. Миссия: 67 «Керамические мастерские».</desc>
  <!-- Арт-канон §9.0: умбра+золото, картуш-рамка, без нимбов. -->
  <defs>
    <radialGradient id="chasha-ikh-bg" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#3a2410"/>
      <stop offset="100%" stop-color="#1a0e04"/>
    </radialGradient>
  </defs>
  <rect x="2" y="2" width="92" height="92" rx="10" fill="url(#chasha-ikh-bg)" stroke="#8a6a34" stroke-width="2"/>
  <rect x="7" y="7" width="82" height="82" rx="7" fill="none" stroke="#c8a56a" stroke-width="1" opacity=".55"/>
  <!-- тулово чаши -->
  <path d="M18 38 H78 Q76 62 48 66 Q20 62 18 38 Z" fill="#8a6a34" stroke="#c8a56a" stroke-width="1.8"/>
  <ellipse cx="48" cy="38" rx="30" ry="6" fill="#2a1808" stroke="#c8a56a" stroke-width="1.5"/>
  <!-- ножка -->
  <path d="M40 66 L38 74 H58 L56 66" fill="#8a6a34" stroke="#c8a56a" stroke-width="1.5"/>
  <!-- процарапанная рыба -->
  <path d="M34 52 Q46 42 58 52 Q46 60 34 52 Z M58 52 L64 47 M58 52 L64 57" fill="none" stroke="#1a0e04" stroke-width="1.8" stroke-linecap="round"/>
  <circle cx="40" cy="51" r="1" fill="#1a0e04"/>
  <!-- пояски гончарного круга -->
  <path d="M22 46 Q48 50 74 46" fill="none" stroke="#c8a56a" stroke-width=".8" opacity=".6"/>
</svg>
