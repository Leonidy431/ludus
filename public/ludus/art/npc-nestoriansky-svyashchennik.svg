<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 140" role="img" aria-label="Священник Церкви Востока">
  <title>Священник Церкви Востока</title>
  <desc>ФОРМА: пресвитер Церкви Востока (несторианин) в тёмной шапочке и ризе с орарём, с седой бородой; держит крест с расширенными концами над лотосом и книгу с сирийскими строками. Нарисован с уважением, как человек веры, без карикатуры и без нимба. ДЕЙСТВИЕ: спор с ним о вере ведётся словом, свидетельством и любовью, а не силой. ЦЕЛЬ: разномыслие о Христе требует истины и кротости вместе. Миссия 59.</desc>
  <rect width="100" height="140" fill="#1a0e04"/>
  <rect x="5" y="5" width="90" height="130" fill="none" stroke="#8a6a34" stroke-width="1.5"/>
  <!-- Арт-канон §9.0: умбра+золото, картуш, без нимбов -->
  <!-- лицо и тёмная шапочка-куссита -->
  <circle cx="50" cy="35" r="10" fill="#2a1808" stroke="#c8a56a" stroke-width="2"/>
  <path d="M40 32 Q40 20 50 20 Q60 20 60 32 Q50 27 40 32 Z" fill="#1a0e04" stroke="#8a6a34" stroke-width="1.5"/>
  <!-- седая окладистая борода -->
  <path d="M42 40 Q44 56 50 58 Q56 56 58 40 Q54 46 50 46 Q46 46 42 40 Z" fill="#e8c87a" opacity=".75"/>
  <!-- риза -->
  <path d="M50 48 C31 54 27 80 29 118 H71 C73 80 69 54 50 48 Z" fill="#2a1808" stroke="#c8a56a" stroke-width="2"/>
  <!-- стола-орарь с точками -->
  <path d="M44 58 V118 M56 58 V118" stroke="#8a6a34" stroke-width="3"/>
  <g fill="#e8c87a"><circle cx="44" cy="96" r="1.2"/><circle cx="56" cy="96" r="1.2"/><circle cx="44" cy="108" r="1.2"/><circle cx="56" cy="108" r="1.2"/></g>
  <!-- крест Церкви Востока над лотосом -->
  <g stroke="#e8c87a" stroke-width="2" fill="none">
    <path d="M50 62 V78 M43 70 H57"/>
    <path d="M47 62 H53 M47 78 H53 M43 67 V73 M57 67 V73"/>
  </g>
  <path d="M43 81 Q50 86 57 81 Q50 83 43 81 Z" fill="#c8a56a"/>
  <!-- книга с сирийскими строками -->
  <rect x="62" y="84" width="16" height="20" fill="#1a0e04" stroke="#e8c87a" stroke-width="1.5"/>
  <g stroke="#c8a56a" stroke-width="1"><path d="M65 90 H75 M65 95 H75 M65 100 H73"/></g>
</svg>
