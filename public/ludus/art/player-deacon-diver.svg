<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 140" role="img" aria-label="Дьякон-водолаз, оператор ROV на Иссык-Куле">
  <title>Дьякон под водой Иссык-Куля</title>
  <desc>Тот же дьякон в водолазном костюме с крестом на груди, связанный тросом с лодкой: погружение в глубину озера как образ нисхождения ума в сердце. Форма — Выносливость и Мудрость; действие — наблюдение глубины через ROV; цель — созерцание Творца в тварном мире (естественное созерцание).</desc>
  <rect width="100" height="140" fill="#0d2a3a"/>
  <rect x="5" y="5" width="90" height="130" fill="none" stroke="#8a6a34" stroke-width="1.5"/>
  <!-- свет с поверхности озера -->
  <path d="M8 14 Q28 10 50 14 T92 14" fill="none" stroke="#1f5a73" stroke-width="2"/>
  <g stroke="#1f5a73" stroke-width="1.2" opacity=".7">
    <path d="M30 16 L22 60 M50 16 L50 50 M70 16 L78 60"/>
  </g>
  <!-- страховочный трос к поверхности -->
  <path d="M50 8 Q56 20 52 30" fill="none" stroke="#c8a56a" stroke-width="1.8"/>
  <!-- водолазный шлем с иллюминатором -->
  <circle cx="50" cy="40" r="12" fill="#1a0e04" stroke="#c8a56a" stroke-width="2"/>
  <circle cx="50" cy="41" r="6" fill="#1f5a73" stroke="#e8c87a" stroke-width="1.5"/>
  <path d="M38 50 H62" stroke="#8a6a34" stroke-width="2"/>
  <!-- пузырьки дыхания — молитва, восходящая вверх -->
  <g fill="none" stroke="#e8c87a" stroke-width="1" opacity=".8">
    <circle cx="66" cy="30" r="1.5"/><circle cx="69" cy="23" r="2"/><circle cx="66" cy="15" r="1.5"/>
  </g>
  <!-- костюм -->
  <path d="M50 52 C33 56 30 80 33 116 H67 C70 80 67 56 50 52 Z" fill="#1a0e04" stroke="#c8a56a" stroke-width="2"/>
  <!-- малый крест на груди -->
  <path d="M50 62 v12 M45 66 h10" stroke="#e8c87a" stroke-width="2.2"/>
  <!-- пульт управления ROV в руках -->
  <path d="M40 86 H60 V96 H40 Z" fill="#2a1808" stroke="#e8c87a" stroke-width="1.5"/>
  <path d="M46 86 V80 M54 86 V80" stroke="#c8a56a" stroke-width="1.5"/>
  <circle cx="46" cy="79" r="1.8" fill="#c8a56a"/><circle cx="54" cy="79" r="1.8" fill="#c0392b"/>
  <!-- кабель к аппарату ROV -->
  <path d="M60 92 Q76 100 78 114" fill="none" stroke="#8a6a34" stroke-width="1.5"/>
  <!-- аппарат ROV с фонарём -->
  <path d="M72 114 H86 V122 H72 Z" fill="#2a1808" stroke="#c8a56a" stroke-width="1.5"/>
  <circle cx="84" cy="118" r="1.8" fill="#e8c87a"/>
  <!-- ласты -->
  <path d="M36 116 l-6 10 h12 Z M64 116 l6 10 h-12 Z" fill="#2a1808" stroke="#8a6a34" stroke-width="1.5"/>
  <!-- дно озера -->
  <path d="M8 130 Q30 124 50 130 T92 128" fill="none" stroke="#1f5a73" stroke-width="1.5"/>
</svg>
