<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Новая ограда обители на высокой террасе над озером">
  <title>Верхняя терраса</title>
  <desc>Высокая терраса на склоне над Иссык-Кулём: заложена новая каменная ограда, часть её ещё колья и верёвка, рядом груды камня и тачка; внизу у воды — старая обитель, которой грозит подъём озера. ФОРМА: новое место выше воды. ДЕЙСТВИЕ: игрок решает, что переносить и как размечать. ЦЕЛЬ: не держаться за стены — община переносит жизнь, а не только камни. Миссия: 35 «Перенос монастыря».</desc>
  <defs>
    <linearGradient id="ter-nebo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0e04"/>
      <stop offset="60%" stop-color="#3a2410"/>
      <stop offset="100%" stop-color="#8a6a34"/>
    </linearGradient>
  </defs>
  <rect width="320" height="180" fill="url(#ter-nebo)"/>
  <!-- дальний хребет -->
  <path d="M0 70 L40 44 L80 62 L130 36 L180 60 L240 40 L320 62 V80 H0 Z" fill="#241405"/>
  <!-- озеро внизу справа -->
  <path d="M170 150 Q250 138 320 142 V180 H170 Z" fill="#0d2a3a"/>
  <g stroke="#1f5a73" stroke-width="1.2" fill="none"><path d="M200 160 Q210 157 220 160 M260 168 Q270 165 280 168"/></g>
  <!-- старая обитель у самой воды -->
  <g fill="#2a1808" stroke="#8a6a34" stroke-width="1.2">
    <path d="M230 150 V138 H270 V150"/>
    <path d="M244 138 V132 H256 V138"/>
  </g>
  <path d="M250 131 V124 M247 127 h6" stroke="#c8a56a" stroke-width="1.2"/>
  <!-- склон к террасе -->
  <path d="M0 90 H180 Q200 110 190 150 Q180 170 170 180 H0 Z" fill="#2a1808" stroke="#c8a56a" stroke-width="2"/>
  <!-- тропа вниз -->
  <path d="M150 110 Q180 128 170 150 Q196 146 230 150" fill="none" stroke="#8a6a34" stroke-width="1.2" stroke-dasharray="3 3"/>
  <!-- новая каменная ограда (сложенная часть) -->
  <g fill="#8a6a34" stroke="#e8c87a" stroke-width="1.3">
    <rect x="16" y="76" width="16" height="10"/><rect x="32" y="76" width="16" height="10"/>
    <rect x="48" y="76" width="16" height="10"/><rect x="24" y="66" width="16" height="10"/>
    <rect x="40" y="66" width="16" height="10"/><rect x="64" y="80" width="14" height="6"/>
  </g>
  <!-- недостроенная часть: колья и разметочная верёвка -->
  <g stroke="#c8a56a" stroke-width="2">
    <path d="M90 90 V74 M116 90 V74 M142 90 V74"/>
  </g>
  <path d="M78 78 L90 76 L116 76 L142 76" fill="none" stroke="#e8c87a" stroke-width="1"/>
  <!-- груды камня -->
  <g fill="#8a6a34" stroke="#c8a56a" stroke-width="1">
    <circle cx="40" cy="108" r="5"/><circle cx="50" cy="110" r="4"/><circle cx="45" cy="102" r="4"/>
    <circle cx="100" cy="112" r="4"/><circle cx="108" cy="114" r="3"/>
  </g>
  <!-- тачка -->
  <g stroke="#e8c87a" stroke-width="1.5" fill="#1a0e04">
    <path d="M120 116 L150 116 L146 126 L126 126 Z"/>
    <circle cx="124" cy="130" r="4"/>
    <path d="M150 116 L162 124" fill="none"/>
  </g>
  <!-- светлый крест-веха нового места -->
  <path d="M70 60 V42 M64 48 h12 M65 55 l10 -3" stroke="#e8c87a" stroke-width="2"/>
</svg>
