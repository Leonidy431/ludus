<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Двор обители в праздник на берегу Иссык-Куля">
  <title>Праздничный двор обители</title>
  <desc>ФОРМА: двор обители у озера — храм с крестом, ограда, праздничные полотнища, группы людей разных общин стоят вместе. ДЕЙСТВИЕ: игрок собирает хор диаспоры — армяне, сирийцы-несториане, греки и местные жители поют каждый своим клиросом, антифонно, а капелла. ЦЕЛЬ: единство в праздновании без смешения исповеданий; радость как дар, а не шум. Миссия: 27 «Хор диаспоры».</desc>
  <!-- Арт-канон §9.0: умбра+золото; синь только для воды. -->
  <defs>
    <linearGradient id="dvpr-nebo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0e04"/>
      <stop offset="60%" stop-color="#3a2410"/>
      <stop offset="100%" stop-color="#8a6a34"/>
    </linearGradient>
  </defs>
  <rect width="320" height="180" fill="url(#dvpr-nebo)"/>
  <!-- горы за озером -->
  <path d="M0 84 L40 58 L70 76 L110 50 L150 74 L200 54 L250 78 L290 60 L320 74 V96 H0 Z" fill="#241405"/>
  <!-- озеро -->
  <rect y="92" width="320" height="24" fill="#0d2a3a"/>
  <g stroke="#1f5a73" stroke-width="1.4" fill="none">
    <path d="M20 100 Q30 97 40 100"/><path d="M230 104 Q240 101 250 104"/><path d="M280 98 Q290 95 300 98"/>
  </g>
  <!-- земля двора -->
  <path d="M0 114 H320 V180 H0 Z" fill="#2a1808"/>
  <!-- храм: четверик, глава, крест -->
  <g stroke="#c8a56a" stroke-width="2" fill="#2a1808">
    <path d="M136 148 V108 H184 V148"/>
    <path d="M148 108 V94 H172 V108"/>
    <path d="M148 94 Q160 76 172 94 Z" fill="#8a6a34"/>
  </g>
  <path d="M160 78 V62 M154 68 h12 M155 75 l10 -2" stroke="#e8c87a" stroke-width="2" fill="none"/>
  <path d="M152 148 V130 Q160 122 168 130 V148" fill="#140a02" stroke="#e8c87a" stroke-width="1.5"/>
  <!-- праздничные полотнища между шестами -->
  <g stroke="#8a6a34" stroke-width="1.5">
    <path d="M60 150 V112 M110 150 V112 M210 150 V112 M260 150 V112"/>
  </g>
  <path d="M60 114 Q85 124 110 114 M210 114 Q235 124 260 114" fill="none" stroke="#e8c87a" stroke-width="1.2"/>
  <g fill="#e8c87a">
    <path d="M70 118 l3 6 l3 -5 Z"/><path d="M84 121 l3 6 l3 -6 Z"/><path d="M98 118 l3 5 l3 -6 Z"/>
    <path d="M220 118 l3 6 l3 -5 Z"/><path d="M234 121 l3 6 l3 -6 Z"/>
  </g>
  <path d="M248 118 l3 5 l3 -6 Z" fill="#c0392b"/>
  <!-- хор: два клироса по сторонам храма -->
  <g fill="#140a02" stroke="#c8a56a" stroke-width="1.2">
    <path d="M70 162 q0 -12 6 -12 q6 0 6 12 Z"/><circle cx="76" cy="146" r="3.5"/>
    <path d="M86 164 q0 -12 6 -12 q6 0 6 12 Z"/><circle cx="92" cy="148" r="3.5"/>
    <path d="M102 162 q0 -12 6 -12 q6 0 6 12 Z"/><circle cx="108" cy="146" r="3.5"/>
    <path d="M206 162 q0 -12 6 -12 q6 0 6 12 Z"/><circle cx="212" cy="146" r="3.5"/>
    <path d="M222 164 q0 -12 6 -12 q6 0 6 12 Z"/><circle cx="228" cy="148" r="3.5"/>
    <path d="M238 162 q0 -12 6 -12 q6 0 6 12 Z"/><circle cx="244" cy="146" r="3.5"/>
  </g>
  <!-- свечи в руках поющих -->
  <g fill="#e8c87a"><circle cx="82" cy="150" r="1.4"/><circle cx="114" cy="150" r="1.4"/><circle cx="218" cy="150" r="1.4"/><circle cx="250" cy="150" r="1.4"/></g>
  <!-- ограда обители -->
  <path d="M0 136 H40 M280 136 H320" stroke="#8a6a34" stroke-width="3"/>
</svg>
