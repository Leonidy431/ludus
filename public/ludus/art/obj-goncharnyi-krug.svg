<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="Гончарный круг с растущим сосудом">
  <title>Гончарный круг</title>
  <desc>Ножной гончарный круг: вверху — диск с поднимающимся сосудом, внизу — тяжёлый маховик на оси. ФОРМА: глина, послушная рукам мастера. ДЕЙСТВИЕ: игрок налаживает мастерскую, учит учеников ремеслу. ЦЕЛЬ: «мы — глина, Ты — образователь наш» (Ис. 64:8); труд как соработничество Творцу. Миссия: 67 «Керамические мастерские».</desc>
  <defs>
    <radialGradient id="gkr-bg" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#3a2410"/>
      <stop offset="100%" stop-color="#1a0e04"/>
    </radialGradient>
  </defs>
  <rect x="2" y="2" width="92" height="92" rx="10" fill="url(#gkr-bg)" stroke="#8a6a34" stroke-width="2"/>
  <rect x="7" y="7" width="82" height="82" rx="7" fill="none" stroke="#c8a56a" stroke-width="1" opacity=".55"/>
  <!-- сосуд на круге -->
  <path d="M40 22 H56 Q54 28 58 36 Q64 44 58 50 H38 Q32 44 38 36 Q42 28 40 22 Z" fill="#8a6a34" stroke="#e8c87a" stroke-width="1.5"/>
  <path d="M40 22 Q48 25 56 22" fill="none" stroke="#1a0e04" stroke-width="1.2"/>
  <!-- следы пальцев — спиральные бороздки -->
  <g fill="none" stroke="#c8a56a" stroke-width=".9" opacity=".8">
    <path d="M38 40 Q48 43 58 40"/><path d="M37 45 Q48 48 59 45"/>
  </g>
  <!-- верхний диск -->
  <ellipse cx="48" cy="52" rx="20" ry="4" fill="#2a1808" stroke="#c8a56a" stroke-width="1.8"/>
  <!-- ось -->
  <path d="M48 56 V74" stroke="#c8a56a" stroke-width="3"/>
  <!-- маховик -->
  <ellipse cx="48" cy="76" rx="28" ry="6" fill="#2a1808" stroke="#e8c87a" stroke-width="2"/>
  <ellipse cx="48" cy="75" rx="18" ry="3" fill="none" stroke="#8a6a34" stroke-width="1"/>
  <!-- стрелки вращения -->
  <g fill="none" stroke="#e8c87a" stroke-width="1.2" opacity=".7">
    <path d="M22 64 Q18 70 22 74"/><path d="M20 72 l2 2 l3 -1"/>
  </g>
</svg>
