<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="Чётки дьякона — добродетель">
  <!-- Арт-канон §9.0 (АРТ_ПРОМПТЫ_КАРТЫ_И_КОСТИ_2026-08-17): умбра+золото,
       картуш-рамка, без нимбов. Объект II-каталога: монашеские чётки
       (вервица) — иконка добродетели в stats-панели дашборда (проход №36). -->
  <defs>
    <radialGradient id="chetki-bg" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#3a2410"/>
      <stop offset="100%" stop-color="#1a0e04"/>
    </radialGradient>
  </defs>
  <rect x="2" y="2" width="92" height="92" rx="10" fill="url(#chetki-bg)" stroke="#8a6a34" stroke-width="2"/>
  <rect x="7" y="7" width="82" height="82" rx="7" fill="none" stroke="#c8a56a" stroke-width="1" opacity=".55"/>
  <!-- Петля вервицы -->
  <ellipse cx="48" cy="42" rx="24" ry="20" fill="none" stroke="#8a6a34" stroke-width="2.4" opacity=".8"/>
  <!-- Узлы-бусины по петле -->
  <g fill="#c8a56a" stroke="#8a6a34" stroke-width=".8">
    <circle cx="48" cy="22" r="3.2"/><circle cx="62" cy="25.5" r="3.2"/><circle cx="70.5" cy="35" r="3.2"/>
    <circle cx="71" cy="47" r="3.2"/><circle cx="64" cy="56.5" r="3.2"/><circle cx="53" cy="61.4" r="3.2"/>
    <circle cx="43" cy="61.4" r="3.2"/><circle cx="32" cy="56.5" r="3.2"/><circle cx="25" cy="47" r="3.2"/>
    <circle cx="25.5" cy="35" r="3.2"/><circle cx="34" cy="25.5" r="3.2"/>
  </g>
  <!-- Подвес: крестик под петлёй -->
  <line x1="48" y1="62" x2="48" y2="72" stroke="#8a6a34" stroke-width="2"/>
  <g stroke="#e8c87a" stroke-width="3" stroke-linecap="round">
    <line x1="48" y1="70" x2="48" y2="84"/>
    <line x1="42" y1="75.5" x2="54" y2="75.5"/>
  </g>
  <circle cx="48" cy="70" r="2.6" fill="#e8c87a" stroke="#8a6a34" stroke-width=".8"/>
</svg>
