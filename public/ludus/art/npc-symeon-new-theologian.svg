<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 140" role="img" aria-label="Преподобный Симеон Новый Богослов">
  <title>Симеон Новый Богослов</title>
  <desc>Преподобный Симеон Новый Богослов, игумен обители святого Маманта в Константинополе, свидетель нетварного Божественного света. Сегмент неба с лучами — свет Фаворский, сходящий свыше, а не рождённый человеком; раскрытые ладони — ум, который не берёт, а принимает; малый огонёк в сердце — свет, вселившийся в молящегося. Смысл: мудрость (Wisdom) как опытное богопознание и учёность (Erudition) его «Гимнов Божественной любви». Без нимба: игровой образ — не икона; нимб принадлежит иконе, поэтому святость здесь явлена атрибутами.</desc>
  <!-- Арт-канон §9.0: умбра+золото, картуш, без нимбов; святость — в атрибутах -->
  <rect width="100" height="140" fill="#1a0e04"/>
  <rect x="5" y="5" width="90" height="130" fill="none" stroke="#8a6a34" stroke-width="1.5"/>
  <!-- сегмент неба в верху картуша: источник света вне человека -->
  <path d="M32 7 Q50 19 68 7 Z" fill="#c8a56a" stroke="#e8c87a" stroke-width="1.2"/>
  <!-- три луча нетварного света, сходящие на подвижника -->
  <g stroke="#e8c87a" stroke-width="1.2" stroke-dasharray="3 2">
    <path d="M50 14 V20 M44 12 L39 20 M56 12 L61 20"/>
  </g>
  <!-- монашеский куколь, ниспадающий на плечи -->
  <path d="M34 54 Q32 26 50 23 Q68 26 66 54 Z" fill="#8a6a34" stroke="#c8a56a" stroke-width="1.5"/>
  <!-- лик, обращённый к свету -->
  <circle cx="50" cy="37" r="9" fill="#1a0e04" stroke="#c8a56a" stroke-width="2"/>
  <!-- мантия игумена -->
  <path d="M50 50 C31 56 27 82 29 118 H71 C73 82 69 56 50 50 Z" fill="#2a1808" stroke="#c8a56a" stroke-width="2"/>
  <!-- тёмная борода средней длины -->
  <path d="M42 40 Q42 54 50 58 Q58 54 58 40 Q55 47 50 47 Q45 47 42 40 Z" fill="#8a6a34" stroke="#c8a56a" stroke-width="1"/>
  <!-- складки мантии -->
  <path d="M40 72 Q38 96 40 118 M60 72 Q62 96 60 118" fill="none" stroke="#8a6a34" stroke-width="1.2"/>
  <!-- свет в сердце: принятый дар, а не собственное сияние -->
  <circle cx="50" cy="72" r="3.5" fill="#e8c87a" opacity=".9"/>
  <circle cx="50" cy="72" r="8" fill="#e8c87a" opacity=".14"/>
  <!-- раскрытые ладони, обращённые вверх -->
  <g fill="#2a1808" stroke="#c8a56a" stroke-width="1.5">
    <path d="M24 72 Q26 82 36 84 L38 80 Q30 78 28 70 Z"/>
    <path d="M76 72 Q74 82 64 84 L62 80 Q70 78 72 70 Z"/>
  </g>
  <path d="M24 72 l-2 -4 M26 71 l-1 -5 M28 70 l0 -5 M76 72 l2 -4 M74 71 l1 -5 M72 70 l0 -5" stroke="#c8a56a" stroke-width="1.2"/>
  <!-- свиток «Гимнов Божественной любви» у пояса -->
  <path d="M43 94 H57 V108 H43 Z" fill="#1a0e04" stroke="#c8a56a" stroke-width="1.5"/>
  <path d="M41 92 h4 v18 h-4 Z M55 92 h4 v18 h-4 Z" fill="#8a6a34"/>
  <path d="M46 98 h8 M46 101 h8 M46 104 h5" stroke="#e8c87a" stroke-width="1"/>
</svg>
