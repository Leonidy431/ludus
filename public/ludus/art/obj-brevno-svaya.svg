<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="Бревно-свая, забитое в дно реки">
  <title>Бревно-свая</title>
  <desc>Форма: три лиственничные сваи с заострёнными концами и железными бугелями, вбитые в донный грунт, поперечная насадка на скобах, верёвка копра. Действие: ставить мост на твёрдое основание, а не на песок. Цель: притча о доме на камне (Мф. 7:24–25): дорога миссии держится на невидимом труде под водой. Миссия: 73 Мосты и дороги миссии.</desc>
  <!-- Арт-канон §9.0: умбра+золото, картуш-рамка, без нимбов. Объект: свайное основание моста. -->
  <defs>
    <radialGradient id="svaya-bg" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#3a2410"/>
      <stop offset="100%" stop-color="#1a0e04"/>
    </radialGradient>
  </defs>
  <rect x="2" y="2" width="92" height="92" rx="10" fill="url(#svaya-bg)" stroke="#8a6a34" stroke-width="2"/>
  <rect x="7" y="7" width="82" height="82" rx="7" fill="none" stroke="#c8a56a" stroke-width="1" opacity=".55"/>
  <!-- вода и дно -->
  <rect x="10" y="50" width="76" height="22" fill="#0d2a3a"/>
  <path d="M10 50 Q20 47 30 50 T50 50 T70 50 T86 50" fill="none" stroke="#1f5a73" stroke-width="1.5"/>
  <path d="M10 72 Q30 68 48 72 T86 72 V86 H10 Z" fill="#2a1808" stroke="#8a6a34" stroke-width="1.2"/>
  <!-- три сваи с острыми концами -->
  <g fill="#8a6a34" stroke="#e8c87a" stroke-width="1.5">
    <path d="M24 26 H32 V76 L28 82 L24 76 Z"/>
    <path d="M44 22 H52 V78 L48 84 L44 78 Z"/>
    <path d="M64 26 H72 V76 L68 82 L64 76 Z"/>
  </g>
  <!-- годичные кольца на торцах -->
  <g fill="none" stroke="#2a1808" stroke-width=".9"><path d="M26 29 H30 M46 25 H50 M66 29 H70"/></g>
  <!-- железные бугели -->
  <g stroke="#1a0e04" stroke-width="2"><path d="M24 48 H32 M44 48 H52 M64 48 H72 M24 62 H32 M44 62 H52 M64 62 H72"/></g>
  <g fill="#c8a56a" stroke="#1a0e04" stroke-width="1"><ellipse cx="28" cy="26" rx="4" ry="1.6"/><ellipse cx="48" cy="22" rx="4" ry="1.6"/><ellipse cx="68" cy="26" rx="4" ry="1.6"/></g>
  <!-- поперечная насадка на скобах -->
  <rect x="18" y="36" width="60" height="6" fill="#2a1808" stroke="#c8a56a" stroke-width="1.4"/>
  <g fill="#e8c87a"><circle cx="28" cy="39" r="1.2"/><circle cx="48" cy="39" r="1.2"/><circle cx="68" cy="39" r="1.2"/></g>
  <!-- верёвка копра над средней сваей -->
  <path d="M16 12 Q30 14 46 22" fill="none" stroke="#c8a56a" stroke-width="1.4" stroke-dasharray="3 1.5"/>
</svg>
