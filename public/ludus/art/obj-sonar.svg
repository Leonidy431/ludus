<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="Сонар — кольца эхолота">
  <title>Сонар</title>
  <desc>Сигнал уходит во тьму и возвращается эхом: так молитва посылается в молчание и получает ответ. Сокрытое на дне обнаруживается терпеливым слушанием — не видением, а вниманием.</desc>
  <!-- Объект ROV: импульсы эхолота и найденный на дне отклик -->
  <defs>
    <radialGradient id="sonar-bg" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#0d2a3a"/>
      <stop offset="100%" stop-color="#1a0e04"/>
    </radialGradient>
  </defs>
  <!-- картуш-рамка -->
  <rect x="2" y="2" width="92" height="92" rx="10" fill="url(#sonar-bg)" stroke="#8a6a34" stroke-width="2"/>
  <rect x="7" y="7" width="82" height="82" rx="7" fill="none" stroke="#c8a56a" stroke-width="1" opacity=".55"/>
  <g>
    <!-- источник импульса -->
    <circle cx="48" cy="22" r="4" fill="#e8c87a" stroke="#8a6a34" stroke-width="1"/>
    <!-- кольца импульса -->
    <g fill="none" stroke="#c8a56a" stroke-linecap="round">
      <path d="M36 30 Q48 40 60 30" stroke-width="2"/>
      <path d="M28 36 Q48 54 68 36" stroke-width="1.8" opacity=".8"/>
      <path d="M20 42 Q48 68 76 42" stroke-width="1.6" opacity=".6"/>
      <path d="M14 50 Q48 82 82 50" stroke-width="1.4" opacity=".4"/>
    </g>
    <!-- дно озера -->
    <path d="M10 82 Q30 76 48 80 Q66 84 86 78" fill="none" stroke="#8a6a34" stroke-width="2"/>
    <!-- отклик: сокрытый крест на дне -->
    <path d="M60 70 v10 M56 74 h8" stroke="#e8c87a" stroke-width="2" stroke-linecap="round"/>
    <circle cx="60" cy="75" r="7" fill="none" stroke="#e8c87a" stroke-width="1" stroke-dasharray="2 2"/>
  </g>
</svg>
