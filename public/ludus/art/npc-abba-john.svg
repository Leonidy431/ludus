<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 140" role="img" aria-label="Авва Иоанн, отец пустыни">
  <title>Авва Иоанн</title>
  <desc>Пустынный авва в грубой власянице с посохом и корзиной из пальмовых листьев: труд рук и пост как школа постоянства. Форма — Выносливость и Мудрость; действие — аскетическое делание, пост, рукоделие; цель — смирение и свобода от страстей.</desc>
  <rect width="100" height="140" fill="#1a0e04"/>
  <rect x="5" y="5" width="90" height="130" fill="none" stroke="#8a6a34" stroke-width="1.5"/>
  <!-- низкое солнце пустыни -->
  <circle cx="78" cy="22" r="6" fill="none" stroke="#8a6a34" stroke-width="1.5"/>
  <!-- худое лицо аскета с непокрытой головой -->
  <circle cx="48" cy="34" r="10" fill="#2a1808" stroke="#c8a56a" stroke-width="2"/>
  <!-- власяница, подпоясанная верёвкой -->
  <path d="M48 46 C32 52 30 80 32 120 H66 C68 80 66 52 48 46 Z" fill="#2a1808" stroke="#c8a56a" stroke-width="2"/>
  <!-- спутанная борода -->
  <path d="M40 38 L42 56 L46 50 L50 60 L54 50 L58 56 L58 38 Q50 46 40 38 Z" fill="#c8a56a" opacity=".75"/>
  <path d="M34 82 H64" stroke="#e8c87a" stroke-width="2"/>
  <path d="M46 82 l-2 10 M50 82 l2 10" stroke="#e8c87a" stroke-width="1.5"/>
  <!-- грубый подол — рваный край -->
  <path d="M32 120 l3 -5 3 5 3 -5 3 5 3 -5 3 5 3 -5 3 5 3 -5 3 5 3 -5 2 5" fill="none" stroke="#8a6a34" stroke-width="1.2"/>
  <!-- посох-тау пустынника -->
  <path d="M74 122 V44 M68 44 H80" fill="none" stroke="#8a6a34" stroke-width="2.5"/>
  <circle cx="72" cy="70" r="2.8" fill="#2a1808" stroke="#c8a56a" stroke-width="1.5"/>
  <!-- корзина из пальмовых листьев — рукоделие -->
  <path d="M16 100 H34 L31 116 H19 Z" fill="#1a0e04" stroke="#c8a56a" stroke-width="1.5"/>
  <path d="M17 105 H33 M18 110 H32" stroke="#8a6a34" stroke-width="1"/>
  <path d="M20 100 Q25 92 30 100" fill="none" stroke="#c8a56a" stroke-width="1.2"/>
  <!-- волна дюн -->
  <path d="M8 126 Q28 118 48 126 T92 124" fill="none" stroke="#8a6a34" stroke-width="1.5"/>
</svg>
