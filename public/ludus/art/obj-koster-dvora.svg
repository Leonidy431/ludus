<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="Костёр двора Герата — очаг на камнях с золотым пламенем">
  <!-- Арт-канон §9.0: умбра+золото. Объект V2-сцены двора (реестр VR п.26:
       «юрты, костёр» в glb) — проход №53; 2D-эталон формы и палитры для
       будущего лоу-поли объекта: каменное кольцо, поленья крестом, пламя
       тремя языками (#8a6a34 -> #e8c87a -> #fff3c0), угли #a33a2a. -->
  <defs>
    <linearGradient id="kos-fon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a1808"/>
      <stop offset="100%" stop-color="#1a0e04"/>
    </linearGradient>
    <radialGradient id="kos-svet" cx="50%" cy="62%" r="46%">
      <stop offset="0%" stop-color="#e8c87a" stop-opacity=".28"/>
      <stop offset="100%" stop-color="#e8c87a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="96" height="96" rx="10" fill="url(#kos-fon)"/>
  <rect x="3" y="3" width="90" height="90" rx="8" fill="none" stroke="#8a6a34" stroke-width="1.4" opacity=".8"/>
  <!-- Тёплый отсвет на землю -->
  <circle cx="48" cy="60" r="40" fill="url(#kos-svet)"/>
  <!-- Каменное кольцо очага -->
  <g fill="#3a2410" stroke="#241405" stroke-width="1">
    <ellipse cx="26" cy="72" rx="7" ry="4.5"/>
    <ellipse cx="40" cy="76" rx="8" ry="5"/>
    <ellipse cx="57" cy="76" rx="8" ry="5"/>
    <ellipse cx="70" cy="71" rx="7" ry="4.5"/>
  </g>
  <!-- Поленья крестом -->
  <g stroke="#3a2410" stroke-width="5" stroke-linecap="round">
    <path d="M32 74 L64 64"/>
    <path d="M34 64 L62 74"/>
  </g>
  <g stroke="#8a6a34" stroke-width="1" opacity=".6">
    <path d="M34 73 L62 65 M36 65 L60 73"/>
  </g>
  <!-- Угли -->
  <g fill="#a33a2a">
    <circle cx="44" cy="69" r="2"/>
    <circle cx="52" cy="70" r="1.6"/>
    <circle cx="48" cy="72" r="1.3"/>
  </g>
  <!-- Пламя: три языка, тёмное золото -> светлое -> сердцевина -->
  <path d="M48 66 Q36 56 42 44 Q45 38 43 30 Q52 38 51 48 Q58 42 56 32 Q64 44 58 56 Q55 62 48 66 Z" fill="#8a6a34"/>
  <path d="M48 64 Q40 55 45 45 Q47 40 46 35 Q53 42 51 50 Q56 46 55 40 Q60 50 55 58 Q52 62 48 64 Z" fill="#e8c87a"/>
  <path d="M48 61 Q44 55 47 49 Q48 45 48 42 Q52 48 50 53 Q53 55 51 58 Q50 60 48 61 Z" fill="#fff3c0"/>
  <!-- Искры -->
  <g fill="#fff3c0" opacity=".85">
    <circle cx="41" cy="28" r="1.1"/>
    <circle cx="57" cy="24" r="0.9"/>
    <circle cx="50" cy="20" r="0.8"/>
  </g>
</svg>
