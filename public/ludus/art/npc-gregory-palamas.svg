<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 140" role="img" aria-label="Святитель Григорий Палама, архиепископ Фессалоникийский">
  <title>Григорий Палама</title>
  <desc>Святитель Григорий Палама, архиепископ Фессалоникийский, учитель исихазма и защитник нетварного Фаворского света. Омофор с крестами — служение пастыря; свиток «Триад в защиту священнобезмолвствующих» — богословие, выросшее из молитвы; луч, нисходящий свыше к сердцу, — нетварная энергия Божия, которую созерцает очищенный ум. Форма — Мудрость и Вера; действие — умная молитва и защита истины словом; цель — видение Фаворского света, обожение по благодати. Без нимба: игровой образ — не икона; нимб принадлежит иконе, поэтому святость здесь явлена атрибутами. Фон — едва заметная золотая спираль: мера и порядок творения, а не венец над главой.</desc>
  <!-- Арт-канон §9.0: умбра+золото, картуш, без нимбов; святость — в атрибутах -->
  <rect width="100" height="140" fill="#1a0e04"/>
  <rect x="5" y="5" width="90" height="130" fill="none" stroke="#8a6a34" stroke-width="1.5"/>
  <!-- фон: золотая спираль (мера творения), низко и в стороне от главы — не нимб -->
  <path d="M8 126 A47 47 0 0 1 55 79 A29 29 0 0 1 84 108 A18 18 0 0 1 66 126 A11 11 0 0 1 55 115 A7 7 0 0 1 62 108 A4 4 0 0 1 66 112 A3 3 0 0 1 63 115" fill="none" stroke="#8a6a34" stroke-width="1" opacity=".25"/>
  <!-- лик, открытое чело -->
  <circle cx="50" cy="33" r="10" fill="#1a0e04" stroke="#c8a56a" stroke-width="2"/>
  <!-- святительский саккос -->
  <path d="M50 48 C31 54 27 80 29 118 H71 C73 80 69 54 50 48 Z" fill="#2a1808" stroke="#c8a56a" stroke-width="2"/>
  <!-- тёмная заострённая борода -->
  <path d="M41 36 Q42 52 50 60 Q58 52 59 36 Q56 44 50 44 Q44 44 41 36 Z" fill="#8a6a34" stroke="#c8a56a" stroke-width="1"/>
  <!-- великий омофор: полоса по плечам и спускающийся конец -->
  <path d="M33 58 Q50 70 67 58" fill="none" stroke="#e8c87a" stroke-width="5"/>
  <path d="M50 66 L47 118" stroke="#e8c87a" stroke-width="5"/>
  <!-- кресты на омофоре -->
  <g stroke="#1a0e04" stroke-width="1.3">
    <path d="M38 60 v5 M35.5 62.5 h5"/>
    <path d="M62 60 v5 M59.5 62.5 h5"/>
    <path d="M49 82 v6 M46 85 h6"/>
    <path d="M47.8 102 v6 M44.8 105 h6"/>
  </g>
  <!-- Фаворский свет: источник свыше, в углу, три луча -->
  <g stroke="#e8c87a" stroke-width="1.2">
    <path d="M86 9 v8 M82 13 h8 M83.2 10.2 l5.6 5.6 M88.8 10.2 l-5.6 5.6"/>
  </g>
  <!-- три луча нисходят к сердцу (не касаясь главы) -->
  <g stroke="#e8c87a" stroke-width="1" opacity=".5">
    <path d="M83 19 L57 71 M86 19 L59 72 M89 19 L61 73"/>
  </g>
  <!-- сердце, принявшее свет: ум, сведённый в сердце -->
  <circle cx="59" cy="74" r="7" fill="#e8c87a" opacity=".15"/>
  <circle cx="59" cy="74" r="2.8" fill="#e8c87a"/>
  <!-- свиток «Триад» в деснице -->
  <path d="M26 84 H42 V106 H26 Z" fill="#1a0e04" stroke="#c8a56a" stroke-width="1.6"/>
  <path d="M24 82 h4 v26 h-4 Z M40 82 h4 v26 h-4 Z" fill="#8a6a34"/>
  <g stroke="#e8c87a" stroke-width="1">
    <path d="M30 89 h8 M30 93 h8 M30 97 h8 M30 101 h5"/>
  </g>
  <!-- три знака на свитке: три части Триад -->
  <g fill="#e8c87a"><circle cx="31" cy="86" r=".8"/><circle cx="34" cy="86" r=".8"/><circle cx="37" cy="86" r=".8"/></g>
  <!-- кисть руки, держащая свиток -->
  <circle cx="34" cy="109" r="3" fill="#2a1808" stroke="#c8a56a" stroke-width="1.5"/>
</svg>
