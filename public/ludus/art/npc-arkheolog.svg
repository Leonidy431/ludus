<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 140" role="img" aria-label="Археолог с кистью и черепком">
  <title>Археолог</title>
  <desc>Археолог — проводник «режима археолога»: широкополая шляпа, сумка с полевой книгой, в руках кисть и черепок, у ног совок и раскоп с колышками. ФОРМА: терпение и внимательность (Erudition). ДЕЙСТВИЕ: игрок слой за слоем расчищает следы миссии XIV века. ЦЕЛЬ: история как свидетельство — найденное описывают и хранят, а не продают. Миссия: 93 «Режим археолога».</desc>
  <rect width="100" height="140" fill="#1a0e04"/>
  <rect x="5" y="5" width="90" height="130" fill="none" stroke="#8a6a34" stroke-width="1.5"/>
  <!-- широкополая шляпа -->
  <path d="M32 30 Q50 24 68 30 Q60 32 50 32 Q40 32 32 30 Z" fill="#8a6a34" stroke="#c8a56a" stroke-width="1.5"/>
  <path d="M41 29 Q42 18 50 18 Q58 18 59 29 Z" fill="#8a6a34" stroke="#c8a56a" stroke-width="1.5"/>
  <!-- лицо -->
  <circle cx="50" cy="38" r="8.5" fill="#2a1808" stroke="#c8a56a" stroke-width="2"/>
  <path d="M46 42 Q50 44 54 42" fill="none" stroke="#c8a56a" stroke-width="1"/>
  <!-- куртка -->
  <path d="M50 48 C33 54 29 80 31 118 H69 C71 80 67 54 50 48 Z" fill="#2a1808" stroke="#c8a56a" stroke-width="2"/>
  <!-- ремень сумки и сумка с полевой книгой -->
  <path d="M38 54 L64 96" stroke="#8a6a34" stroke-width="2.5"/>
  <rect x="56" y="92" width="16" height="14" rx="2" fill="#8a6a34" stroke="#e8c87a" stroke-width="1.3"/>
  <path d="M58 96 h12" stroke="#1a0e04" stroke-width="1"/>
  <!-- рука с черепком -->
  <path d="M36 70 Q30 80 38 86" fill="none" stroke="#c8a56a" stroke-width="2"/>
  <path d="M36 84 L46 80 L48 88 L40 92 Z" fill="#8a6a34" stroke="#e8c87a" stroke-width="1.3"/>
  <!-- кисть -->
  <path d="M56 70 L48 80" stroke="#e8c87a" stroke-width="1.8"/>
  <path d="M48 80 L45 84 L47 85 Z" fill="#c8a56a"/>
  <!-- раскоп у ног: колышки и шнур -->
  <g stroke="#c8a56a" stroke-width="1.5">
    <path d="M14 128 V118 M28 128 V118"/>
  </g>
  <path d="M14 119 H28" stroke="#e8c87a" stroke-width="1"/>
  <path d="M12 128 H30" stroke="#8a6a34" stroke-width="1.5"/>
  <!-- совок -->
  <path d="M76 120 L84 112 M84 112 L90 110 L88 116 Z" fill="#c8a56a" stroke="#c8a56a" stroke-width="1.5"/>
</svg>
