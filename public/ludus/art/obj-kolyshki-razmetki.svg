<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="Разметочные колышки со шнуром и колотушкой">
  <title>Колышки разметки</title>
  <desc>ФОРМА: три колышка, натянутый мерный шнур с узлами, колотушка, пунктир будущей межи. ДЕЙСТВИЕ: игрок заново размечает участки после отступления воды, честно по мере, а не по силе. ЦЕЛЬ: правда меры (Притч. 11:1) — когда вода уходит, спор решает шнур, а не сильнейший. Миссия: 31 Фаза регрессии.</desc>
  <!-- Арт-канон §9.0: умбра+золото, без нимбов. Рисовано вручную: сырьё 99 репо не подходит (правило 0.15). -->
  <defs>
    <radialGradient id="kolyshki-razmetki-bg" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#3a2410"/>
      <stop offset="100%" stop-color="#1a0e04"/>
    </radialGradient>
  </defs>
  <rect x="2" y="2" width="92" height="92" rx="10" fill="url(#kolyshki-razmetki-bg)" stroke="#8a6a34" stroke-width="2"/>
  <rect x="7" y="7" width="82" height="82" rx="7" fill="none" stroke="#c8a56a" stroke-width="1" opacity=".55"/>
  <!-- земля -->
  <path d="M9 68 Q48 60 87 68 V87 H9 Z" fill="#2a1808"/>
  <path d="M20 76 L48 70 L78 77" fill="none" stroke="#c8a56a" stroke-width="1.2" stroke-dasharray="3 3"/>
  <!-- колышки -->
  <g fill="#c8a56a" stroke="#8a6a34" stroke-width="1.2">
    <path d="M18 38 H24 V70 L21 76 L18 70 Z"/>
    <path d="M45 30 H51 V64 L48 70 L45 64 Z"/>
    <path d="M75 40 H81 V71 L78 77 L75 71 Z"/>
  </g>
  <!-- мерный шнур с узлами -->
  <path d="M21 44 L48 36 L78 46" fill="none" stroke="#e8c87a" stroke-width="1.5"/>
  <g fill="#e8c87a"><circle cx="30" cy="41.3" r="1.8"/><circle cx="39" cy="38.7" r="1.8"/><circle cx="58" cy="39.3" r="1.8"/><circle cx="68" cy="42.7" r="1.8"/></g>
  <!-- колотушка -->
  <g transform="rotate(-30 62 60)">
    <rect x="56" y="52" width="14" height="9" rx="2" fill="#8a6a34" stroke="#c8a56a" stroke-width="1.2"/>
    <path d="M63 61 V76" stroke="#c8a56a" stroke-width="2.2"/>
  </g>
</svg>
