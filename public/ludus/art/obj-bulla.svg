<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="Булла — свинцовая печать на шёлковых шнурах">
  <title>Булла посольства</title>
  <desc>ФОРМА: край грамоты, свинцовая печать-булла на двух шнурах; на печати — лишь ободок и малый крест, без ликов. ДЕЙСТВИЕ: посол везёт грамоту и хранит печать целой — порча печати делает слово ничтожным. ЦЕЛЬ: верность данному слову и терпение в долгом пути переговоров. Миссия: 54 Посольство к Папе.</desc>
  <!-- Арт-канон §9.0: умбра+золото, картуш-рамка, без нимбов. -->
  <defs>
    <radialGradient id="bulla-bg" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#3a2410"/>
      <stop offset="100%" stop-color="#1a0e04"/>
    </radialGradient>
  </defs>
  <rect x="2" y="2" width="92" height="92" rx="10" fill="url(#bulla-bg)" stroke="#8a6a34" stroke-width="2"/>
  <rect x="7" y="7" width="82" height="82" rx="7" fill="none" stroke="#c8a56a" stroke-width="1" opacity=".55"/>
  <!-- нижний край пергамента с подгибом -->
  <path d="M16 16 H80 V34 H16 Z" fill="#c8a56a" stroke="#8a6a34" stroke-width="1.4"/>
  <path d="M16 28 H80" stroke="#8a6a34" stroke-width="1.2"/>
  <g stroke="#8a6a34" stroke-width="1" opacity=".8"><path d="M22 20 H74 M22 24 H62"/></g>
  <!-- проколы и шнуры: шёлк красный и золотой -->
  <circle cx="44" cy="31" r="1.3" fill="#1a0e04"/><circle cx="52" cy="31" r="1.3" fill="#1a0e04"/>
  <path d="M44 31 Q42 42 46 52" fill="none" stroke="#c0392b" stroke-width="2"/>
  <path d="M52 31 Q54 42 50 52" fill="none" stroke="#e8c87a" stroke-width="2"/>
  <!-- свинцовый диск буллы -->
  <circle cx="48" cy="64" r="15" fill="#2a1808" stroke="#8a6a34" stroke-width="2"/>
  <circle cx="48" cy="64" r="11.5" fill="none" stroke="#c8a56a" stroke-width="1" stroke-dasharray="1.5 2"/>
  <!-- малый крест в поле печати -->
  <path d="M48 57 V71 M42 62 H54" stroke="#e8c87a" stroke-width="1.8" stroke-linecap="round"/>
  <!-- блик металла -->
  <path d="M38 58 Q40 53 45 51" fill="none" stroke="#e8c87a" stroke-width="1" opacity=".5"/>
</svg>
