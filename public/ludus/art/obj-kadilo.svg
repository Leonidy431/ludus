<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="Кадило с фимиамом">
  <title>Кадило</title>
  <desc>Да исправится молитва моя, яко кадило пред Тобою (Пс 140:2): фимиам, восходящий вверх, — образ молитвы. Угли — огонь Божества, чаша — Богородица, вместившая Невместимого.</desc>
  <!-- Объект литургии: кадило на трёх цепях с дымом фимиама -->
  <defs>
    <radialGradient id="kadilo-bg" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#3a2410"/>
      <stop offset="100%" stop-color="#1a0e04"/>
    </radialGradient>
  </defs>
  <!-- картуш-рамка -->
  <rect x="2" y="2" width="92" height="92" rx="10" fill="url(#kadilo-bg)" stroke="#8a6a34" stroke-width="2"/>
  <rect x="7" y="7" width="82" height="82" rx="7" fill="none" stroke="#c8a56a" stroke-width="1" opacity=".55"/>
  <g>
    <!-- цепи -->
    <g stroke="#8a6a34" stroke-width="1.4" fill="none">
      <path d="M48 12 L34 50"/><path d="M48 12 L48 40"/><path d="M48 12 L62 50"/>
    </g>
    <circle cx="48" cy="12" r="3" fill="#c8a56a" stroke="#8a6a34" stroke-width=".8"/>
    <!-- крышка-купол с крестом -->
    <path d="M36 50 Q48 34 60 50 Z" fill="#2a1808" stroke="#c8a56a" stroke-width="1.8"/>
    <path d="M48 36 v-5 M46 33 h4" stroke="#e8c87a" stroke-width="1.4"/>
    <!-- чаша с углями -->
    <path d="M32 52 H64 Q62 70 48 72 Q34 70 32 52 Z" fill="#c8a56a" stroke="#8a6a34" stroke-width="1.6"/>
    <path d="M36 56 H60" stroke="#8a6a34" stroke-width="1"/>
    <circle cx="44" cy="51" r="1.4" fill="#c0392b"/><circle cx="51" cy="51" r="1.4" fill="#c0392b"/>
    <path d="M44 72 L42 78 H54 L52 72" fill="#8a6a34"/>
    <!-- дым фимиама -->
    <g stroke="#e8c87a" stroke-width="1.5" fill="none" opacity=".6" stroke-linecap="round">
      <path d="M66 46 Q72 38 68 30 Q64 22 72 14"/><path d="M72 50 Q80 42 76 34"/><path d="M28 44 Q22 36 26 28"/>
    </g>
  </g>
</svg>
