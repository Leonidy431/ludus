<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="Вязанка дров, перетянутая верёвкой с лямкой">
  <title>Вязанка дров</title>
  <desc>Форма: вязанка поленьев, перетянутая двумя верёвками с лямкой для переноски на спине. Действие: игрок-логист рассчитывает, сколько дров нужно обители и путникам на зиму, и носит их сам. Цель: забота о тепле для других — простая служба без награды. Миссия: 6 «Миссия-логист».</desc>
  <!-- Арт-канон §9.0: умбра+золото, картуш-рамка, без нимбов. -->
  <defs>
    <radialGradient id="drova-bg" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#3a2410"/>
      <stop offset="100%" stop-color="#1a0e04"/>
    </radialGradient>
  </defs>
  <rect x="2" y="2" width="92" height="92" rx="10" fill="url(#drova-bg)" stroke="#8a6a34" stroke-width="2"/>
  <rect x="7" y="7" width="82" height="82" rx="7" fill="none" stroke="#c8a56a" stroke-width="1" opacity=".55"/>
  <!-- лямка для переноски -->
  <path d="M30 40 Q48 8 66 40" fill="none" stroke="#8a6a34" stroke-width="2.5"/>
  <!-- поленья (боковые плахи) -->
  <g fill="#8a6a34" stroke="#c8a56a" stroke-width="1.2">
    <rect x="16" y="42" width="58" height="9" rx="2"/>
    <rect x="18" y="50" width="58" height="9" rx="2"/>
    <rect x="16" y="58" width="58" height="9" rx="2"/>
    <rect x="20" y="66" width="56" height="9" rx="2"/>
  </g>
  <!-- торцы поленьев с годовыми кольцами -->
  <g fill="#c8a56a" stroke="#8a6a34" stroke-width="1">
    <circle cx="76" cy="46.5" r="4.5"/><circle cx="78" cy="54.5" r="4.5"/>
    <circle cx="76" cy="62.5" r="4.5"/><circle cx="78" cy="70.5" r="4.5"/>
  </g>
  <g fill="none" stroke="#8a6a34" stroke-width=".7">
    <circle cx="76" cy="46.5" r="2"/><circle cx="78" cy="54.5" r="2"/>
    <circle cx="76" cy="62.5" r="2"/><circle cx="78" cy="70.5" r="2"/>
  </g>
  <!-- две верёвки поперёк -->
  <g stroke="#e8c87a" stroke-width="2" fill="none">
    <path d="M30 40 V78"/><path d="M62 40 V78"/>
  </g>
  <!-- узел -->
  <circle cx="62" cy="40" r="2.5" fill="#e8c87a"/>
  <circle cx="30" cy="40" r="2.5" fill="#e8c87a"/>
</svg>
