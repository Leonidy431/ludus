<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="Брачные венцы на чистом плате">
  <title>Брачные венцы</title>
  <desc>ФОРМА: два брачных венца с малыми крестиками наверху лежат рядом на чистом плате, под светом сверху. ДЕЙСТВИЕ: игрок готовит венчание в семье, где сходятся армянская и тюркская родня; венцы — принадлежность Таинства (noLoot), их не покупают и не носят как награду. ЦЕЛЬ: брак как малая Церковь; венцы — и слава, и мученичество верности. Миссия: 97 «Армяно-тюркский синкретизм» — различение обычая и веры.</desc>
  <!-- Арт-канон §9.0: умбра+золото, картуш-рамка, без нимбов. -->
  <defs>
    <radialGradient id="vnts-bg" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#3a2410"/>
      <stop offset="100%" stop-color="#1a0e04"/>
    </radialGradient>
  </defs>
  <rect x="2" y="2" width="92" height="92" rx="10" fill="url(#vnts-bg)" stroke="#8a6a34" stroke-width="2"/>
  <rect x="7" y="7" width="82" height="82" rx="7" fill="none" stroke="#c8a56a" stroke-width="1" opacity=".55"/>
  <!-- свет сверху -->
  <path d="M34 8 H62 L72 50 H24 Z" fill="#e8c87a" opacity=".08"/>
  <!-- чистый плат -->
  <path d="M12 70 L84 70 L78 82 L18 82 Z" fill="#e8d9b8" stroke="#8a6a34" stroke-width="1.2" opacity=".9"/>
  <!-- два венца: обод, зубцы, крестик -->
  <g stroke="#8a6a34" stroke-width="1.4" fill="#c8a56a">
    <path d="M16 68 V52 L22 44 L27 52 L32 42 L37 52 L42 44 L46 52 V68 Z"/>
    <path d="M50 68 V52 L54 44 L59 52 L64 42 L69 52 L74 44 L80 52 V68 Z"/>
  </g>
  <g stroke="#8a6a34" stroke-width="1.2" fill="none">
    <path d="M16 60 H46 M50 60 H80"/>
  </g>
  <g fill="#e8c87a">
    <circle cx="24" cy="64" r="1.4"/><circle cx="31" cy="64" r="1.6"/><circle cx="38" cy="64" r="1.4"/>
    <circle cx="58" cy="64" r="1.4"/><circle cx="65" cy="64" r="1.6"/><circle cx="72" cy="64" r="1.4"/>
  </g>
  <!-- малые крестики наверху -->
  <path d="M32 42 V32 M28.5 35.5 H35.5 M64 42 V32 M60.5 35.5 H67.5" stroke="#e8c87a" stroke-width="1.8"/>
</svg>
