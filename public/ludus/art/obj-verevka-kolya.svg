<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="Разметочная верёвка с узлами на трёх кольях">
  <title>Разметочная верёвка с кольями</title>
  <desc>Верёвка с двенадцатью равными узлами, натянутая на три кола прямоугольным треугольником 3-4-5 — древний способ разметить прямой угол. ФОРМА: мера и порядок. ДЕЙСТВИЕ: игрок размечает основание кельи, амбара, ограды. ЦЕЛЬ: «всё расположил мерою, числом и весом» (Прем. 11:21) — строительство как отражение порядка творения. Миссия: 72 «Планировочная геометрия».</desc>
  <defs>
    <radialGradient id="vrk-bg" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#3a2410"/>
      <stop offset="100%" stop-color="#1a0e04"/>
    </radialGradient>
  </defs>
  <rect x="2" y="2" width="92" height="92" rx="10" fill="url(#vrk-bg)" stroke="#8a6a34" stroke-width="2"/>
  <rect x="7" y="7" width="82" height="82" rx="7" fill="none" stroke="#c8a56a" stroke-width="1" opacity=".55"/>
  <!-- земля -->
  <path d="M9 74 H87" stroke="#8a6a34" stroke-width="1.2" opacity=".6"/>
  <!-- натянутая верёвка: катеты 3 и 4, гипотенуза 5 -->
  <path d="M22 70 L70 70 L70 34 Z" fill="#e8c87a" fill-opacity=".06" stroke="#c8a56a" stroke-width="1.6"/>
  <!-- узлы через равные промежутки (12 долей) -->
  <g fill="#e8c87a">
    <circle cx="34" cy="70" r="1.8"/><circle cx="46" cy="70" r="1.8"/><circle cx="58" cy="70" r="1.8"/>
    <circle cx="70" cy="58" r="1.8"/><circle cx="70" cy="46" r="1.8"/>
    <circle cx="60.4" cy="41.2" r="1.8"/><circle cx="50.8" cy="48.4" r="1.8"/>
    <circle cx="41.2" cy="55.6" r="1.8"/><circle cx="31.6" cy="62.8" r="1.8"/>
  </g>
  <!-- три кола -->
  <g fill="#8a6a34" stroke="#e8c87a" stroke-width="1.3">
    <path d="M19 62 H25 V76 L22 80 L19 76 Z"/>
    <path d="M67 62 H73 V76 L70 80 L67 76 Z"/>
    <path d="M67 24 H73 V38 L70 42 L67 38 Z"/>
  </g>
  <!-- знак прямого угла -->
  <path d="M64 70 V64 H70" fill="none" stroke="#c0392b" stroke-width="1.2"/>
  <!-- свободный конец верёвки -->
  <path d="M22 62 Q16 50 24 44 Q30 40 26 32" fill="none" stroke="#c8a56a" stroke-width="1.3"/>
</svg>
