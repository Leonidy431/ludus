<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="Подводный аппарат ROV в глубине Иссык-Куля">
  <title>Подводный аппарат (ROV)</title>
  <desc>Аппарат на тросе спускается во тьму озера и светит фонарём: наблюдение глубины — образ богопознания через тьму (Григорий Нисский о Моисее во мраке). Трос — послушание: связь с поверхностью. Глубина даёт бонус к Мудрости.</desc>
  <!-- Объект ROV: телеуправляемый аппарат с фонарём и тросом в глубине озера -->
  <defs>
    <radialGradient id="rov-bg" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#0d2a3a"/>
      <stop offset="100%" stop-color="#1a0e04"/>
    </radialGradient>
  </defs>
  <!-- картуш-рамка -->
  <rect x="2" y="2" width="92" height="92" rx="10" fill="url(#rov-bg)" stroke="#8a6a34" stroke-width="2"/>
  <rect x="7" y="7" width="82" height="82" rx="7" fill="none" stroke="#c8a56a" stroke-width="1" opacity=".55"/>
  <g>
    <!-- трос к поверхности -->
    <path d="M48 8 Q44 18 50 30" fill="none" stroke="#c8a56a" stroke-width="1.4" stroke-dasharray="3 2"/>
    <!-- корпус с плавучестью -->
    <rect x="28" y="30" width="40" height="12" rx="3" fill="#c8a56a" stroke="#8a6a34" stroke-width="1.6"/>
    <rect x="30" y="42" width="36" height="16" fill="#1a0e04" stroke="#c8a56a" stroke-width="1.8"/>
    <path d="M36 42 V58 M60 42 V58" stroke="#8a6a34" stroke-width="1.4"/>
    <!-- движители -->
    <rect x="20" y="44" width="8" height="10" rx="3" fill="#2a1808" stroke="#e8c87a" stroke-width="1.4"/>
    <rect x="68" y="44" width="8" height="10" rx="3" fill="#2a1808" stroke="#e8c87a" stroke-width="1.4"/>
    <!-- глаз-камера -->
    <circle cx="48" cy="50" r="4.5" fill="#0d2a3a" stroke="#e8c87a" stroke-width="1.4"/>
    <!-- луч фонаря во тьму -->
    <path d="M44 56 L28 86 H68 L52 56 Z" fill="#e8c87a" opacity=".16"/>
    <!-- пузырьки -->
    <g fill="none" stroke="#e8c87a" stroke-width=".9" opacity=".7">
      <circle cx="74" cy="34" r="1.6"/><circle cx="77" cy="26" r="2"/><circle cx="73" cy="18" r="1.3"/>
    </g>
  </g>
</svg>
