<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 140" role="img" aria-label="Даругачи, монгольский наместник-управитель">
  <title>Даругачи</title>
  <desc>Даругачи — монгольский наместник, представитель хана при городах и общинах: шапка с отогнутыми полями, косы, запахнутый халат с поясом, золотая пайза на груди, свиток грамот. Нарисован как человек власти, с достоинством, без карикатуры. ФОРМА: закон ханства и ответственность за подданных. ДЕЙСТВИЕ: дьякон, как консул диаспоры, просит за купцов и христиан, опираясь на ярлык и правду. ЦЕЛЬ: «всякая душа да будет покорна высшим властям» (Рим. 13:1) — и мир для малых общин. Миссия: 48 Консул диаспоры.</desc>
  <!-- Арт-канон §9.0: умбра+золото, без нимбов. Рисовано вручную: сырьё 99 репо не подходит (правило 0.15). -->
  <rect width="100" height="140" fill="#1a0e04"/>
  <rect x="5" y="5" width="90" height="130" fill="none" stroke="#8a6a34" stroke-width="1.5"/>
  <!-- голова, шапка с отогнутыми полями и навершием -->
  <circle cx="50" cy="36" r="11" fill="#2a1808" stroke="#c8a56a" stroke-width="2"/>
  <path d="M38 30 Q40 19 50 18 Q60 19 62 30 Z" fill="#8a6a34" stroke="#c8a56a" stroke-width="1.5"/>
  <path d="M34 31 Q50 25 66 31" fill="none" stroke="#e8c87a" stroke-width="2.4" stroke-linecap="round"/>
  <circle cx="50" cy="16" r="2" fill="#e8c87a"/>
  <!-- косы, заплетённые петлёй за ушами -->
  <path d="M39 38 q-5 4 -1 9 M61 38 q5 4 1 9" fill="none" stroke="#8a6a34" stroke-width="2"/>
  <!-- усы -->
  <path d="M45 42 Q50 40 55 42" fill="none" stroke="#c8a56a" stroke-width="1.4"/>
  <!-- халат с запахом направо и пояс -->
  <path d="M50 48 C31 54 27 80 29 118 H71 C73 80 69 54 50 48 Z" fill="#2a1808" stroke="#c8a56a" stroke-width="2"/>
  <path d="M42 52 Q54 62 64 72" fill="none" stroke="#e8c87a" stroke-width="2"/>
  <path d="M31 88 H69" stroke="#c8a56a" stroke-width="3"/>
  <!-- золотая пайза на шнуре -->
  <path d="M46 52 L48 62 M54 52 L52 62" stroke="#8a6a34" stroke-width="1"/>
  <rect x="44" y="62" width="12" height="17" rx="4" fill="#e8c87a" stroke="#8a6a34" stroke-width="1.2"/>
  <circle cx="50" cy="66" r="1.3" fill="#1a0e04"/>
  <path d="M47 71 H53 M47 74 H53" stroke="#8a6a34" stroke-width=".9"/>
  <!-- свиток грамот в руке -->
  <rect x="62" y="92" width="16" height="6" rx="3" fill="#e8d9b8" stroke="#8a6a34" stroke-width="1.2"/>
  <circle cx="64" cy="96" r="2.5" fill="#2a1808" stroke="#c8a56a" stroke-width="1"/>
</svg>
