<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 140" role="img" aria-label="Брат-унитор, армянский монах-переводчик">
  <title>Брат-унитор</title>
  <desc>ФОРМА: армянский монах из братства униторов XIV века — светлый подрясник, тёмный плащ с капюшоном, кодекс и ключ от книгохранилища. ДЕЙСТВИЕ: переводит и хранит грамоты, сопровождает посольство, спорит учтиво и по источникам. ЦЕЛЬ: игрок учится различать веру и дружбу — вести честный диалог о расхождениях, не называя человека врагом. Миссии: 54 Посольство к Папе, 64 Тайный архив униторов.</desc>
  <rect width="100" height="140" fill="#1a0e04"/>
  <rect x="5" y="5" width="90" height="130" fill="none" stroke="#8a6a34" stroke-width="1.5"/>
  <!-- Арт-канон §9.0: умбра+золото. Инославный монах — уважительно, как
       человек и учёный, без карикатуры. -->
  <!-- голова, короткая борода -->
  <circle cx="50" cy="36" r="11" fill="#2a1808" stroke="#c8a56a" stroke-width="2"/>
  <path d="M43 42 Q50 50 57 42 Q54 46 50 46 Q46 46 43 42 Z" fill="#8a6a34"/>
  <!-- откинутый капюшон за плечами -->
  <path d="M36 46 Q50 38 64 46 Q60 54 50 54 Q40 54 36 46 Z" fill="#1a0e04" stroke="#c8a56a" stroke-width="1.5"/>
  <!-- светлый подрясник -->
  <path d="M50 52 C38 56 36 80 38 118 H62 C64 80 62 56 50 52 Z" fill="#c8a56a" stroke="#8a6a34" stroke-width="1.5"/>
  <!-- тёмный плащ, раскрытый спереди -->
  <path d="M40 50 C29 58 27 84 29 118 H40 C38 88 40 64 44 54 Z" fill="#2a1808" stroke="#c8a56a" stroke-width="2"/>
  <path d="M60 50 C71 58 73 84 71 118 H60 C62 88 60 64 56 54 Z" fill="#2a1808" stroke="#c8a56a" stroke-width="2"/>
  <!-- пояс -->
  <path d="M40 84 H60" stroke="#2a1808" stroke-width="2.5"/>
  <!-- кодекс в руках: книга перевода -->
  <rect x="42" y="66" width="16" height="12" rx="1" fill="#1a0e04" stroke="#e8c87a" stroke-width="1.6"/>
  <path d="M45 70 h10 M45 73 h8" stroke="#8a6a34" stroke-width="1"/>
  <!-- ключ архива на поясе -->
  <g stroke="#e8c87a" stroke-width="1.5" fill="none">
    <circle cx="56" cy="92" r="2.5"/><path d="M56 94.5 V104 M56 100 h3 M56 103 h2"/>
  </g>
  <!-- малый нагрудный крест на шнуре -->
  <path d="M50 56 v5 M48 58 h4" stroke="#1a0e04" stroke-width="1.3"/>
</svg>
