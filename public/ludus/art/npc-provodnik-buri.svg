<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 140" role="img" aria-label="Бури, проводник каравана, указывает на путеводную звезду">
  <title>Бури, проводник каравана</title>
  <desc>ФОРМА: степной проводник в меховой шапке и халате, с посохом и мотком верёвки; рука поднята к звезде, у подола — линия берега. ДЕЙСТВИЕ: учит держать курс ночью по звёздам, днём — по берегам и горам. ЦЕЛЬ: путь познаётся терпеливым наблюдением; звезда ведёт, но идёт сам путник. Миссия: 78 Навигация по звёздам и берегам.</desc>
  <rect width="100" height="140" fill="#1a0e04"/>
  <rect x="5" y="5" width="90" height="130" fill="none" stroke="#8a6a34" stroke-width="1.5"/>
  <!-- Арт-канон §9.0: умбра+золото. Звезда вынесена в угол, над головой
       нет никакого кольца. -->
  <!-- путеводная звезда в углу -->
  <path d="M80 14 L81.6 20 L87 21 L81.6 23 L80 29 L78.4 23 L73 21 L78.4 20 Z" fill="#e8c87a"/>
  <circle cx="80" cy="21" r="7" fill="#e8c87a" opacity=".14"/>
  <!-- голова в меховой шапке с отворотами -->
  <circle cx="46" cy="38" r="11" fill="#2a1808" stroke="#c8a56a" stroke-width="2"/>
  <path d="M34 36 Q34 22 46 22 Q58 22 58 36 L56 42 Q54 32 46 32 Q38 32 36 42 Z" fill="#8a6a34" stroke="#c8a56a" stroke-width="1.5"/>
  <path d="M36 28 Q46 24 56 28" fill="none" stroke="#e8c87a" stroke-width="1.2"/>
  <!-- халат с запахом -->
  <path d="M46 50 C28 56 26 82 28 118 H66 C68 82 64 56 46 50 Z" fill="#2a1808" stroke="#c8a56a" stroke-width="2"/>
  <path d="M40 54 L54 96" stroke="#c8a56a" stroke-width="1.5"/>
  <path d="M30 80 H64" stroke="#8a6a34" stroke-width="2"/>
  <!-- поднятая рука к звезде -->
  <path d="M58 58 Q66 44 72 30" fill="none" stroke="#c8a56a" stroke-width="2.4" stroke-linecap="round"/>
  <!-- моток верёвки у пояса -->
  <g fill="none" stroke="#e8c87a" stroke-width="1.3"><ellipse cx="38" cy="90" rx="6" ry="4"/><ellipse cx="38" cy="90" rx="3.5" ry="2"/></g>
  <!-- посох -->
  <path d="M22 122 V52" stroke="#8a6a34" stroke-width="2.2"/>
  <!-- линия берега и гор у подола -->
  <path d="M8 128 L22 118 L32 124 L46 114 L60 124 L74 118 L92 128" fill="none" stroke="#8a6a34" stroke-width="1.3"/>
</svg>
