<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 140" role="img" aria-label="Давит, молодой возчик, с вожжами у колеса арбы">
  <title>Давит, молодой возчик</title>
  <desc>ФОРМА: юноша без бороды, в войлочной шапке и короткой куртке, с вожжами в руках; позади — колесо арбы. ДЕЙСТВИЕ: ведёт повозку каравана, учится у старших братства караванщиков делить воду, беречь животных и не бросать отставших. ЦЕЛЬ: братство в пути — сила слабого в верности товарищей. Миссия: 15 Братство караванщиков.</desc>
  <rect width="100" height="140" fill="#1a0e04"/>
  <rect x="5" y="5" width="90" height="130" fill="none" stroke="#8a6a34" stroke-width="1.5"/>
  <!-- Арт-канон §9.0: умбра+золото. -->
  <!-- колесо арбы позади -->
  <g transform="translate(72,100)" fill="none">
    <circle r="16" stroke="#8a6a34" stroke-width="2"/>
    <path d="M0 -16 V16 M-16 0 H16 M-11 -11 L11 11 M-11 11 L11 -11" stroke="#8a6a34" stroke-width="1.2"/>
    <circle r="3" fill="#8a6a34"/>
  </g>
  <!-- молодое лицо, войлочная шапка -->
  <circle cx="46" cy="38" r="10.5" fill="#2a1808" stroke="#c8a56a" stroke-width="2"/>
  <path d="M35 34 Q36 22 46 22 Q56 22 57 34 Z" fill="#c8a56a" stroke="#8a6a34" stroke-width="1.5"/>
  <path d="M35 34 H57" stroke="#e8c87a" stroke-width="1.8"/>
  <!-- короткая куртка и штаны -->
  <path d="M46 50 C32 54 30 70 32 92 H60 C62 70 60 54 46 50 Z" fill="#2a1808" stroke="#c8a56a" stroke-width="2"/>
  <path d="M34 92 L34 120 H44 L46 96 L48 120 H58 L58 92 Z" fill="#1a0e04" stroke="#c8a56a" stroke-width="1.5"/>
  <path d="M32 84 H60" stroke="#e8c87a" stroke-width="2"/>
  <!-- вожжи в руках -->
  <path d="M38 72 Q46 76 54 72" fill="none" stroke="#c8a56a" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M40 72 Q24 62 12 70 M52 72 Q30 58 12 64" fill="none" stroke="#e8c87a" stroke-width="1.3"/>
  <!-- фляга с водой на боку -->
  <ellipse cx="58" cy="80" rx="4" ry="5" fill="#8a6a34" stroke="#c8a56a" stroke-width="1.2"/>
</svg>
