<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 140" role="img" aria-label="Святитель Иоанн Златоуст, архиепископ Константинопольский">
  <title>Иоанн Златоуст</title>
  <desc>Святитель Иоанн Златоуст, архиепископ Константинопольский, проповедник милостыни и обличитель неправды, дважды изгнанный и умерший в ссылке со словами «Слава Богу за всё». Пчела у уст — предание о даре медоточивого слова, отсюда «Златые уста»; Евангелие — единственный источник его проповеди; омофор с крестами — пастырь, несущий овцу. Смысл: харизма (Charisma) слова, укоренённая в вере (Faith), — речь, которая не льстит, а исцеляет. Без нимба: игровой образ — не икона; нимб принадлежит иконе, поэтому святость здесь явлена атрибутами.</desc>
  <!-- Арт-канон §9.0: умбра+золото, картуш, без нимбов; святость — в атрибутах -->
  <rect width="100" height="140" fill="#1a0e04"/>
  <rect x="5" y="5" width="90" height="130" fill="none" stroke="#8a6a34" stroke-width="1.5"/>
  <!-- лик аскета, истощённого постом -->
  <circle cx="50" cy="32" r="10" fill="#1a0e04" stroke="#c8a56a" stroke-width="2"/>
  <!-- святительский саккос -->
  <path d="M50 47 C31 53 27 80 29 118 H71 C73 80 69 53 50 47 Z" fill="#2a1808" stroke="#c8a56a" stroke-width="2"/>
  <!-- короткая клиновидная борода -->
  <path d="M42 36 Q43 48 50 54 Q57 48 58 36 Q55 43 50 43 Q45 43 42 36 Z" fill="#8a6a34" stroke="#c8a56a" stroke-width="1"/>
  <!-- пчела у уст: дар медоточивого слова -->
  <g stroke="#8a6a34" stroke-width=".7">
    <ellipse cx="62" cy="38" rx="3.2" ry="2" fill="#e8c87a"/>
    <path d="M60.5 36.3 v3.4 M62.3 36 v4" stroke="#1a0e04"/>
    <ellipse cx="61" cy="34.8" rx="2" ry="1.3" fill="#c8a56a" opacity=".7"/>
    <ellipse cx="63.8" cy="34.8" rx="2" ry="1.3" fill="#c8a56a" opacity=".7"/>
  </g>
  <path d="M58.8 38 q-2 .5 -3.5 0" fill="none" stroke="#e8c87a" stroke-width=".8" stroke-dasharray="1 1"/>
  <!-- великий омофор: полоса по плечам и спускающийся конец -->
  <path d="M33 57 Q50 69 67 57" fill="none" stroke="#e8c87a" stroke-width="5"/>
  <path d="M50 65 L54 118" stroke="#e8c87a" stroke-width="5"/>
  <!-- кресты на омофоре -->
  <g stroke="#1a0e04" stroke-width="1.3">
    <path d="M38 59 v5 M35.5 61.5 h5"/>
    <path d="M62 59 v5 M59.5 61.5 h5"/>
    <path d="M51.5 84 v6 M48.5 87 h6"/>
    <path d="M53 104 v6 M50 107 h6"/>
  </g>
  <!-- Евангелие в окладе, прижатое к груди -->
  <path d="M30 76 H46 V98 H30 Z" fill="#1a0e04" stroke="#c8a56a" stroke-width="1.8"/>
  <path d="M38 80 v14 M33.5 85.5 h9" stroke="#e8c87a" stroke-width="1.5"/>
  <circle cx="32" cy="78" r="1" fill="#e8c87a"/><circle cx="44" cy="78" r="1" fill="#e8c87a"/>
  <circle cx="32" cy="96" r="1" fill="#e8c87a"/><circle cx="44" cy="96" r="1" fill="#e8c87a"/>
  <!-- благословляющая десница -->
  <path d="M64 80 q-2 -8 2 -10 q3 2 2 10 Z" fill="#1a0e04" stroke="#c8a56a" stroke-width="1.5"/>
  <!-- чаша Литургии, носящей его имя -->
  <path d="M70 108 h10 q0 7 -5 8 v4 h3 v2 h-8 v-2 h3 v-4 q-5 -1 -5 -8 Z" fill="#1a0e04" stroke="#c8a56a" stroke-width="1.3"/>
</svg>
