<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Размытая горная дорога — разлив речки в сезон дождей">
  <title>Размытая дорога</title>
  <desc>ФОРМА: горная дорога уходит под мутный разлив речки, косой дождь, сломанное колесо повозки и каменная тура-указатель на том берегу. ДЕЙСТВИЕ: дьякон решает — ждать спада воды, искать брод или разгрузить караван; спешка здесь губит. ЦЕЛЬ: терпение и рассудительность в пути. Миссия: 41 Сезон дождей.</desc>
  <!-- Арт-канон §9.0: умбра+золото, без нимбов. Рисовано вручную: сырьё 99 репо не подходит (правило 0.15). -->
  <defs>
    <linearGradient id="rd-nebo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0e04"/>
      <stop offset="60%" stop-color="#2a1808"/>
      <stop offset="100%" stop-color="#241405"/>
    </linearGradient>
  </defs>
  <rect width="320" height="180" fill="url(#rd-nebo)"/>
  <!-- тяжёлые тучи -->
  <path d="M0 30 Q40 14 80 26 Q120 10 170 24 Q220 8 270 22 Q300 14 320 22 V0 H0 Z" fill="#140a02"/>
  <!-- склоны ущелья -->
  <path d="M0 40 L60 60 L90 120 L0 150 Z" fill="#241405" stroke="#8a6a34" stroke-width="1.5"/>
  <path d="M320 36 L250 64 L230 116 L320 140 Z" fill="#241405" stroke="#8a6a34" stroke-width="1.5"/>
  <!-- дорога вдоль склона -->
  <path d="M0 150 Q40 136 90 126 L112 122" fill="none" stroke="#c8a56a" stroke-width="3"/>
  <path d="M212 118 L236 118 Q280 124 320 140" fill="none" stroke="#c8a56a" stroke-width="3"/>
  <!-- разлив речки поверх дороги -->
  <path d="M60 180 Q90 130 110 118 Q160 106 214 116 Q250 140 270 180 Z" fill="#0d2a3a" stroke="#1f5a73" stroke-width="1.8"/>
  <g stroke="#1f5a73" stroke-width="1.4" fill="none">
    <path d="M110 134 Q124 128 138 134 Q152 140 166 134 Q180 128 194 134"/>
    <path d="M96 152 Q112 146 128 152 Q144 158 160 152 Q176 146 192 152 Q208 158 224 152"/>
    <path d="M86 168 Q104 162 122 168 M200 168 Q220 162 240 168"/>
  </g>
  <!-- обломок колеса в потоке -->
  <g stroke="#c8a56a" stroke-width="1.6" fill="none">
    <path d="M140 150 A10 10 0 0 1 158 142"/>
    <path d="M149 150 L143 143 M149 150 L151 140 M149 150 L157 146"/>
  </g>
  <!-- тура-указатель на том берегу -->
  <g fill="#2a1808" stroke="#c8a56a" stroke-width="1.3">
    <ellipse cx="258" cy="116" rx="8" ry="4"/><ellipse cx="258" cy="109" rx="6" ry="3.5"/><ellipse cx="258" cy="103" rx="4" ry="3"/>
  </g>
  <!-- косой дождь -->
  <g stroke="#c8a56a" stroke-width="1" opacity=".45">
    <path d="M40 40 l-6 14 M80 36 l-6 14 M120 44 l-6 14 M160 34 l-6 14 M200 42 l-6 14 M240 36 l-6 14 M280 44 l-6 14"/>
    <path d="M60 76 l-6 14 M140 70 l-6 14 M180 82 l-6 14 M300 74 l-6 14 M20 90 l-6 14"/>
  </g>
</svg>
