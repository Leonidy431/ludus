<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="Врата знания III — Аскетическое: чётки и хлеб, порог Мудрости 8">
  <title>Врата III: Аскетическое</title>
  <desc>Вервица и ломоть простого хлеба рядом с кружкой воды. Смысл: пост и правило — не наказание тела, а навык свободы: немного хлеба, немного воды и непрестанный счёт молитв. Восемь точек внизу — порог Мудрости 8.</desc>
  <!-- Арт-канон §9.0: умбра+золото, картуш-рамка. Врата знания, уровень 3 из 6:
       фон без сияния, образ беднее — начинается строгость. -->
  <rect x="2" y="2" width="92" height="92" rx="10" fill="#1a0e04" stroke="#8a6a34" stroke-width="2"/>
  <rect x="7" y="7" width="82" height="82" rx="7" fill="none" stroke="#c8a56a" stroke-width="1" opacity=".55"/>
  <!-- петля вервицы -->
  <ellipse cx="36" cy="38" rx="16" ry="18" fill="none" stroke="#8a6a34" stroke-width="2"/>
  <g fill="#c8a56a" stroke="#8a6a34" stroke-width=".6">
    <circle cx="36" cy="20" r="2.2"/><circle cx="46" cy="24" r="2.2"/><circle cx="51.5" cy="33" r="2.2"/>
    <circle cx="51" cy="44" r="2.2"/><circle cx="45" cy="52" r="2.2"/><circle cx="27" cy="52" r="2.2"/>
    <circle cx="21" cy="44" r="2.2"/><circle cx="20.5" cy="33" r="2.2"/><circle cx="26" cy="24" r="2.2"/>
  </g>
  <!-- кисть и крестик вервицы -->
  <path d="M36 56 V62 M36 62 V72 M32 66 H40" stroke="#e8c87a" stroke-width="2" stroke-linecap="round"/>
  <!-- ломоть хлеба -->
  <path d="M52 72 Q52 60 64 58 Q76 60 76 72 Z" fill="#8a6a34" stroke="#c8a56a" stroke-width="1.5"/>
  <path d="M58 70 l4 -8 M64 70 l4 -8 M70 70 l3 -6" stroke="#2a1808" stroke-width="1.2"/>
  <!-- кружка воды -->
  <path d="M62 34 H76 V52 H62 Z" fill="#2a1808" stroke="#c8a56a" stroke-width="1.5"/>
  <path d="M76 38 q5 0 5 5 q0 5 -5 5" fill="none" stroke="#c8a56a" stroke-width="1.5"/>
  <path d="M64 38 H74" stroke="#8a6a34" stroke-width="1"/>
  <!-- стол-доска -->
  <path d="M14 76 H82" stroke="#8a6a34" stroke-width="1.5"/>
  <!-- порог Мудрости: 8 точек -->
  <g fill="#e8c87a"><circle cx="32.6" cy="83" r="1.5"/><circle cx="37" cy="83" r="1.5"/><circle cx="41.4" cy="83" r="1.5"/><circle cx="45.8" cy="83" r="1.5"/><circle cx="50.2" cy="83" r="1.5"/><circle cx="54.6" cy="83" r="1.5"/><circle cx="59" cy="83" r="1.5"/><circle cx="63.4" cy="83" r="1.5"/></g>
</svg>
