<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Перевал Санташ — каменная груда у дороги и малый пост с крестом">
  <title>Перевал Санташ</title>
  <desc>ФОРМА: горный перевал: снежные вершины, дорога серпантином, великая груда камней «Санташ» (по преданию, счёт воинов), каменная сторожка с деревянным крестом, арча. ДЕЙСТВИЕ: игрок ставит на перевале форпост веры — приют для путников, а не крепость для войны. ЦЕЛЬ: там, где камни считали убитых, крест встречает живых. Миссия: 23 «Форпост веры».</desc>
  <!-- Арт-канон §9.0: умбра+золото, без нимбов. Рисовано вручную: сырьё 99 репо не подходит (правило 0.15). -->
  <defs>
    <linearGradient id="pereval-santash-nebo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0e04"/>
      <stop offset="60%" stop-color="#3a2410"/>
      <stop offset="100%" stop-color="#8a6a34"/>
    </linearGradient>
  </defs>
  <rect width="320" height="180" fill="url(#pereval-santash-nebo)"/>
  <!-- снежные вершины -->
  <path d="M0 110 L30 54 L64 92 L110 34 L150 84 L190 40 L236 90 L280 50 L320 84 V130 H0 Z" fill="#241405"/>
  <g fill="#e8d9b8" opacity=".8">
    <path d="M22 68 L30 54 L38 68 L30 64 Z M100 50 L110 34 L120 50 L110 46 Z M182 54 L190 40 L198 54 L190 50 Z M272 64 L280 50 L288 64 L280 60 Z"/>
  </g>
