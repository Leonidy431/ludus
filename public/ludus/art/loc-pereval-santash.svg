  <path d="M0 124 Q90 102 170 112 Q250 122 320 108 V180 H0 Z" fill="#2a1808"/>
  <!-- дорога серпантином -->
  <path d="M60 180 Q120 166 90 152 Q60 140 130 132 Q190 126 170 114" fill="none" stroke="#c8a56a" stroke-width="2" stroke-dasharray="6 4"/>
  <!-- груда камней Санташ -->
