<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="Восковая табличка-диптих со стилом">
  <title>Восковая табличка</title>
  <desc>ФОРМА: раскрытый деревянный диптих (реестр ВР-09) с тёмным воском, процарапанные строки и счётные метки, ремешок-петля и костяной стило с лопаткой для заглаживания. ДЕЙСТВИЕ: в школе ремёсел ученик пишет, стирает и пишет снова. ЦЕЛЬ: учение терпением — ошибку можно загладить и начать заново. Миссия: 74 Школа ремёсел.</desc>
  <!-- Арт-канон §9.0: умбра+золото, без нимбов. Рисовано вручную: сырьё 99 репо не подходит (правило 0.15). -->
  <defs>
    <radialGradient id="vt-bg" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#3a2410"/>
      <stop offset="100%" stop-color="#1a0e04"/>
    </radialGradient>
  </defs>
  <rect x="2" y="2" width="92" height="92" rx="10" fill="url(#vt-bg)" stroke="#8a6a34" stroke-width="2"/>
  <rect x="7" y="7" width="82" height="82" rx="7" fill="none" stroke="#c8a56a" stroke-width="1" opacity=".55"/>
  <!-- две створки диптиха -->
  <rect x="12" y="18" width="34" height="52" rx="2" fill="#8a6a34" stroke="#c8a56a" stroke-width="1.6"/>
  <rect x="50" y="18" width="34" height="52" rx="2" fill="#8a6a34" stroke="#c8a56a" stroke-width="1.6"/>
  <!-- восковое поле -->
  <rect x="16" y="26" width="26" height="42" fill="#2a1808"/>
  <rect x="54" y="26" width="26" height="42" fill="#2a1808"/>
  <!-- петли-ремешки -->
  <g fill="none" stroke="#c8a56a" stroke-width="1.4"><path d="M45 32 H51 M45 60 H51"/></g>
  <!-- процарапанные строки -->
  <g stroke="#e8c87a" stroke-width="1" stroke-linecap="round">
    <path d="M19 32 H38 M19 38 H35 M19 44 H39 M19 50 H32"/>
    <path d="M57 32 H76 M57 38 H72"/>
  </g>
  <!-- счётные метки -->
  <g stroke="#c8a56a" stroke-width="1.1">
    <path d="M58 48 v6 M61 48 v6 M64 48 v6 M67 48 v6 M56 53 l13 -4"/>
    <path d="M58 60 v5 M61 60 v5"/>
  </g>
  <!-- стило с лопаткой -->
  <path d="M22 80 H72" stroke="#e8c87a" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M72 77.5 L80 80 L72 82.5 Z" fill="#e8c87a"/>
  <path d="M16 77 H22 V83 H16 Z" fill="#c8a56a" stroke="#8a6a34" stroke-width=".8"/>
</svg>
