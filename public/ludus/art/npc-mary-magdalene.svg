<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 140" role="img" aria-label="Святая равноапостольная Мария Магдалина, мироносица">
  <title>Мария Магдалина</title>
  <desc>Святая равноапостольная Мария Магдалина, первая увидевшая Воскресшего у гроба. Сосуд мира — любовь, пришедшая служить Христу до конца; красное яйцо — по преданию, её пасхальный дар кесарю со словами «Христос воскресе!». Смысл: покаяние, превращённое в благовестие. Без нимба: игровой образ — не икона; нимб принадлежит иконе, поэтому святость здесь явлена атрибутами.</desc>
  <rect width="100" height="140" fill="#1a0e04"/>
  <rect x="5" y="5" width="90" height="130" fill="none" stroke="#8a6a34" stroke-width="1.5"/>
  <!-- Арт-канон §9.0: умбра+золото, картуш, без нимбов; святость — в атрибутах -->
  <!-- мафорий, покрывающий голову и плечи -->
  <path d="M50 18 C36 18 34 32 36 46 C30 54 28 80 29 118 H71 C72 80 70 54 64 46 C66 32 64 18 50 18 Z" fill="#2a1808" stroke="#c8a56a" stroke-width="2"/>
  <!-- кайма мафория с тремя звёздами-точками девства и чистоты -->
  <path d="M40 26 Q50 20 60 26" fill="none" stroke="#e8c87a" stroke-width="1.5"/>
  <circle cx="50" cy="21.5" r="1.4" fill="#e8c87a"/>
  <!-- кроткий лик -->
  <circle cx="50" cy="35" r="9" fill="#1a0e04" stroke="#c8a56a" stroke-width="2"/>
  <!-- складки плаща -->
  <path d="M36 46 Q44 60 42 118 M64 46 Q56 60 58 118" fill="none" stroke="#8a6a34" stroke-width="1.2"/>
  <!-- красное пасхальное яйцо в поднятой руке -->
  <path d="M34 70 q-4 -2 -4 -8 q0 -4 4 -4 q4 0 4 4 q0 6 -4 8 Z" fill="#1a0e04" stroke="#c8a56a" stroke-width="1.2"/>
  <ellipse cx="34" cy="58" rx="5" ry="6.5" fill="#c0392b" stroke="#e8c87a" stroke-width="1.2"/>
  <!-- алавастровый сосуд мира -->
  <path d="M56 84 h10 v3 h-2 q4 3 4 10 q0 10 -7 11 q-7 -1 -7 -11 q0 -7 4 -10 h-2 Z" fill="#1a0e04" stroke="#e8c87a" stroke-width="1.5"/>
  <path d="M55 96 h16" stroke="#8a6a34" stroke-width="1.2"/>
  <!-- благоухание мира -->
  <path d="M60 80 q-2 -4 1 -8 M65 80 q2 -4 -1 -8" fill="none" stroke="#c8a56a" stroke-width="1.2" stroke-dasharray="2 2"/>
</svg>
