<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="Тюк ткани с пломбой, реестр СГ-08">
  <title>Тюк ткани (СГ-08)</title>
  <desc>Форма: тугой тюк шёлка и шерсти, перевязанный верёвкой, с торговой пломбой. Действие: вес и мера тюка сверяются с реестром, спор решается по честной мере, а не по силе. Цель: правда в торговле как часть учения. Миссии: 2 Армянская фактория, 3 Епископ-арбитр, 5 Кредит доверия, 69 Текстильные цеха.</desc>
  <!-- Арт-канон §9.0: умбра+золото, картуш-рамка, без нимбов.
       Предмет реестра СГ-08: караванный тюк; пломба — знак честной меры. -->
  <defs>
    <radialGradient id="tyuk-shelka-bg" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#3a2410"/>
      <stop offset="100%" stop-color="#1a0e04"/>
    </radialGradient>
  </defs>
  <rect x="2" y="2" width="92" height="92" rx="10" fill="url(#tyuk-shelka-bg)" stroke="#8a6a34" stroke-width="2"/>
  <rect x="7" y="7" width="82" height="82" rx="7" fill="none" stroke="#c8a56a" stroke-width="1" opacity=".55"/>
  <!-- тело тюка -->
  <path d="M18 40 Q20 30 32 30 H66 Q78 30 78 40 V62 Q78 72 66 72 H30 Q18 72 18 62 Z" fill="#2a1808" stroke="#c8a56a" stroke-width="2"/>
  <!-- торец: слои ткани -->
  <ellipse cx="28" cy="51" rx="8" ry="20" fill="#8a6a34" stroke="#c8a56a" stroke-width="1.5"/>
  <g fill="none" stroke="#e8c87a" stroke-width="1" opacity=".8">
    <ellipse cx="28" cy="51" rx="5.5" ry="15"/><ellipse cx="28" cy="51" rx="3" ry="9"/>
  </g>
  <!-- блеск шёлка по боку -->
  <path d="M40 36 Q56 34 70 38" fill="none" stroke="#e8c87a" stroke-width="1.5" opacity=".6"/>
  <!-- обвязка верёвкой -->
  <g fill="none" stroke="#c8a56a" stroke-width="2">
    <path d="M46 30 V72"/><path d="M62 30 V72"/><path d="M36 51 H78"/>
  </g>
  <!-- пломба на шнуре -->
  <path d="M62 51 Q66 60 64 66" fill="none" stroke="#8a6a34" stroke-width="1.2"/>
  <circle cx="64" cy="70" r="5" fill="#8a6a34" stroke="#e8c87a" stroke-width="1.5"/>
  <circle cx="64" cy="70" r="2.2" fill="none" stroke="#1a0e04" stroke-width="1.2"/>
  <!-- ярлык реестра: две насечки + восемь точек -->
  <rect x="44" y="76" width="22" height="8" rx="2" fill="#1a0e04" stroke="#c8a56a" stroke-width="1"/>
  <g fill="#e8c87a"><circle cx="49" cy="80" r="1"/><circle cx="53" cy="80" r="1"/><circle cx="57" cy="80" r="1"/><circle cx="61" cy="80" r="1"/></g>
</svg>
