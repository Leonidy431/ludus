<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="Ловкость — атрибут точного священнодействия">
  <title>Ловкость (Dexterity)</title>
  <desc>Свеча зажигается от свечи: ловкость здесь — не проворство ради себя, а точность благоговейного действия. По Иоанну Дамаскину, делание (практика) предшествует созерцанию. Атрибут даёт успех в ритуалах.</desc>
  <!-- Атрибут ФОРМЫ №3: Dexterity — огонь, переданный от свечи к свече точным движением руки -->
  <defs>
    <radialGradient id="dexterity-bg" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#3a2410"/>
      <stop offset="100%" stop-color="#1a0e04"/>
    </radialGradient>
  </defs>
  <!-- картуш-рамка -->
  <rect x="2" y="2" width="92" height="92" rx="10" fill="url(#dexterity-bg)" stroke="#8a6a34" stroke-width="2"/>
  <rect x="7" y="7" width="82" height="82" rx="7" fill="none" stroke="#c8a56a" stroke-width="1" opacity=".55"/>
  <g>
    <!-- подсвечник-основание -->
    <path d="M22 78 H74" stroke="#8a6a34" stroke-width="2"/>
    <!-- горящая свеча -->
    <rect x="28" y="40" width="8" height="38" fill="#2a1808" stroke="#c8a56a" stroke-width="1.6"/>
    <path d="M32 26 Q36 32 34 36 Q33 38 32 38 Q31 38 30 36 Q28 32 32 26 Z" fill="#e8c87a" stroke="#8a6a34" stroke-width=".7"/>
    <!-- наклонённая свеча, принимающая огонь -->
    <g transform="rotate(-28 62 78)">
      <rect x="58" y="38" width="8" height="40" fill="#2a1808" stroke="#c8a56a" stroke-width="1.6"/>
      <path d="M62 38 V34" stroke="#c8a56a" stroke-width="1.2"/>
    </g>
    <!-- дуга движения руки -->
    <path d="M40 22 Q50 16 58 24" fill="none" stroke="#c8a56a" stroke-width="1.4" stroke-dasharray="2 3"/>
    <circle cx="44" cy="36" r="10" fill="#e8c87a" opacity=".12"/>
  </g>
</svg>
