<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="Рог глашатая — голос, обращённый к своду">
  <!-- Арт-канон §9.0: умбра+золото. Объект каталога: рог глашатая двора —
       визуальный эталон «голоса» (проход №54, задел под кастомную иконку
       голосового ввода vr-voice, реестр п.14, взамен нейтрального 🎙️). -->
  <defs>
    <linearGradient id="rog-fon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a1808"/>
      <stop offset="100%" stop-color="#1a0e04"/>
    </linearGradient>
    <linearGradient id="rog-metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8c87a"/>
      <stop offset="100%" stop-color="#8a6a34"/>
    </linearGradient>
  </defs>
  <rect width="96" height="96" rx="10" fill="url(#rog-fon)"/>
  <rect x="3" y="3" width="90" height="90" rx="8" fill="none" stroke="#8a6a34" stroke-width="1.4" opacity=".8"/>
  <!-- Изогнутый рог, раструб вверх-вправо -->
  <path d="M24 66 Q22 48 34 36 Q48 22 70 24 Q76 25 76 30 Q60 28 48 40 Q38 50 39 64 Z"
        fill="url(#rog-metal)" stroke="#3a2410" stroke-width="1.2"/>
  <!-- Кольца рога -->
  <g stroke="#3a2410" stroke-width="1" opacity=".6" fill="none">
    <path d="M27 60 Q33 56 40 56"/>
    <path d="M31 50 Q38 47 46 48"/>
    <path d="M38 41 Q46 39 54 41"/>
    <path d="M48 34 Q56 33 64 35"/>
  </g>
  <!-- Раструб -->
  <ellipse cx="73" cy="27" rx="7" ry="9" fill="#3a2410" stroke="#e8c87a" stroke-width="1.3" transform="rotate(20 73 27)"/>
  <!-- Мундштук -->
  <circle cx="22" cy="68" r="4" fill="#241405" stroke="#8a6a34" stroke-width="1"/>
  <!-- Звуковые волны, идущие от раструба -->
  <g stroke="#fff3c0" stroke-width="1.4" fill="none" opacity=".8" stroke-linecap="round">
    <path d="M82 20 Q88 24 86 30"/>
    <path d="M86 16 Q94 22 91 32"/>
  </g>
  <!-- Кисть/подвес -->
  <path d="M24 66 L18 74 M24 66 L20 78" stroke="#a33a2a" stroke-width="1.6" stroke-linecap="round"/>
</svg>
