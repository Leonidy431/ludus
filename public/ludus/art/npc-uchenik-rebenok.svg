<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 140" role="img" aria-label="Дети-ученики школы ремёсел">
  <title>Дети-ученики</title>
  <desc>Форма: собирательный портрет трёх детей разных семей степи и оазиса — мальчик с восковой табличкой, девочка с веретеном, младший с клубком глины; над ними лампада. Действие: учатся грамоте и ремеслу вместе, помогая друг другу. Цель: «пустите детей приходить ко Мне» (Мк. 10:14): школа открыта всем, знание дано как дар; лица детей без этнических клише. Миссия: 74 Школа ремёсел.</desc>
  <rect width="100" height="140" fill="#1a0e04"/>
  <rect x="5" y="5" width="90" height="130" fill="none" stroke="#8a6a34" stroke-width="1.5"/>
  <!-- Арт-канон §9.0: умбра+золото, картуш, без нимбов. Собирательный образ; без портретного сходства с реальными детьми. -->
  <!-- лампада над классом -->
  <path d="M50 10 V18" stroke="#8a6a34" stroke-width="1.2"/>
  <path d="M44 18 H56 Q55 24 50 25 Q45 24 44 18 Z" fill="#c8a56a" stroke="#8a6a34" stroke-width="1"/>
  <path d="M50 12 Q52 15 50 17 Q48 15 50 12 Z" fill="#e8c87a"/>
  <circle cx="50" cy="16" r="8" fill="#e8c87a" opacity=".12"/>
  <!-- старший мальчик в центре -->
  <circle cx="50" cy="48" r="9" fill="#2a1808" stroke="#c8a56a" stroke-width="2"/>
  <path d="M41 45 Q42 37 50 37 Q58 37 59 45 Q54 41 50 41 Q46 41 41 45 Z" fill="#8a6a34"/>
  <path d="M50 58 C36 62 34 84 36 116 H64 C66 84 64 62 50 58 Z" fill="#2a1808" stroke="#c8a56a" stroke-width="2"/>
  <!-- восковая табличка со стилем -->
  <rect x="40" y="76" width="20" height="14" rx="1" fill="#8a6a34" stroke="#e8c87a" stroke-width="1.5"/>
  <g stroke="#1a0e04" stroke-width="1"><path d="M43 80 H57 M43 84 H55"/></g>
  <path d="M60 74 L66 66" stroke="#e8c87a" stroke-width="1.4"/>
  <!-- девочка слева с платком и веретеном -->
  <circle cx="24" cy="70" r="7" fill="#2a1808" stroke="#c8a56a" stroke-width="1.8"/>
  <path d="M16 72 Q16 60 24 60 Q32 60 32 72 L30 68 Q24 62 18 68 Z" fill="#c8a56a" opacity=".8"/>
  <path d="M24 78 C14 82 12 104 14 124 H34 C35 104 33 82 24 78 Z" fill="#2a1808" stroke="#c8a56a" stroke-width="1.8"/>
  <path d="M20 94 V112" stroke="#e8c87a" stroke-width="1.4"/>
  <ellipse cx="20" cy="108" rx="3" ry="2" fill="#c8a56a"/>
  <!-- младший справа с клубком глины -->
  <circle cx="76" cy="76" r="6" fill="#2a1808" stroke="#c8a56a" stroke-width="1.8"/>
  <path d="M76 83 C68 86 66 104 68 124 H84 C86 104 84 86 76 83 Z" fill="#2a1808" stroke="#c8a56a" stroke-width="1.8"/>
  <circle cx="76" cy="100" r="4.5" fill="#8a6a34" stroke="#e8c87a" stroke-width="1.2"/>
  <!-- общая скамья -->
  <path d="M10 126 H90" stroke="#8a6a34" stroke-width="2"/>
</svg>
