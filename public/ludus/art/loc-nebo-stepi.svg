<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Степное небо над юртами — фон VR-сцены">
  <!-- Арт-канон §9.0: умбра+золото. Локация I-каталога: закатное степное небо
       с силуэтами юрт — фоллбэк-скайбокс VR-сцены (реестр п.30, проход №44):
       пока glb грузится или недоступен, за canvas — не белый экран, а степь. -->
  <defs>
    <linearGradient id="nebo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0e04"/>
      <stop offset="55%" stop-color="#3a2410"/>
      <stop offset="78%" stop-color="#8a6a34"/>
      <stop offset="100%" stop-color="#2a1808"/>
    </linearGradient>
  </defs>
  <rect width="320" height="180" fill="url(#nebo)"/>
  <!-- Низкое солнце -->
  <circle cx="238" cy="128" r="16" fill="#e8c87a" opacity=".9"/>
  <circle cx="238" cy="128" r="26" fill="#e8c87a" opacity=".18"/>
  <!-- Дальняя гряда -->
  <path d="M0 140 Q60 128 120 138 Q200 148 260 136 Q300 130 320 136 L320 180 L0 180 Z"
        fill="#241405"/>
  <!-- Силуэты юрт -->
  <g fill="#140a02">
    <path d="M56 148 Q70 132 84 148 L84 154 L56 154 Z"/>
    <path d="M69 133 L71 128 L73 133 Z"/>
    <path d="M150 152 Q161 140 172 152 L172 157 L150 157 Z"/>
    <path d="M286 150 Q296 139 306 150 L306 155 L286 155 Z"/>
  </g>
  <!-- Звёзды в тёмной части -->
  <g fill="#e8c87a">
    <circle cx="42" cy="28" r="1.1"/><circle cx="120" cy="16" r=".9"/>
    <circle cx="200" cy="30" r="1.2" opacity=".8"/><circle cx="288" cy="20" r=".9"/>
    <circle cx="160" cy="46" r=".8" opacity=".7"/>
  </g>
  <!-- Пасхалка (реестр п.95, проход №48): Звезда Пути — восьмиконечная,
       по мотивам obj-kompas-puti/obj-zvezda-puti; в тёмном углу неба сцены. -->
  <g transform="translate(74,20)" opacity=".92">
    <path d="M0 -7 L1.6 -1.6 L7 0 L1.6 1.6 L0 7 L-1.6 1.6 L-7 0 L-1.6 -1.6 Z" fill="#e8c87a"/>
    <path d="M0 -3.4 L0.9 -0.9 L3.4 0 L0.9 0.9 L0 3.4 L-0.9 0.9 L-3.4 0 L-0.9 -0.9 Z" fill="#fff3c0"/>
  </g>
</svg>
