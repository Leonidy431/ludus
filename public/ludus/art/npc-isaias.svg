<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 140" role="img" aria-label="Исаия, пророк">
  <title>Пророк Исаия</title>
  <desc>Пророк Исаия с развёрнутым свитком; серафим касается его уст горящим углём (Ис. 6:6–7): очищенные уста могут возвещать слово. Форма — Вера и Харизма; действие — пророческий призыв и испытание; цель — углубление веры через доверие непонятному.</desc>
  <rect width="100" height="140" fill="#1a0e04"/>
  <rect x="5" y="5" width="90" height="130" fill="none" stroke="#8a6a34" stroke-width="1.5"/>
  <!-- голова пророка с длинными волосами -->
  <path d="M40 30 Q40 20 50 20 Q60 20 60 30 L61 44 Q50 40 39 44 Z" fill="#8a6a34" stroke="#c8a56a" stroke-width="1.5"/>
  <circle cx="50" cy="34" r="10" fill="#2a1808" stroke="#c8a56a" stroke-width="2"/>
  <!-- гиматий через плечо -->
  <path d="M50 48 C31 54 27 82 29 120 H71 C73 82 69 54 50 48 Z" fill="#2a1808" stroke="#c8a56a" stroke-width="2"/>
  <path d="M60 52 L36 104" stroke="#8a6a34" stroke-width="3"/>
  <!-- борода -->
  <path d="M42 39 Q50 58 58 39 Q56 50 50 53 Q44 50 42 39 Z" fill="#c8a56a" opacity=".85"/>
  <!-- клещи серафима с горящим углём у уст -->
  <path d="M82 14 L60 38 M85 17 L62 40" stroke="#c8a56a" stroke-width="1.5"/>
  <circle cx="59" cy="40" r="3" fill="#c0392b" stroke="#e8c87a" stroke-width="1"/>
  <circle cx="59" cy="40" r="6" fill="#c0392b" opacity=".2"/>
  <!-- огненные перья серафима -->
  <path d="M80 10 q6 2 8 8 M76 12 q8 4 10 12" fill="none" stroke="#e8c87a" stroke-width="1.2"/>
  <!-- развёрнутый свиток пророчества -->
  <path d="M40 76 H66 V110 H40 Z" fill="#1a0e04" stroke="#e8c87a" stroke-width="1.5"/>
  <path d="M38 74 h30 v4 h-30 Z M38 108 h30 v4 h-30 Z" fill="#8a6a34" stroke="#c8a56a" stroke-width="1"/>
  <path d="M44 84 h18 M44 90 h18 M44 96 h14 M44 102 h16" stroke="#c8a56a" stroke-width="1"/>
  <!-- правая рука, поднятая в благовестии -->
  <path d="M29 64 L22 50" stroke="#c8a56a" stroke-width="2"/>
  <circle cx="21" cy="47" r="3" fill="#2a1808" stroke="#c8a56a" stroke-width="1.5"/>
</svg>
