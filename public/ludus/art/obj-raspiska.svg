<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" role="img" aria-label="Расписка об одолжении">
  <rect width="80" height="80" fill="#1a0e04"/>
  <rect x="3" y="3" width="74" height="74" fill="none" stroke="#8a6a34" stroke-width="1.2"/>
  <!-- лист расписки, чуть скошенный -->
  <g transform="rotate(-6 40 40)">
    <rect x="20" y="14" width="40" height="52" fill="#2a1808" stroke="#c8a56a" stroke-width="2"/>
    <!-- загнутый уголок -->
    <path d="M60 14 l-8 0 l8 8 Z" fill="#1a0e04" stroke="#c8a56a" stroke-width="1.5"/>
    <!-- строки долга -->
    <path d="M26 26 h22 M26 32 h28 M26 38 h24 M26 44 h28" stroke="#c8a56a" stroke-width="1.2" opacity=".7"/>
    <!-- узел-тамга должника вместо подписи -->
    <path d="M32 54 q4 -6 8 0 q4 6 8 0" fill="none" stroke="#e8c87a" stroke-width="1.6"/>
  </g>
  <!-- восковая печать поверх -->
  <circle cx="56" cy="58" r="8" fill="#2a1808" stroke="#e8c87a" stroke-width="2"/>
  <path d="M56 54 v8 M52 58 h8" stroke="#e8c87a" stroke-width="1.4"/>
</svg>
