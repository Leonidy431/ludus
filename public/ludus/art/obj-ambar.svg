<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="Амбар на сваях у террасы">
  <title>Амбар</title>
  <desc>ФОРМА: бревенчатый амбар на сваях с плоскими камнями против мышей, лестница, мешки с зерном у порога. ДЕЙСТВИЕ: урожай с монастырских террас собирается и хранится для общины и бедных, а не для наживы. ЦЕЛЬ: трезвое хозяйствование как послушание; запас против голода, а не против ближнего. Миссия: 42 «Богатые террасы».</desc>
  <!-- Арт-канон §9.0: умбра+золото, без нимбов. Рисовано вручную: сырьё 99 репо не подходит (правило 0.15). -->
  <defs>
    <radialGradient id="ambar-bg" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#3a2410"/>
      <stop offset="100%" stop-color="#1a0e04"/>
    </radialGradient>
  </defs>
  <rect x="2" y="2" width="92" height="92" rx="10" fill="url(#ambar-bg)" stroke="#8a6a34" stroke-width="2"/>
  <rect x="7" y="7" width="82" height="82" rx="7" fill="none" stroke="#c8a56a" stroke-width="1" opacity=".55"/>
  <!-- земля террасы -->
  <path d="M10 80 H86" stroke="#8a6a34" stroke-width="1.6"/>
  <!-- сваи с плоскими камнями -->
  <g stroke="#8a6a34" stroke-width="2.4"><path d="M28 64 V80 M68 64 V80"/></g>
  <g fill="#c8a56a"><rect x="23" y="65" width="10" height="2.5"/><rect x="63" y="65" width="10" height="2.5"/></g>
  <!-- сруб -->
  <rect x="22" y="42" width="52" height="22" fill="#2a1808" stroke="#c8a56a" stroke-width="1.6"/>
  <g stroke="#8a6a34" stroke-width="1"><path d="M22 48 H74 M22 53 H74 M22 58 H74"/></g>
  <!-- кровля -->
  <path d="M15 44 L48 21 L81 44 Z" fill="#8a6a34" stroke="#c8a56a" stroke-width="1.5"/>
  <path d="M26 38 L48 25 L70 38" fill="none" stroke="#2a1808" stroke-width="1"/>
  <!-- дверь и лестница -->
  <rect x="42" y="46" width="12" height="18" fill="#140a02" stroke="#e8c87a" stroke-width="1.3"/>
  <path d="M44 64 L41 80 M52 64 L55 80 M43 69 H53 M42 75 H54" stroke="#c8a56a" stroke-width="1.3"/>
  <!-- мешки с зерном -->
  <g fill="#c8a56a" stroke="#8a6a34" stroke-width="1.1">
    <path d="M13 80 Q12 70 17 69 L16 67 H22 L21 69 Q26 70 25 80 Z"/>
    <path d="M71 80 Q70 70 75 69 L74 67 H80 L79 69 Q84 70 83 80 Z"/>
  </g>
</svg>
