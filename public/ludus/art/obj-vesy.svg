<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="Торговые весы — коромысло с двумя чашами">
  <!-- Арт-канон §9.0: умбра+золото, картуш-рамка, без нимбов. Предмет
       реестра «99 предметов персонажей» (Гуру-проход): карманные весы
       купца Шёлкового пути — атрибут Саргиса (караван-баши) и Мелика
       (наместник, податной двор), типовой инструмент эпохи [док.]. -->
  <defs>
    <radialGradient id="vesy-bg" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#3a2410"/>
      <stop offset="100%" stop-color="#1a0e04"/>
    </radialGradient>
  </defs>
  <rect x="2" y="2" width="92" height="92" rx="10" fill="url(#vesy-bg)" stroke="#8a6a34" stroke-width="2"/>
  <rect x="7" y="7" width="82" height="82" rx="7" fill="none" stroke="#c8a56a" stroke-width="1" opacity=".55"/>
  <!-- Стойка -->
  <line x1="48" y1="22" x2="48" y2="70" stroke="#8a6a34" stroke-width="2.2"/>
  <path d="M38 70 L58 70 L54 76 L42 76 Z" fill="#2a1808" stroke="#8a6a34" stroke-width="1.4"/>
  <!-- Коромысло -->
  <line x1="24" y1="30" x2="72" y2="30" stroke="#c8a56a" stroke-width="2.2"/>
  <circle cx="48" cy="30" r="2.6" fill="#e8c87a" stroke="#8a6a34" stroke-width="1"/>
  <!-- Нити подвеса -->
  <line x1="24" y1="30" x2="20" y2="46" stroke="#8a6a34" stroke-width="1.1"/>
  <line x1="24" y1="30" x2="28" y2="46" stroke="#8a6a34" stroke-width="1.1"/>
  <line x1="72" y1="30" x2="68" y2="46" stroke="#8a6a34" stroke-width="1.1"/>
  <line x1="72" y1="30" x2="76" y2="46" stroke="#8a6a34" stroke-width="1.1"/>
  <!-- Чаши -->
  <path d="M16 46 Q24 56 32 46 Z" fill="none" stroke="#e8c87a" stroke-width="1.8"/>
  <path d="M64 46 Q72 56 80 46 Z" fill="none" stroke="#e8c87a" stroke-width="1.8"/>
  <!-- Гирьки-монеты в правой чаше -->
  <circle cx="70" cy="49" r="2.2" fill="#e8c87a" stroke="#8a6a34" stroke-width=".8"/>
  <circle cx="75" cy="49" r="2.2" fill="#e8c87a" stroke="#8a6a34" stroke-width=".8"/>
  <circle cx="48" cy="30" r="9" fill="#e8c87a" opacity=".1"/>
</svg>
