<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 140" role="img" aria-label="Святая великомученица Екатерина">
  <title>Великомученица Екатерина</title>
  <desc>Святая Екатерина Александрийская: царская дочь и мудрая дева, переспорившая философов. Венец означает и царский род, и венец мученический; сломанное колесо — орудие казни, разрушенное силой Божией; пальмовая ветвь — победа мученика. Смысл: мужество веры и мудрость, отданная Христу.</desc>
  <rect width="100" height="140" fill="#1a0e04"/>
  <rect x="5" y="5" width="90" height="130" fill="none" stroke="#8a6a34" stroke-width="1.5"/>
  <!-- нимб святой -->
  <circle cx="50" cy="32" r="17" fill="#2a1808" stroke="#e8c87a" stroke-width="1.5"/>
  <circle cx="50" cy="32" r="14.5" fill="none" stroke="#8a6a34" stroke-width="1" stroke-dasharray="2 2"/>
  <!-- лик, спокойный фронтальный -->
  <circle cx="50" cy="34" r="10" fill="#1a0e04" stroke="#c8a56a" stroke-width="2"/>
  <!-- царский венец -->
  <path d="M40 27 L42 18 L46 24 L50 16 L54 24 L58 18 L60 27 Z" fill="#c8a56a" stroke="#e8c87a" stroke-width="1.2"/>
  <circle cx="50" cy="22" r="1.4" fill="#c0392b"/>
  <!-- покрывало, ниспадающее на плечи -->
  <path d="M40 28 Q36 40 38 50 M60 28 Q64 40 62 50" fill="none" stroke="#8a6a34" stroke-width="2"/>
  <!-- царская мантия -->
  <path d="M50 46 C31 52 27 80 29 118 H71 C73 80 69 52 50 46 Z" fill="#2a1808" stroke="#c8a56a" stroke-width="2"/>
  <!-- оплечье с жемчугом -->
  <path d="M38 54 Q50 62 62 54" fill="none" stroke="#e8c87a" stroke-width="2.5"/>
  <path d="M38 54 Q50 62 62 54" fill="none" stroke="#1a0e04" stroke-width="1" stroke-dasharray="1 3"/>
  <!-- мученический крест в деснице -->
  <path d="M46 66 v16 M42 71 h8" stroke="#c0392b" stroke-width="2"/>
  <!-- пальмовая ветвь победы -->
  <path d="M62 104 Q60 80 66 62" fill="none" stroke="#c8a56a" stroke-width="1.5"/>
  <path d="M65 66 l-6 -2 M64 72 l-6 -1 M63 78 l-6 0 M62 84 l-5 1 M65 66 l5 -3 M64 72 l6 -2 M63 78 l6 -1 M62 84 l6 0" stroke="#e8c87a" stroke-width="1.2"/>
  <!-- сломанное колесо у ног -->
  <g fill="none" stroke="#8a6a34" stroke-width="1.8">
    <path d="M22 116 A12 12 0 1 1 40 124"/>
    <circle cx="30" cy="114" r="2.5" fill="#8a6a34"/>
    <path d="M30 114 L30 102 M30 114 L20 110 M30 114 L38 105 M30 114 L22 122"/>
  </g>
  <!-- обломок обода -->
  <path d="M42 122 q4 2 6 -2" fill="none" stroke="#c8a56a" stroke-width="1.8"/>
</svg>
