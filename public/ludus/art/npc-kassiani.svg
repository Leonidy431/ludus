<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 140" role="img" aria-label="Преподобная Кассия, игумения и песнописица">
  <title>Кассия песнописица</title>
  <desc>Преподобная Кассия (Кассиани), константинопольская игумения IX века, отвергнутая невеста императора Феофила, избравшая монастырь и слово. Перо и раскрытый свиток стихир — её песнопение «Господи, яже во многия грехи впадшая жена», которое поётся в Великую Среду; сосуд мира у свитка — та самая жена-грешница, омывшая ноги Христу. Смысл: учёность (Erudition), ставшая молитвой церкви, и вера (Faith), превращающая покаяние в песнь. Без нимба: игровой образ — не икона; нимб принадлежит иконе, поэтому святость здесь явлена атрибутами.</desc>
  <!-- Арт-канон §9.0: умбра+золото, картуш, без нимбов; святость — в атрибутах -->
  <rect width="100" height="140" fill="#1a0e04"/>
  <rect x="5" y="5" width="90" height="130" fill="none" stroke="#8a6a34" stroke-width="1.5"/>
  <!-- монашеское покрывало игумении, облегающее голову и плечи -->
  <path d="M50 18 C37 18 35 32 37 46 C31 54 28 80 29 118 H71 C72 80 69 54 63 46 C65 32 63 18 50 18 Z" fill="#2a1808" stroke="#c8a56a" stroke-width="2"/>
  <!-- апостольник: светлая кайма вокруг лика -->
  <path d="M41 30 Q41 22 50 22 Q59 22 59 30 Q60 44 50 47 Q40 44 41 30 Z" fill="none" stroke="#8a6a34" stroke-width="1.5"/>
  <!-- кроткий лик -->
  <circle cx="50" cy="34" r="9" fill="#1a0e04" stroke="#c8a56a" stroke-width="2"/>
  <!-- игуменский посох-жезл за плечом -->
  <path d="M74 118 V40 M70 44 Q74 36 78 44" fill="none" stroke="#8a6a34" stroke-width="2"/>
  <!-- складки мантии -->
  <path d="M37 46 Q44 62 42 118 M63 46 Q56 62 58 118" fill="none" stroke="#8a6a34" stroke-width="1.2"/>
  <!-- раскрытый свиток стихир с крюковыми знаками -->
  <path d="M30 74 H62 V100 H30 Z" fill="#1a0e04" stroke="#e8c87a" stroke-width="1.6"/>
  <path d="M28 72 h4 v30 h-4 Z M60 72 h4 v30 h-4 Z" fill="#8a6a34"/>
  <g stroke="#c8a56a" stroke-width="1">
    <path d="M35 79 h22 M35 86 h22 M35 93 h16"/>
  </g>
  <!-- крюки знаменного распева над строками: слово, ставшее пением -->
  <g fill="#e8c87a">
    <path d="M37 76 l2 1.5 -2 1.5 Z M44 76 l2 1.5 -2 1.5 Z M51 76 l2 1.5 -2 1.5 Z"/>
    <path d="M38 83 l2 1.5 -2 1.5 Z M47 83 l2 1.5 -2 1.5 Z M54 83 l2 1.5 -2 1.5 Z"/>
    <path d="M40 90 l2 1.5 -2 1.5 Z M48 90 l2 1.5 -2 1.5 Z"/>
  </g>
  <!-- тростниковое перо в деснице, касающееся свитка -->
  <path d="M68 60 L52 95" stroke="#e8c87a" stroke-width="1.6"/>
  <path d="M68 60 q4 -6 2 -10 q-5 3 -4 9 Z" fill="#c8a56a" stroke="#8a6a34" stroke-width=".8"/>
  <circle cx="60" cy="78" r="3" fill="#2a1808" stroke="#c8a56a" stroke-width="1.5"/>
  <!-- алавастровый сосуд жены-мироносицы у подножия -->
  <path d="M40 106 h8 v2 h-2 q3 2 3 7 q0 6 -5 7 q-5 -1 -5 -7 q0 -5 3 -7 h-2 Z" fill="#1a0e04" stroke="#e8c87a" stroke-width="1.3"/>
  <!-- благоухание — слёзы покаяния, ставшие миром -->
  <path d="M42 102 q-2 -3 1 -6 M47 102 q2 -3 -1 -6" fill="none" stroke="#c8a56a" stroke-width="1" stroke-dasharray="2 2"/>
</svg>
