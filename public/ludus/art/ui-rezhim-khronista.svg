<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Угловой орнамент рамки режима хрониста">
  <title>Угол рамки режима хрониста</title>
  <desc>Форма: двойная угловая рамка с пером и свитком, по стороне — погодные засечки, как поля летописи. Действие: обозначает режим хрониста, в котором игрок смотрит на события миссии как летописец, а не как участник. Цель: свидетельствовать правдиво, без суда и без украшений. Ставится в левый верхний угол панели; остальные углы получаются поворотом. Миссия: 92 Режим историка.</desc>
  <!-- двойная угловая рамка -->
  <path d="M4 60 V14 Q4 4 14 4 H60" fill="none" stroke="#8a6a34" stroke-width="2"/>
  <path d="M10 60 V18 Q10 10 18 10 H60" fill="none" stroke="#c8a56a" stroke-width="1" opacity=".55"/>
  <!-- свиток, свёрнутый в углу -->
  <g fill="#2a1808" stroke="#e8c87a" stroke-width="1.5">
    <path d="M16 18 H30 V28 H16 Z"/>
    <ellipse cx="16" cy="23" rx="3" ry="5"/>
  </g>
  <g stroke="#c8a56a" stroke-width=".9"><path d="M20 21 H28 M20 24 H28"/></g>
  <!-- перо по диагонали -->
  <path d="M20 36 L36 16" stroke="#e8c87a" stroke-width="1.3"/>
  <path d="M36 16 Q34 26 26 30 Q30 22 36 16 Z" fill="#c8a56a" stroke="#8a6a34" stroke-width=".7"/>
  <!-- погодные засечки вдоль сторон -->
  <g stroke="#c8a56a" stroke-width="1.2" stroke-linecap="round">
    <path d="M40 14 V18 M46 14 V17 M52 14 V18"/><path d="M14 40 H18 M14 46 H17 M14 52 H18"/>
  </g>
  <!-- киноварная точка — отметка года -->
  <circle cx="58" cy="16" r="1.8" fill="#c0392b"/>
  <circle cx="16" cy="58" r="1.8" fill="#c8a56a"/>
</svg>
