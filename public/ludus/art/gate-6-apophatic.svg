<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="Врата знания VI — Апофатическое: божественный мрак, порог Мудрости 14">
  <title>Врата VI: Апофатическое</title>
  <desc>Тёмное облако, внутри которого почти ничего нет — лишь едва заметная искра. Смысл: Моисей входит во мрак, где Бог, — выше всякого образа и слова; последнее знание есть молчание, и потому этот знак почти пуст. Четырнадцать точек внизу — порог Мудрости 14.</desc>
  <!-- Арт-канон §9.0: умбра+золото, картуш-рамка. Врата знания, уровень 6 из 6:
       предельная строгость — только контур облака и одна искра. -->
  <rect x="2" y="2" width="92" height="92" rx="10" fill="#140a02" stroke="#8a6a34" stroke-width="2"/>
  <rect x="7" y="7" width="82" height="82" rx="7" fill="none" stroke="#c8a56a" stroke-width="1" opacity=".4"/>
  <!-- облако божественного мрака -->
  <path d="M22 60 Q12 60 14 50 Q16 40 28 42 Q28 26 44 26 Q56 24 60 36 Q72 30 78 42 Q86 48 80 58 Q76 62 68 60 Z" fill="#1a0e04" stroke="#8a6a34" stroke-width="1.6"/>
  <!-- едва заметная искра внутри мрака -->
  <circle cx="48" cy="46" r="1.2" fill="#e8c87a" opacity=".6"/>
  <!-- порог Мудрости: 14 точек -->
  <g fill="#c8a56a"><circle cx="19.4" cy="83" r="1.5"/><circle cx="23.8" cy="83" r="1.5"/><circle cx="28.2" cy="83" r="1.5"/><circle cx="32.6" cy="83" r="1.5"/><circle cx="37" cy="83" r="1.5"/><circle cx="41.4" cy="83" r="1.5"/><circle cx="45.8" cy="83" r="1.5"/><circle cx="50.2" cy="83" r="1.5"/><circle cx="54.6" cy="83" r="1.5"/><circle cx="59" cy="83" r="1.5"/><circle cx="63.4" cy="83" r="1.5"/><circle cx="67.8" cy="83" r="1.5"/><circle cx="72.2" cy="83" r="1.5"/><circle cx="76.6" cy="83" r="1.5"/></g>
</svg>
