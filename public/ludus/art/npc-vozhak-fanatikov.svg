<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 140" role="img" aria-label="Вожак фанатиков — суровый человек с опущенным факелом">
  <title>Вожак фанатиков</title>
  <desc>ФОРМА: человек, а не демон: худое суровое лицо, сжатые губы, простой плащ, красный кушак гнева, в руке опущенный факел, другая рука поднята в призыве. Знаков чьей-либо веры нет: страсть гнева не принадлежит народу. ДЕЙСТВИЕ: дьякон удерживает его словом и кротостью, не отвечая насилием. ЦЕЛЬ: распознать гнев под видом ревности и увидеть в противнике душу. Миссия: 98 Конфликт с фанатиками.</desc>
  <!-- Арт-канон §9.0: умбра+золото, без нимбов. Рисовано вручную: сырьё 99 репо не подходит (правило 0.15). -->
  <rect width="100" height="140" fill="#1a0e04"/>
  <rect x="5" y="5" width="90" height="130" fill="none" stroke="#8a6a34" stroke-width="1.5"/>
  <circle cx="50" cy="36" r="11" fill="#2a1808" stroke="#c8a56a" stroke-width="2"/>
  <!-- простой капюшон -->
  <path d="M37 42 Q34 20 50 18 Q66 20 63 42 Q60 28 50 27 Q40 28 37 42 Z" fill="#241405" stroke="#c8a56a" stroke-width="1.5"/>
  <!-- сдвинутые брови и сжатые губы: человек в гневе -->
  <path d="M43 34 L48 36 M57 34 L52 36" stroke="#e8c87a" stroke-width="1.4"/>
  <path d="M45 38 h3 M52 38 h3" stroke="#c8a56a" stroke-width="1.2"/>
  <path d="M46 43 H54" stroke="#c8a56a" stroke-width="1.4"/>
  <path d="M42 44 Q50 52 58 44" fill="none" stroke="#8a6a34" stroke-width="1.5"/>
  <path d="M50 48 C31 54 27 80 29 118 H71 C73 80 69 54 50 48 Z" fill="#2a1808" stroke="#c8a56a" stroke-width="2"/>
  <!-- красный кушак — страсть гнева -->
  <path d="M31 84 H69" stroke="#c0392b" stroke-width="3.5"/>
  <path d="M60 84 L64 98 M62 84 L68 96" stroke="#c0392b" stroke-width="2"/>
  <!-- поднятая рука призыва -->
  <path d="M36 60 Q26 46 24 30" fill="none" stroke="#c8a56a" stroke-width="2.2"/>
  <path d="M21 30 V24 M24 29 V22 M27 30 V24" stroke="#c8a56a" stroke-width="1.6"/>
  <!-- опущенный факел: огонь ещё не брошен -->
  <path d="M64 62 Q70 74 72 84" fill="none" stroke="#c8a56a" stroke-width="2.2"/>
  <path d="M70 80 L80 116" stroke="#8a6a34" stroke-width="2.5"/>
  <path d="M80 116 Q86 122 82 130 Q79 124 76 128 Q74 120 80 116 Z" fill="#e8c87a" stroke="#c0392b" stroke-width="1"/>
</svg>
