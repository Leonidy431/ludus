<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="Зерновая яма в разрезе под каменной крышкой">
  <title>Зерновая яма</title>
  <desc>ФОРМА: грушевидная яма в разрезе грунта, обмазанная обожжённой глиной, до половины засыпана зерном, сверху каменная крышка с глиняной замазкой, над землёй колос. ДЕЙСТВИЕ: игрок устраивает сухое хранение урожая, сберегая зерно на голодный год. ЦЕЛЬ: предусмотрительность Иосифа (Быт. 41) — запас как забота о многих. Миссия: 75 Системы хранения зерна.</desc>
  <!-- Арт-канон §9.0: умбра+золото, без нимбов. Рисовано вручную: сырьё 99 репо не подходит (правило 0.15). -->
  <defs>
    <radialGradient id="zernovaya-yama-bg" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#3a2410"/>
      <stop offset="100%" stop-color="#1a0e04"/>
    </radialGradient>
  </defs>
  <rect x="2" y="2" width="92" height="92" rx="10" fill="url(#zernovaya-yama-bg)" stroke="#8a6a34" stroke-width="2"/>
  <rect x="7" y="7" width="82" height="82" rx="7" fill="none" stroke="#c8a56a" stroke-width="1" opacity=".55"/>
  <!-- грунт в разрезе -->
  <path d="M8 34 H88 V80 Q88 88 80 88 H16 Q8 88 8 80 Z" fill="#2a1808"/>
  <path d="M8 34 H88" stroke="#c8a56a" stroke-width="1.6"/>
  <g stroke="#8a6a34" stroke-width=".9" stroke-dasharray="4 3" opacity=".7"><path d="M10 48 H26 M70 48 H86 M10 62 H22 M74 62 H86 M10 76 H24 M72 76 H86"/></g>
  <!-- яма, обмазанная глиной -->
  <path d="M42 34 V39 Q24 46 26 64 Q28 82 48 82 Q68 82 70 64 Q72 46 54 39 V34 Z" fill="#1a0e04" stroke="#c8a56a" stroke-width="1.8"/>
  <path d="M44 40 Q28 47 30 64 Q32 78 48 78 Q64 78 66 64 Q68 47 52 40" fill="none" stroke="#8a6a34" stroke-width="1.2"/>
  <!-- зерно -->
  <path d="M31 56 Q48 51 65 56 Q67 66 63 72 Q57 78 48 78 Q39 78 33 72 Q29 66 31 56 Z" fill="#c8a56a"/>
  <g fill="#8a6a34"><circle cx="40" cy="60" r="1"/><circle cx="48" cy="58" r="1"/><circle cx="56" cy="61" r="1"/><circle cx="44" cy="67" r="1"/><circle cx="53" cy="68" r="1"/><circle cx="48" cy="73" r="1"/></g>
  <!-- каменная крышка с замазкой -->
  <rect x="35" y="29" width="26" height="6" rx="2" fill="#8a6a34" stroke="#e8c87a" stroke-width="1.3"/>
  <!-- колос над землёй -->
  <path d="M20 34 Q18 22 22 14" fill="none" stroke="#8a6a34" stroke-width="1.3"/>
  <g fill="#e8c87a"><ellipse cx="22" cy="16" rx="1.6" ry="2.6"/><ellipse cx="19.5" cy="20" rx="1.6" ry="2.6"/><ellipse cx="23" cy="21" rx="1.6" ry="2.6"/></g>
</svg>
