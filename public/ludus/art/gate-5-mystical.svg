<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="Врата знания V — Мистическое: Фаворский свет, порог Мудрости 12">
  <title>Врата V: Мистическое</title>
  <desc>Вершина Фавора и над ней мандорла нетварного света — три концентрических круга и расходящиеся лучи, без фигур. Смысл: теория, видение Бога — свет Преображения не создан и не изображается ликом, его можно лишь указать. Двенадцать точек внизу — порог Мудрости 12.</desc>
  <!-- Арт-канон §9.0: умбра+золото, картуш-рамка. Врата знания, уровень 5 из 6:
       только гора и свет, фигуры убраны — строгость почти предельная. -->
  <rect x="2" y="2" width="92" height="92" rx="10" fill="#1a0e04" stroke="#8a6a34" stroke-width="2"/>
  <rect x="7" y="7" width="82" height="82" rx="7" fill="none" stroke="#c8a56a" stroke-width="1" opacity=".55"/>
  <!-- мандорла: три круга нетварного света -->
  <circle cx="48" cy="36" r="22" fill="#e8c87a" opacity=".06" stroke="#8a6a34" stroke-width="1"/>
  <circle cx="48" cy="36" r="15" fill="#e8c87a" opacity=".1" stroke="#c8a56a" stroke-width="1"/>
  <circle cx="48" cy="36" r="8" fill="#e8c87a" opacity=".9"/>
  <!-- три луча вниз, к горе -->
  <path d="M48 44 L40 64 M48 44 L48 64 M48 44 L56 64" stroke="#e8c87a" stroke-width="1.5" opacity=".7"/>
  <!-- вершина Фавора -->
  <path d="M14 76 L36 58 L44 64 L52 56 L82 76 Z" fill="#2a1808" stroke="#c8a56a" stroke-width="1.6"/>
  <!-- порог Мудрости: 12 точек -->
  <g fill="#e8c87a"><circle cx="23.8" cy="83" r="1.5"/><circle cx="28.2" cy="83" r="1.5"/><circle cx="32.6" cy="83" r="1.5"/><circle cx="37" cy="83" r="1.5"/><circle cx="41.4" cy="83" r="1.5"/><circle cx="45.8" cy="83" r="1.5"/><circle cx="50.2" cy="83" r="1.5"/><circle cx="54.6" cy="83" r="1.5"/><circle cx="59" cy="83" r="1.5"/><circle cx="63.4" cy="83" r="1.5"/><circle cx="67.8" cy="83" r="1.5"/><circle cx="72.2" cy="83" r="1.5"/></g>
</svg>
