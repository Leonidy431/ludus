<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="Раскрытая тетрадь житий с киноварным инициалом">
  <title>Тетрадь синаксаря</title>
  <desc>ФОРМА: раскрытая сшитая тетрадь, строки записей, киноварный инициал, закладка и калам. ДЕЙСТВИЕ: дьякон записывает, что видел и слышал о подвижниках Иссык-Куля, отделяя свидетельство от слуха. ЦЕЛЬ: жития пишутся по правде, а не в угоду легенде (Эрудиция по традиции Синаксаря). Миссия: 22 Миссионерская легенда.</desc>
  <!-- Арт-канон §9.0: умбра+золото, без нимбов. Рисовано вручную: сырьё 99 репо не подходит (правило 0.15). -->
  <defs>
    <radialGradient id="sinaksar-tetrad-bg" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#3a2410"/>
      <stop offset="100%" stop-color="#1a0e04"/>
    </radialGradient>
  </defs>
  <rect x="2" y="2" width="92" height="92" rx="10" fill="url(#sinaksar-tetrad-bg)" stroke="#8a6a34" stroke-width="2"/>
  <rect x="7" y="7" width="82" height="82" rx="7" fill="none" stroke="#c8a56a" stroke-width="1" opacity=".55"/>
  <!-- кожаная обложка -->
  <path d="M13 29 Q31 24 48 30 Q65 24 83 29 V76 Q65 71 48 77 Q31 71 13 76 Z" fill="#2a1808" stroke="#8a6a34" stroke-width="1.4"/>
  <!-- листы -->
  <path d="M16 30 Q32 26 48 32 Q64 26 80 30 V72 Q64 68 48 74 Q32 68 16 72 Z" fill="#e8d9b8" stroke="#8a6a34" stroke-width="1.4"/>
  <path d="M48 32 V74" stroke="#8a6a34" stroke-width="1.5"/>
  <path d="M48 36 V70" stroke="#2a1808" stroke-width="1" stroke-dasharray="2 3"/>
  <!-- киноварный инициал и строки -->
  <rect x="21" y="35" width="5" height="6" fill="#c0392b"/>
  <g stroke="#8a6a34" stroke-width="1">
    <path d="M28 38 Q35 36.5 43 38.5 M21 45 Q32 42.5 43 45 M21 51 Q32 48.5 43 51 M21 57 Q32 54.5 43 57 M21 63 Q30 61 38 62.5"/>
    <path d="M53 38.5 Q64 36 75 37 M53 45 Q64 42.5 75 43.5 M53 51 Q64 48.5 75 49.5 M53 57 Q64 54.5 75 55.5"/>
  </g>
  <!-- малый крест-заставка -->
  <path d="M64 61 v6 M61 63.5 h6" stroke="#8a6a34" stroke-width="1.3"/>
  <!-- закладка -->
  <path d="M58 30 V84" stroke="#c8a56a" stroke-width="2"/>
  <!-- калам -->
  <path d="M70 84 L86 64" stroke="#e8c87a" stroke-width="2" stroke-linecap="round"/>
</svg>
