<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="Ярлык хана — грамота с тамгой и красной печатью">
  <!-- Арт-канон §9.0: умбра+золото. Объект каталога: ярлык — ханская
       грамота-разрешение (выдаётся после уплаты ясака). Проход №51;
       задел под реестр VR п.93 (3D-объект ярлыка в сцене после ясака):
       2D-эталон формы/палитры для будущего glb-объекта. -->
  <defs>
    <linearGradient id="yar-fon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a1808"/>
      <stop offset="100%" stop-color="#1a0e04"/>
    </linearGradient>
  </defs>
  <rect width="96" height="96" rx="10" fill="url(#yar-fon)"/>
  <rect x="3" y="3" width="90" height="90" rx="8" fill="none" stroke="#8a6a34" stroke-width="1.4" opacity=".8"/>
  <!-- Свиток-грамота с закрученными краями -->
  <g>
    <path d="M24 18 H72 Q76 18 76 22 V70 Q76 74 72 74 H24 Q20 74 20 70 V22 Q20 18 24 18 Z"
          fill="#e8d9b8"/>
    <path d="M20 22 Q16 22 16 26 V30 Q16 34 20 34 Z" fill="#c8a56a"/>
    <path d="M76 62 Q80 62 80 66 V70 Q80 74 76 74 Z" fill="#c8a56a"/>
    <!-- Строки уйгурского письма (вертикальные, как в канцелярии Орды) -->
    <g stroke="#3a2410" stroke-width="1.6" stroke-linecap="round" opacity=".85">
      <path d="M32 26 V52 M32 30 H35 M32 40 H36 M32 48 H34"/>
      <path d="M42 26 V56 M42 34 H45 M42 44 H46"/>
      <path d="M52 26 V48 M52 32 H55 M52 40 H54"/>
      <path d="M62 26 V54 M62 30 H65 M62 46 H66"/>
    </g>
  </g>
  <!-- Тамга хана золотом -->
  <g transform="translate(48,62)" stroke="#8a6a34" stroke-width="2" fill="none">
    <circle r="6"/>
    <path d="M0 -6 V-10 M-4 4 L-7 8 M4 4 L7 8"/>
  </g>
  <!-- Алая вислая печать на шнуре -->
  <path d="M70 70 Q74 76 72 82" stroke="#8a6a34" stroke-width="1.6" fill="none"/>
  <circle cx="72" cy="84" r="7" fill="#a33a2a"/>
  <circle cx="72" cy="84" r="4.2" fill="none" stroke="#e8c87a" stroke-width="1"/>
  <path d="M72 81 V87 M69 84 H75" stroke="#e8c87a" stroke-width="1"/>
  <!-- Отблеск -->
  <path d="M24 20 Q48 16 72 20" stroke="#fff3c0" stroke-width="1" opacity=".35" fill="none"/>
</svg>
