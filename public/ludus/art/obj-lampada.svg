<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="Лампада — непрерывная серия дней молитвы">
  <!-- Арт-канон §9.0: умбра+золото, картуш-рамка, без нимбов. Объект
       II-каталога: подвесная лампада с живым огоньком — иконка streak-серии
       «Задания дня» (проход №38): огонь, который не гаснет, пока дьякон
       приходит каждый день. -->
  <defs>
    <radialGradient id="lampada-bg" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#3a2410"/>
      <stop offset="100%" stop-color="#1a0e04"/>
    </radialGradient>
    <radialGradient id="lampada-flame" cx="50%" cy="70%" r="60%">
      <stop offset="0%" stop-color="#fff3c0"/>
      <stop offset="55%" stop-color="#e8c87a"/>
      <stop offset="100%" stop-color="#c8a56a"/>
    </radialGradient>
  </defs>
  <rect x="2" y="2" width="92" height="92" rx="10" fill="url(#lampada-bg)" stroke="#8a6a34" stroke-width="2"/>
  <rect x="7" y="7" width="82" height="82" rx="7" fill="none" stroke="#c8a56a" stroke-width="1" opacity=".55"/>
  <!-- Три цепочки подвеса -->
  <g stroke="#8a6a34" stroke-width="1.4" fill="none">
    <path d="M48 12 L48 30"/>
    <path d="M30 12 Q34 22 40 32"/>
    <path d="M66 12 Q62 22 56 32"/>
  </g>
  <circle cx="48" cy="12" r="2.6" fill="#c8a56a" stroke="#8a6a34" stroke-width=".8"/>
  <!-- Чаша лампады -->
  <path d="M32 36 L64 36 Q63 52 48 55 Q33 52 32 36 Z" fill="#c8a56a" stroke="#8a6a34" stroke-width="1.5"/>
  <ellipse cx="48" cy="36" rx="16" ry="4" fill="#2a1808" stroke="#8a6a34" stroke-width="1.2"/>
  <!-- Подвесной низ с каплей -->
  <path d="M48 55 L48 63" stroke="#8a6a34" stroke-width="1.6"/>
  <circle cx="48" cy="66" r="3" fill="#c8a56a" stroke="#8a6a34" stroke-width="1"/>
  <!-- Огонёк над чашей -->
  <path d="M48 22 Q52.5 29 50 33.5 Q49 35.5 48 36 Q47 35.5 46 33.5 Q43.5 29 48 22 Z"
        fill="url(#lampada-flame)" stroke="#8a6a34" stroke-width=".7"/>
  <!-- Мягкое свечение -->
  <circle cx="48" cy="30" r="12" fill="#e8c87a" opacity=".12"/>
</svg>
