<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 140" role="img" aria-label="Генуэзский купец, мирянин">
  <title>Генуэзский купец</title>
  <desc>ФОРМА: мирянин-купец из Генуи в красной шапочке и суконном кафтане с поясом, в руке счётная книга, у пояса кошель и печать. ДЕЙСТВИЕ: ведёт переговоры о союзе с армянскими торговыми домами; игрок проверяет честность уговора, а не веру собеседника. ЦЕЛЬ: правда в торговле — «мера верная и весы верные»; союз держится словом. Латинянин по вере — изображён уважительно, как человек, без обличения. Миссия: 7 «Армяно-генуэзский союз».</desc>
  <rect width="100" height="140" fill="#1a0e04"/>
  <rect x="5" y="5" width="90" height="130" fill="none" stroke="#8a6a34" stroke-width="1.5"/>
  <!-- Арт-канон §9.0: умбра+золото; человек, а не карикатура -->
  <!-- голова, бритое лицо, мягкая красная шапочка -->
  <circle cx="50" cy="36" r="11" fill="#2a1808" stroke="#c8a56a" stroke-width="2"/>
  <path d="M38 32 Q38 20 50 20 Q64 20 64 30 Q60 26 50 27 Q42 28 38 32 Z" fill="#c0392b" stroke="#c8a56a" stroke-width="1.2"/>
  <path d="M62 28 q6 2 6 10" fill="none" stroke="#c0392b" stroke-width="2"/>
  <!-- кафтан с поясом -->
  <path d="M50 48 C31 54 27 80 29 118 H71 C73 80 69 54 50 48 Z" fill="#2a1808" stroke="#c8a56a" stroke-width="2"/>
  <path d="M50 50 V118" stroke="#8a6a34" stroke-width="1.2"/>
  <path d="M31 84 H69" stroke="#e8c87a" stroke-width="2.5"/>
  <!-- счётная книга в руке -->
  <rect x="54" y="62" width="16" height="20" rx="1" fill="#1a0e04" stroke="#e8c87a" stroke-width="1.6"/>
  <g stroke="#8a6a34" stroke-width="1"><path d="M57 67 h10 M57 71 h10 M57 75 h7"/></g>
  <!-- кошель и печать на поясе -->
  <path d="M36 86 q-2 10 4 12 q6 -2 4 -12 Z" fill="#8a6a34" stroke="#c8a56a" stroke-width="1.2"/>
  <circle cx="60" cy="92" r="3" fill="#1a0e04" stroke="#e8c87a" stroke-width="1.4"/>
  <!-- корабль вдали: генуэзская торговля по морю -->
  <path d="M40 124 q10 5 20 0 l-2 4 h-16 Z" fill="#1a0e04" stroke="#e8c87a" stroke-width="1.1"/>
  <path d="M50 124 V112 l6 10 Z" fill="#e8c87a" opacity=".7"/>
</svg>
