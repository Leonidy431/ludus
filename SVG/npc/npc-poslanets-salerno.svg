<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 140" role="img" aria-label="Посланец из Салерно — мирянин-нотарий">
  <title>Посланец из Салерно</title>
  <desc>Форма: мирянин-нотарий в шапероне и котте, с чернильницей у пояса, пером и запечатанным ларчиком документов. Не святой, без нимба. Действие: привозит грамоту другой версии о мощах. Цель: игрок учится сличать свидетельства и искать истину без торга святыней. Миссия: 89 «Конфликт версий мощей».</desc>
  <!-- Арт-канон §9.0: умбра+золото, без нимбов. -->
  <rect width="100" height="140" fill="#1a0e04"/>
  <rect x="5" y="5" width="90" height="130" fill="none" stroke="#8a6a34" stroke-width="1.5"/>
  <!-- голова в шапероне со свисающим концом -->
  <circle cx="50" cy="36" r="11" fill="#2a1808" stroke="#c8a56a" stroke-width="2"/>
  <path d="M38 34 Q36 20 50 20 Q64 20 62 34 Q58 26 50 26 Q42 26 38 34 Z" fill="#8a6a34" stroke="#c8a56a" stroke-width="1.5"/>
  <path d="M62 30 Q70 36 68 52" fill="none" stroke="#8a6a34" stroke-width="3"/>
  <!-- котта нотария -->
<path d="M50 48 C31 54 27 80 29 118 H71 C73 80 69 54 50 48 Z" fill="#2a1808" stroke="#c8a56a" stroke-width="2"/>
  <path d="M34 84 H66" stroke="#c8a56a" stroke-width="2"/>
  <!-- чернильница и перо у пояса -->
  <rect x="38" y="86" width="6" height="7" fill="#1a0e04" stroke="#e8c87a" stroke-width="1.2"/>
  <path d="M42 86 L47 72" stroke="#e8c87a" stroke-width="1.2"/>
  <!-- запечатанный ларчик документов в руках -->
  <rect x="50" y="66" width="18" height="12" rx="1.5" fill="#1a0e04" stroke="#e8c87a" stroke-width="1.6"/>
  <path d="M50 70 h18" stroke="#c8a56a" stroke-width="1"/>
  <circle cx="59" cy="74" r="2" fill="#c0392b"/>
</svg>
