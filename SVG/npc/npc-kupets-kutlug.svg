<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 140" role="img" aria-label="Кутлуг, скотовод-должник, с расщеплённой биркой долга">
  <title>Кутлуг, скотовод-должник</title>
  <desc>Форма: купец в войлочной шапке, рука у груди, пустой кошель у пояса и расщеплённая бирка долга. Действие: прийти на суд общины и честно показать долг. Цель: суд, который видит человека за долгом, — милость и правда вместе. Миссия: 49 Судебная автономия.</desc>
  <rect width="100" height="140" fill="#1a0e04"/>
  <rect x="5" y="5" width="90" height="130" fill="none" stroke="#8a6a34" stroke-width="1.5"/>
  <!-- голова, войлочная шапка -->
  <circle cx="50" cy="38" r="11" fill="#2a1808" stroke="#c8a56a" stroke-width="2"/>
  <path d="M39 32 Q40 20 50 20 Q60 20 61 32 Z" fill="#8a6a34" stroke="#c8a56a" stroke-width="1.5"/>
  <path d="M38 32 H62" stroke="#e8c87a" stroke-width="1.5"/>
  <!-- озабоченные брови, короткая борода -->
  <path d="M44 35 L48 36 M56 35 L52 36" stroke="#c8a56a" stroke-width="1.2"/>
  <path d="M44 44 Q50 51 56 44" fill="none" stroke="#c8a56a" stroke-width="1.5"/>
  <!-- кафтан -->
  <path d="M50 50 C32 56 28 80 30 120 H70 C72 80 68 56 50 50 Z" fill="#2a1808" stroke="#c8a56a" stroke-width="2"/>
  <!-- рука у груди: жест признания -->
  <path d="M36 62 Q44 72 52 66" fill="none" stroke="#c8a56a" stroke-width="2.4" stroke-linecap="round"/>
  <!-- кушак -->
  <path d="M32 88 H68" stroke="#8a6a34" stroke-width="3"/>
  <!-- пустой кошель, вывернутый -->
  <path d="M60 90 Q66 100 62 106 Q56 108 54 100 Z" fill="#1a0e04" stroke="#c8a56a" stroke-width="1.4"/>
  <!-- бирка долга: палочка с зарубками, расщеплённая надвое -->
  <g stroke="#e8c87a" stroke-width="2"><path d="M26 70 L22 100"/><path d="M29 71 L26 99"/></g>
  <g stroke="#1a0e04" stroke-width="1"><path d="M22 78 H29"/><path d="M21.5 84 H28.5"/><path d="M21 90 H28"/></g>
</svg>
