<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 140" role="img" aria-label="Бек кочевников — старейшина рода">
  <title>Бек кочевников</title>
  <desc>ФОРМА: пожилой старейшина рода в высокой войлочной шапке с меховой опушкой, в запашном халате с поясом, седая борода; в руках пиала гостеприимства, на поясе тамга рода. ДЕЙСТВИЕ: дьякон договаривается с ним о пастбищах, воде и проходе караванов, уважая обычай. ЦЕЛЬ: мир через честное посредничество, а не хитрость. Миссия: 8 Торговый медиатор.</desc>
  <!-- Арт-канон §9.0: умбра+золото, без нимбов. Рисовано вручную: сырьё 99 репо не подходит (правило 0.15). -->
  <rect width="100" height="140" fill="#1a0e04"/>
  <rect x="5" y="5" width="90" height="130" fill="none" stroke="#8a6a34" stroke-width="1.5"/>
  <circle cx="50" cy="36" r="11" fill="#2a1808" stroke="#c8a56a" stroke-width="2"/>
  <!-- высокая войлочная шапка с меховой опушкой -->
  <path d="M40 30 Q42 12 50 10 Q58 12 60 30 Z" fill="#8a6a34" stroke="#c8a56a" stroke-width="1.5"/>
  <path d="M38 31 Q50 25 62 31 Q50 35 38 31 Z" fill="#c8a56a" stroke="#e8c87a" stroke-width="1.2"/>
  <!-- спокойные глаза и седая борода старейшины -->
  <path d="M45 37 h3 M52 37 h3" stroke="#e8c87a" stroke-width="1.2"/>
  <path d="M42 42 Q50 60 58 42 Q54 48 50 48 Q46 48 42 42 Z" fill="#e8c87a" opacity=".85"/>
  <!-- запашной халат -->
  <path d="M50 50 C31 56 26 80 28 118 H72 C74 80 69 56 50 50 Z" fill="#2a1808" stroke="#c8a56a" stroke-width="2"/>
  <path d="M42 56 L60 100" stroke="#c8a56a" stroke-width="2"/>
  <path d="M28 118 H72" stroke="#8a6a34" stroke-width="4"/>
  <!-- пояс с тамгой рода -->
  <path d="M31 88 H69" stroke="#8a6a34" stroke-width="3"/>
  <circle cx="62" cy="88" r="3.5" fill="#1a0e04" stroke="#e8c87a" stroke-width="1.3"/>
  <path d="M62 85.5 V90.5 M60 88 H64" stroke="#e8c87a" stroke-width="1"/>
  <!-- руки с пиалой гостеприимства -->
  <path d="M34 66 Q38 76 44 76 M66 66 Q62 76 56 76" fill="none" stroke="#c8a56a" stroke-width="2"/>
  <path d="M42 74 H58 Q57 81 50 82 Q43 81 42 74 Z" fill="#c8a56a" stroke="#8a6a34" stroke-width="1.2"/>
  <path d="M47 70 q1 -3 0 -5 M53 70 q1 -3 0 -5" fill="none" stroke="#e8c87a" stroke-width=".9" opacity=".7"/>
  <!-- плеть пастуха за поясом, опущенная -->
  <path d="M36 90 L32 116" stroke="#8a6a34" stroke-width="2"/>
</svg>
