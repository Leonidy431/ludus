<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 140" role="img" aria-label="Второй купец-истец с весами и расписками">
  <title>Купец-истец (второй)</title>
  <desc>Второй из двух купцов-истцов: торговец пряностями в чалме, с седой бородой, держит ручные весы и связку расписок. Нарисован уважительно: человек в споре, а не злодей. Парная фигура — npc-kupets-a. ФОРМА: право и обида. ДЕЙСТВИЕ: епископский суд выслушивает обе стороны и сверяет вес с договором. ЦЕЛЬ: примирение выше выигрыша (Втор. 16:18-20). Миссия: 3 Епископ-арбитр.</desc>
  <!-- Арт-канон §9.0: умбра+золото, без нимбов. Рисовано вручную: пара к npc-kupets-a. -->
  <rect width="100" height="140" fill="#1a0e04"/>
  <rect x="5" y="5" width="90" height="130" fill="none" stroke="#8a6a34" stroke-width="1.5"/>
  <!-- голова и чалма -->
  <circle cx="50" cy="37" r="11" fill="#2a1808" stroke="#c8a56a" stroke-width="2"/>
  <path d="M38 32 Q39 19 50 19 Q61 19 62 32 Q56 27 50 28 Q44 27 38 32 Z" fill="#c8a56a" stroke="#8a6a34" stroke-width="1.3"/>
  <path d="M40 26 Q50 31 60 26" stroke="#8a6a34" stroke-width="1" fill="none"/>
  <!-- седая борода -->
  <path d="M42 42 Q44 57 50 58 Q56 57 58 42 Q54 48 50 48 Q46 48 42 42 Z" fill="#e8c87a"/>
  <!-- халат с поясом -->
  <path d="M50 50 C32 56 28 82 30 118 H70 C72 82 68 56 50 50 Z" fill="#2a1808" stroke="#c8a56a" stroke-width="2"/>
  <path d="M42 56 L58 118" stroke="#8a6a34" stroke-width="1.4"/>
  <path d="M32 88 H68" stroke="#c0392b" stroke-width="2.4"/>
  <!-- ручные весы: коромысло и две чаши -->
  <path d="M66 58 V66 M56 66 H78" stroke="#e8c87a" stroke-width="1.6"/>
  <path d="M56 66 L53 74 H59 Z M78 66 L75 74 H81 Z" fill="none" stroke="#e8c87a" stroke-width="1.2"/>
  <path d="M52 74 Q56 78 60 74 M74 74 Q78 78 82 74" fill="#c8a56a" stroke="#c8a56a" stroke-width="1.2"/>
  <!-- связка расписок -->
  <path d="M20 70 L36 68 L37 84 L21 86 Z" fill="#e8d9b8" stroke="#8a6a34" stroke-width="1.2"/>
  <path d="M23 74 L34 72.5 M23 78 L34 76.5" stroke="#8a6a34" stroke-width="0.9"/>
  <path d="M19 78 H38" stroke="#c0392b" stroke-width="1.4"/>
</svg>
