<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 140" role="img" aria-label="Сомневающийся паломник с посохом">
  <title>Сомневающийся паломник</title>
  <desc>ФОРМА: паломник в дорожном плаще с посохом и сумой, в раздумье касается подбородка; у ног тропа расходится надвое. ДЕЙСТВИЕ: он спрашивает, может ли малая частица святыни быть свидетельством целого; игрок отвечает беседой, а не доказательством силой. ЦЕЛЬ: сомнение как начало вопрошания, которое ведёт к вере (Фома), а не к насмешке. Миссия: 20 «Pars pro toto».</desc>
  <rect width="100" height="140" fill="#1a0e04"/>
  <rect x="5" y="5" width="90" height="130" fill="none" stroke="#8a6a34" stroke-width="1.5"/>
  <!-- Арт-канон §9.0: умбра+золото; человек, а не карикатура -->
  <!-- голова в капюшоне -->
  <circle cx="48" cy="36" r="10" fill="#2a1808" stroke="#c8a56a" stroke-width="2"/>
  <path d="M36 42 Q34 22 48 22 Q62 22 60 42" fill="none" stroke="#8a6a34" stroke-width="2.5"/>
  <path d="M42 44 Q48 50 54 44" fill="none" stroke="#c8a56a" stroke-width="1.5"/>
  <!-- дорожный плащ -->
  <path d="M48 48 C30 54 26 80 28 116 H68 C70 80 66 54 48 48 Z" fill="#2a1808" stroke="#c8a56a" stroke-width="2"/>
  <!-- рука у подбородка — раздумье -->
  <path d="M40 72 Q40 56 48 48" fill="none" stroke="#c8a56a" stroke-width="3" stroke-linecap="round"/>
  <!-- сума через плечо -->
  <path d="M60 54 L38 90" stroke="#8a6a34" stroke-width="2"/>
  <path d="M30 88 h14 v10 q-7 4 -14 0 Z" fill="#8a6a34" stroke="#c8a56a" stroke-width="1.2"/>
  <!-- посох с раковиной-ковшом паломника -->
  <path d="M74 118 V30" stroke="#8a6a34" stroke-width="2.2"/>
  <path d="M70 36 q4 -6 8 0 q-4 3 -8 0 Z" fill="#e8c87a"/>
  <!-- тропа расходится надвое -->
  <path d="M48 132 V124 M48 124 Q40 120 22 118 M48 124 Q58 120 78 118" fill="none" stroke="#e8c87a" stroke-width="1.4" stroke-dasharray="2 2"/>
</svg>
