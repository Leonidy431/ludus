<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 140" role="img" aria-label="Заезжий торговец «реликвиями» — образ прелести">
  <title>Торговец «реликвиями»</title>
  <desc>ФОРМА: заезжий торговец с лотком ярко блестящих ларчиков и приветливой улыбкой; блеск слишком ярок, печати на ларчиках нет. ДЕЙСТВИЕ: предлагает купить «святыню»; игрок распознаёт подмену по трезвению — нет свидетельства, нет благословения, есть цена. ЦЕЛЬ: прелесть выглядит как награда (правило 33, ТАБУ 0.2 п. 8); святыня не продаётся (Деян. 8:20). Это человек, впавший в сребролюбие, а не демон и не чужой народ. Миссия: 14 «Рынок реликвий».</desc>
  <rect width="100" height="140" fill="#1a0e04"/>
  <rect x="5" y="5" width="90" height="130" fill="none" stroke="#8a6a34" stroke-width="1.5"/>
  <!-- Арт-канон §9.0: умбра+золото; человек, а не карикатура -->
  <!-- голова, дорожная шапка -->
  <circle cx="50" cy="34" r="10" fill="#2a1808" stroke="#c8a56a" stroke-width="2"/>
  <path d="M40 30 Q50 18 60 30 Z" fill="#8a6a34" stroke="#c8a56a" stroke-width="1.2"/>
  <!-- приветливая улыбка -->
  <path d="M45 38 Q50 42 55 38" fill="none" stroke="#e8c87a" stroke-width="1.2"/>
  <!-- пёстрый халат -->
  <path d="M50 46 C31 52 27 80 29 118 H71 C73 80 69 52 50 46 Z" fill="#2a1808" stroke="#c8a56a" stroke-width="2"/>
  <path d="M40 60 L44 118 M60 60 L56 118" stroke="#8a6a34" stroke-width="1.2"/>
  <!-- ремень лотка на шее -->
  <path d="M40 50 L26 80 M60 50 L74 80" stroke="#8a6a34" stroke-width="1.6"/>
  <!-- лоток с «чудными» ларчиками -->
  <path d="M22 80 H78 L74 90 H26 Z" fill="#1a0e04" stroke="#c8a56a" stroke-width="1.6"/>
  <g fill="#e8c87a" stroke="#c8a56a" stroke-width=".8">
    <rect x="30" y="72" width="10" height="8"/><rect x="45" y="70" width="10" height="10"/><rect x="60" y="72" width="10" height="8"/>
  </g>
  <!-- обманчивый блеск: слишком яркий -->
  <g fill="#fff3c0">
    <path d="M50 57 l1.5 4.5 l4.5 1.5 l-4.5 1.5 l-1.5 4.5 l-1.5 -4.5 l-4.5 -1.5 l4.5 -1.5 Z"/>
    <path d="M35 63 l1 3 l3 1 l-3 1 l-1 3 l-1 -3 l-3 -1 l3 -1 Z"/>
    <path d="M65 63 l1 3 l3 1 l-3 1 l-1 3 l-1 -3 l-3 -1 l3 -1 Z"/>
  </g>
  <!-- пустое место для печати: свидетельства нет -->
  <circle cx="50" cy="85" r="2.5" fill="none" stroke="#c0392b" stroke-width="1" stroke-dasharray="1.5 1.5"/>
  <!-- перстни на руках -->
  <circle cx="24" cy="84" r="2" fill="#e8c87a"/><circle cx="76" cy="84" r="2" fill="#e8c87a"/>
</svg>
