<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 140" role="img" aria-label="Голодный послушник-кладовщик с ключами и хлебом">
  <title>Послушник-кладовщик</title>
  <desc>Молодой послушник, кладовщик обители: худое лицо с впалыми щеками, подрясник, связка ключей от амбара, за спиной припрятан хлеб, у ног мешок. Не злодей, а голодный человек в искушении. ФОРМА: доступ к общему и голод. ДЕЙСТВИЕ: игрок замечает недостачу и решает — наказать или понять причину и исправить устройство кладовой. ЦЕЛЬ: милость и честная экономика обители; страсть чревоугодия побеждается рассуждением, не позором. Миссия: 11 «Миссионер-экономист».</desc>
  <rect width="100" height="140" fill="#1a0e04"/>
  <rect x="5" y="5" width="90" height="130" fill="none" stroke="#8a6a34" stroke-width="1.5"/>
  <!-- скуфья -->
  <path d="M41 28 Q42 20 50 20 Q58 20 59 28 Z" fill="#2a1808" stroke="#c8a56a" stroke-width="1.5"/>
  <!-- худое лицо, впалые щёки -->
  <ellipse cx="50" cy="37" rx="7.5" ry="10" fill="#1a0e04" stroke="#c8a56a" stroke-width="2"/>
  <path d="M45 40 Q46 44 47 45 M55 40 Q54 44 53 45" fill="none" stroke="#8a6a34" stroke-width="1"/>
  <path d="M46 35 h2 M52 35 h2" stroke="#c8a56a" stroke-width="1"/>
  <!-- юношеская бородка -->
  <path d="M46 45 Q50 49 54 45" fill="none" stroke="#c8a56a" stroke-width="1.2" opacity=".8"/>
  <!-- узкий подрясник -->
  <path d="M50 48 C36 54 33 80 35 120 H65 C67 80 64 54 50 48 Z" fill="#2a1808" stroke="#c8a56a" stroke-width="2"/>
  <path d="M38 78 H62" stroke="#8a6a34" stroke-width="2"/>
  <!-- связка ключей на поясе -->
  <circle cx="42" cy="84" r="3.5" fill="none" stroke="#e8c87a" stroke-width="1.5"/>
  <g stroke="#e8c87a" stroke-width="1.5">
    <path d="M40 87 V96 M40 93 h2 M40 96 h2"/>
    <path d="M44 87 V94 M44 92 h2"/>
  </g>
  <!-- припрятанный хлеб за спиной -->
  <ellipse cx="68" cy="88" rx="8" ry="5" fill="#8a6a34" stroke="#e8c87a" stroke-width="1.3"/>
  <path d="M64 86 l2 3 M68 85 l2 3" stroke="#1a0e04" stroke-width="1"/>
  <path d="M62 70 Q70 78 64 88" fill="none" stroke="#c8a56a" stroke-width="1.8"/>
  <!-- мешок зерна у ног -->
  <path d="M20 128 Q18 114 26 110 L24 106 H32 L30 110 Q38 114 36 128 Z" fill="#8a6a34" stroke="#c8a56a" stroke-width="1.3"/>
</svg>
