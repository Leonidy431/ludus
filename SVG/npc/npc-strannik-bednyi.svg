<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 140" role="img" aria-label="Бедный странник в латаной свитке с пустой чашей">
  <title>Бедный странник</title>
  <desc>Нищий странник: латаная свитка, босые ноги в обмотках, деревянная чаша в протянутой руке, ветхая сума через плечо. Нарисован с достоинством: образ Христа в меньшем брате (Мф. 25:40), а не жалкий статист. ФОРМА: нужда. ДЕЙСТВИЕ: игрок делится хлебом без условий; выбор не даёт очков, только тихий свет у ворот. ЦЕЛЬ: милостыня как дар, а не сделка. Миссия: 25.</desc>
  <!-- Арт-канон §9.0: умбра+золото, без нимбов. Рисовано вручную. -->
  <rect width="100" height="140" fill="#1a0e04"/>
  <rect x="5" y="5" width="90" height="130" fill="none" stroke="#8a6a34" stroke-width="1.5"/>
  <!-- голова, непокрытая, с растрёпанными волосами -->
  <circle cx="50" cy="38" r="10.5" fill="#2a1808" stroke="#c8a56a" stroke-width="2"/>
  <path d="M40 34 Q42 25 50 25 Q58 25 60 34 M42 30 L39 27 M58 30 L61 27" stroke="#8a6a34" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M44 44 Q50 52 56 44" stroke="#8a6a34" stroke-width="2" fill="none"/>
  <!-- латаная свитка -->
  <path d="M50 49 C35 55 32 82 34 116 H66 C68 82 65 55 50 49 Z" fill="#2a1808" stroke="#c8a56a" stroke-width="2"/>
  <rect x="38" y="78" width="9" height="8" fill="#8a6a34" stroke="#c8a56a" stroke-width="0.8"/>
  <rect x="54" y="96" width="8" height="7" fill="#8a6a34" stroke="#c8a56a" stroke-width="0.8"/>
  <path d="M36 92 H64" stroke="#8a6a34" stroke-width="1.6" stroke-dasharray="3 2"/>
  <!-- сума через плечо -->
  <path d="M42 52 L64 100" stroke="#8a6a34" stroke-width="2"/>
  <path d="M58 98 Q66 96 70 104 Q66 112 58 108 Z" fill="#8a6a34" stroke="#c8a56a" stroke-width="1.1"/>
  <!-- протянутая рука с пустой деревянной чашей -->
  <path d="M36 64 Q26 68 22 72" stroke="#c8a56a" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M14 72 H30 Q28 80 22 80 Q16 80 14 72 Z" fill="#8a6a34" stroke="#e8c87a" stroke-width="1.3"/>
  <!-- ноги в обмотках -->
  <path d="M42 116 V126 M58 116 V126" stroke="#c8a56a" stroke-width="3" stroke-linecap="round"/>
  <path d="M40 120 H44 M56 120 H60" stroke="#8a6a34" stroke-width="1.2"/>
</svg>
