<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 140" role="img" aria-label="Мастер-гончар из армянской диаспоры">
  <title>Гончар Ованес</title>
  <desc>Форма: армянский мастер-гончар в войлочной шапке, с короткой бородой, в фартуке, испачканном глиной; руки ведут сосуд на гончарном круге. Действие: терпеливо выводит стенку сосуда, начиная заново, если глина пошла вкось. Цель: образ Горшечника и глины (Иер. 18:4–6): ремесло учит смирению перед рукой Творца; мастер — человек своей общины, учит без проповеди. Миссия: 67 Керамические мастерские.</desc>
  <rect width="100" height="140" fill="#1a0e04"/>
  <rect x="5" y="5" width="90" height="130" fill="none" stroke="#8a6a34" stroke-width="1.5"/>
  <!-- Арт-канон §9.0: умбра+золото, картуш, без нимбов. Армянин диаспоры — уважительный портрет, без карикатуры. -->
  <!-- голова в войлочной шапке -->
  <circle cx="50" cy="34" r="11" fill="#2a1808" stroke="#c8a56a" stroke-width="2"/>
  <path d="M39 30 Q40 18 50 18 Q60 18 61 30 Z" fill="#8a6a34" stroke="#c8a56a" stroke-width="1.5"/>
  <!-- короткая борода -->
  <path d="M42 40 Q50 50 58 40 Q55 46 50 46 Q45 46 42 40 Z" fill="#c8a56a" opacity=".8"/>
  <!-- рубаха и фартук в глине -->
  <path d="M50 48 C31 54 27 80 29 118 H71 C73 80 69 54 50 48 Z" fill="#2a1808" stroke="#c8a56a" stroke-width="2"/>
  <path d="M38 64 H62 L66 116 H34 Z" fill="#8a6a34" stroke="#c8a56a" stroke-width="1.5"/>
  <g fill="#1a0e04" opacity=".5"><circle cx="44" cy="80" r="2"/><circle cx="56" cy="92" r="1.6"/><circle cx="48" cy="104" r="2.2"/></g>
  <!-- гончарный круг и сосуд -->
  <ellipse cx="50" cy="118" rx="20" ry="4" fill="#1a0e04" stroke="#e8c87a" stroke-width="1.6"/>
  <path d="M42 116 Q38 104 44 98 Q46 94 44 90 H56 Q54 94 56 98 Q62 104 58 116 Z" fill="#c8a56a" stroke="#e8c87a" stroke-width="1.6"/>
  <path d="M43 106 Q50 109 57 106" fill="none" stroke="#8a6a34" stroke-width="1"/>
  <!-- ладони на сосуде -->
  <g fill="#2a1808" stroke="#c8a56a" stroke-width="1.5"><ellipse cx="38" cy="102" rx="4" ry="6"/><ellipse cx="62" cy="102" rx="4" ry="6"/></g>
</svg>
