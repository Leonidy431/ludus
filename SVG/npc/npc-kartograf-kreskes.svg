<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 140" role="img" aria-label="Картограф майоркинской школы — собирательный образ">
  <title>Картограф майоркинской школы</title>
  <desc>ФОРМА: собирательный образ мастера карт с Майорки XIV века — учёная шапочка, плащ, циркуль-измеритель и портолан с розой ветров. ДЕЙСТВИЕ: сверяет рассказы купцов с картой, отмечает озеро и обитель на краю известного мира, отделяет слух от свидетельства. ЦЕЛЬ: смирение знания — наносить только проверенное. Миссия: 87 Картографы Крескесы.</desc>
  <rect width="100" height="140" fill="#1a0e04"/>
  <rect x="5" y="5" width="90" height="130" fill="none" stroke="#8a6a34" stroke-width="1.5"/>
  <!-- Арт-канон §9.0: умбра+золото. Собирательный образ учёного, без
       этнических черт-карикатур. -->
  <!-- голова, мягкая учёная шапочка -->
  <circle cx="50" cy="36" r="11" fill="#2a1808" stroke="#c8a56a" stroke-width="2"/>
  <path d="M38 32 Q38 22 50 22 Q62 22 62 32 Q50 27 38 32 Z" fill="#8a6a34" stroke="#c8a56a" stroke-width="1.5"/>
  <!-- ухоженная борода -->
  <path d="M43 42 Q50 54 57 42 Q54 48 50 48 Q46 48 43 42 Z" fill="#c8a56a" opacity=".75"/>
  <!-- плащ -->
  <path d="M50 48 C31 54 27 80 29 118 H71 C73 80 69 54 50 48 Z" fill="#2a1808" stroke="#c8a56a" stroke-width="2"/>
  <!-- портолан перед грудью -->
  <rect x="32" y="68" width="36" height="28" fill="#c8a56a" stroke="#8a6a34" stroke-width="1.5"/>
  <!-- роза ветров и румбы -->
  <g stroke="#8a6a34" stroke-width=".8">
    <path d="M44 82 L32 70 M44 82 L68 72 M44 82 L68 94 M44 82 L34 96 M44 82 H68 M44 82 V68"/>
  </g>
  <circle cx="44" cy="82" r="3" fill="#1a0e04" stroke="#8a6a34" stroke-width="1"/>
  <!-- береговая линия и озеро-метка -->
  <path d="M52 76 Q58 72 64 78 Q60 84 54 82" fill="none" stroke="#1a0e04" stroke-width="1.2"/>
  <circle cx="60" cy="90" r="2" fill="#1f5a73"/>
  <!-- циркуль-измеритель в руке -->
  <g stroke="#e8c87a" stroke-width="1.8" stroke-linecap="round">
    <path d="M70 58 L64 74 M70 58 L74 74"/>
  </g>
  <circle cx="70" cy="57" r="2" fill="#e8c87a"/>
</svg>
