<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 140" role="img" aria-label="Монах-печатник у типографского станка">
  <title>Печатник</title>
  <desc>Форма: монах в скуфье и подряснике с нарукавниками, держит свежий оттиск листа и кожаную набивную подушку для краски; за плечом винт печатного станка. Действие: набирает, выверяет и печатает книги, сверяя каждый лист с исправным списком. Цель: книга для многих без искажения: печатник служит точности слова, а не тиражу ради славы. Миссия: 79 Монастырская типография (позднее, вне хронологии XIV в.).</desc>
  <rect width="100" height="140" fill="#1a0e04"/>
  <rect x="5" y="5" width="90" height="130" fill="none" stroke="#8a6a34" stroke-width="1.5"/>
  <!-- Арт-канон §9.0: умбра+золото, картуш, без нимбов. Монах без нимба; сцена поздней эпохи, помечена как анахронизм. -->
  <!-- винт и рама станка за спиной -->
  <g stroke="#8a6a34" stroke-width="2" fill="none"><path d="M18 118 V20 H82 V118"/></g>
  <rect x="64" y="14" width="8" height="6" fill="#2a1808" stroke="#c8a56a" stroke-width="1.2"/>
  <path d="M68 16 L88 10" stroke="#e8c87a" stroke-width="2"/>
  <!-- голова в скуфье -->
  <circle cx="50" cy="37" r="10" fill="#2a1808" stroke="#c8a56a" stroke-width="2"/>
  <path d="M40 34 Q40 24 50 24 Q60 24 60 34 Z" fill="#1a0e04" stroke="#c8a56a" stroke-width="1.5"/>
  <path d="M43 42 Q50 52 57 42 Q54 48 50 48 Q46 48 43 42 Z" fill="#c8a56a" opacity=".75"/>
  <!-- подрясник с нарукавниками -->
  <path d="M50 48 C31 54 27 80 29 118 H71 C73 80 69 54 50 48 Z" fill="#2a1808" stroke="#c8a56a" stroke-width="2"/>
  <g fill="#8a6a34" stroke="#c8a56a" stroke-width="1"><rect x="30" y="84" width="8" height="10"/><rect x="62" y="84" width="8" height="10"/></g>
  <!-- свежий оттиск листа -->
  <rect x="36" y="70" width="24" height="30" fill="#e8d9b8" opacity=".85" stroke="#8a6a34" stroke-width="1.4"/>
  <rect x="39" y="73" width="5" height="5" fill="#c0392b"/>
  <g stroke="#2a1808" stroke-width="1"><path d="M46 75 H57 M39 81 H57 M39 85 H57 M39 89 H57 M39 93 H52"/></g>
  <!-- набивная подушка для краски -->
  <path d="M64 100 L70 112" stroke="#c8a56a" stroke-width="2"/>
  <ellipse cx="72" cy="116" rx="6" ry="4" fill="#1a0e04" stroke="#e8c87a" stroke-width="1.4"/>
</svg>
