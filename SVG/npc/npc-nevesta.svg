<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 140" role="img" aria-label="Невеста в высоком свадебном уборе с покрывалом">
  <title>Невеста</title>
  <desc>Невеста из знатного степного рода в высоком свадебном головном уборе с покрывалом и подвесками, в платье с вышитым оплечьем; в руках вышитый платок-дар. Нарисована с достоинством, как человек, а не залог. ФОРМА: юность и свобода выбора. ДЕЙСТВИЕ: игрок следит, чтобы союз родов не стал насилием: согласие невесты, мир семей, честное слово обеих сторон. ЦЕЛЬ: брак — таинство любви и свободы, а не только договор держав (Еф. 5:25). Миссия: 60 Брак как дипломатия.</desc>
  <!-- Арт-канон §9.0: умбра+золото, без нимбов. Рисовано вручную: сырьё 99 репо не подходит (правило 0.15). -->
  <rect width="100" height="140" fill="#1a0e04"/>
  <rect x="5" y="5" width="90" height="130" fill="none" stroke="#8a6a34" stroke-width="1.5"/>
  <!-- покрывало, ниспадающее с убора на плечи -->
  <path d="M50 12 Q30 30 30 70 L38 70 Q38 40 50 24 Q62 40 62 70 L70 70 Q70 30 50 12 Z" fill="#c8a56a" opacity=".3"/>
  <!-- голова -->
  <circle cx="50" cy="38" r="10" fill="#2a1808" stroke="#c8a56a" stroke-width="2"/>
  <!-- высокий свадебный убор -->
  <path d="M40 31 L46 11 H54 L60 31 Z" fill="#8a6a34" stroke="#e8c87a" stroke-width="1.6"/>
  <path d="M42 25 H58 M44 18 H56" stroke="#e8c87a" stroke-width="1.2"/>
  <path d="M50 11 V7" stroke="#c0392b" stroke-width="2"/>
  <!-- подвески у висков -->
  <g stroke="#c8a56a" stroke-width="1"><path d="M40 33 V44 M60 33 V44"/></g>
  <g fill="#e8c87a"><circle cx="40" cy="45" r="1.6"/><circle cx="60" cy="45" r="1.6"/></g>
  <!-- платье -->
  <path d="M50 49 C33 55 30 80 26 120 H74 C70 80 67 55 50 49 Z" fill="#2a1808" stroke="#c8a56a" stroke-width="2"/>
  <!-- вышитое оплечье и полоса -->
  <path d="M38 56 Q50 64 62 56" fill="none" stroke="#e8c87a" stroke-width="2.4"/>
  <path d="M50 62 V118" stroke="#8a6a34" stroke-width="2.5"/>
  <g fill="#e8c87a"><circle cx="50" cy="70" r="1.3"/><circle cx="50" cy="80" r="1.3"/><circle cx="50" cy="90" r="1.3"/><circle cx="50" cy="100" r="1.3"/><circle cx="50" cy="110" r="1.3"/></g>
  <!-- вышитый платок-дар в сложенных руках -->
  <path d="M40 82 L60 82 L56 94 L44 94 Z" fill="#e8d9b8" stroke="#8a6a34" stroke-width="1.2"/>
  <path d="M44 86 H56 M46 90 H54" stroke="#c0392b" stroke-width="1" opacity=".8"/>
</svg>
