<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 140" role="img" aria-label="Странник-мусульманин с посохом, флягой и чётками">
  <title>Странник-мусульманин</title>
  <desc>Странник-мусульманин, гость обители на Шёлковом пути: белая чалма, борода, дорожный плащ, посох с тыквенной флягой, дорожная сума, чётки-тасбих в руке. Нарисован уважительно, как почтенный путник, а не как враг или карикатура. Входит в тройку гостей вместе с npc-strannik-kochevnik и npc-strannik-bednyi. ФОРМА: путник иной веры. ДЕЙСТВИЕ: игрок принимает его по обету гостеприимства: омовение ног, хлеб, ночлег, без условий и без принуждения к вере. ЦЕЛЬ: «был странником, и вы приняли Меня» (Мф. 25:35). Миссия: 25 Обет гостеприимства.</desc>
  <!-- Арт-канон §9.0: умбра+золото, без нимбов. Рисовано вручную: сырьё 99 репо не подходит (правило 0.15). -->
  <rect width="100" height="140" fill="#1a0e04"/>
  <rect x="5" y="5" width="90" height="130" fill="none" stroke="#8a6a34" stroke-width="1.5"/>
  <!-- голова в белой чалме -->
  <circle cx="50" cy="37" r="11" fill="#2a1808" stroke="#c8a56a" stroke-width="2"/>
  <path d="M37 32 Q38 20 50 19 Q62 20 63 32 Q50 27 37 32 Z" fill="#e8d9b8" stroke="#c8a56a" stroke-width="1.5"/>
  <path d="M39 26 Q50 22 61 27 M38 30 Q50 25 62 30" fill="none" stroke="#8a6a34" stroke-width="1"/>
  <!-- седеющая борода -->
  <path d="M42 42 Q44 56 50 57 Q56 56 58 42 Q54 48 50 48 Q46 48 42 42 Z" fill="#c8a56a" opacity=".8"/>
  <!-- дорожный плащ -->
  <path d="M50 48 C31 54 27 80 29 118 H71 C73 80 69 54 50 48 Z" fill="#2a1808" stroke="#c8a56a" stroke-width="2"/>
  <path d="M40 60 Q38 90 40 118 M60 60 Q62 90 60 118" fill="none" stroke="#8a6a34" stroke-width="1.2"/>
  <!-- ремень и дорожная сума -->
  <path d="M40 52 L64 96" stroke="#8a6a34" stroke-width="2"/>
  <path d="M58 92 H72 V104 Q65 108 58 104 Z" fill="#8a6a34" stroke="#c8a56a" stroke-width="1.3"/>
  <!-- посох с тыквенной флягой -->
  <path d="M24 124 V40" stroke="#8a6a34" stroke-width="2.2"/>
  <path d="M24 48 Q20 52 22 56" fill="none" stroke="#c8a56a" stroke-width="1"/>
  <path d="M22 56 Q16 58 17 64 Q18 70 23 68 Q28 66 25 60 Z" fill="#c8a56a" stroke="#8a6a34" stroke-width="1.1"/>
  <!-- чётки-тасбих в руке -->
  <circle cx="44" cy="80" r="3" fill="#2a1808" stroke="#c8a56a" stroke-width="1.2"/>
  <g fill="#e8c87a">
    <circle cx="42" cy="85" r="1.2"/><circle cx="41" cy="89" r="1.2"/><circle cx="42" cy="93" r="1.2"/><circle cx="45" cy="95" r="1.2"/>
    <circle cx="48" cy="93" r="1.2"/><circle cx="49" cy="89" r="1.2"/><circle cx="48" cy="85" r="1.2"/>
  </g>
  <path d="M45 95 V100" stroke="#e8c87a" stroke-width="1.2"/>
</svg>
