<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 140" role="img" aria-label="Старая Шушан в платке, с клюкой, указывает на холм">
  <title>Старая Шушан</title>
  <desc>ФОРМА: старуха берега в тёмном платке и шерстяной накидке, с клюкой; рука указывает вверх, на холм; за ней линия берега. ДЕЙСТВИЕ: рассказывает предание бабки: братья вынесли на холм сначала стариков, потом книги, а сундук апостола последним — «не потеряно, а сохранено». ЦЕЛЬ: память, которая ничего не просит, кроме памяти (Втор. 32:7; 1 Фес. 5:21); помечено как предание. Миссия 88.</desc>
  <rect width="100" height="140" fill="#1a0e04"/>
  <rect x="5" y="5" width="90" height="130" fill="none" stroke="#8a6a34" stroke-width="1.5"/>
  <!-- Арт-канон §9.0: умбра+золото, без нимба. -->
  <!-- линия берега и холм позади -->
  <path d="M5 112 Q30 104 60 110 T95 106" fill="none" stroke="#3a2410" stroke-width="2"/>
  <path d="M62 60 Q78 40 95 52" fill="none" stroke="#3a2410" stroke-width="2"/>
  <!-- лицо с морщинами в платке -->
  <circle cx="44" cy="40" r="9.5" fill="#2a1808" stroke="#c8a56a" stroke-width="1.8"/>
  <path d="M40 44 q4 2 8 0 M39 37 q2 1 3 0 M46 37 q2 1 3 0" fill="none" stroke="#8a6a34" stroke-width="1"/>
  <path d="M32 46 Q30 24 44 24 Q58 24 56 46 Q56 34 44 31 Q32 34 32 46 Z" fill="#3a2410" stroke="#c8a56a" stroke-width="1.5"/>
  <!-- накидка, сгорбленная спина -->
  <path d="M44 50 C28 54 24 80 26 122 H62 C64 84 60 56 44 50 Z" fill="#2a1808" stroke="#c8a56a" stroke-width="2"/>
  <path d="M30 70 Q44 76 58 70" fill="none" stroke="#8a6a34" stroke-width="1.4"/>
  <!-- рука указывает на холм -->
  <path d="M56 64 L72 50" stroke="#c8a56a" stroke-width="3" stroke-linecap="round"/>
  <path d="M72 50 l5 -4" stroke="#e8c87a" stroke-width="1.6" stroke-linecap="round"/>
  <!-- клюка -->
  <path d="M24 74 V128 M24 74 q-6 -6 -10 0" fill="none" stroke="#8a6a34" stroke-width="2.4" stroke-linecap="round"/>
</svg>
