<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 140" role="img" aria-label="Жених — молодой купец">
  <title>Жених — молодой купец</title>
  <desc>ФОРМА: молодой купец в расшитом кафтане и шапочке с опушкой, с короткой бородкой; держит свёрток шёлка — свадебный дар, на поясе кошель. ДЕЙСТВИЕ: брак, задуманный как союз домов, игрок помогает обратить в свободное согласие двоих, а не сделку. ЦЕЛЬ: таинство брака не продаётся; мир между родами строится на верности. Миссия 60.</desc>
  <rect width="100" height="140" fill="#1a0e04"/>
  <rect x="5" y="5" width="90" height="130" fill="none" stroke="#8a6a34" stroke-width="1.5"/>
  <!-- Арт-канон §9.0: умбра+золото, картуш, без нимбов -->
  <!-- голова в шапочке с опушкой -->
  <circle cx="50" cy="36" r="10" fill="#2a1808" stroke="#c8a56a" stroke-width="2"/>
  <path d="M41 30 Q50 18 59 30 Z" fill="#8a6a34" stroke="#c8a56a" stroke-width="1.5"/>
  <path d="M40 31 Q50 27 60 31" fill="none" stroke="#e8c87a" stroke-width="2"/>
  <!-- короткая молодая бородка -->
  <path d="M45 43 Q50 48 55 43 Q50 45 45 43 Z" fill="#c8a56a"/>
  <!-- расшитый кафтан -->
  <path d="M50 48 C31 54 27 80 29 118 H71 C73 80 69 54 50 48 Z" fill="#2a1808" stroke="#c8a56a" stroke-width="2"/>
  <path d="M50 50 Q42 60 44 118" fill="none" stroke="#e8c87a" stroke-width="1.5"/>
  <g fill="none" stroke="#c8a56a" stroke-width="1"><path d="M46 62 q3 -3 6 0 q-3 3 -6 0 M45 74 q3 -3 6 0 q-3 3 -6 0 M45 86 q3 -3 6 0 q-3 3 -6 0"/></g>
  <path d="M31 90 H69" stroke="#8a6a34" stroke-width="2.5"/>
  <!-- кошель на поясе -->
  <path d="M60 92 Q58 102 64 102 Q70 102 68 92 Z" fill="#3a2410" stroke="#c8a56a" stroke-width="1.2"/>
  <!-- свёрток шёлка — свадебный дар -->
  <rect x="22" y="70" width="18" height="14" rx="3" fill="#c8a56a" stroke="#8a6a34" stroke-width="1.4"/>
  <path d="M31 70 V84 M22 77 H40" stroke="#c0392b" stroke-width="1.5"/>
</svg>
