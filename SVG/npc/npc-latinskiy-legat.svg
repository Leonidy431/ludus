<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 140" role="img" aria-label="Латинский легат в дорожном плаще">
  <title>Латинский легат</title>
  <desc>Форма: папский посланец в мирском дорожном облике: берет, плащ с застёжкой, свиток грамоты с вислой печатью; изображений святых нет. Действие: предлагает унию и беседует о различиях обряда. Цель: учтивый спор о вере без вражды — игрок учится различать, а не ненавидеть. Миссия: 21 «Униатский обряд».</desc>
  <!-- Арт-канон §9.0: умбра+золото, без нимбов. -->
  <rect width="100" height="140" fill="#1a0e04"/>
  <rect x="5" y="5" width="90" height="130" fill="none" stroke="#8a6a34" stroke-width="1.5"/>
  <!-- голова, гладко выбрит, чёрный берет -->
  <circle cx="50" cy="36" r="11" fill="#2a1808" stroke="#c8a56a" stroke-width="2"/>
  <path d="M38 31 Q40 21 52 21 Q64 22 63 30 Q52 26 38 31 Z" fill="#1a0e04" stroke="#c8a56a" stroke-width="1.5"/>
  <!-- дорожный плащ с застёжкой -->
<path d="M50 48 C31 54 27 80 29 118 H71 C73 80 69 54 50 48 Z" fill="#2a1808" stroke="#c8a56a" stroke-width="2"/>
  <path d="M42 52 L50 60 L58 52" fill="none" stroke="#c8a56a" stroke-width="1.5"/>
  <circle cx="50" cy="60" r="2.5" fill="#e8c87a"/>
  <path d="M50 62 V118" stroke="#8a6a34" stroke-width="1.2"/>
  <!-- грамота с вислой красной печатью -->
  <rect x="56" y="78" width="16" height="7" rx="3.5" fill="#1a0e04" stroke="#e8c87a" stroke-width="1.5"/>
  <path d="M64 85 V93" stroke="#c8a56a" stroke-width="1"/>
  <circle cx="64" cy="96" r="3" fill="#c0392b"/>
  <!-- дорожная сума -->
  <path d="M30 92 h12 v12 h-12 Z" fill="#1a0e04" stroke="#c8a56a" stroke-width="1.4"/>
  <path d="M30 96 h12" stroke="#8a6a34" stroke-width="1"/>
</svg>
