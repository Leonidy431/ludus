<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 140" role="img" aria-label="Монах-садовник с садовым ножом и виноградной лозой">
  <title>Монах-садовник</title>
  <desc>Форма: монах в скуфье и подряснике с подоткнутым краем, чётки на запястье, в руке садовый нож-кривец, рядом лоза на шпалере с гроздью. Действие: обрезает лозу, чтобы она приносила плод. Цель: образ евангельской лозы (Ин. 15:1–2) — отсечение лишнего ради плода; труд и молитва вместе. Миссия: 70 «Монастырская винодельня/сад».</desc>
  <!-- Арт-канон §9.0: умбра+золото, картуш, без нимбов -->
  <rect width="100" height="140" fill="#1a0e04"/>
  <rect x="5" y="5" width="90" height="130" fill="none" stroke="#8a6a34" stroke-width="1.5"/>
  <!-- шпалера с лозой справа -->
  <g stroke="#8a6a34" stroke-width="1.5"><path d="M80 130 V40 M70 60 H90 M70 84 H90"/></g>
  <path d="M80 128 Q74 110 82 96 Q88 80 78 66 Q74 56 82 46" fill="none" stroke="#c8a56a" stroke-width="2"/>
  <g fill="#8a6a34" stroke="#c8a56a" stroke-width="1">
    <path d="M82 96 q8 -2 8 -8 q-7 0 -8 8 Z"/><path d="M78 66 q-8 -2 -8 -8 q7 0 8 8 Z"/>
  </g>
  <!-- гроздь -->
  <g fill="#c8a56a" stroke="#8a6a34" stroke-width=".8">
    <circle cx="86" cy="104" r="2.3"/><circle cx="90" cy="104" r="2.3"/><circle cx="88" cy="108" r="2.3"/>
    <circle cx="84" cy="108" r="2.3"/><circle cx="86" cy="112" r="2.3"/>
  </g>
  <!-- голова в скуфье -->
  <circle cx="44" cy="36" r="11" fill="#2a1808" stroke="#c8a56a" stroke-width="2"/>
  <path d="M33 32 Q44 18 55 32 Z" fill="#1a0e04" stroke="#c8a56a" stroke-width="1.5"/>
  <!-- борода -->
  <path d="M37 42 Q44 58 51 42 Q48 48 44 48 Q40 48 37 42 Z" fill="#c8a56a" opacity=".8"/>
  <!-- подрясник, подоткнутый для работы -->
  <path d="M44 50 C26 56 22 80 24 118 H64 C66 80 62 56 44 50 Z" fill="#2a1808" stroke="#c8a56a" stroke-width="2"/>
  <path d="M28 96 Q44 102 60 96" fill="none" stroke="#8a6a34" stroke-width="1.5"/>
  <path d="M28 84 H60" stroke="#8a6a34" stroke-width="2.5"/>
  <!-- чётки на левом запястье -->
  <g fill="#e8c87a"><circle cx="30" cy="70" r="1.5"/><circle cx="28" cy="74" r="1.5"/><circle cx="30" cy="78" r="1.5"/><circle cx="34" cy="77" r="1.5"/><circle cx="34" cy="72" r="1.5"/></g>
  <!-- садовый нож-кривец в правой руке -->
  <path d="M60 76 L66 70" stroke="#8a6a34" stroke-width="3" stroke-linecap="round"/>
  <path d="M66 70 Q72 62 68 58 Q68 64 64 68" fill="#e8c87a" stroke="#8a6a34" stroke-width=".8"/>
</svg>
