<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 140" role="img" aria-label="Вдова с детьми — бедная семья у каравана">
  <title>Вдова с детьми</title>
  <desc>Форма: женщина в тёмном платке, прижимает младенца; рядом двое детей и пустая миска. Действие: семья ждёт помощи у каравана благотворительности. Цель: милостыня как встреча с ближним, а не подачка; бедность показана с достоинством. Миссия: 9 «Караван благотворительности».</desc>
  <!-- Арт-канон §9.0: умбра+золото, без нимбов. -->
  <rect width="100" height="140" fill="#1a0e04"/>
  <rect x="5" y="5" width="90" height="130" fill="none" stroke="#8a6a34" stroke-width="1.5"/>
  <!-- голова матери в платке -->
  <path d="M33 40 Q33 19 46 19 Q59 19 59 40 L61 52 Q46 46 31 52 Z" fill="#1a0e04" stroke="#8a6a34" stroke-width="1.5"/>
  <circle cx="46" cy="35" r="8" fill="#2a1808" stroke="#c8a56a" stroke-width="2"/>
  <!-- платье матери -->
  <path d="M46 46 C30 52 26 80 28 118 H62 C64 80 60 52 46 46 Z" fill="#2a1808" stroke="#c8a56a" stroke-width="2"/>
  <!-- младенец в пелёнке на руках -->
  <ellipse cx="46" cy="66" rx="10" ry="6" fill="#8a6a34" stroke="#e8c87a" stroke-width="1.4"/>
  <circle cx="39" cy="64" r="3" fill="#2a1808" stroke="#e8c87a" stroke-width="1"/>
  <!-- старший ребёнок справа -->
  <circle cx="74" cy="84" r="6" fill="#2a1808" stroke="#c8a56a" stroke-width="1.8"/>
  <path d="M74 91 C66 94 64 106 65 118 H83 C84 106 82 94 74 91 Z" fill="#2a1808" stroke="#c8a56a" stroke-width="1.8"/>
  <!-- пустая миска в руках ребёнка -->
  <path d="M66 102 H82 Q80 108 74 108 Q68 108 66 102 Z" fill="#1a0e04" stroke="#e8c87a" stroke-width="1.4"/>
  <!-- младший держится за подол -->
  <circle cx="20" cy="98" r="5" fill="#2a1808" stroke="#c8a56a" stroke-width="1.6"/>
  <path d="M20 104 C14 106 13 112 14 118 H26 C27 112 26 106 20 104 Z" fill="#2a1808" stroke="#c8a56a" stroke-width="1.6"/>
  <path d="M24 108 L30 104" stroke="#c8a56a" stroke-width="1.6"/>
</svg>
