<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 140" role="img" aria-label="Резчик кайраков — мастер надгробных камней">
  <title>Резчик кайраков</title>
  <desc>ФОРМА: собирательный образ мастера Семиречья (связка П-33): шапочка, кожаный фартук, в руках зубило и киянка, рядом валун с начатым крестом на лотосе. ДЕЙСТВИЕ: дьякон заказывает у него камень и учится читать знаки несторианского креста. ЦЕЛЬ: ремесло на службе памяти усопших. Миссия: 17 Несторианский крест.</desc>
  <!-- Арт-канон §9.0: умбра+золото, без нимбов. Рисовано вручную: сырьё 99 репо не подходит (правило 0.15). -->
  <rect width="100" height="140" fill="#1a0e04"/>
  <rect x="5" y="5" width="90" height="130" fill="none" stroke="#8a6a34" stroke-width="1.5"/>
  <circle cx="50" cy="36" r="11" fill="#2a1808" stroke="#c8a56a" stroke-width="2"/>
  <!-- войлочная шапочка ремесленника -->
  <path d="M39 31 Q40 22 50 22 Q60 22 61 31 Z" fill="#8a6a34" stroke="#c8a56a" stroke-width="1.5"/>
  <path d="M45 37 h3 M52 37 h3" stroke="#e8c87a" stroke-width="1.2"/>
  <path d="M43 42 Q50 52 57 42 Q54 47 50 47 Q46 47 43 42 Z" fill="#c8a56a" opacity=".75"/>
  <path d="M50 48 C31 54 27 80 29 118 H71 C73 80 69 54 50 48 Z" fill="#2a1808" stroke="#c8a56a" stroke-width="2"/>
  <!-- кожаный фартук -->
  <path d="M38 66 H62 L64 112 H36 Z" fill="#8a6a34" stroke="#c8a56a" stroke-width="1.5"/>
  <path d="M38 66 L42 56 M62 66 L58 56" stroke="#c8a56a" stroke-width="1.2"/>
  <!-- каменная пыль на фартуке -->
  <g fill="#e8c87a" opacity=".6"><circle cx="44" cy="96" r="1"/><circle cx="54" cy="102" r="1"/><circle cx="58" cy="90" r="1"/></g>
  <!-- киянка в правой руке -->
  <path d="M34 62 Q28 70 26 76" fill="none" stroke="#c8a56a" stroke-width="2"/>
  <path d="M26 76 L22 62" stroke="#8a6a34" stroke-width="2"/>
  <rect x="16" y="56" width="12" height="8" rx="2" fill="#2a1808" stroke="#c8a56a" stroke-width="1.5"/>
  <!-- зубило в левой руке -->
  <path d="M66 62 Q70 70 70 76" fill="none" stroke="#c8a56a" stroke-width="2"/>
  <path d="M70 76 L74 90" stroke="#e8c87a" stroke-width="2"/>
  <!-- валун с начатым крестом на лотосе -->
  <path d="M64 128 Q60 104 76 98 Q92 104 90 128 Z" fill="#241405" stroke="#c8a56a" stroke-width="1.8"/>
  <path d="M77 104 V118 M71 110 H83" stroke="#e8c87a" stroke-width="1.6"/>
  <path d="M71 121 Q74 117 77 120 Q80 117 83 121" fill="none" stroke="#c8a56a" stroke-width="1.2" stroke-dasharray="2 1.5"/>
</svg>
