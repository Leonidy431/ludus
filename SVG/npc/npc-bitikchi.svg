<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 140" role="img" aria-label="Битикчи — писец канцелярии Орды">
  <title>Битикчи — писец канцелярии Орды</title>
  <desc>ФОРМА: писец ханской канцелярии в халате с запахом и шапке с полями, с кистью и свитком вертикального уйгуро-монгольского письма, у пояса чернильница. ДЕЙСТВИЕ: он записывает указы и налоги, от его точности зависит, будет ли признана налоговая льгота обители. ЦЕЛЬ: честный чиновник чужого двора — не враг, а соработник справедливости. Миссия 10.</desc>
  <rect width="100" height="140" fill="#1a0e04"/>
  <rect x="5" y="5" width="90" height="130" fill="none" stroke="#8a6a34" stroke-width="1.5"/>
  <!-- Арт-канон §9.0: умбра+золото, картуш, без нимбов -->
  <!-- голова в шапке с загнутыми полями -->
  <circle cx="50" cy="36" r="10" fill="#2a1808" stroke="#c8a56a" stroke-width="2"/>
  <path d="M36 30 Q50 26 64 30 L60 26 Q50 14 40 26 Z" fill="#8a6a34" stroke="#c8a56a" stroke-width="1.5"/>
  <path d="M50 16 V12" stroke="#e8c87a" stroke-width="1.5"/>
  <!-- тонкие усы -->
  <path d="M45 42 Q50 40 55 42" fill="none" stroke="#c8a56a" stroke-width="1.2"/>
  <!-- халат с запахом на правую сторону -->
  <path d="M50 48 C31 54 27 80 29 118 H71 C73 80 69 54 50 48 Z" fill="#2a1808" stroke="#c8a56a" stroke-width="2"/>
  <path d="M42 50 Q56 62 62 76" fill="none" stroke="#e8c87a" stroke-width="1.6"/>
  <path d="M31 84 H69" stroke="#8a6a34" stroke-width="2.5"/>
  <!-- чернильница у пояса -->
  <rect x="62" y="86" width="7" height="9" rx="1.5" fill="#1a0e04" stroke="#c8a56a" stroke-width="1.2"/>
  <!-- свиток с вертикальными строками -->
  <rect x="30" y="92" width="22" height="26" fill="#c8a56a" stroke="#8a6a34" stroke-width="1.4"/>
  <g stroke="#2a1808" stroke-width="1.1" fill="none">
    <path d="M35 96 V114 M40 96 q2 4 0 8 v8 M45 96 V110 M49 98 V114"/>
  </g>
  <!-- кисть в руке -->
  <path d="M58 102 L70 88" stroke="#8a6a34" stroke-width="2"/>
  <path d="M58 102 l-2 3 l3 -1 Z" fill="#1a0e04"/>
</svg>
