<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 140" role="img" aria-label="Брат-кузнец монастырской кузни">
  <title>Брат-кузнец</title>
  <desc>Форма: монах-послушник в скуфье, подрясник с подоткнутыми рукавами, кожаный фартук, молот в руке и клещи с раскалённой подковой. Действие: куёт гвозди, скобы и подковы для обители и для соседей, ведёт огонь ровно, как молитву. Цель: «кто не хочет трудиться, тот и не ешь» (2 Фес. 3:10): труд рук в послушании очищает сердце, как горн металл. Миссия: 66 Кузня монастыря.</desc>
  <rect width="100" height="140" fill="#1a0e04"/>
  <rect x="5" y="5" width="90" height="130" fill="none" stroke="#8a6a34" stroke-width="1.5"/>
  <!-- Арт-канон §9.0: умбра+золото, картуш, без нимбов. Монах без нимба; святость — в труде и послушании. -->
  <!-- голова в скуфье, окладистая борода -->
  <circle cx="50" cy="35" r="11" fill="#2a1808" stroke="#c8a56a" stroke-width="2"/>
  <path d="M39 31 Q39 21 50 21 Q61 21 61 31 Z" fill="#1a0e04" stroke="#c8a56a" stroke-width="1.5"/>
  <path d="M41 40 Q44 56 50 57 Q56 56 59 40 Q55 47 50 47 Q45 47 41 40 Z" fill="#c8a56a" opacity=".75"/>
  <!-- подрясник -->
  <path d="M50 48 C31 54 27 80 29 118 H71 C73 80 69 54 50 48 Z" fill="#2a1808" stroke="#c8a56a" stroke-width="2"/>
  <!-- кожаный фартук -->
  <path d="M38 60 H62 L64 116 H36 Z" fill="#8a6a34" stroke="#e8c87a" stroke-width="1.5"/>
  <path d="M38 60 L34 54 M62 60 L66 54" stroke="#c8a56a" stroke-width="1.2"/>
  <!-- малый параманный крестик на шнуре -->
  <path d="M50 58 v6 M48 60.5 h4" stroke="#e8c87a" stroke-width="1.2"/>
  <!-- молот -->
  <path d="M28 108 V70" stroke="#c8a56a" stroke-width="2.4"/>
  <rect x="19" y="62" width="18" height="8" rx="1" fill="#1a0e04" stroke="#e8c87a" stroke-width="1.5"/>
  <!-- клещи с раскалённой подковой -->
  <path d="M72 108 L66 84 M76 108 L68 84" stroke="#c8a56a" stroke-width="1.8"/>
  <path d="M60 84 Q60 74 68 74 Q76 74 76 84" fill="none" stroke="#c0392b" stroke-width="3"/>
  <circle cx="68" cy="80" r="8" fill="#e8c87a" opacity=".15"/>
</svg>
