<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 140" role="img" aria-label="Странник-кочевник с посохом и бурдюком">
  <title>Странник-кочевник</title>
  <desc>Странник из кочевого рода: войлочная шапка с отворотами, овчинный тулуп, посох и кожаный бурдюк, у ног дорожная сума. Нарисован уважительно: гость у ворот обители. ФОРМА: чужой по языку и роду. ДЕЙСТВИЕ: игрок встречает его хлебом и водой без вопросов о вере. ЦЕЛЬ: «странника принимайте» (Евр. 13:2), гостеприимство как добродетель. Миссия: 25.</desc>
  <!-- Арт-канон §9.0: умбра+золото, без нимбов. Рисовано вручную. -->
  <rect width="100" height="140" fill="#1a0e04"/>
  <rect x="5" y="5" width="90" height="130" fill="none" stroke="#8a6a34" stroke-width="1.5"/>
  <!-- посох -->
  <path d="M24 30 V124" stroke="#c8a56a" stroke-width="2.4" stroke-linecap="round"/>
  <!-- голова и войлочная шапка с отворотами -->
  <circle cx="50" cy="38" r="10.5" fill="#2a1808" stroke="#c8a56a" stroke-width="2"/>
  <path d="M38 34 L42 20 Q50 15 58 20 L62 34 Z" fill="#8a6a34" stroke="#c8a56a" stroke-width="1.4"/>
  <path d="M37 34 Q37 44 40 46 M63 34 Q63 44 60 46" stroke="#c8a56a" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- овчинный тулуп с меховой оторочкой -->
  <path d="M50 49 C33 55 29 82 31 120 H69 C71 82 67 55 50 49 Z" fill="#2a1808" stroke="#c8a56a" stroke-width="2"/>
  <path d="M40 52 Q50 60 60 52" stroke="#e8c87a" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <path d="M31 118 H69" stroke="#e8c87a" stroke-width="3" stroke-linecap="round"/>
  <path d="M33 90 H67" stroke="#8a6a34" stroke-width="2.2"/>
  <!-- рука на посохе -->
  <path d="M34 70 Q28 72 26 74" stroke="#c8a56a" stroke-width="3" stroke-linecap="round" fill="none"/>
  <!-- кожаный бурдюк -->
  <path d="M66 74 Q78 72 78 86 Q76 98 66 96 Q62 86 66 74 Z" fill="#8a6a34" stroke="#c8a56a" stroke-width="1.3"/>
  <path d="M66 74 L63 68" stroke="#c8a56a" stroke-width="1.5"/>
  <!-- дорожная сума у ног -->
  <rect x="64" y="110" width="18" height="12" rx="3" fill="#2a1808" stroke="#8a6a34" stroke-width="1.3"/>
</svg>
