<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 140" role="img" aria-label="Вдова купца с грамотой о наследстве">
  <title>Вдова</title>
  <desc>Вдова купца: тёмный плат, покрывающий голову и плечи, простое платье, в руках грамота о наследстве и ключ от лавки мужа. ФОРМА: беззащитность перед законом и её упорство. ДЕЙСТВИЕ: игрок вместе с знатоками права разбирает её дело. ЦЕЛЬ: «защищайте вдову» (Ис. 1:17) — право как служение слабому. Миссия: 62 «Эксперты по праву».</desc>
  <rect width="100" height="140" fill="#1a0e04"/>
  <rect x="5" y="5" width="90" height="130" fill="none" stroke="#8a6a34" stroke-width="1.5"/>
  <!-- тёмный плат, покрывающий голову и плечи -->
  <path d="M50 18 Q34 20 34 40 Q32 54 26 62 H74 Q68 54 66 40 Q66 20 50 18 Z" fill="#2a1808" stroke="#c8a56a" stroke-width="2"/>
  <!-- лицо -->
  <ellipse cx="50" cy="38" rx="8" ry="9.5" fill="#1a0e04" stroke="#8a6a34" stroke-width="1.5"/>
  <path d="M46 36 h2.5 M51.5 36 h2.5" stroke="#c8a56a" stroke-width="1"/>
  <path d="M47 43 Q50 42 53 43" fill="none" stroke="#c8a56a" stroke-width="1"/>
  <!-- платье -->
  <path d="M50 58 C32 62 28 86 30 122 H70 C72 86 68 62 50 58 Z" fill="#2a1808" stroke="#c8a56a" stroke-width="2"/>
  <path d="M42 70 Q40 96 42 122 M58 70 Q60 96 58 122" fill="none" stroke="#8a6a34" stroke-width="1.2"/>
  <!-- грамота о наследстве с печатью -->
  <rect x="38" y="80" width="24" height="18" fill="#c8a56a" stroke="#8a6a34" stroke-width="1.2"/>
  <g stroke="#8a6a34" stroke-width=".8"><path d="M41 84 h18 M41 88 h18 M41 92 h12"/></g>
  <circle cx="57" cy="94" r="2.5" fill="#c0392b"/>
  <!-- руки, держащие грамоту -->
  <path d="M34 78 Q34 88 38 90 M66 78 Q66 88 62 90" fill="none" stroke="#c8a56a" stroke-width="1.8"/>
  <!-- ключ от лавки на шнуре -->
  <path d="M50 60 V70" stroke="#8a6a34" stroke-width="1"/>
  <circle cx="50" cy="72" r="2" fill="none" stroke="#e8c87a" stroke-width="1.3"/>
  <path d="M50 74 V79 M50 77 h2" stroke="#e8c87a" stroke-width="1.3"/>
</svg>
