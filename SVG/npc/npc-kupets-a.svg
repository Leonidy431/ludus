<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 140" role="img" aria-label="Первый купец-истец с отрезом ткани и договором">
  <title>Купец-истец (первый)</title>
  <desc>Первый из двух купцов-истцов: торговец тканями в низкой шапке с опушкой, с тёмной бородой, держит развёрнутый договор и сверток ткани; у пояса кошель. Нарисован уважительно: человек в споре, а не злодей. Парная фигура — npc-kupets-b (второй купец). ФОРМА: право и обида. ДЕЙСТВИЕ: игрок-епископский суд выслушивает обе стороны, сверяет договор с весами и свидетелями и примиряет. ЦЕЛЬ: «суди праведно» (Втор. 16:18-20) — примирение выше выигрыша. Миссия: 3 Епископ-арбитр.</desc>
  <!-- Арт-канон §9.0: умбра+золото, без нимбов. Рисовано вручную: сырьё 99 репо не подходит (правило 0.15). -->
  <rect width="100" height="140" fill="#1a0e04"/>
  <rect x="5" y="5" width="90" height="130" fill="none" stroke="#8a6a34" stroke-width="1.5"/>
  <!-- голова, низкая шапка с опушкой -->
  <circle cx="50" cy="36" r="11" fill="#2a1808" stroke="#c8a56a" stroke-width="2"/>
  <path d="M39 30 Q40 21 50 21 Q60 21 61 30 Z" fill="#2a1808" stroke="#c8a56a" stroke-width="1.5"/>
  <path d="M38 30 H62" stroke="#8a6a34" stroke-width="4" stroke-linecap="round"/>
  <!-- тёмная борода -->
  <path d="M42 41 Q44 54 50 55 Q56 54 58 41 Q54 47 50 47 Q46 47 42 41 Z" fill="#8a6a34"/>
  <!-- кафтан -->
  <path d="M50 48 C31 54 27 80 29 118 H71 C73 80 69 54 50 48 Z" fill="#2a1808" stroke="#c8a56a" stroke-width="2"/>
  <path d="M50 56 V118" stroke="#8a6a34" stroke-width="1.4"/>
  <path d="M31 86 H69" stroke="#c8a56a" stroke-width="2.4"/>
  <!-- поднятый договор с печатью -->
  <path d="M60 58 L78 54 L80 78 L62 82 Z" fill="#e8d9b8" stroke="#8a6a34" stroke-width="1.3"/>
  <path d="M64 62 L76 59.5 M64 67 L76 64.5 M64 72 L74 70" stroke="#8a6a34" stroke-width="1"/>
  <circle cx="72" cy="76" r="2.5" fill="#c0392b"/>
  <!-- сверток ткани под рукой -->
  <rect x="22" y="72" width="22" height="10" rx="5" fill="#c8a56a" stroke="#8a6a34" stroke-width="1.3"/>
  <path d="M28 72 V82 M34 72 V82" stroke="#8a6a34" stroke-width="1"/>
  <!-- кошель у пояса -->
  <path d="M40 88 Q36 98 42 100 Q48 98 44 88 Z" fill="#8a6a34" stroke="#c8a56a" stroke-width="1.2"/>
</svg>
