<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="Макет берега с городами на столе">
  <title>Макет берега</title>
  <desc>Форма: глиняный рельеф на деревянном лотке — горы, берег озера, два городка-кубика, земляная запруда со шлюзом, вода в канале. Действие: испытать запруду на макете, прежде чем трогать реку, и увидеть, чьи поля и дома затопит вода. Цель: разумное попечение о творении и о соседе; любой замысел проверяется последствием для ближнего. Миссия: 38 Плотинный эксперимент.</desc>
  <!-- Арт-канон §9.0: умбра+золото, картуш-рамка, без нимбов. Объект: учебный макет, изометрия. -->
  <defs>
    <radialGradient id="maket-bg" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#3a2410"/>
      <stop offset="100%" stop-color="#1a0e04"/>
    </radialGradient>
  </defs>
  <rect x="2" y="2" width="92" height="92" rx="10" fill="url(#maket-bg)" stroke="#8a6a34" stroke-width="2"/>
  <rect x="7" y="7" width="82" height="82" rx="7" fill="none" stroke="#c8a56a" stroke-width="1" opacity=".55"/>
  <!-- лоток в изометрии -->
  <path d="M10 56 L48 36 L86 56 L48 76 Z" fill="#2a1808" stroke="#c8a56a" stroke-width="1.8"/>
  <path d="M10 56 V62 L48 82 L86 62 V56 M48 76 V82" fill="none" stroke="#8a6a34" stroke-width="1.6"/>
  <!-- озеро и канал -->
  <path d="M48 76 L30 66 Q40 60 52 64 Q62 66 70 64 L86 56 Z" fill="#0d2a3a" stroke="#1f5a73" stroke-width="1.2"/>
  <path d="M54 64 Q50 54 56 46" fill="none" stroke="#1f5a73" stroke-width="2"/>
  <!-- запруда со шлюзом -->
  <path d="M50 52 L60 50" stroke="#8a6a34" stroke-width="3.5" stroke-linecap="round"/>
  <rect x="53.5" y="48" width="3" height="4" fill="#e8c87a"/>
  <!-- горы -->
  <path d="M24 50 L32 38 L40 46 L46 36 L50 42" fill="#8a6a34" stroke="#e8c87a" stroke-width="1.3"/>
  <!-- городки-кубики -->
  <g fill="#c8a56a" stroke="#1a0e04" stroke-width=".8">
    <path d="M26 60 h5 v-4 h-5 Z M32 62 h4 v-5 h-4 Z"/>
    <path d="M66 58 h5 v-4 h-5 Z M72 60 h4 v-6 h-4 Z"/>
  </g>
  <!-- указка и метка уровня воды -->
  <path d="M76 22 L62 50" stroke="#c8a56a" stroke-width="1.4"/>
  <path d="M18 22 V42 M18 26 H22 M18 30 H21 M18 34 H22 M18 38 H21" stroke="#e8c87a" stroke-width="1.2"/>
</svg>
