<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="Сундук казны с тремя замками">
  <title>Сундук казны</title>
  <desc>Форма: кованый сундук с плоской крышкой, железными полосами и тремя висячими замками разной формы, рядом весы-безмен и счётная дощечка. Действие: казну открывают только три ключника вместе, каждая монета записана. Цель: против сребролюбия — прозрачность и общая ответственность; казна обители служит бедным, а не хранителю; реестр МЛ-12. Миссия: 80 Хранение монет.</desc>
  <!-- Арт-канон §9.0: умбра+золото, картуш-рамка, без нимбов. Объект: казна миссии, монеты внутри не показаны. -->
  <defs>
    <radialGradient id="sunduk-bg" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#3a2410"/>
      <stop offset="100%" stop-color="#1a0e04"/>
    </radialGradient>
  </defs>
  <rect x="2" y="2" width="92" height="92" rx="10" fill="url(#sunduk-bg)" stroke="#8a6a34" stroke-width="2"/>
  <rect x="7" y="7" width="82" height="82" rx="7" fill="none" stroke="#c8a56a" stroke-width="1" opacity=".55"/>
  <!-- корпус -->
  <rect x="16" y="40" width="64" height="36" rx="2" fill="#2a1808" stroke="#c8a56a" stroke-width="1.8"/>
  <!-- крышка -->
  <path d="M14 32 H82 V42 H14 Z" fill="#8a6a34" stroke="#e8c87a" stroke-width="1.6"/>
  <!-- железные полосы с заклёпками -->
  <g stroke="#1a0e04" stroke-width="3"><path d="M24 32 V76 M72 32 V76 M16 58 H80"/></g>
  <g fill="#c8a56a"><circle cx="24" cy="36" r="1.2"/><circle cx="72" cy="36" r="1.2"/><circle cx="24" cy="70" r="1.2"/><circle cx="72" cy="70" r="1.2"/></g>
  <!-- три замка трёх ключников -->
  <g fill="#e8c87a" stroke="#8a6a34" stroke-width="1">
    <path d="M32 44 h8 v8 h-8 Z"/><path d="M44 44 h8 v8 h-8 Z"/><path d="M56 44 h8 v8 h-8 Z"/>
  </g>
  <g fill="none" stroke="#e8c87a" stroke-width="1.4"><path d="M34 44 Q36 39 38 44 M46 44 Q48 39 50 44 M58 44 Q60 39 62 44"/></g>
  <g fill="#1a0e04"><circle cx="36" cy="48" r="1.1"/><path d="M47 47 h2 v3 h-2 Z"/><path d="M60 46 l1.5 3 h-3 Z"/></g>
  <!-- счётная дощечка с зарубками -->
  <rect x="22" y="80" width="30" height="5" fill="#8a6a34" stroke="#c8a56a" stroke-width="1"/>
  <path d="M26 80 v5 M30 80 v5 M34 80 v5 M38 80 v5 M42 80 v5" stroke="#1a0e04" stroke-width="1"/>
  <!-- безмен -->
  <path d="M60 82 H80 M64 82 v-6" stroke="#c8a56a" stroke-width="1.4"/>
  <circle cx="78" cy="82" r="2.4" fill="#c8a56a"/>
</svg>
