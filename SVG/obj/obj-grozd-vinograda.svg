<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="Гроздь винограда с листом и усиком">
  <title>Гроздь винограда</title>
  <desc>ФОРМА: спелая гроздь на лозе, лист и усик. ДЕЙСТВИЕ: братия подрезает лозу, собирает урожай и делит его с трудниками. ЦЕЛЬ: «Я есмь лоза, а вы ветви» — плод рождается от пребывания и терпеливого труда, а не от спешки. Миссия: 70 Монастырская винодельня/сад.</desc>
  <!-- Арт-канон §9.0: умбра+золото, картуш-рамка, без нимбов. -->
  <defs>
    <radialGradient id="grozd-bg" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#3a2410"/>
      <stop offset="100%" stop-color="#1a0e04"/>
    </radialGradient>
  </defs>
  <rect x="2" y="2" width="92" height="92" rx="10" fill="url(#grozd-bg)" stroke="#8a6a34" stroke-width="2"/>
  <rect x="7" y="7" width="82" height="82" rx="7" fill="none" stroke="#c8a56a" stroke-width="1" opacity=".55"/>
  <!-- лоза и черенок -->
  <path d="M18 20 Q34 16 46 22 Q50 24 48 30" fill="none" stroke="#8a6a34" stroke-width="2.4" stroke-linecap="round"/>
  <!-- усик-спираль -->
  <path d="M30 18 Q28 10 22 12 Q18 14 21 17 Q23 18 24 16" fill="none" stroke="#c8a56a" stroke-width="1.2"/>
  <!-- виноградный лист -->
  <path d="M52 24 Q60 12 72 16 Q70 20 76 24 Q70 28 72 34 Q62 34 56 30 Z" fill="#2a1808" stroke="#c8a56a" stroke-width="1.5"/>
  <path d="M54 26 L70 20 M60 24 L66 31" stroke="#8a6a34" stroke-width="1"/>
  <!-- ягоды грозди -->
  <g fill="#8a6a34" stroke="#e8c87a" stroke-width="1.2">
    <circle cx="40" cy="36" r="5"/><circle cx="50" cy="35" r="5"/><circle cx="60" cy="38" r="5"/>
    <circle cx="36" cy="46" r="5"/><circle cx="46" cy="45" r="5"/><circle cx="56" cy="47" r="5"/>
    <circle cx="41" cy="55" r="5"/><circle cx="51" cy="56" r="5"/>
    <circle cx="45" cy="65" r="5"/><circle cx="54" cy="64" r="4.5"/>
    <circle cx="48" cy="74" r="4.5"/>
  </g>
  <!-- блики на ягодах -->
  <g fill="#e8c87a" opacity=".7">
    <circle cx="38.5" cy="34.5" r="1.1"/><circle cx="44.5" cy="43.5" r="1.1"/>
    <circle cx="49.5" cy="54.5" r="1.1"/><circle cx="46.5" cy="72.5" r="1"/>
  </g>
</svg>
