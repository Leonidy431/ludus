<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="Тетрадь перевода ектении в два столбца">
  <title>Тетрадь перевода ектении</title>
  <desc>Форма: раскрытая тетрадь в два столбца — греческий подлинник слева, перевод справа — с пером и чернильницей. Действие: переводить прошения ектении слово в слово, сверяясь с подлинником. Цель: многоязычная литургия, где каждый народ молится на понятном языке. Миссия: 18 Многоязычная литургия. Строки условны, священный текст не искажается.</desc>
  <!-- Арт-канон §9.0: умбра+золото, картуш-рамка, без нимбов.
       Рабочая тетрадь переводчика: строки — знаки текста, не буквы. -->
  <defs>
    <radialGradient id="sluzhebnik-perevod-bg" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#3a2410"/>
      <stop offset="100%" stop-color="#1a0e04"/>
    </radialGradient>
  </defs>
  <rect x="2" y="2" width="92" height="92" rx="10" fill="url(#sluzhebnik-perevod-bg)" stroke="#8a6a34" stroke-width="2"/>
  <rect x="7" y="7" width="82" height="82" rx="7" fill="none" stroke="#c8a56a" stroke-width="1" opacity=".55"/>
  <!-- раскрытая тетрадь -->
  <path d="M14 28 Q30 24 47 30 V78 Q30 72 14 76 Z" fill="#2a1808" stroke="#c8a56a" stroke-width="1.8"/>
  <path d="M49 30 Q66 24 82 28 V76 Q66 72 49 78 Z" fill="#2a1808" stroke="#c8a56a" stroke-width="1.8"/>
  <path d="M48 30 V78" stroke="#8a6a34" stroke-width="1.5"/>
  <!-- левый столбец: подлинник, строки с киноварной первой -->
  <path d="M19 34 H30" stroke="#c0392b" stroke-width="2"/>
  <g stroke="#e8c87a" stroke-width="1.2"><path d="M19 40 H42"/><path d="M19 46 H40"/><path d="M19 52 H42"/><path d="M19 58 H38"/><path d="M19 64 H42"/></g>
  <!-- правый столбец: перевод, строка к строке -->
  <path d="M54 34 H65" stroke="#c0392b" stroke-width="2"/>
  <g stroke="#c8a56a" stroke-width="1.2"><path d="M54 40 H77"/><path d="M54 46 H74"/><path d="M54 52 H77"/><path d="M54 58 H72"/><path d="M54 64 H70"/></g>
  <!-- нити соответствия строк -->
  <g stroke="#8a6a34" stroke-width=".8" stroke-dasharray="1.5 2"><path d="M43 40 H53"/><path d="M43 52 H53"/></g>
  <!-- чернильница и перо -->
  <path d="M66 70 H78 V80 H66 Z" fill="#1a0e04" stroke="#c8a56a" stroke-width="1.4"/>
  <path d="M72 70 L86 52" stroke="#e8c87a" stroke-width="1.6"/>
  <path d="M86 52 Q82 58 80 60" fill="none" stroke="#c8a56a" stroke-width="1.2"/>
</svg>
