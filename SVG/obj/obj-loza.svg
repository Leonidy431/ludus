<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="Виноградная лоза на шпалере с гроздью">
  <title>Виноградная лоза</title>
  <desc>ФОРМА: лоза вьётся по шпалере из жердей, резные листья, тяжёлая гроздь и отсечённая сухая ветвь. ДЕЙСТВИЕ: игрок подрезает и подвязывает лозу на террасах — сухое отсекается, чтобы живое принесло плод. ЦЕЛЬ: «Я есмь лоза, а вы ветви» (Ин. 15:5) — богатство террас от пребывания, а не от наживы. Миссия: 42 «Богатые террасы».</desc>
  <!-- Арт-канон §9.0: умбра+золото, картуш-рамка, без нимбов. -->
  <defs>
    <radialGradient id="loza-bg" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#3a2410"/>
      <stop offset="100%" stop-color="#1a0e04"/>
    </radialGradient>
  </defs>
  <rect x="2" y="2" width="92" height="92" rx="10" fill="url(#loza-bg)" stroke="#8a6a34" stroke-width="2"/>
  <rect x="7" y="7" width="82" height="82" rx="7" fill="none" stroke="#c8a56a" stroke-width="1" opacity=".55"/>
  <!-- шпалера из жердей -->
  <g stroke="#8a6a34" stroke-width="2">
    <path d="M16 86 V20 M80 86 V20 M16 30 H80 M16 54 H80"/>
  </g>
  <!-- ствол лозы -->
  <path d="M40 86 Q36 70 44 58 Q52 46 46 34 Q42 26 50 22" fill="none" stroke="#c8a56a" stroke-width="3" stroke-linecap="round"/>
  <path d="M44 58 Q60 54 70 30" fill="none" stroke="#c8a56a" stroke-width="2"/>
  <!-- листья -->
  <g fill="#8a6a34" stroke="#e8c87a" stroke-width="1">
    <path d="M28 40 l4 -8 l4 4 l4 -6 l2 8 l6 2 l-8 6 l-4 -2 l-6 2 Z"/>
    <path d="M58 22 l4 -6 l4 4 l6 -2 l-2 8 l4 4 l-8 2 l-4 -2 Z"/>
    <path d="M60 50 l6 -6 l2 6 l6 0 l-4 6 l2 6 l-8 -2 Z"/>
  </g>
  <!-- усики -->
  <path d="M52 40 q6 -2 4 4 q-2 4 2 4 M30 58 q-6 0 -4 4" fill="none" stroke="#c8a56a" stroke-width="1"/>
  <!-- гроздь -->
  <g fill="#2a1808" stroke="#e8c87a" stroke-width="1.1">
    <circle cx="46" cy="64" r="3.2"/><circle cx="53" cy="64" r="3.2"/><circle cx="60" cy="64" r="3.2"/>
    <circle cx="49.5" cy="70" r="3.2"/><circle cx="56.5" cy="70" r="3.2"/>
    <circle cx="53" cy="76" r="3.2"/>
  </g>
  <!-- отсечённая сухая ветвь -->
  <path d="M22 80 L32 74 M24 74 l4 2" stroke="#3a2410" stroke-width="2"/>
</svg>
