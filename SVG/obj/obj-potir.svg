<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="Потир, сделанный мастерами обители для храма">
  <title>Потир для храма</title>
  <desc>Потир — чаша для Евхаристии: чаша, узел, ножка на широком основании, малый крест на чаше; стоит на сложенном покровце, свет падает сверху. ФОРМА: серебро, очищенное огнём и трудом. ДЕЙСТВИЕ: игрок с мастерами обители честно выплавляет и чеканит — вещь отдаётся храму. ЦЕЛЬ: лучший труд — Богу. Святыня: не добыча, не награда, не товар; её нельзя подобрать как лут. Миссия: 81 «Обработка серебра и золота».</desc>
  <defs>
    <radialGradient id="ptr-bg" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#3a2410"/>
      <stop offset="100%" stop-color="#1a0e04"/>
    </radialGradient>
  </defs>
  <rect x="2" y="2" width="92" height="92" rx="10" fill="url(#ptr-bg)" stroke="#8a6a34" stroke-width="2"/>
  <rect x="7" y="7" width="82" height="82" rx="7" fill="none" stroke="#c8a56a" stroke-width="1" opacity=".55"/>
  <!-- тихий свет сверху -->
  <path d="M38 8 H58 L66 40 H30 Z" fill="#e8c87a" opacity=".07"/>
  <!-- чаша -->
  <path d="M30 22 H66 Q66 44 48 48 Q30 44 30 22 Z" fill="#c8a56a" stroke="#8a6a34" stroke-width="1.5"/>
  <ellipse cx="48" cy="22" rx="18" ry="3.5" fill="#2a1808" stroke="#8a6a34" stroke-width="1.2"/>
  <!-- малый крест на чаше -->
  <path d="M48 28 v12 M43 33 h10" stroke="#2a1808" stroke-width="1.8"/>
  <!-- стебель с узлом -->
  <path d="M45 48 H51 V60 H45 Z" fill="#c8a56a" stroke="#8a6a34" stroke-width="1.2"/>
  <ellipse cx="48" cy="55" rx="6" ry="3" fill="#e8c87a" stroke="#8a6a34" stroke-width="1.2"/>
  <!-- основание -->
  <path d="M45 60 Q46 66 34 72 H62 Q50 66 51 60 Z" fill="#c8a56a" stroke="#8a6a34" stroke-width="1.5"/>
  <!-- сложенный покровец -->
  <path d="M20 72 H76 L72 80 H24 Z" fill="#8a6a34" stroke="#c8a56a" stroke-width="1.2"/>
  <path d="M28 76 H68" stroke="#e8c87a" stroke-width=".8" stroke-dasharray="2 2"/>
</svg>
