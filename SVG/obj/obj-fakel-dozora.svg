<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="Факел дозора в железном держателе на стене">
  <title>Факел дозора</title>
  <desc>ФОРМА: смоляной факел в кованом держателе на каменной стене, ровное пламя. ДЕЙСТВИЕ: дозорный зажигает и гасит факел по условленному порядку — знак «всё спокойно» или «тревога» (реестр С-07). ЦЕЛЬ: бодрствование ради ближних; огонь как весть, а не угроза. Миссия: 84 «Системы сигнализации».</desc>
  <!-- Арт-канон §9.0: умбра+золото, картуш-рамка, без нимбов. -->
  <defs>
    <radialGradient id="fakd-bg" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#3a2410"/>
      <stop offset="100%" stop-color="#1a0e04"/>
    </radialGradient>
  </defs>
  <rect x="2" y="2" width="92" height="92" rx="10" fill="url(#fakd-bg)" stroke="#8a6a34" stroke-width="2"/>
  <rect x="7" y="7" width="82" height="82" rx="7" fill="none" stroke="#c8a56a" stroke-width="1" opacity=".55"/>
  <!-- каменная кладка -->
  <g stroke="#3a2410" stroke-width="1.2" fill="none">
    <path d="M10 30 H86 M10 52 H86 M10 74 H86 M30 10 V30 M62 10 V30 M46 30 V52 M22 52 V74 M72 52 V74 M40 74 V88"/>
  </g>
  <!-- кованый держатель -->
  <path d="M40 72 H56 V80 H40 Z" fill="#2a1808" stroke="#c8a56a" stroke-width="1.5"/>
  <path d="M48 72 V60 M42 60 H54" stroke="#c8a56a" stroke-width="2"/>
  <circle cx="44" cy="76" r="1.2" fill="#c8a56a"/><circle cx="52" cy="76" r="1.2" fill="#c8a56a"/>
  <!-- древко факела -->
  <path d="M48 70 L48 44" stroke="#8a6a34" stroke-width="4" stroke-linecap="round"/>
  <path d="M44 46 H52 V40 H44 Z" fill="#2a1808" stroke="#8a6a34" stroke-width="1"/>
  <!-- пламя -->
  <path d="M48 40 Q38 32 44 20 Q46 26 48 24 Q50 16 48 10 Q60 22 54 34 Q52 40 48 40 Z" fill="#e8c87a" stroke="#8a6a34" stroke-width=".8"/>
  <path d="M48 38 Q44 32 47 26 Q49 30 51 32 Q52 36 48 38 Z" fill="#fff3c0"/>
  <circle cx="48" cy="28" r="16" fill="#e8c87a" opacity=".1"/>
</svg>
