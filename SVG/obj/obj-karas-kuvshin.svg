<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="Карас — большой глиняный кувшин для вина">
  <title>Карас для вина</title>
  <desc>ФОРМА: армянский карас — пузатый глиняный сосуд, до плеч врытый в землю, с деревянной крышкой и гроздью у бока. ДЕЙСТВИЕ: игрок учится у мастера бережно хранить вино обители — меру, чистоту, время. ЦЕЛЬ: труд сада как послушание; вино — плод земли, приносимый с трезвением, без пьянства. Миссия: 70 «Монастырская винодельня/сад».</desc>
  <!-- Арт-канон §9.0: умбра+золото, картуш-рамка, без нимбов. -->
  <defs>
    <radialGradient id="kars-bg" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#3a2410"/>
      <stop offset="100%" stop-color="#1a0e04"/>
    </radialGradient>
  </defs>
  <rect x="2" y="2" width="92" height="92" rx="10" fill="url(#kars-bg)" stroke="#8a6a34" stroke-width="2"/>
  <rect x="7" y="7" width="82" height="82" rx="7" fill="none" stroke="#c8a56a" stroke-width="1" opacity=".55"/>
  <!-- земля, в которую врыт карас -->
  <path d="M8 62 H88 V88 H8 Z" fill="#2a1808"/>
  <path d="M8 62 H88" stroke="#8a6a34" stroke-width="1.5"/>
  <!-- тело караса -->
  <path d="M34 22 H62 Q80 34 78 56 Q76 80 48 84 Q20 80 18 56 Q16 34 34 22 Z" fill="#8a6a34" stroke="#c8a56a" stroke-width="1.8"/>
  <path d="M26 40 Q48 48 70 40 M22 54 Q48 62 74 54" fill="none" stroke="#c8a56a" stroke-width="1.2"/>
  <!-- часть под землёй затенена -->
  <path d="M19 62 H77 Q74 80 48 84 Q22 80 19 62 Z" fill="#1a0e04" opacity=".55"/>
  <!-- горло и деревянная крышка -->
  <path d="M34 22 V16 H62 V22" fill="#8a6a34" stroke="#c8a56a" stroke-width="1.6"/>
  <ellipse cx="48" cy="15" rx="17" ry="4" fill="#2a1808" stroke="#e8c87a" stroke-width="1.5"/>
  <path d="M48 11 V8" stroke="#e8c87a" stroke-width="2"/>
  <!-- гроздь у бока -->
  <g fill="#2a1808" stroke="#e8c87a" stroke-width="1">
    <circle cx="80" cy="64" r="2.6"/><circle cx="85" cy="64" r="2.6"/>
    <circle cx="82.5" cy="68.5" r="2.6"/><circle cx="82.5" cy="73" r="2.4"/>
  </g>
  <path d="M82 61 q2 -6 6 -6" fill="none" stroke="#8a6a34" stroke-width="1.2"/>
</svg>
