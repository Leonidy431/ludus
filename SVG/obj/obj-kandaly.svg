<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="Кандалы с замком — силой не снимаются">
  <title>Кандалы пленника</title>
  <desc>Форма: два железных обруча, цепь и тяжёлый замок. Действие: оковы не разбиваются силой; их снимает выкуп, ходатайство и милость. Цель: покровительство пленникам — дело любви, а не боя (Мф. 25:36). Миссия: 24 Покровительство пленникам.</desc>
  <!-- Арт-канон §9.0: умбра+золото, картуш-рамка, без нимбов.
       Предмет миссии 24: не оружие и не трофей; замок открывает только ключ ходатайства. -->
  <defs>
    <radialGradient id="kandaly-bg" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#3a2410"/>
      <stop offset="100%" stop-color="#1a0e04"/>
    </radialGradient>
  </defs>
  <rect x="2" y="2" width="92" height="92" rx="10" fill="url(#kandaly-bg)" stroke="#8a6a34" stroke-width="2"/>
  <rect x="7" y="7" width="82" height="82" rx="7" fill="none" stroke="#c8a56a" stroke-width="1" opacity=".55"/>
  <!-- цепь -->
  <g fill="none" stroke="#8a6a34" stroke-width="2">
    <ellipse cx="40" cy="44" rx="4" ry="2.5"/><ellipse cx="48" cy="46" rx="2.5" ry="4"/><ellipse cx="56" cy="44" rx="4" ry="2.5"/>
  </g>
  <!-- обручи -->
  <g fill="none" stroke="#c8a56a" stroke-width="4">
    <circle cx="26" cy="52" r="11"/><circle cx="70" cy="52" r="11"/>
  </g>
  <g fill="none" stroke="#1a0e04" stroke-width="1"><circle cx="26" cy="52" r="11"/><circle cx="70" cy="52" r="11"/></g>
  <path d="M34 46 L36 44 M62 46 L60 44" stroke="#c8a56a" stroke-width="2"/>
  <!-- заклёпки -->
  <g fill="#e8c87a"><circle cx="26" cy="41" r="1.8"/><circle cx="70" cy="41" r="1.8"/></g>
  <!-- висячий замок -->
  <path d="M42 64 V60 Q42 54 48 54 Q54 54 54 60 V64" fill="none" stroke="#c8a56a" stroke-width="2"/>
  <rect x="39" y="64" width="18" height="15" rx="2" fill="#2a1808" stroke="#e8c87a" stroke-width="1.6"/>
  <circle cx="48" cy="70" r="2" fill="#1a0e04" stroke="#e8c87a" stroke-width="1"/>
  <path d="M48 72 V76" stroke="#e8c87a" stroke-width="1.5"/>
  <!-- светлая полоса сверху: надежда на освобождение -->
  <path d="M20 20 Q48 12 76 20" fill="none" stroke="#e8c87a" stroke-width="1.2" opacity=".5"/>
</svg>
