<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="Ковчежец с частицей мощей апостола Матфея">
  <title>Ковчежец апостола Матфея</title>
  <desc>ФОРМА: малый ковчежец-домик с крестиком на кровле стоит на чистом плате, свет падает сверху. ДЕЙСТВИЕ: игрок хранит и переносит святыню с благоговением; её нельзя продать, взять как добычу или использовать как оружие (noLoot, noInteract кроме поклона). ЦЕЛЬ: часть святыни свидетельствует о целом (pars pro toto) — вера держится не вещью, а тем, о Ком она свидетельствует. Без нимба. Миссии: 19 «Реликварий Матфея», 20 «Pars pro toto», 32 «Фаза трансгрессии».</desc>
  <!-- Арт-канон §9.0: умбра+золото, картуш-рамка, без нимбов. -->
  <defs>
    <radialGradient id="kovm-bg" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#3a2410"/>
      <stop offset="100%" stop-color="#1a0e04"/>
    </radialGradient>
  </defs>
  <rect x="2" y="2" width="92" height="92" rx="10" fill="url(#kovm-bg)" stroke="#8a6a34" stroke-width="2"/>
  <rect x="7" y="7" width="82" height="82" rx="7" fill="none" stroke="#c8a56a" stroke-width="1" opacity=".55"/>
  <!-- свет сверху: не нимб, а падающий луч -->
  <path d="M40 10 L56 10 L64 60 L32 60 Z" fill="#e8c87a" opacity=".1"/>
  <!-- чистый плат на аналое -->
  <path d="M18 70 L78 70 L72 80 L24 80 Z" fill="#e8d9b8" stroke="#8a6a34" stroke-width="1.2" opacity=".9"/>
  <path d="M30 80 v4 M48 80 v5 M66 80 v4" stroke="#c8a56a" stroke-width="1.2"/>
  <!-- корпус ковчежца -->
  <rect x="30" y="46" width="36" height="24" rx="1.5" fill="#2a1808" stroke="#c8a56a" stroke-width="1.8"/>
  <!-- двускатная кровля -->
  <path d="M27 46 L48 32 L69 46 Z" fill="#c8a56a" stroke="#8a6a34" stroke-width="1.5"/>
  <path d="M34 44 L48 35 L62 44" fill="none" stroke="#8a6a34" stroke-width="1"/>
  <!-- крестик на кровле -->
  <path d="M48 32 V22 M44.5 26 H51.5" stroke="#e8c87a" stroke-width="1.8"/>
  <!-- аркада на стенке и оконце-частица -->
  <g fill="none" stroke="#8a6a34" stroke-width="1.2">
    <path d="M34 68 V56 Q37 52 40 56 V68"/>
    <path d="M56 68 V56 Q59 52 62 56 V68"/>
  </g>
  <rect x="44" y="52" width="8" height="10" rx="1" fill="#1a0e04" stroke="#e8c87a" stroke-width="1.2"/>
  <circle cx="48" cy="57" r="1.6" fill="#e8c87a"/>
  <!-- ножки ковчежца -->
  <path d="M32 70 v2 M64 70 v2" stroke="#c8a56a" stroke-width="2"/>
</svg>
