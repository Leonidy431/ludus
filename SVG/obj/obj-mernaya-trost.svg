<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="Мерная трость в броде">
  <title>Мерная трость</title>
  <desc>Мерная трость с зарубками-делениями, поставленная в брод: уровень воды читается по меткам, течение огибает трость. ФОРМА: мера, данная заранее. ДЕЙСТВИЕ: игрок меряет глубину и решает, пройдёт ли караван, нужен ли мост. ЦЕЛЬ: трезвение — сперва измерь, потом иди; ответственность за жизни идущих. Миссия: 73 «Мосты и дороги миссии» (реестр Д-10).</desc>
  <defs>
    <radialGradient id="mtr-bg" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#3a2410"/>
      <stop offset="100%" stop-color="#1a0e04"/>
    </radialGradient>
  </defs>
  <rect x="2" y="2" width="92" height="92" rx="10" fill="url(#mtr-bg)" stroke="#8a6a34" stroke-width="2"/>
  <rect x="7" y="7" width="82" height="82" rx="7" fill="none" stroke="#c8a56a" stroke-width="1" opacity=".55"/>
  <!-- вода брода -->
  <path d="M9 56 Q48 52 87 56 V82 Q87 87 82 87 H14 Q9 87 9 82 Z" fill="#0d2a3a"/>
  <g fill="none" stroke="#1f5a73" stroke-width="1.5">
    <path d="M14 64 Q24 61 34 64"/><path d="M60 70 Q70 67 80 70"/><path d="M20 78 Q30 75 40 78"/>
  </g>
  <!-- трость -->
  <rect x="44" y="14" width="8" height="68" rx="2" fill="#8a6a34" stroke="#e8c87a" stroke-width="1.5"/>
  <!-- деления: длинные через каждые пять -->
  <g stroke="#1a0e04" stroke-width="1.2">
    <path d="M44 22 h8 M44 26 h4 M44 30 h4 M44 34 h4 M44 38 h4 M44 42 h8 M44 46 h4 M44 50 h4 M44 54 h4"/>
  </g>
  <!-- обтекание воды вокруг трости -->
  <path d="M38 56 Q44 53 48 56 Q52 53 58 56" fill="none" stroke="#e8c87a" stroke-width="1.3"/>
  <path d="M54 60 Q62 60 68 62" fill="none" stroke="#e8c87a" stroke-width="1" opacity=".6"/>
  <!-- навершие-петля для верёвки -->
  <circle cx="48" cy="12" r="3" fill="none" stroke="#c8a56a" stroke-width="1.5"/>
</svg>
