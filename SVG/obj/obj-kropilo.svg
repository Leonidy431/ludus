<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="Кропило и чаша святой воды">
  <title>Кропило и чаша святой воды</title>
  <desc>Чаша со святой водой и кропило из пучка трав, с которого падают капли. ФОРМА: вода, освящённая молитвой Церкви. ДЕЙСТВИЕ: игрок участвует в освящении нового стана — это чин, а не заклинание и не оружие. ЦЕЛЬ: вся жизнь общины посвящается Богу; святыня не бывает ни добычей, ни силой против врага. Миссия: 23 «Форпост веры».</desc>
  <defs>
    <radialGradient id="krp-bg" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#3a2410"/>
      <stop offset="100%" stop-color="#1a0e04"/>
    </radialGradient>
  </defs>
  <rect x="2" y="2" width="92" height="92" rx="10" fill="url(#krp-bg)" stroke="#8a6a34" stroke-width="2"/>
  <rect x="7" y="7" width="82" height="82" rx="7" fill="none" stroke="#c8a56a" stroke-width="1" opacity=".55"/>
  <!-- чаша на низкой ножке -->
  <path d="M20 54 H64 Q62 70 42 72 Q22 70 20 54 Z" fill="#c8a56a" stroke="#8a6a34" stroke-width="1.5"/>
  <ellipse cx="42" cy="54" rx="22" ry="4.5" fill="#1f5a73" stroke="#8a6a34" stroke-width="1.2"/>
  <path d="M36 72 H48 L50 80 H34 Z" fill="#8a6a34" stroke="#c8a56a" stroke-width="1.2"/>
  <!-- малый крест на чаше -->
  <path d="M42 58 v9 M38.5 61.5 h7" stroke="#1a0e04" stroke-width="1.5"/>
  <!-- кропило: рукоять и пучок трав -->
  <path d="M80 16 L60 40" stroke="#c8a56a" stroke-width="3" stroke-linecap="round"/>
  <g stroke="#e8c87a" stroke-width="1.3" fill="none">
    <path d="M60 40 L52 46 M60 40 L54 48 M60 40 L57 49 M60 40 L50 43 M60 40 L60 49"/>
  </g>
  <path d="M58 38 L62 42" stroke="#8a6a34" stroke-width="2.5"/>
  <!-- падающие капли -->
  <g fill="#e8c87a" opacity=".85">
    <path d="M46 26 q2 3 0 4 q-2 -1 0 -4 Z"/><path d="M38 32 q2 3 0 4 q-2 -1 0 -4 Z"/><path d="M50 16 q2 3 0 4 q-2 -1 0 -4 Z"/>
  </g>
</svg>
