<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="Эталонные гири ярмарки">
  <title>Эталонные гири</title>
  <desc>Форма: вложенный набор бронзовых гирь с клеймом на общей доске. Действие: сверить гири купцов с эталоном перед ярмаркой. Цель: одна мера для всех — справедливость без лицеприятия (Притч. 11:1). Миссия: 56 Участие в ярмарках.</desc>
  <!-- Арт-канон §9.0: умбра+золото, картуш-рамка, без нимбов.
       Предмет ярмарки: эталон меры, клеймо обители. -->
  <defs>
    <radialGradient id="etalon-giri-bg" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#3a2410"/>
      <stop offset="100%" stop-color="#1a0e04"/>
    </radialGradient>
  </defs>
  <rect x="2" y="2" width="92" height="92" rx="10" fill="url(#etalon-giri-bg)" stroke="#8a6a34" stroke-width="2"/>
  <rect x="7" y="7" width="82" height="82" rx="7" fill="none" stroke="#c8a56a" stroke-width="1" opacity=".55"/>
  <!-- доска-подставка -->
  <path d="M14 70 H82 L78 78 H18 Z" fill="#2a1808" stroke="#8a6a34" stroke-width="1.5"/>
  <!-- ряд гирь от большой к малой -->
  <g fill="#8a6a34" stroke="#e8c87a" stroke-width="1.6">
    <path d="M18 70 V48 Q18 42 24 42 H36 Q42 42 42 48 V70 Z"/>
    <path d="M46 70 V54 Q46 50 50 50 H58 Q62 50 62 54 V70 Z"/>
    <path d="M65 70 V60 Q65 57 68 57 H73 Q76 57 76 60 V70 Z"/>
  </g>
  <!-- ручки -->
  <g fill="none" stroke="#c8a56a" stroke-width="2">
    <path d="M24 42 Q30 32 36 42"/><path d="M50 50 Q54 44 58 50"/><path d="M68 57 Q70.5 53 73 57"/>
  </g>
  <!-- клеймо: кольцо с точкой (мерный знак, не святыня) -->
  <circle cx="30" cy="57" r="6" fill="#2a1808" stroke="#e8c87a" stroke-width="1.2"/>
  <circle cx="30" cy="57" r="3" fill="none" stroke="#e8c87a" stroke-width="1"/><circle cx="30" cy="57" r="1" fill="#e8c87a"/>
  <circle cx="54" cy="61" r="3" fill="none" stroke="#e8c87a" stroke-width="1"/>
  <!-- чистая мера — лёгкий свет -->
  <circle cx="48" cy="56" r="26" fill="#e8c87a" opacity=".06"/>
</svg>
