<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="Лодка паломника у террас">
  <title>Лодка паломника</title>
  <desc>Форма: деревянная плоскодонка с вёслами на глади озера у береговой террасы. Действие: плыть от террасы к террасе, отмечая прежние берега. Цель: путь как паломничество — каждая терраса ступень памяти. Миссия: 28 Паломничество по террасам.</desc>
  <!-- Арт-канон §9.0: умбра+золото, картуш-рамка, без нимбов.
       Транспорт миссии 28: простая лодка, без украшений. -->
  <defs>
    <radialGradient id="lodka-bg" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#3a2410"/>
      <stop offset="100%" stop-color="#1a0e04"/>
    </radialGradient>
  </defs>
  <rect x="2" y="2" width="92" height="92" rx="10" fill="url(#lodka-bg)" stroke="#8a6a34" stroke-width="2"/>
  <rect x="7" y="7" width="82" height="82" rx="7" fill="none" stroke="#c8a56a" stroke-width="1" opacity=".55"/>
  <!-- ступени береговых террас -->
  <path d="M8 44 H30 V36 H52 V28 H88 V52 H8 Z" fill="#2a1808" stroke="#8a6a34" stroke-width="1.2"/>
  <g stroke="#c8a56a" stroke-width="1.2" fill="none"><path d="M8 44 H30 V36 H52 V28 H88"/></g>
  <!-- вода -->
  <rect x="8" y="52" width="80" height="36" rx="5" fill="#0d2a3a"/>
  <g fill="none" stroke="#1f5a73" stroke-width="1.4">
    <path d="M14 82 Q22 79 30 82"/><path d="M62 84 Q70 81 78 84"/><path d="M12 60 Q18 58 24 60"/>
  </g>
  <!-- корпус лодки -->
  <path d="M18 62 H78 L70 74 H26 Z" fill="#8a6a34" stroke="#e8c87a" stroke-width="1.8"/>
  <path d="M22 67 H74" stroke="#2a1808" stroke-width="1.5"/>
  <!-- вёсла -->
  <g stroke="#c8a56a" stroke-width="2"><path d="M36 60 L24 80"/><path d="M60 60 L72 80"/></g>
  <g fill="#c8a56a"><ellipse cx="23" cy="82" rx="2.5" ry="4" transform="rotate(30 23 82)"/><ellipse cx="73" cy="82" rx="2.5" ry="4" transform="rotate(-30 73 82)"/></g>
  <!-- отражение -->
  <path d="M28 77 H68" stroke="#1f5a73" stroke-width="1.5"/>
</svg>
