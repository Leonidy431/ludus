<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="Запечатанное письмо на перекрёстке путей вестей">
  <title>Письмо с вестями</title>
  <desc>ФОРМА: сложенное письмо, перевязанное шнуром, с красной восковой печатью; вокруг пунктир путей к четырём станциям. ДЕЙСТВИЕ: игрок узнаёт о нуждах общин через купцов и странников и отвечает помощью, а не слежкой и доносом. ЦЕЛЬ: весть служит любви; знание о ближнем — ради заботы о нём. Миссия: 53 Сеть информаторов.</desc>
  <!-- Арт-канон §9.0: умбра+золото, без нимбов. Рисовано вручную: сырьё 99 репо не подходит (правило 0.15). -->
  <defs>
    <radialGradient id="pismo-vesti-bg" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#3a2410"/>
      <stop offset="100%" stop-color="#1a0e04"/>
    </radialGradient>
  </defs>
  <rect x="2" y="2" width="92" height="92" rx="10" fill="url(#pismo-vesti-bg)" stroke="#8a6a34" stroke-width="2"/>
  <rect x="7" y="7" width="82" height="82" rx="7" fill="none" stroke="#c8a56a" stroke-width="1" opacity=".55"/>
  <!-- пути вестей и станции -->
  <g stroke="#8a6a34" stroke-width="1" stroke-dasharray="2 3" fill="none">
    <path d="M48 48 L18 18 M48 48 L78 18 M48 48 L18 78 M48 48 L78 78"/>
  </g>
  <g fill="#2a1808" stroke="#c8a56a" stroke-width="1.3">
    <circle cx="18" cy="18" r="3.5"/><circle cx="78" cy="18" r="3.5"/><circle cx="18" cy="78" r="3.5"/><circle cx="78" cy="78" r="3.5"/>
  </g>
  <!-- сложенное письмо -->
  <rect x="24" y="33" width="48" height="30" rx="1.5" fill="#e8d9b8" stroke="#8a6a34" stroke-width="1.5"/>
  <path d="M24 33 L48 51 L72 33" fill="none" stroke="#8a6a34" stroke-width="1.3"/>
  <path d="M29 58 H43 M53 58 H67" stroke="#8a6a34" stroke-width="1" opacity=".7"/>
  <!-- шнур -->
  <path d="M24 48 H72" stroke="#c8a56a" stroke-width="1.6"/>
  <!-- восковая печать -->
  <circle cx="48" cy="50" r="5" fill="#c0392b" stroke="#8a6a34" stroke-width="1"/>
  <circle cx="48" cy="50" r="2.2" fill="none" stroke="#1a0e04" stroke-width=".8"/>
</svg>
