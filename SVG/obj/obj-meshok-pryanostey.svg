<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="Мешок пряностей — перец, корица и бадьян">
  <title>Мешок пряностей</title>
  <desc>ФОРМА: раскрытый холщовый мешок, перевязанный шнуром; рядом рассыпаны перец, палочки корицы и звёздочки бадьяна. ДЕЙСТВИЕ: армянский купец отмеряет товар честной мерой, дьякон помогает свести счёт без обмана. ЦЕЛЬ: честная торговля — добродетель, противоположная сребролюбию. Миссия: 2 Армянская фактория.</desc>
  <!-- Арт-канон §9.0: умбра+золото, картуш-рамка, без нимбов. -->
  <defs>
    <radialGradient id="spice-bg" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#3a2410"/>
      <stop offset="100%" stop-color="#1a0e04"/>
    </radialGradient>
  </defs>
  <rect x="2" y="2" width="92" height="92" rx="10" fill="url(#spice-bg)" stroke="#8a6a34" stroke-width="2"/>
  <rect x="7" y="7" width="82" height="82" rx="7" fill="none" stroke="#c8a56a" stroke-width="1" opacity=".55"/>
  <!-- тело мешка -->
  <path d="M28 40 Q20 60 26 76 H70 Q76 60 68 40 Z" fill="#2a1808" stroke="#c8a56a" stroke-width="1.8"/>
  <!-- отвёрнутый край горловины -->
  <path d="M26 40 Q30 32 36 36 Q42 30 48 35 Q54 30 60 36 Q66 32 70 40 Q48 46 26 40 Z" fill="#8a6a34" stroke="#c8a56a" stroke-width="1.4"/>
  <!-- горка перца в горловине -->
  <path d="M34 38 Q48 26 62 38 Q48 42 34 38 Z" fill="#1a0e04"/>
  <g fill="#e8c87a"><circle cx="42" cy="35" r="1.3"/><circle cx="48" cy="32" r="1.3"/><circle cx="54" cy="35" r="1.3"/><circle cx="46" cy="37" r="1.2"/><circle cx="51" cy="37" r="1.2"/></g>
  <!-- шнур и узел -->
  <path d="M28 46 Q48 52 68 46" fill="none" stroke="#e8c87a" stroke-width="1.6"/>
  <path d="M60 49 q2 6 -2 10 M62 49 q4 5 2 9" fill="none" stroke="#e8c87a" stroke-width="1.2"/>
  <!-- холщовые швы -->
  <g stroke="#8a6a34" stroke-width="1" stroke-dasharray="2 2"><path d="M34 54 V74 M48 56 V76"/></g>
  <!-- палочки корицы -->
  <g fill="#8a6a34" stroke="#c8a56a" stroke-width="1">
    <rect x="12" y="74" width="16" height="4" rx="2" transform="rotate(-18 20 76)"/>
    <rect x="14" y="80" width="15" height="4" rx="2" transform="rotate(-8 21 82)"/>
  </g>
  <!-- звёздочка бадьяна -->
  <g transform="translate(78,76)" fill="#8a6a34" stroke="#e8c87a" stroke-width=".9">
    <path d="M0 -6 L1.6 -1.6 L6 0 L1.6 1.6 L0 6 L-1.6 1.6 L-6 0 L-1.6 -1.6 Z"/>
    <circle r="1.2" fill="#e8c87a"/>
  </g>
  <!-- рассыпанные горошины -->
  <g fill="#e8c87a"><circle cx="34" cy="82" r="1.2"/><circle cx="62" cy="82" r="1.2"/><circle cx="68" cy="80" r="1"/></g>
</svg>
