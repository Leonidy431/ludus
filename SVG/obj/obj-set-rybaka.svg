<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="Сеть рыбака с поплавками и грузилами">
  <title>Сеть рыбака</title>
  <desc>Форма: ячеистая сеть, растянутая между верхней верёвкой с деревянными поплавками и нижней с каменными грузилами, в сети одна рыба. Действие: рыбак Иссык-Куля чинит и забрасывает сеть; игрок помогает и слушает. Цель: образ апостольского призвания — «ловцы человеков» (Мф. 4:19); рыба в сети связывает труд берега со знаком Ихтис. Миссия: 16 «Символ Ихтиса».</desc>
  <!-- Арт-канон §9.0: умбра+золото, картуш-рамка, без нимбов. -->
  <defs>
    <radialGradient id="set-ryb-bg" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#3a2410"/>
      <stop offset="100%" stop-color="#1a0e04"/>
    </radialGradient>
  </defs>
  <rect x="2" y="2" width="92" height="92" rx="10" fill="url(#set-ryb-bg)" stroke="#8a6a34" stroke-width="2"/>
  <rect x="7" y="7" width="82" height="82" rx="7" fill="none" stroke="#c8a56a" stroke-width="1" opacity=".55"/>
  <!-- верхняя и нижняя верёвки -->
  <path d="M14 22 Q48 28 82 22" fill="none" stroke="#c8a56a" stroke-width="2"/>
  <path d="M18 74 Q48 80 78 74" fill="none" stroke="#c8a56a" stroke-width="2"/>
  <!-- ячея сети -->
  <g fill="none" stroke="#8a6a34" stroke-width="1.1">
    <path d="M14 22 L30 76 M26 24 L42 78 M38 25 L54 78 M50 26 L66 77 M62 25 L78 74 M74 24 L82 50"/>
    <path d="M82 22 L66 76 M70 24 L54 78 M58 25 L42 78 M46 26 L30 77 M34 25 L18 74 M22 24 L14 50"/>
  </g>
  <!-- деревянные поплавки -->
  <g fill="#e8c87a" stroke="#8a6a34" stroke-width="1">
    <ellipse cx="24" cy="24" rx="4" ry="2.5"/><ellipse cx="48" cy="26" rx="4" ry="2.5"/><ellipse cx="72" cy="24" rx="4" ry="2.5"/>
  </g>
  <!-- каменные грузила -->
  <g fill="#2a1808" stroke="#c8a56a" stroke-width="1">
    <circle cx="28" cy="77" r="3"/><circle cx="48" cy="80" r="3"/><circle cx="68" cy="77" r="3"/>
  </g>
  <!-- одна рыба в сети -->
  <path d="M36 52 Q48 43 60 52 Q48 60 36 52 Z" fill="#c8a56a" stroke="#e8c87a" stroke-width="1.2"/>
  <path d="M60 52 L66 47 V57 Z" fill="#c8a56a" stroke="#e8c87a" stroke-width="1"/>
  <circle cx="41" cy="51" r="1.1" fill="#1a0e04"/>
</svg>
