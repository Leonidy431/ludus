<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="Кайрак — надгробный камень с крестом и сирийской надписью">
  <title>Кайрак — надгробный камень с крестом и сирийской надписью</title>
  <desc>ФОРМА: речной валун-кайрак из семиреченских христианских кладбищ, на нём процарапан крест с расширенными концами над полумесяцем-лотосом и строки сирийской надписи. ДЕЙСТВИЕ: игрок читает камень, а не забирает его: это память об умершем, не добыча. ЦЕЛЬ: христиане жили у озера до миссии, и память о них требует уважения к Церкви Востока. Миссии 17, 34, 39, 59.</desc>
  <!-- Арт-канон §9.0: умбра+золото, двойная рамка-картуш -->
  <rect x="2" y="2" width="92" height="92" rx="10" fill="#1a0e04" stroke="#8a6a34" stroke-width="2"/>
  <rect x="7" y="7" width="82" height="82" rx="7" fill="none" stroke="#c8a56a" stroke-width="1" opacity=".55"/>
  <!-- валун-кайрак, стоящий в траве -->
  <path d="M26 76 Q20 50 30 30 Q44 16 62 22 Q76 30 72 56 Q70 70 70 76 Z" fill="#2a1808" stroke="#c8a56a" stroke-width="2"/>
  <path d="M34 30 Q46 22 58 26" fill="none" stroke="#8a6a34" stroke-width="1.2"/>
  <!-- крест с расширенными концами и точками на концах -->
  <g stroke="#e8c87a" stroke-width="2" fill="none">
    <path d="M48 28 V46 M40 37 H56"/>
    <path d="M45 28 H51 M45 46 H51 M40 34 V40 M56 34 V40"/>
  </g>
  <g fill="#e8c87a">
    <circle cx="48" cy="26" r="1.2"/><circle cx="38" cy="37" r="1.2"/><circle cx="58" cy="37" r="1.2"/>
  </g>
  <!-- полумесяц-лотос под крестом -->
  <path d="M40 48 Q48 54 56 48 Q48 51 40 48 Z" fill="#c8a56a" stroke="#c8a56a" stroke-width="1"/>
  <!-- строки сирийской надписи (эстрангело, условно) -->
  <g stroke="#c8a56a" stroke-width="1.2" fill="none" stroke-linecap="round">
    <path d="M34 58 H62 M36 58 v-3 M41 58 q2 -4 4 0 M49 58 v-4 h2 M55 58 q2 -3 4 0"/>
    <path d="M34 66 H62 M37 66 q2 -4 4 0 M44 66 v-3 M48 66 v-4 h3 M56 66 v-3 M60 66 q-2 -3 -4 0"/>
  </g>
  <!-- трава у подножия -->
  <path d="M16 78 H80" stroke="#8a6a34" stroke-width="2"/>
  <g stroke="#8a6a34" stroke-width="1.4" fill="none">
    <path d="M22 78 l-2 -6 M26 78 l1 -7 M70 78 l2 -6 M74 78 l-1 -5"/>
  </g>
</svg>
