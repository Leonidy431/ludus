<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="Летопись уровней озера">
  <title>Летопись уровней озера</title>
  <desc>ФОРМА: раскрытая тетрадь с отметками уровня воды по годам, линия поднимается и опускается, рядом калам. ДЕЙСТВИЕ: игрок сверяет записи монахов с наблюдением на берегу и строит прогноз, а не гадает. ЦЕЛЬ: терпеливое наблюдение творения учит предусмотрительности. Миссия 33.</desc>
  <!-- Арт-канон §9.0: умбра+золото, двойная рамка-картуш -->
  <rect x="2" y="2" width="92" height="92" rx="10" fill="#1a0e04" stroke="#8a6a34" stroke-width="2"/>
  <rect x="7" y="7" width="82" height="82" rx="7" fill="none" stroke="#c8a56a" stroke-width="1" opacity=".55"/>
  <!-- раскрытая тетрадь -->
  <path d="M12 26 L48 30 L84 26 L84 72 L48 76 L12 72 Z" fill="#c8a56a" stroke="#8a6a34" stroke-width="2"/>
  <path d="M48 30 V76" stroke="#8a6a34" stroke-width="1.5"/>
  <!-- сетка годов на левой странице -->
  <g stroke="#8a6a34" stroke-width=".8" opacity=".7">
    <path d="M16 40 H44 M16 50 H44 M16 60 H44"/>
    <path d="M22 32 V70 M30 33 V70 M38 34 V71"/>
  </g>
  <!-- кривая уровня воды (синяя, как вода) -->
  <path d="M16 56 L22 48 L30 52 L38 42 L44 46" fill="none" stroke="#1f5a73" stroke-width="2"/>
  <!-- правая страница: волна и строки записей -->
  <path d="M54 42 q4 -4 8 0 q4 4 8 0 q4 -4 8 0" fill="none" stroke="#1f5a73" stroke-width="1.6"/>
  <g stroke="#2a1808" stroke-width="1.2"><path d="M54 52 H78 M54 58 H74 M54 64 H78"/></g>
  <!-- калам -->
  <path d="M60 86 L88 62" stroke="#3a2410" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M60 86 l3 -1 l-2 -2 Z" fill="#e8c87a"/>
</svg>
