<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="Водосвятная чаша с тремя свечами">
  <title>Водосвятная чаша с тремя свечами</title>
  <desc>ФОРМА: широкая чаша на ножке с водой, на краю три свечи, рядом кропило из веток. ДЕЙСТВИЕ: вода освящается молитвой Церкви на службе, игрок только сопутствует чину и не использует воду как зелье или бонус. ЦЕЛЬ: вода озера и вода крещения — дар, а не ресурс. Миссия 43.</desc>
  <!-- Арт-канон §9.0: умбра+золото, двойная рамка-картуш -->
  <rect x="2" y="2" width="92" height="92" rx="10" fill="#1a0e04" stroke="#8a6a34" stroke-width="2"/>
  <rect x="7" y="7" width="82" height="82" rx="7" fill="none" stroke="#c8a56a" stroke-width="1" opacity=".55"/>
  <!-- три свечи на краю чаши -->
  <g fill="#e8c87a" stroke="#c8a56a" stroke-width="1">
    <rect x="30" y="30" width="3" height="12"/><rect x="46.5" y="26" width="3" height="14"/><rect x="63" y="30" width="3" height="12"/>
  </g>
  <g fill="#e8c87a">
    <path d="M31.5 24 q2.5 3 0 6 q-2.5 -3 0 -6 Z"/><path d="M48 20 q2.5 3 0 6 q-2.5 -3 0 -6 Z"/><path d="M64.5 24 q2.5 3 0 6 q-2.5 -3 0 -6 Z"/>
  </g>
  <!-- чаша -->
  <path d="M20 44 H76 Q74 62 48 64 Q22 62 20 44 Z" fill="#c8a56a" stroke="#8a6a34" stroke-width="1.8"/>
  <ellipse cx="48" cy="44" rx="28" ry="5" fill="#1f5a73" stroke="#8a6a34" stroke-width="1.5"/>
  <path d="M34 44 Q40 42 46 44 M52 45 Q58 43 64 45" stroke="#0d2a3a" stroke-width="1" fill="none"/>
  <!-- ножка и подножие -->
  <path d="M44 64 L42 74 H54 L52 64" fill="#8a6a34" stroke="#8a6a34" stroke-width="1"/>
  <ellipse cx="48" cy="76" rx="14" ry="3.5" fill="#c8a56a" stroke="#8a6a34" stroke-width="1.5"/>
  <!-- кропило из веток у подножия -->
  <path d="M68 80 L80 60" stroke="#8a6a34" stroke-width="2"/>
  <g fill="none" stroke="#c8a56a" stroke-width="1.3"><path d="M78 63 l-5 -2 M79 61 l4 -4 M80 60 l-1 -5"/></g>
</svg>
