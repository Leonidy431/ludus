<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="Плоскодонная баржа у верфи на озере">
  <title>Баржа</title>
  <desc>ФОРМА: плоскодонная баржа с мачтой и свёрнутым парусом, тюками груза и кормовым веслом, на воде Иссык-Куля. ДЕЙСТВИЕ: на верфях Светлого Мыса братия и местные мастера строят суда для перевозки зерна и людей. ЦЕЛЬ: ремесло как служение общине; озеро соединяет, а не разделяет. Миссия: 68 Верфи на Светлом Мысу.</desc>
  <!-- Арт-канон §9.0: умбра+золото, без нимбов. Рисовано вручную: сырьё 99 репо не подходит (правило 0.15). -->
  <defs>
    <radialGradient id="lodka-barzha-bg" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#3a2410"/>
      <stop offset="100%" stop-color="#1a0e04"/>
    </radialGradient>
  </defs>
  <rect x="2" y="2" width="92" height="92" rx="10" fill="url(#lodka-barzha-bg)" stroke="#8a6a34" stroke-width="2"/>
  <rect x="7" y="7" width="82" height="82" rx="7" fill="none" stroke="#c8a56a" stroke-width="1" opacity=".55"/>
  <!-- вода -->
  <path d="M8 60 H88 V87 H8 Z" fill="#0d2a3a"/>
  <g stroke="#1f5a73" stroke-width="1.3" fill="none">
    <path d="M12 72 Q20 69 28 72 M58 76 Q66 73 74 76 M30 82 Q38 79 46 82"/>
  </g>
  <!-- мачта, рей, свёрнутый парус -->
  <path d="M48 52 V16" stroke="#8a6a34" stroke-width="2"/>
  <path d="M34 21 H62" stroke="#c8a56a" stroke-width="1.8"/>
  <path d="M35 22 H61 L59 27 H37 Z" fill="#e8d9b8" opacity=".85" stroke="#8a6a34" stroke-width="1"/>
  <path d="M48 16 L34 21 M48 16 L62 21 M48 18 L20 50 M48 18 L78 50" stroke="#8a6a34" stroke-width=".8"/>
  <!-- тюки груза -->
  <g fill="#c8a56a" stroke="#8a6a34" stroke-width="1">
    <rect x="24" y="42" width="12" height="9" rx="1.5"/><rect x="56" y="43" width="10" height="8" rx="1.5"/>
  </g>
  <!-- корпус баржи с обшивкой -->
  <path d="M13 51 H83 L76 65 H20 Z" fill="#2a1808" stroke="#c8a56a" stroke-width="1.8"/>
  <g stroke="#8a6a34" stroke-width="1"><path d="M16 56 H80 M18 60.5 H78"/></g>
  <!-- кормовое весло -->
  <path d="M80 50 L87 68" stroke="#c8a56a" stroke-width="1.8"/>
  <!-- отражение корпуса -->
  <path d="M24 68 H72" stroke="#1f5a73" stroke-width="2" opacity=".8"/>
</svg>
