<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="Походный котёл на треноге над огнём">
  <title>Походный котёл</title>
  <desc>Форма: медный котёл с дужкой на железной треноге, похлёбка с паром, огонь и поленья, половник на крюке. Действие: накормить всех у одного огня — паломника, погонщика и странника, не спрашивая веры. Цель: трапеза как дело милосердия (Мф. 25:35); реестр С-13. Миссия: 83 Полевые кухни.</desc>
  <!-- Арт-канон §9.0: умбра+золото, картуш-рамка, без нимбов. Объект: полевая кухня миссии. -->
  <defs>
    <radialGradient id="kotel-bg" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#3a2410"/>
      <stop offset="100%" stop-color="#1a0e04"/>
    </radialGradient>
  </defs>
  <rect x="2" y="2" width="92" height="92" rx="10" fill="url(#kotel-bg)" stroke="#8a6a34" stroke-width="2"/>
  <rect x="7" y="7" width="82" height="82" rx="7" fill="none" stroke="#c8a56a" stroke-width="1" opacity=".55"/>
  <!-- тренога -->
  <g stroke="#8a6a34" stroke-width="2" fill="none"><path d="M48 14 L20 84 M48 14 L76 84 M48 14 V30"/></g>
  <circle cx="48" cy="14" r="2.5" fill="#c8a56a"/>
  <!-- дужка котла -->
  <path d="M32 42 Q48 26 64 42" fill="none" stroke="#c8a56a" stroke-width="1.6"/>
  <!-- котёл -->
  <path d="M28 42 H68 Q68 66 48 68 Q28 66 28 42 Z" fill="#8a6a34" stroke="#e8c87a" stroke-width="1.8"/>
  <ellipse cx="48" cy="42" rx="20" ry="4" fill="#2a1808" stroke="#e8c87a" stroke-width="1.4"/>
  <path d="M34 52 Q48 56 62 52" fill="none" stroke="#c8a56a" stroke-width="1"/>
  <!-- пар -->
  <g fill="none" stroke="#e8d9b8" stroke-width="1.2" opacity=".6"><path d="M42 36 q-3 -5 0 -9 q3 -4 0 -8"/><path d="M54 36 q3 -5 0 -9"/></g>
  <!-- огонь и поленья -->
  <path d="M38 80 Q40 70 44 74 Q46 64 50 72 Q54 66 58 80 Z" fill="#e8c87a" stroke="#c8a56a" stroke-width="1"/>
  <path d="M44 78 Q48 72 52 78 Z" fill="#c0392b"/>
  <g stroke="#2a1808" stroke-width="3" stroke-linecap="round"><path d="M32 84 L60 78 M36 78 L64 84"/></g>
  <!-- половник на крюке -->
  <path d="M70 24 V40 q0 4 -4 4" fill="none" stroke="#c8a56a" stroke-width="1.4"/>
</svg>
