<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="Отрез ткани — рулон с развёрнутым полотном">
  <title>Отрез ткани</title>
  <desc>ФОРМА: рулон ткани с развёрнутым и сложенным концом, узорная кайма, мерный шнур. ДЕЙСТВИЕ: караван делит ткань на отрезы и раздаёт нуждающимся на зиму — равной мерой и без огласки дарителя. ЦЕЛЬ: милостыня втайне — «одеть нагого». Миссия: 9 Караван благотворительности.</desc>
  <!-- Арт-канон §9.0: умбра+золото, картуш-рамка, без нимбов. -->
  <defs>
    <radialGradient id="tkan-bg" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#3a2410"/>
      <stop offset="100%" stop-color="#1a0e04"/>
    </radialGradient>
  </defs>
  <rect x="2" y="2" width="92" height="92" rx="10" fill="url(#tkan-bg)" stroke="#8a6a34" stroke-width="2"/>
  <rect x="7" y="7" width="82" height="82" rx="7" fill="none" stroke="#c8a56a" stroke-width="1" opacity=".55"/>
  <!-- развёрнутое полотно с изгибом -->
  <path d="M30 36 L74 30 Q80 42 74 54 L78 72 L30 76 Z" fill="#8a6a34" stroke="#c8a56a" stroke-width="1.5"/>
  <!-- узорная кайма: ромбы -->
  <g fill="none" stroke="#e8c87a" stroke-width="1.2">
    <path d="M32 70 L76 66"/>
    <path d="M36 70 l3 -3 3 3 -3 3 Z M48 69 l3 -3 3 3 -3 3 Z M60 68 l3 -3 3 3 -3 3 Z"/>
  </g>
  <!-- сгиб полотна -->
  <path d="M74 54 Q64 52 56 56" fill="none" stroke="#2a1808" stroke-width="1.4"/>
  <!-- рулон -->
  <rect x="16" y="30" width="18" height="50" rx="4" fill="#2a1808" stroke="#c8a56a" stroke-width="1.6"/>
  <ellipse cx="25" cy="30" rx="9" ry="3.5" fill="#8a6a34" stroke="#c8a56a" stroke-width="1.4"/>
  <ellipse cx="25" cy="30" rx="4" ry="1.6" fill="none" stroke="#e8c87a" stroke-width="1"/>
  <circle cx="25" cy="30" r="1" fill="#1a0e04"/>
  <!-- витки ткани на рулоне -->
  <g stroke="#8a6a34" stroke-width="1"><path d="M17 44 Q25 47 33 44 M17 58 Q25 61 33 58"/></g>
  <!-- мерный шнур с узелками-локтями -->
  <path d="M38 22 Q56 16 78 22" fill="none" stroke="#e8c87a" stroke-width="1.3"/>
  <g fill="#e8c87a"><circle cx="46" cy="19.5" r="1.4"/><circle cx="58" cy="18" r="1.4"/><circle cx="70" cy="19.5" r="1.4"/></g>
</svg>
