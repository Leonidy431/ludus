<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="Портулан — морская карта с розой ветров">
  <title>Портулан</title>
  <desc>Форма: пергаментная карта с береговой линией, сетью румбов из розы ветров, островами и якорными стоянками. Действие: прокладывать путь по проверенным румбам, сверяя карту с опытом кормчих. Цель: знание мира ради встречи народов, а не ради захвата; союз армянских и генуэзских купцов держится на точной карте и честном слове. Миссии: 7 Армяно-генуэзский союз, 87 Картографы Крескесы.</desc>
  <!-- Арт-канон §9.0: умбра+золото, картуш-рамка, без нимбов. Объект: генуэзско-майоркский портулан XIV в. -->
  <defs>
    <radialGradient id="portulan-bg" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#3a2410"/>
      <stop offset="100%" stop-color="#1a0e04"/>
    </radialGradient>
  </defs>
  <rect x="2" y="2" width="92" height="92" rx="10" fill="url(#portulan-bg)" stroke="#8a6a34" stroke-width="2"/>
  <rect x="7" y="7" width="82" height="82" rx="7" fill="none" stroke="#c8a56a" stroke-width="1" opacity=".55"/>
  <!-- пергамент с загнутыми краями -->
  <path d="M14 20 Q48 14 82 20 L82 76 Q48 82 14 76 Z" fill="#2a1808" stroke="#c8a56a" stroke-width="1.8"/>
  <path d="M14 20 Q10 24 14 28 M82 76 Q86 72 82 68" fill="none" stroke="#8a6a34" stroke-width="1.4"/>
  <!-- сеть румбов из центра -->
  <g stroke="#8a6a34" stroke-width=".9" opacity=".9">
    <path d="M40 48 L16 22 M40 48 L80 22 M40 48 L16 74 M40 48 L80 74 M40 48 H80 M40 48 H16 M40 48 V18 M40 48 V78 M40 48 L80 36 M40 48 L80 60"/>
  </g>
  <!-- береговая линия с заливами -->
  <path d="M50 18 Q56 26 52 32 Q60 36 58 44 Q66 48 64 56 Q72 60 70 70 Q76 74 80 72" fill="none" stroke="#e8c87a" stroke-width="1.8"/>
  <g stroke="#c8a56a" stroke-width=".9"><path d="M55 22 v3 M56 38 v3 M64 50 v3 M69 64 v3"/></g>
  <!-- острова -->
  <g fill="#8a6a34" stroke="#e8c87a" stroke-width="1"><ellipse cx="26" cy="34" rx="4" ry="2.4"/><ellipse cx="30" cy="64" rx="3" ry="2"/></g>
  <!-- роза ветров, север киноварью -->
  <circle cx="40" cy="48" r="7" fill="#1a0e04" stroke="#e8c87a" stroke-width="1.4"/>
  <path d="M40 39 L42 48 L40 57 L38 48 Z" fill="#c8a56a"/>
  <path d="M31 48 L40 46 L49 48 L40 50 Z" fill="#8a6a34"/>
  <path d="M40 39 L42 45 H38 Z" fill="#c0392b"/>
  <!-- масштабная линейка -->
  <path d="M20 72 H36" stroke="#e8c87a" stroke-width="1.4" stroke-dasharray="2 2"/>
</svg>
