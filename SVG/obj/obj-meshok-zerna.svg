<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="Мешок зерна — хлеб в долг под честное слово">
  <title>Мешок зерна</title>
  <desc>Форма: завязанный холщовый мешок, из надреза сыплется пшеница, рядом мерка. Действие: зерно даётся в долг и хранится для голодного года. Цель: доверие и милостыня как основание общины. Миссии: 5 «Кредит доверия», 11 «Миссионер-экономист», 75 «Системы хранения зерна».</desc>
  <!-- Арт-канон §9.0: умбра+золото, без нимбов. -->
  <rect x="2" y="2" width="92" height="92" rx="10" fill="#1a0e04" stroke="#8a6a34" stroke-width="2"/>
  <rect x="7" y="7" width="82" height="82" rx="7" fill="none" stroke="#c8a56a" stroke-width="1" opacity=".55"/>
  <!-- тело мешка с горловиной -->
  <path d="M30 80 Q24 56 34 40 L40 32 H56 L62 40 Q72 56 66 80 Q48 86 30 80 Z" fill="#2a1808" stroke="#c8a56a" stroke-width="2"/>
  <!-- перевязь горловины -->
  <path d="M38 34 Q48 40 58 34" fill="none" stroke="#e8c87a" stroke-width="2"/>
  <path d="M40 28 L44 32 M56 28 L52 32 M48 24 V32" stroke="#8a6a34" stroke-width="1.8"/>
  <!-- заплата и шов холста -->
  <path d="M38 58 h12 v10 h-12 Z" fill="none" stroke="#8a6a34" stroke-width="1.2" stroke-dasharray="2 2"/>
  <!-- колосок-клеймо общинной житницы -->
  <g stroke="#e8c87a" stroke-width="1.4" fill="none">
    <path d="M58 72 V52"/><path d="M58 56 l-3 -3 M58 60 l-3 -3 M58 64 l-3 -3 M58 56 l3 -3 M58 60 l3 -3 M58 64 l3 -3"/>
  </g>
  <!-- просыпанные зёрна -->
  <g fill="#e8c87a">
    <ellipse cx="72" cy="80" rx="1.6" ry="1"/><ellipse cx="76" cy="78" rx="1.6" ry="1"/>
    <ellipse cx="74" cy="82" rx="1.6" ry="1"/><ellipse cx="79" cy="81" rx="1.6" ry="1"/>
    <ellipse cx="22" cy="81" rx="1.6" ry="1"/>
  </g>
</svg>
