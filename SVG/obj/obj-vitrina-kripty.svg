<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="Витрина в крипте — черепки ушедших культур под стеклом">
  <title>Витрина крипты</title>
  <desc>ФОРМА: витрина в сводчатой нише: черепок кувшина, монета, глиняная табличка и светильник под стеклом, у каждого — бирка. ДЕЙСТВИЕ: дьякон собирает и описывает следы исчезнувших народов, не продавая и не присваивая их. ЦЕЛЬ: память о людях, а не трофеи; прах не выставляется — только вещи. Миссия: 39 Сбор трупов культур.</desc>
  <!-- Арт-канон §9.0: умбра+золото, картуш-рамка, без нимбов. -->
  <defs>
    <radialGradient id="vitrina-bg" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#3a2410"/>
      <stop offset="100%" stop-color="#1a0e04"/>
    </radialGradient>
  </defs>
  <rect x="2" y="2" width="92" height="92" rx="10" fill="url(#vitrina-bg)" stroke="#8a6a34" stroke-width="2"/>
  <rect x="7" y="7" width="82" height="82" rx="7" fill="none" stroke="#c8a56a" stroke-width="1" opacity=".55"/>
  <!-- сводчатая ниша крипты -->
  <path d="M14 84 V36 Q14 14 48 14 Q82 14 82 36 V84" fill="#1a0e04" stroke="#8a6a34" stroke-width="1.6"/>
  <g stroke="#8a6a34" stroke-width="1" opacity=".7"><path d="M14 48 H22 M74 40 H82 M14 64 H20 M76 60 H82"/></g>
  <!-- стеклянный короб -->
  <rect x="22" y="34" width="52" height="36" fill="#2a1808" stroke="#c8a56a" stroke-width="1.6"/>
  <path d="M22 34 L30 26 H82 L74 34" fill="none" stroke="#c8a56a" stroke-width="1.2"/>
  <path d="M74 34 L82 26 V62 L74 70" fill="none" stroke="#c8a56a" stroke-width="1.2"/>
  <!-- черепок кувшина -->
  <path d="M28 64 Q26 50 34 46 L38 50 Q36 58 40 64 Z" fill="#8a6a34" stroke="#e8c87a" stroke-width="1"/>
  <!-- монета -->
  <circle cx="48" cy="60" r="4" fill="#c8a56a" stroke="#8a6a34" stroke-width="1"/>
  <circle cx="48" cy="60" r="1.2" fill="#2a1808"/>
  <!-- глиняная табличка со штрихами -->
  <rect x="56" y="44" width="12" height="16" rx="1.5" fill="#8a6a34" stroke="#e8c87a" stroke-width="1"/>
  <path d="M58 48 h8 M58 51 h8 M58 54 h6" stroke="#2a1808" stroke-width=".9"/>
  <!-- светильник-плошка -->
  <path d="M44 44 Q48 50 54 44 Q50 42 44 44 Z" fill="#c8a56a" stroke="#8a6a34" stroke-width=".8"/>
  <!-- бирки описи -->
  <g fill="#e8c87a"><rect x="30" y="66" width="5" height="2.5"/><rect x="46" y="66" width="5" height="2.5"/><rect x="60" y="66" width="5" height="2.5"/></g>
  <!-- блики стекла -->
  <g stroke="#e8c87a" stroke-width="1" opacity=".45"><path d="M26 42 L34 36 M64 68 L72 62"/></g>
  <!-- тумба -->
  <rect x="20" y="70" width="56" height="10" fill="#2a1808" stroke="#8a6a34" stroke-width="1.4"/>
</svg>
