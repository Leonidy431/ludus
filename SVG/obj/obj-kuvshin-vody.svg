<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="Кувшин воды и простая чашка — для пленников">
  <title>Кувшин воды</title>
  <desc>Форма: простой глиняный кувшин, полный воды, и деревянная чашка рядом, капля над краем. Действие: игрок приносит воду пленникам и узникам, не спрашивая, кто они. Цель: дело милосердия по Евангелию (Мф. 25:35–36): напоить жаждущего и посетить узника. Миссия: 24 «Покровительство пленникам».</desc>
  <!-- Арт-канон §9.0: умбра+золото, картуш-рамка, без нимбов;
       синий — только для воды. -->
  <defs>
    <radialGradient id="kuvshin-v-bg" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#3a2410"/>
      <stop offset="100%" stop-color="#1a0e04"/>
    </radialGradient>
  </defs>
  <rect x="2" y="2" width="92" height="92" rx="10" fill="url(#kuvshin-v-bg)" stroke="#8a6a34" stroke-width="2"/>
  <rect x="7" y="7" width="82" height="82" rx="7" fill="none" stroke="#c8a56a" stroke-width="1" opacity=".55"/>
  <!-- ручка кувшина -->
  <path d="M26 32 Q14 36 18 52 Q20 58 26 58" fill="none" stroke="#c8a56a" stroke-width="3"/>
  <!-- тулово кувшина с носиком -->
  <path d="M30 18 H44 L48 14 L46 22 V26 Q58 34 56 54 Q54 74 38 76 Q22 74 20 54 Q18 34 30 26 Z" fill="#8a6a34" stroke="#c8a56a" stroke-width="1.8"/>
  <ellipse cx="37" cy="19" rx="7" ry="2" fill="#0d2a3a" stroke="#c8a56a" stroke-width="1"/>
  <!-- капля над носиком -->
  <path d="M50 26 Q52 30 50 32 Q48 30 50 26 Z" fill="#1f5a73"/>
  <!-- деревянная чашка с водой -->
  <path d="M58 60 H80 Q78 74 69 74 Q60 74 58 60 Z" fill="#2a1808" stroke="#c8a56a" stroke-width="1.6"/>
  <ellipse cx="69" cy="60" rx="11" ry="3" fill="#1f5a73" stroke="#c8a56a" stroke-width="1"/>
  <!-- тень пола -->
  <path d="M16 80 H82" stroke="#8a6a34" stroke-width="1.2" opacity=".7"/>
</svg>
