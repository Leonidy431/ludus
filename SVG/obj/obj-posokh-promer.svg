<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="Посох для промера льда">
  <title>Посох промера</title>
  <desc>Форма: длинный посох с железным наконечником и зарубками-мерами, упёртый в лёд с трещинами. Действие: путник проверяет толщину льда прежде каждого шага. Цель: трезвение — осторожность, а не страх. Миссия: 37 «Ледниковый путь».</desc>
  <!-- Арт-канон §9.0: умбра+золото, без нимбов. -->
  <rect x="2" y="2" width="92" height="92" rx="10" fill="#1a0e04" stroke="#8a6a34" stroke-width="2"/>
  <rect x="7" y="7" width="82" height="82" rx="7" fill="none" stroke="#c8a56a" stroke-width="1" opacity=".55"/>
  <!-- лёд с лункой -->
  <path d="M10 70 H86 V84 H10 Z" fill="#0d2a3a" stroke="#c8a56a" stroke-width="1.5"/>
  <path d="M10 70 H86" stroke="#e8c87a" stroke-width="1.2" opacity=".7"/>
  <!-- трещины во льду -->
  <path d="M30 70 L26 76 L30 80 M64 70 L70 76 L66 82" fill="none" stroke="#c8a56a" stroke-width="1"/>
  <ellipse cx="48" cy="72" rx="5" ry="1.6" fill="#1f5a73"/>
  <!-- посох наклонно, наконечник в лунке -->
  <path d="M66 14 L48 72" stroke="#8a6a34" stroke-width="3.2" stroke-linecap="round"/>
  <path d="M51 62 L48 72 L46 64" fill="#c8a56a" stroke="#e8c87a" stroke-width="1"/>
  <!-- зарубки-меры на посохе -->
  <g stroke="#e8c87a" stroke-width="1.4">
    <path d="M59 34 l5 2 M57 40 l5 2 M55 46 l5 2 M53 52 l5 2"/>
  </g>
  <!-- ременная петля у рукояти -->
  <path d="M64 20 Q74 24 68 30" fill="none" stroke="#c8a56a" stroke-width="1.4"/>
</svg>
