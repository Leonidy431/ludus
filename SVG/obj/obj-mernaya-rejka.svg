<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="Мерная рейка уровня воды озера">
  <title>Мерная рейка</title>
  <desc>Форма: деревянная рейка с зарубками, вбитая в воду, и старые отметки уровня выше нынешней воды. Действие: наблюдать и записывать, как отступает озеро. Цель: терпеливое наблюдение творения вместо гадания. Миссии: 31 Фаза регрессии, 33 Лимнологический прогноз.</desc>
  <!-- Арт-канон §9.0: умбра+золото, картуш-рамка, без нимбов.
       Прибор наблюдения: зарубки — год за годом, вода — лимнологическая шкала. -->
  <defs>
    <radialGradient id="mernaya-rejka-bg" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#3a2410"/>
      <stop offset="100%" stop-color="#1a0e04"/>
    </radialGradient>
  </defs>
  <rect x="2" y="2" width="92" height="92" rx="10" fill="url(#mernaya-rejka-bg)" stroke="#8a6a34" stroke-width="2"/>
  <rect x="7" y="7" width="82" height="82" rx="7" fill="none" stroke="#c8a56a" stroke-width="1" opacity=".55"/>
  <!-- вода озера -->
  <rect x="8" y="58" width="80" height="30" rx="5" fill="#0d2a3a"/>
  <g fill="none" stroke="#1f5a73" stroke-width="1.5">
    <path d="M12 60 Q20 56 28 60 Q36 64 44 60"/><path d="M52 60 Q60 56 68 60 Q76 64 84 60"/>
    <path d="M16 72 Q24 69 32 72"/><path d="M60 76 Q68 73 76 76"/>
  </g>
  <!-- рейка -->
  <rect x="42" y="14" width="12" height="70" fill="#2a1808" stroke="#c8a56a" stroke-width="1.8"/>
  <path d="M42 14 L48 9 L54 14" fill="#8a6a34" stroke="#c8a56a" stroke-width="1.5"/>
  <!-- шкала зарубок -->
  <g stroke="#e8c87a" stroke-width="1.5">
    <path d="M42 20 H50"/><path d="M42 26 H47"/><path d="M42 32 H50"/><path d="M42 38 H47"/>
    <path d="M42 44 H50"/><path d="M42 50 H47"/><path d="M42 56 H50"/>
  </g>
  <!-- старые уровни воды — отметки прежних лет -->
  <g stroke="#c0392b" stroke-width="1.5"><path d="M54 30 H62"/><path d="M54 40 H60"/></g>
  <path d="M62 30 Q70 42 60 56" fill="none" stroke="#8a6a34" stroke-width="1.2" stroke-dasharray="2 2"/>
  <!-- нынешний уровень -->
  <path d="M30 58 H66" stroke="#e8c87a" stroke-width="1.8"/>
  <path d="M26 55 L30 58 L26 61" fill="none" stroke="#e8c87a" stroke-width="1.5"/>
</svg>
