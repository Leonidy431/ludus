<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="Ключ от склада обители">
  <title>Ключ от склада обители</title>
  <desc>ФОРМА: большой кованый ключ с кольцом и бородкой, на кольце деревянная бирка. ДЕЙСТВИЕ: эконом доверяет ключ от склада караван-сарая при обители, ключ открывает запасы для странников. ЦЕЛЬ: хозяйство обители — служение гостеприимству, а не накопление. Миссия 1.</desc>
  <!-- Арт-канон §9.0: умбра+золото, двойная рамка-картуш -->
  <rect x="2" y="2" width="92" height="92" rx="10" fill="#1a0e04" stroke="#8a6a34" stroke-width="2"/>
  <rect x="7" y="7" width="82" height="82" rx="7" fill="none" stroke="#c8a56a" stroke-width="1" opacity=".55"/>
  <!-- кольцо ключа -->
  <circle cx="30" cy="36" r="12" fill="none" stroke="#c8a56a" stroke-width="3"/>
  <circle cx="30" cy="36" r="6" fill="none" stroke="#8a6a34" stroke-width="1.5"/>
  <!-- стержень -->
  <path d="M40 43 L70 66" stroke="#c8a56a" stroke-width="4" stroke-linecap="round"/>
  <path d="M46 46 L50 42 M50 50 L54 46" stroke="#8a6a34" stroke-width="1.5"/>
  <!-- бородка -->
  <path d="M60 58 L66 52 L70 56 L68 58 L72 62 L66 68 Z" fill="#c8a56a" stroke="#8a6a34" stroke-width="1.5"/>
  <!-- бирка на шнурке -->
  <path d="M24 46 Q20 56 24 62" fill="none" stroke="#8a6a34" stroke-width="1.4"/>
  <rect x="16" y="62" width="16" height="12" rx="2" fill="#3a2410" stroke="#e8c87a" stroke-width="1.4"/>
  <path d="M20 68 H28" stroke="#e8c87a" stroke-width="1.2"/>
</svg>
