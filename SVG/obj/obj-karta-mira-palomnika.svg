<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="Карта паломника — пути к святым местам мира">
  <title>Карта паломника</title>
  <desc>Форма: развёрнутый свиток-карта с тремя материками, пунктирными путями и точками святых мест (Иерусалим, Синай, Аксум в Эфиопии, Иссык-Куль). Действие: паломник видит, что Церковь подвижна и живёт на всех путях. Цель: единство Церкви поверх расстояний. Миссия: 30 «Подвижная Эфиопия».</desc>
  <!-- Арт-канон §9.0: умбра+золото, без нимбов. -->
  <rect x="2" y="2" width="92" height="92" rx="10" fill="#1a0e04" stroke="#8a6a34" stroke-width="2"/>
  <rect x="7" y="7" width="82" height="82" rx="7" fill="none" stroke="#c8a56a" stroke-width="1" opacity=".55"/>
  <!-- лист карты со свитыми краями -->
  <path d="M16 22 H80 V74 H16 Z" fill="#2a1808" stroke="#c8a56a" stroke-width="1.8"/>
  <rect x="12" y="18" width="6" height="60" rx="3" fill="#8a6a34" stroke="#e8c87a" stroke-width="1.2"/>
  <rect x="78" y="18" width="6" height="60" rx="3" fill="#8a6a34" stroke="#e8c87a" stroke-width="1.2"/>
  <!-- очертания земель -->
  <g fill="#8a6a34" opacity=".6" stroke="#c8a56a" stroke-width="1">
    <path d="M22 30 Q30 26 40 30 L42 38 Q34 42 26 40 Z"/>
    <path d="M36 44 Q46 42 48 50 Q46 64 40 68 Q34 58 36 44 Z"/>
    <path d="M48 28 Q62 24 74 30 L72 44 Q60 46 52 40 Z"/>
  </g>
  <!-- пути паломников -->
  <path d="M34 36 Q44 40 44 52 M44 38 Q56 38 66 36" fill="none" stroke="#e8c87a" stroke-width="1.2" stroke-dasharray="2 2"/>
  <!-- святые места: малые кресты-метки -->
  <g stroke="#e8c87a" stroke-width="1.3">
    <path d="M44 36 v4 M42 38 h4"/><path d="M44 52 v4 M42 54 h4"/><path d="M66 34 v4 M64 36 h4"/>
  </g>
  <!-- Иссык-Куль: синее озеро -->
  <ellipse cx="66" cy="36" rx="3" ry="1.5" fill="#1f5a73"/>
  <!-- роза ветров -->
  <path d="M28 64 v-8 M24 60 h8" stroke="#c8a56a" stroke-width="1"/>
  <circle cx="28" cy="60" r="2" fill="#e8c87a"/>
</svg>
