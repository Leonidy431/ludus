<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Обитель в подступающей воде озера">
  <title>Затопление обители</title>
  <desc>Форма: стены и малая церковь обители на берегу, вода Иссык-Куля уже у подножия стен и заливает двор, братья грузят в лодку футляры с рукописями, на холме новая тропа. Действие: вовремя увидеть, что вода поднимается, спасти людей и книги и перенести обитель выше. Цель: всё земное преходяще, неизменно лишь то, что хранится в сердце; трансгрессия озера — урок трезвения, а не кара. Миссия: 32 Фаза трансгрессии.</desc>
  <!-- Арт-канон §9.0: умбра+золото. Локация миссии 32: подъём уровня Иссык-Куля; церковь не повреждена и не осквернена. -->
  <defs>
    <linearGradient id="zatoplenie-nebo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0e04"/>
      <stop offset="60%" stop-color="#3a2410"/>
      <stop offset="100%" stop-color="#8a6a34"/>
    </linearGradient>
  </defs>
  <rect width="320" height="180" fill="url(#zatoplenie-nebo)"/>
  <!-- дальние хребты -->
  <path d="M0 80 L40 50 L80 72 L130 40 L180 70 L230 46 L280 70 L320 54 V96 H0 Z" fill="#241405"/>
  <g fill="#e8d9b8" opacity=".75"><path d="M124 46 L130 40 L136 46 L130 44 Z"/><path d="M224 52 L230 46 L236 52 L230 50 Z"/></g>
  <!-- холм с новой тропой вверх -->
  <path d="M230 120 Q270 84 320 80 V140 H230 Z" fill="#2a1808"/>
  <path d="M250 118 Q270 104 284 98 Q296 92 312 88" fill="none" stroke="#c8a56a" stroke-width="1.4" stroke-dasharray="3 3"/>
  <!-- стены обители -->
  <path d="M60 128 V96 H200 V128" fill="#2a1808" stroke="#c8a56a" stroke-width="2"/>
  <g fill="#140a02" stroke="#c8a56a" stroke-width="1.2"><rect x="72" y="104" width="8" height="10"/><rect x="180" y="104" width="8" height="10"/></g>
  <!-- малая церковь внутри стен -->
  <g stroke="#c8a56a" stroke-width="2" fill="#2a1808">
    <path d="M110 128 V84 H150 V128"/><path d="M120 84 V72 H140 V84"/><path d="M120 72 Q130 56 140 72 Z" fill="#8a6a34"/>
  </g>
  <path d="M130 58 V44 M125 49 h10 M126 55 l8 -2" stroke="#e8c87a" stroke-width="2" fill="none"/>
  <circle cx="130" cy="94" r="2" fill="#e8c87a"/>
  <!-- вода озера у стен -->
  <path d="M0 116 Q60 112 120 118 Q190 124 240 116 L240 180 H0 Z" fill="#0d2a3a"/>
  <path d="M240 116 Q280 124 320 120 V180 H240 Z" fill="#0d2a3a"/>
  <g fill="none" stroke="#1f5a73" stroke-width="1.5">
    <path d="M10 126 q8 -4 16 0 t16 0 M70 132 q8 -4 16 0 t16 0 M150 128 q8 -4 16 0 t16 0 M210 136 q8 -4 16 0"/>
    <path d="M30 150 q10 -4 20 0 t20 0 M120 156 q10 -4 20 0 t20 0 M230 152 q10 -4 20 0"/>
  </g>
  <!-- отражение стен в воде -->
  <path d="M60 118 V128 H200 V120" fill="none" stroke="#c8a56a" stroke-width="1" opacity=".35"/>
  <!-- лодка с футлярами рукописей и двумя братьями -->
  <path d="M206 142 H260 L252 152 H214 Z" fill="#2a1808" stroke="#e8c87a" stroke-width="1.6"/>
  <g fill="#8a6a34" stroke="#e8c87a" stroke-width="1"><rect x="220" y="136" width="14" height="5" rx="2"/><rect x="224" y="131" width="12" height="5" rx="2"/></g>
  <g fill="#1a0e04" stroke="#c8a56a" stroke-width="1.4">
    <path d="M242 142 V130 Q246 126 250 130 V142 Z"/><circle cx="246" cy="126" r="3"/>
    <path d="M212 142 V132 Q215 129 218 132 V142 Z"/><circle cx="215" cy="128" r="2.6"/>
  </g>
  <path d="M258 128 L266 158" stroke="#c8a56a" stroke-width="1.6"/>
</svg>
