<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Совет обителей — трапезная с большой картой сети миссий">
  <title>Совет обителей</title>
  <desc>Форма: трапезная со сводом; длинный стол, по сторонам скамьи с настоятелями-силуэтами, на стене большая карта: обители — узлы, пути — нити. Действие: совет решает, как миссии помогают друг другу. Цель: Церковь как общение, миссия как узел сети. Миссия: 91 «Миссия-как-хаб».</desc>
  <!-- Арт-канон §9.0: умбра+золото, без нимбов. -->
  <rect width="320" height="180" fill="#1a0e04"/>
  <!-- своды трапезной -->
  <path d="M0 40 Q80 0 160 30 Q240 0 320 40 V0 H0 Z" fill="#2a1808" stroke="#8a6a34" stroke-width="1.5"/>
  <!-- большая карта сети миссий на стене -->
  <rect x="80" y="30" width="160" height="72" rx="3" fill="#2a1808" stroke="#e8c87a" stroke-width="2"/>
  <path d="M190 60 Q200 56 210 60 Q200 64 190 60 Z" fill="#1f5a73"/>
  <g stroke="#c8a56a" stroke-width="1.4" fill="none" stroke-dasharray="3 2">
    <path d="M100 50 L140 66 L200 60 L220 84 M140 66 L120 90 M140 66 L170 44 L200 60 M140 66 L180 88"/>
  </g>
  <g fill="#e8c87a" stroke="#8a6a34" stroke-width="1">
    <circle cx="100" cy="50" r="3"/><circle cx="120" cy="90" r="3"/><circle cx="170" cy="44" r="3"/>
    <circle cx="200" cy="60" r="3"/><circle cx="220" cy="84" r="3"/><circle cx="180" cy="88" r="3"/>
  </g>
  <!-- центральная обитель-узел -->
  <circle cx="140" cy="66" r="5" fill="#e8c87a" stroke="#8a6a34" stroke-width="1.2"/>
  <path d="M140 58 v-6 M137 55 h6" stroke="#e8c87a" stroke-width="1.2"/>
  <!-- окна со светом -->
  <g fill="#e8c87a" opacity=".5"><path d="M30 90 V60 Q38 50 46 60 V90 Z"/><path d="M274 90 V60 Q282 50 290 60 V90 Z"/></g>
  <!-- длинный стол -->
  <rect x="40" y="128" width="240" height="8" fill="#8a6a34" stroke="#c8a56a" stroke-width="1.5"/>
  <path d="M60 136 V160 M260 136 V160" stroke="#8a6a34" stroke-width="3"/>
  <!-- хлеб и чаши на столе -->
  <g fill="#c8a56a"><ellipse cx="110" cy="126" rx="8" ry="3"/><ellipse cx="210" cy="126" rx="8" ry="3"/></g>
  <!-- настоятели за столом: силуэты -->
  <g fill="#140a02" stroke="#c8a56a" stroke-width="1.4">
    <circle cx="70" cy="110" r="6"/><path d="M60 128 Q60 118 70 116 Q80 118 80 128 Z"/>
    <circle cx="140" cy="108" r="6"/><path d="M130 128 Q130 116 140 114 Q150 116 150 128 Z"/>
    <circle cx="180" cy="108" r="6"/><path d="M170 128 Q170 116 180 114 Q190 116 190 128 Z"/>
    <circle cx="250" cy="110" r="6"/><path d="M240 128 Q240 118 250 116 Q260 118 260 128 Z"/>
  </g>
  <!-- пол трапезной -->
  <rect y="160" width="320" height="20" fill="#241405"/>
</svg>
