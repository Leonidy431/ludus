<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Ночной берег Иссык-Куля под звёздами">
  <title>Ночной берег</title>
  <desc>Ночной берег озера: звёздное небо с Ковшом и Полярной звездой, чёрные силуэты хребтов, звёзды отражаются в воде, лодка у берега. ФОРМА: неподвижные звёзды и берега. ДЕЙСТВИЕ: игрок прокладывает путь по звёздам и приметам берега. ЦЕЛЬ: «небеса проповедуют славу Божию» — порядок творения ведёт путника. Не астрология: только навигация. Миссия: 78 «Навигация по звёздам и берегам».</desc>
  <rect width="320" height="180" fill="#1a0e04"/>
  <!-- россыпь звёзд -->
  <g fill="#e8c87a">
    <circle cx="20" cy="18" r=".9"/><circle cx="48" cy="40" r=".7"/><circle cx="80" cy="14" r="1"/>
    <circle cx="106" cy="52" r=".7"/><circle cx="140" cy="22" r=".8"/><circle cx="182" cy="46" r=".7"/>
    <circle cx="214" cy="12" r=".9"/><circle cx="296" cy="30" r=".8"/><circle cx="306" cy="60" r=".7"/>
    <circle cx="10" cy="64" r=".7"/><circle cx="160" cy="62" r=".6"/><circle cx="264" cy="66" r=".6"/>
  </g>
  <!-- Большой Ковш -->
  <g fill="#e8c87a">
    <circle cx="186" cy="30" r="1.5"/><circle cx="200" cy="34" r="1.5"/><circle cx="212" cy="40" r="1.5"/>
    <circle cx="226" cy="42" r="1.5"/><circle cx="230" cy="56" r="1.5"/><circle cx="246" cy="58" r="1.5"/>
    <circle cx="244" cy="44" r="1.5"/>
  </g>
  <path d="M186 30 L200 34 L212 40 L226 42 L230 56 L246 58 L244 44 L226 42" fill="none" stroke="#8a6a34" stroke-width=".8" opacity=".6"/>
  <!-- Полярная звезда и направляющая линия -->
  <path d="M244 44 L268 16" stroke="#c8a56a" stroke-width=".7" stroke-dasharray="2 3" opacity=".7"/>
  <g stroke="#e8c87a" stroke-width="1.2"><path d="M270 8 v12 M264 14 h12"/></g>
  <circle cx="270" cy="14" r="6" fill="#e8c87a" opacity=".14"/>
  <!-- силуэты хребтов -->
  <path d="M0 108 L30 80 L56 96 L92 70 L128 98 L166 78 L200 100 L240 72 L276 94 L320 80 V116 H0 Z" fill="#241405" stroke="#8a6a34" stroke-width="1"/>
  <!-- озеро -->
  <rect y="114" width="320" height="40" fill="#0d2a3a"/>
  <g stroke="#1f5a73" stroke-width="1.2" opacity=".8" fill="none">
    <path d="M20 124 Q30 121 40 124"/><path d="M110 132 Q120 129 130 132"/><path d="M280 128 Q290 125 300 128"/>
  </g>
  <!-- отражения звёзд -->
  <g stroke="#e8c87a" stroke-width="1" opacity=".55">
    <path d="M266 122 h8 M267 130 h6"/><path d="M196 126 h6 M226 134 h6"/>
  </g>
  <!-- берег с галькой и лодкой -->
  <path d="M0 150 Q100 142 200 152 Q270 156 320 150 V180 H0 Z" fill="#2a1808"/>
  <g transform="translate(80,146)">
    <path d="M-16 0 Q0 8 18 0 L14 5 L-12 5 Z" fill="#1a0e04" stroke="#c8a56a" stroke-width="1.5"/>
    <path d="M-2 0 V-14" stroke="#c8a56a" stroke-width="1.5"/>
  </g>
  <g fill="#8a6a34" opacity=".7">
    <ellipse cx="150" cy="162" rx="3" ry="1.5"/><ellipse cx="190" cy="168" rx="4" ry="1.5"/><ellipse cx="240" cy="164" rx="3" ry="1.5"/>
  </g>
  <!-- путник смотрит на звёзды -->
  <g stroke="#c8a56a" stroke-width="1.6" fill="#1a0e04">
    <circle cx="214" cy="140" r="3"/>
    <path d="M214 143 L210 158 H218 Z"/>
  </g>
</svg>
