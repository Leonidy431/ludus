<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Диван даруги — приёмный шатёр ханского наместника">
  <title>Диван даруги</title>
  <desc>Приёмный шатёр даруги, наместника Орды: на помосте сидит наместник, над ним висит пайцза, по сторонам туги, перед помостом ковёр и просители-купцы разных общин. ФОРМА: власть чужого двора показана как порядок, без злодейства. ДЕЙСТВИЕ: игрок как консул диаспоры ходатайствует за своих, говорит прямо и уважительно. ЦЕЛЬ: «Воздадите кесарево кесарю»: верность Богу вместе с честностью перед властью. Миссия 48.</desc>
  <!-- Арт-канон §9.0: умбра+золото; 2D-виньетка локации -->
  <defs>
    <linearGradient id="divan-nebo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0e04"/>
      <stop offset="60%" stop-color="#3a2410"/>
      <stop offset="100%" stop-color="#8a6a34"/>
    </linearGradient>
  </defs>
  <rect width="320" height="180" fill="url(#divan-nebo)"/>
  <!-- решётчатые стены шатра-ставки -->
  <path d="M0 40 Q160 0 320 40 V150 H0 Z" fill="#2a1808" stroke="#8a6a34" stroke-width="2"/>
  <g stroke="#8a6a34" stroke-width="1" opacity=".6" fill="none">
    <path d="M0 70 L40 110 L80 70 L120 110 L160 70 L200 110 L240 70 L280 110 L320 70"/>
    <path d="M0 110 L40 70 L80 110 L120 70 L160 110 L200 70 L240 110 L280 70 L320 110"/>
  </g>
  <!-- туги по сторонам помоста -->
  <g stroke="#c8a56a" stroke-width="2"><path d="M96 130 V46 M224 130 V46"/></g>
  <g fill="#e8c87a" opacity=".85">
    <path d="M96 46 q-6 10 -2 22 q2 -10 2 -22 q6 10 2 22 q-2 -10 -2 -22 Z"/>
    <path d="M224 46 q-6 10 -2 22 q2 -10 2 -22 q6 10 2 22 q-2 -10 -2 -22 Z"/>
  </g>
  <!-- пайцза над помостом -->
  <path d="M160 34 V42" stroke="#c8a56a" stroke-width="1.2"/>
  <rect x="154" y="42" width="12" height="20" rx="4" fill="#e8c87a" stroke="#8a6a34" stroke-width="1.2"/>
  <!-- помост и наместник -->
  <path d="M116 118 H204 V132 H116 Z" fill="#3a2410" stroke="#c8a56a" stroke-width="1.8"/>
  <g fill="#140a02" stroke="#c8a56a" stroke-width="1.6">
    <circle cx="160" cy="82" r="7"/>
    <path d="M160 90 Q142 96 142 118 H178 Q178 96 160 90 Z"/>
  </g>
  <path d="M150 78 Q160 70 170 78 Z" fill="#8a6a34"/>
  <!-- низкий столик со свитками -->
  <path d="M176 112 H196 M180 112 v6 M192 112 v6" stroke="#c8a56a" stroke-width="1.6"/>
  <rect x="180" y="106" width="12" height="4" fill="#e8c87a"/>
  <!-- ковёр -->
  <path d="M60 150 L100 132 H220 L260 150 Z" fill="#8a6a34" stroke="#e8c87a" stroke-width="1.5"/>
  <path d="M110 140 H210" stroke="#c0392b" stroke-width="1.5"/>
  <!-- просители-купцы -->
  <g fill="#140a02" stroke="#c8a56a" stroke-width="1.5">
    <circle cx="44" cy="120" r="5"/><path d="M44 126 Q34 130 34 150 H54 Q54 130 44 126 Z"/>
    <circle cx="68" cy="124" r="5"/><path d="M68 130 Q60 134 60 150 H76 Q76 134 68 130 Z"/>
    <circle cx="270" cy="122" r="5"/><path d="M270 128 Q260 132 260 150 H280 Q280 132 270 128 Z"/>
  </g>
  <path d="M0 150 H320 V180 H0 Z" fill="#1a0e04"/>
</svg>
