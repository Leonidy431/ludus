<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Верхняя терраса — новая обитель над озером">
  <title>Верхняя терраса</title>
  <desc>ФОРМА: высокая горная терраса над Иссык-Кулём: новая малая церковь в лесах, две кельи, огород на уступах, тропа-серпантин от берега. ДЕЙСТВИЕ: после выбора игрока община уходит выше от подступающей воды и строит обитель заново. ЦЕЛЬ: ветвление судьбы — потеря места не отменяет призвания; обитель — братия, а не стены. Миссия: 90 Ветвление судьбы.</desc>
  <!-- Арт-канон §9.0: умбра+золото. Синий — только вода озера. -->
  <defs>
    <linearGradient id="vt-nebo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0e04"/>
      <stop offset="60%" stop-color="#3a2410"/>
      <stop offset="100%" stop-color="#8a6a34"/>
    </linearGradient>
  </defs>
  <rect width="320" height="180" fill="url(#vt-nebo)"/>
  <!-- утренний свет из-за хребта -->
  <circle cx="250" cy="40" r="12" fill="#e8c87a" opacity=".8"/>
  <circle cx="250" cy="40" r="22" fill="#e8c87a" opacity=".12"/>
  <!-- озеро внизу справа -->
  <path d="M150 180 Q200 140 320 136 V180 Z" fill="#1f5a73"/>
  <path d="M220 156 H260 M250 166 H300" stroke="#0d2a3a" stroke-width="1.2"/>
  <!-- склон с уступами-террасами -->
  <path d="M0 180 V70 L60 52 L150 60 L200 90 Q170 120 190 180 Z" fill="#241405"/>
  <g fill="none" stroke="#8a6a34" stroke-width="1.6">
    <path d="M10 96 H168"/><path d="M14 122 H176"/><path d="M18 150 H182"/>
  </g>
  <!-- грядки на нижних уступах -->
  <g stroke="#c8a56a" stroke-width="1" opacity=".7"><path d="M30 130 V146 M42 130 V146 M54 130 V146 M120 104 V118 M132 104 V118"/></g>
  <!-- новая малая церковь на верхней террасе -->
  <g stroke="#c8a56a" stroke-width="2" fill="#2a1808">
    <path d="M60 96 V70 H96 V96"/>
    <path d="M70 70 V62 H86 V70"/>
    <path d="M70 62 Q78 48 86 62 Z" fill="#8a6a34"/>
  </g>
  <path d="M78 50 V38 M74 42 h8" stroke="#e8c87a" stroke-width="2"/>
  <path d="M74 96 V84 Q78 80 82 84 V96 Z" fill="#140a02"/>
  <!-- строительные леса у стены -->
  <g stroke="#8a6a34" stroke-width="1.2" fill="none"><path d="M100 96 V66 M112 96 V66 M98 76 H114 M98 86 H114 M100 66 L112 76"/></g>
  <!-- кельи -->
  <g fill="#2a1808" stroke="#c8a56a" stroke-width="1.6">
    <path d="M122 96 V86 Q130 78 138 86 V96 Z"/><path d="M20 96 V86 Q28 78 36 86 V96 Z"/>
  </g>
  <g fill="#e8c87a"><rect x="128" y="89" width="4" height="4"/><rect x="26" y="89" width="4" height="4"/></g>
  <!-- тропа-серпантин от берега -->
  <path d="M178 176 Q150 164 170 150 Q120 140 164 124 Q110 112 150 98" fill="none" stroke="#c8a56a" stroke-width="1.3" stroke-dasharray="3 3"/>
  <!-- дальний хребет -->
  <path d="M170 90 L210 62 L240 80 L276 56 L320 84 V110 Q260 104 200 100 Z" fill="#2a1808"/>
</svg>
