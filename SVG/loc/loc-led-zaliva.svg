<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Замёрзший мелкий залив Иссык-Куля под горами, вехи пути по льду">
  <title>Лёд мелкого залива</title>
  <desc>Форма: мелкий залив скован льдом, по нему идут вехи, трещины расходятся от полыньи, за льдом снежный Тянь-Шань. Действие: игрок проверяет лёд шестом и идёт по вехам, не спеша, обходя тёмную полынью. Цель: трезвение как внимание к каждому шагу. Миссия: 37 «Ледниковый путь».</desc>
  <!-- Арт-канон §9.0: умбра+золото; озёрные синие только для воды. -->
  <defs>
    <linearGradient id="led-nebo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0e04"/>
      <stop offset="100%" stop-color="#3a2410"/>
    </linearGradient>
  </defs>
  <rect width="320" height="180" fill="url(#led-nebo)"/>
  <!-- холодное солнце -->
  <circle cx="70" cy="40" r="10" fill="#e8d9b8" opacity=".7"/>
  <!-- горы со снегом -->
  <path d="M0 96 L44 50 L76 80 L118 40 L160 84 L200 52 L240 86 L282 46 L320 80 V104 H0 Z" fill="#241405"/>
  <g fill="#e8d9b8" opacity=".85">
    <path d="M34 60 L44 50 L54 60 L44 57 Z"/><path d="M108 50 L118 40 L128 50 L118 47 Z"/>
    <path d="M192 60 L200 52 L208 60 L200 58 Z"/><path d="M272 56 L282 46 L292 56 L282 53 Z"/>
  </g>
  <!-- открытая вода за кромкой льда -->
  <rect y="100" width="320" height="14" fill="#0d2a3a"/>
  <path d="M0 114 H320" stroke="#1f5a73" stroke-width="1.5"/>
  <!-- ледяное поле залива -->
  <path d="M0 114 Q160 110 320 114 V160 H0 Z" fill="#e8d9b8" opacity=".3"/>
  <!-- трещины льда от полыньи -->
  <ellipse cx="220" cy="136" rx="16" ry="5" fill="#0d2a3a" stroke="#1f5a73" stroke-width="1.5"/>
  <g stroke="#e8d9b8" stroke-width="1.2" fill="none" opacity=".8">
    <path d="M204 136 L180 128 L166 132 M236 136 L262 126 L284 130 M220 141 L214 156 M226 131 L240 118"/>
  </g>
  <!-- вехи пути по льду -->
  <g stroke="#c8a56a" stroke-width="2">
    <path d="M40 158 V146 M84 148 V138 M124 140 V132 M150 132 V126"/>
  </g>
  <g fill="#c0392b">
    <path d="M40 146 l6 2 -6 2 Z"/><path d="M84 138 l5 2 -5 2 Z"/><path d="M124 132 l4 2 -4 2 Z"/>
  </g>
  <path d="M30 164 Q90 146 156 130" fill="none" stroke="#8a6a34" stroke-width="1.2" stroke-dasharray="3 3"/>
  <!-- заснеженный берег -->
  <path d="M0 160 Q100 150 200 160 Q270 166 320 158 V180 H0 Z" fill="#241405"/>
  <path d="M0 160 Q100 150 200 160 Q270 166 320 158" fill="none" stroke="#e8d9b8" stroke-width="2" opacity=".6"/>
  <!-- путник с шестом на берегу -->
  <g stroke="#e8c87a" stroke-width="1.6" fill="#1a0e04">
    <circle cx="26" cy="150" r="3"/>
    <path d="M26 153 L22 168 H30 Z"/>
    <path d="M32 144 L20 172" fill="none"/>
  </g>
</svg>
