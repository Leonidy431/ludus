<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" preserveAspectRatio="xMidYMid slice" role="img" aria-label="План обители сверху: храм, кельи, сетка улиц и озеро">
  <title>План обители</title>
  <desc>ФОРМА: вид сверху — крестовокупольный храм в центре, по периметру ограды кельи, прямая сетка улиц, ворота к озеру, колодец и трапеза на осях. ДЕЙСТВИЕ: игрок размечает обитель так, чтобы все пути вели к храму, а вода и хозяйство были рядом. ЦЕЛЬ: порядок пространства как образ устроенной жизни — храм в середине, а не на краю. Миссия: 72 «Планировочная геометрия».</desc>
  <!-- Арт-канон §9.0: умбра+золото; синь только для воды. -->
  <defs>
    <linearGradient id="plan-nebo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0e04"/>
      <stop offset="60%" stop-color="#3a2410"/>
      <stop offset="100%" stop-color="#8a6a34"/>
    </linearGradient>
  </defs>
  <rect width="320" height="180" fill="url(#plan-nebo)"/>
  <!-- земля (вид сверху) -->
  <rect width="320" height="180" fill="#2a1808"/>
  <!-- озеро справа -->
  <path d="M250 0 Q236 60 248 120 Q256 160 240 180 H320 V0 Z" fill="#0d2a3a"/>
  <g stroke="#1f5a73" stroke-width="1.2" fill="none">
    <path d="M270 40 q6 -3 12 0"/><path d="M280 90 q6 -3 12 0"/><path d="M266 140 q6 -3 12 0"/>
  </g>
  <!-- ограда обители -->
  <rect x="40" y="20" width="180" height="140" fill="none" stroke="#c8a56a" stroke-width="2.5"/>
  <!-- ворота к озеру -->
  <path d="M220 82 V98" stroke="#1a0e04" stroke-width="4"/>
  <path d="M220 82 h8 M220 98 h8" stroke="#e8c87a" stroke-width="1.5"/>
  <!-- сетка улиц -->
  <g stroke="#8a6a34" stroke-width="1.2" stroke-dasharray="4 3">
    <path d="M40 56 H220 M40 124 H220 M86 20 V160 M174 20 V160"/>
  </g>
  <path d="M40 90 H250" stroke="#8a6a34" stroke-width="3" opacity=".6"/>
  <!-- кельи по периметру -->
  <g fill="#1a0e04" stroke="#c8a56a" stroke-width="1.2">
    <rect x="48" y="26" width="14" height="10"/><rect x="66" y="26" width="14" height="10"/>
    <rect x="96" y="26" width="14" height="10"/><rect x="114" y="26" width="14" height="10"/>
    <rect x="132" y="26" width="14" height="10"/><rect x="150" y="26" width="14" height="10"/>
    <rect x="182" y="26" width="14" height="10"/><rect x="200" y="26" width="14" height="10"/>
    <rect x="48" y="144" width="14" height="10"/><rect x="66" y="144" width="14" height="10"/>
    <rect x="96" y="144" width="14" height="10"/><rect x="114" y="144" width="14" height="10"/>
    <rect x="132" y="144" width="14" height="10"/><rect x="150" y="144" width="14" height="10"/>
    <rect x="182" y="144" width="14" height="10"/><rect x="200" y="144" width="14" height="10"/>
  </g>
  <!-- храм: крестовокупольный план с апсидой на восток -->
  <path d="M112 66 H148 V78 H160 V102 H148 V114 H112 V102 H100 V78 H112 Z" fill="#8a6a34" stroke="#e8c87a" stroke-width="2"/>
  <path d="M160 82 Q172 90 160 98" fill="#8a6a34" stroke="#e8c87a" stroke-width="2"/>
  <circle cx="130" cy="90" r="8" fill="none" stroke="#e8c87a" stroke-width="1.5"/>
  <!-- трапеза и колодец -->
  <rect x="50" y="68" width="26" height="44" fill="#1a0e04" stroke="#c8a56a" stroke-width="1.5"/>
  <circle cx="196" cy="72" r="5" fill="#0d2a3a" stroke="#c8a56a" stroke-width="1.5"/>
  <!-- роза ветров: север вверх -->
  <g transform="translate(20,150)" stroke="#e8c87a" stroke-width="1.2" fill="none">
    <path d="M0 -12 V12 M-12 0 H12"/><path d="M0 -12 l-3 6 h6 Z" fill="#e8c87a"/>
  </g>
</svg>
