<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Верфь на Светлом Мысу — стапель и рёбра лодки у озера">
  <title>Верфь на Светлом Мысу</title>
  <desc>Форма: стапель на мысу, остов лодки с рёбрами-шпангоутами, штабель досок, тёсла; за мысом Иссык-Куль и горы. Действие: община строит лодки для рыбаков и паломников. Цель: ковчег как образ Церкви — остов, собираемый многими руками. Миссия: 68 «Верфи на Светлом Мысу».</desc>
  <!-- Арт-канон §9.0: умбра+золото, без нимбов. -->
  <defs><linearGradient id="vs-nebo" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#1a0e04"/><stop offset="60%" stop-color="#3a2410"/><stop offset="100%" stop-color="#8a6a34"/></linearGradient></defs>
  <rect width="320" height="180" fill="url(#vs-nebo)"/>
  <!-- снежные хребты -->
  <path d="M0 80 L50 50 L90 74 L140 44 L190 72 L250 48 L320 76 V92 H0 Z" fill="#241405"/>
  <g fill="#e8c87a" opacity=".7"><path d="M44 54 L50 50 L56 54 Z M134 48 L140 44 L146 48 Z M244 52 L250 48 L256 52 Z"/></g>
  <!-- озеро -->
  <rect y="90" width="320" height="90" fill="#0d2a3a"/>
  <path d="M200 110 Q212 106 224 110 M260 130 Q272 126 284 130 M220 156 Q232 152 244 156" fill="none" stroke="#1f5a73" stroke-width="1.4"/>
  <!-- светлый мыс вдаётся в воду -->
  <path d="M0 120 Q90 108 180 124 Q200 134 186 144 Q100 150 0 150 Z" fill="#8a6a34" stroke="#c8a56a" stroke-width="1.5"/>
  <path d="M0 150 Q120 146 200 160 Q250 170 320 172 V180 H0 Z" fill="#241405"/>
  <!-- стапель: наклонные брусья к воде -->
  <path d="M40 142 L176 128 M40 148 L180 136" stroke="#2a1808" stroke-width="3"/>
  <!-- остов лодки: киль и рёбра -->
  <path d="M60 130 Q110 144 160 126" fill="none" stroke="#e8c87a" stroke-width="2.4"/>
  <g stroke="#c8a56a" stroke-width="1.8" fill="none">
    <path d="M72 133 Q70 118 74 108 M86 136 Q84 118 88 104 M100 138 Q98 118 102 102 M114 137 Q112 118 116 102 M128 135 Q128 116 130 104 M142 131 Q142 116 146 108"/>
  </g>
  <path d="M74 110 Q110 98 146 110" fill="none" stroke="#8a6a34" stroke-width="1.4"/>
  <!-- штабель досок и тесло -->
  <g fill="#2a1808" stroke="#c8a56a" stroke-width="1.2">
    <rect x="12" y="152" width="40" height="4"/><rect x="14" y="157" width="40" height="4"/><rect x="12" y="162" width="40" height="4"/>
  </g>
  <path d="M70 168 L78 154 M74 156 h8" stroke="#e8c87a" stroke-width="1.6"/>
  <!-- готовая лодка на воде -->
  <path d="M232 94 H268 Q264 102 250 102 Q236 102 232 94 Z" fill="#2a1808" stroke="#c8a56a" stroke-width="1.4"/>
</svg>
