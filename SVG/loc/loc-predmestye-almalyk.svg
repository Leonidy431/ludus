<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Бедное предместье Алмалыка — глинобитные дома">
  <title>Предместье Алмалыка</title>
  <desc>Бедное предместье у стен Алмалыка: низкие глинобитные дома с плоскими кровлями, дувал, арык, верёвка с бельём, к улице подходит ослик с тележкой хлеба. ФОРМА: нужда простых людей любой веры. ДЕЙСТВИЕ: игрок везёт и раздаёт помощь, не спрашивая веры. ЦЕЛЬ: милостыня втайне — любовь, а не покупка душ. Миссия: 9 «Караван благотворительности».</desc>
  <defs>
    <linearGradient id="alm-nebo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a1808"/>
      <stop offset="100%" stop-color="#8a6a34"/>
    </linearGradient>
  </defs>
  <rect width="320" height="180" fill="url(#alm-nebo)"/>
  <!-- городская стена с башнями вдали -->
  <path d="M0 96 H320 V108 H0 Z" fill="#241405"/>
  <g fill="#241405"><rect x="40" y="84" width="16" height="14"/><rect x="150" y="80" width="18" height="18"/><rect x="262" y="84" width="16" height="14"/></g>
  <!-- пыльная улица -->
  <path d="M0 140 Q160 130 320 142 V180 H0 Z" fill="#8a6a34" opacity=".5"/>
  <!-- глинобитные дома -->
  <g fill="#2a1808" stroke="#c8a56a" stroke-width="1.8">
    <path d="M10 140 V108 H80 V140"/>
    <path d="M86 142 V116 H140 V142"/>
    <path d="M210 142 V112 H270 V142"/>
    <path d="M274 140 V118 H316 V140"/>
  </g>
  <!-- кровельные балки-выпуски -->
  <g stroke="#e8c87a" stroke-width="1.5">
    <path d="M14 108 h-6 M34 108 v-3 M58 108 v-3 M92 116 v-3 M120 116 v-3 M218 112 v-3 M250 112 v-3 M290 118 v-3"/>
  </g>
  <!-- двери и оконца -->
  <g fill="#140a02" stroke="#8a6a34" stroke-width="1">
    <rect x="30" y="122" width="12" height="18"/><rect x="58" y="116" width="8" height="6"/>
    <rect x="104" y="126" width="12" height="16"/><rect x="232" y="124" width="12" height="18"/>
    <rect x="288" y="126" width="8" height="6"/>
  </g>
  <!-- трещины в глине -->
  <path d="M66 126 L70 132 L68 138 M258 118 L262 126" fill="none" stroke="#8a6a34" stroke-width="1"/>
  <!-- верёвка с бельём -->
  <path d="M140 118 Q175 128 210 118" fill="none" stroke="#c8a56a" stroke-width="1"/>
  <g fill="#c8a56a" opacity=".8">
    <rect x="156" y="121" width="8" height="10"/><rect x="176" y="123" width="10" height="8"/><rect x="194" y="121" width="6" height="10"/>
  </g>
  <!-- арык вдоль улицы -->
  <path d="M0 156 Q100 150 200 158 Q260 162 320 156" fill="none" stroke="#1f5a73" stroke-width="2.5"/>
  <!-- ослик с тележкой хлеба -->
  <g transform="translate(146,150) scale(1.4)" stroke="#e8c87a" stroke-width="1.5" fill="#1a0e04">
    <path d="M0 0 H20 V-8 H0 Z"/>
    <circle cx="4" cy="3" r="4"/>
    <path d="M20 -4 H28 Q34 -6 34 -12 L38 -10 L36 -4 Q34 0 30 0 V6 M24 0 V6"/>
    <path d="M36 -12 L35 -17" fill="none"/>
    <path d="M3 -8 Q10 -14 17 -8" fill="#8a6a34"/>
  </g>
  <!-- ребёнок у порога ждёт -->
  <g stroke="#c8a56a" stroke-width="1.4" fill="#1a0e04">
    <circle cx="48" cy="130" r="2.6"/><path d="M48 133 L45 142 H51 Z"/>
  </g>
</svg>
