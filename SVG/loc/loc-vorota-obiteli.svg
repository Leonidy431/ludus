<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Ворота обители ночью и толпа с факелами">
  <title>Ворота обители</title>
  <desc>Ночь, стены обители и арочные ворота с крестом над ними; в воротах стоит монах с лампадой, перед воротами толпа людей с факелами. Толпа нарисована людьми, без масок зла и без примет народа: страсть гнева не этнична. ДЕЙСТВИЕ: игрок встречает ярость без оружия — словом, кротостью и открытой дверью, распознавая гнев в себе. ЦЕЛЬ: «Кроткий ответ отвращает гнев» (Притч. 15:1). Миссия 98.</desc>
  <!-- Арт-канон §9.0: умбра+золото; 2D-виньетка локации -->
  <defs>
    <linearGradient id="vorota-nebo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#140a02"/>
      <stop offset="60%" stop-color="#1a0e04"/>
      <stop offset="100%" stop-color="#2a1808"/>
    </linearGradient>
  </defs>
  <rect width="320" height="180" fill="url(#vorota-nebo)"/>
  <!-- звёзды -->
  <g fill="#e8c87a" opacity=".6"><circle cx="40" cy="20" r="1"/><circle cx="120" cy="14" r="1"/><circle cx="220" cy="22" r="1"/><circle cx="290" cy="12" r="1"/></g>
  <!-- стены обители -->
  <path d="M0 136 V74 H320 V136 Z" fill="#2a1808" stroke="#8a6a34" stroke-width="1.6"/>
  <g stroke="#3a2410" stroke-width="1"><path d="M0 90 H320 M0 106 H320 M0 122 H320"/></g>
  <!-- надвратная арка и ворота -->
  <path d="M124 136 V60 H196 V136 Z" fill="#3a2410" stroke="#c8a56a" stroke-width="2"/>
  <path d="M138 136 V98 Q160 76 182 98 V136 Z" fill="#140a02" stroke="#e8c87a" stroke-width="1.6"/>
  <!-- крест над воротами -->
  <path d="M160 58 V40 M154 46 H166 M155 53 L165 50" stroke="#e8c87a" stroke-width="2" fill="none"/>
  <!-- монах в воротах с лампадой -->
  <g fill="#1a0e04" stroke="#c8a56a" stroke-width="1.4">
    <circle cx="160" cy="106" r="5"/>
    <path d="M160 112 Q150 116 150 136 H170 Q170 116 160 112 Z"/>
  </g>
  <path d="M168 120 V126" stroke="#8a6a34" stroke-width="1"/>
  <circle cx="168" cy="128" r="2.4" fill="#e8c87a"/>
  <circle cx="168" cy="128" r="9" fill="#e8c87a" opacity=".15"/>
  <!-- земля -->
  <path d="M0 136 H320 V180 H0 Z" fill="#1a0e04"/>
  <!-- толпа людей с факелами: силуэты без черт народа -->
  <g fill="#140a02" stroke="#8a6a34" stroke-width="1.3">
    <circle cx="60" cy="146" r="6"/><path d="M60 153 Q48 158 48 180 H72 Q72 158 60 153 Z"/>
    <circle cx="94" cy="150" r="6"/><path d="M94 157 Q82 162 82 180 H106 Q106 162 94 157 Z"/>
    <circle cx="226" cy="148" r="6"/><path d="M226 155 Q214 160 214 180 H238 Q238 160 226 155 Z"/>
    <circle cx="262" cy="144" r="6"/><path d="M262 151 Q250 156 250 180 H274 Q274 156 262 151 Z"/>
    <circle cx="30" cy="152" r="5"/><path d="M30 158 Q20 162 20 180 H40 Q40 162 30 158 Z"/>
    <circle cx="294" cy="152" r="5"/><path d="M294 158 Q284 162 284 180 H304 Q304 162 294 158 Z"/>
  </g>
  <!-- факелы: пламя с редким красным -->
  <g stroke="#8a6a34" stroke-width="2"><path d="M70 162 L76 132 M104 164 L110 136 M216 162 L210 134 M252 158 L246 128"/></g>
  <g fill="#e8c87a">
    <path d="M76 132 q-5 -6 0 -14 q5 8 0 14 Z"/><path d="M110 136 q-5 -6 0 -14 q5 8 0 14 Z"/>
    <path d="M210 134 q-5 -6 0 -14 q5 8 0 14 Z"/><path d="M246 128 q-5 -6 0 -14 q5 8 0 14 Z"/>
  </g>
  <g fill="#c0392b">
    <path d="M76 131 q-2 -3 0 -6 q2 3 0 6 Z"/><path d="M110 135 q-2 -3 0 -6 q2 3 0 6 Z"/>
    <path d="M210 133 q-2 -3 0 -6 q2 3 0 6 Z"/><path d="M246 127 q-2 -3 0 -6 q2 3 0 6 Z"/>
  </g>
</svg>
