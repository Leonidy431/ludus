<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Лечебница обители — палата с лежанками и полками трав">
  <title>Лечебница обители</title>
  <desc>ФОРМА: сводчатая палата с тремя лежанками, полки с сосудами и пучки сушёных трав, лампада под сводом, свет из окна. ДЕЙСТВИЕ: дьякон учится травничеству у брата-врачевателя, готовит отвары и бдит у больных. ЦЕЛЬ: милосердие как дело веры, врачевство без суеверия. Миссия: 76 Травничество и медицина.</desc>
  <!-- Арт-канон §9.0: умбра+золото, без нимбов. Рисовано вручную: сырьё 99 репо не подходит (правило 0.15). -->
  <defs>
    <linearGradient id="le-nebo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a1808"/>
      <stop offset="60%" stop-color="#241405"/>
      <stop offset="100%" stop-color="#1a0e04"/>
    </linearGradient>
  </defs>
  <rect width="320" height="180" fill="url(#le-nebo)"/>
  <!-- свод палаты -->
  <path d="M0 0 H320 V40 Q160 -4 0 40 Z" fill="#140a02"/>
  <path d="M0 40 Q160 -4 320 40" fill="none" stroke="#8a6a34" stroke-width="2"/>
  <!-- пол -->
  <rect y="150" width="320" height="30" fill="#241405"/>
  <path d="M0 150 H320" stroke="#8a6a34" stroke-width="1.5"/>
  <!-- окно со светом -->
  <path d="M222 110 V62 Q236 46 250 62 V110 Z" fill="#8a6a34" stroke="#c8a56a" stroke-width="1.8"/>
  <path d="M236 52 V110 M222 84 H250" stroke="#2a1808" stroke-width="1.6"/>
  <path d="M222 110 L180 150 H240 L250 110 Z" fill="#e8c87a" opacity=".08"/>
  <!-- лампада под сводом -->
  <path d="M110 20 V40" stroke="#8a6a34" stroke-width="1.2"/>
  <path d="M102 42 H118 Q117 50 110 52 Q103 50 102 42 Z" fill="#c8a56a" stroke="#8a6a34" stroke-width="1.2"/>
  <path d="M110 32 Q113 37 110 41 Q107 37 110 32 Z" fill="#e8c87a"/>
  <circle cx="110" cy="38" r="9" fill="#e8c87a" opacity=".14"/>
  <!-- полки с сосудами -->
  <g stroke="#8a6a34" stroke-width="1.8"><path d="M20 70 H90 M20 100 H90"/></g>
  <g fill="#2a1808" stroke="#c8a56a" stroke-width="1.3">
    <path d="M26 70 V60 Q30 56 34 60 V70 Z"/><path d="M42 70 V58 H50 V70 Z"/>
    <path d="M58 70 Q56 62 62 60 Q68 62 66 70 Z"/><path d="M74 70 V62 H84 V70 Z"/>
    <path d="M28 100 V92 H36 V100 Z"/><path d="M46 100 Q44 90 50 88 Q56 90 54 100 Z"/>
    <path d="M64 100 V90 Q68 86 72 90 V100 Z"/>
  </g>
  <!-- пучки сушёных трав на шнуре -->
  <path d="M140 56 H200" stroke="#8a6a34" stroke-width="1.2"/>
  <g stroke="#c8a56a" stroke-width="1.3" fill="none">
    <path d="M150 56 V62 M150 62 l-4 12 M150 62 l0 13 M150 62 l4 12"/>
    <path d="M170 56 V62 M170 62 l-4 11 M170 62 l0 12 M170 62 l4 11"/>
    <path d="M190 56 V62 M190 62 l-4 12 M190 62 l0 13 M190 62 l4 12"/>
  </g>
  <!-- три лежанки с покрывалами и изголовьями -->
  <g fill="#2a1808" stroke="#c8a56a" stroke-width="1.6">
    <rect x="20" y="126" width="70" height="12"/>
    <rect x="110" y="126" width="70" height="12"/>
    <rect x="200" y="130" width="70" height="12"/>
  </g>
  <g fill="#8a6a34" stroke="#c8a56a" stroke-width="1.2">
    <rect x="22" y="120" width="14" height="6" rx="3"/>
    <rect x="112" y="120" width="14" height="6" rx="3"/>
    <rect x="202" y="124" width="14" height="6" rx="3"/>
  </g>
  <g stroke="#8a6a34" stroke-width="1.6">
    <path d="M24 138 V150 M86 138 V150 M114 138 V150 M176 138 V150 M204 142 V150 M266 142 V150"/>
  </g>
  <!-- ступка и чаша отвара -->
  <path d="M290 150 V140 H304 V150 Z" fill="#2a1808" stroke="#c8a56a" stroke-width="1.4"/>
  <path d="M300 140 L308 128" stroke="#c8a56a" stroke-width="1.6"/>
</svg>
