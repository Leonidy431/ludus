<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Свадебный двор — юрта и армянский дом, праздник">
  <title>Свадебный двор</title>
  <desc>ФОРМА: вечерний двор: слева юрта, справа каменный армянский дом с арочной дверью, между ними гирлянда фонарей, общий котёл и стол с хлебом, гранатовое дерево. ДЕЙСТВИЕ: две семьи готовят свадьбу; игрок помогает уважить обычаи обеих, не смешивая веру с суевериями. ЦЕЛЬ: любовь и уважение без растворения — различать обычай и таинство. Миссия: 97 Армяно-тюркский синкретизм.</desc>
  <!-- Арт-канон §9.0: умбра+золото. Оба народа — с уважением, без
       карикатуры. -->
  <defs>
    <linearGradient id="svad-nebo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0e04"/>
      <stop offset="100%" stop-color="#3a2410"/>
    </linearGradient>
  </defs>
  <rect width="320" height="180" fill="url(#svad-nebo)"/>
  <!-- звёзды -->
  <g fill="#e8c87a" opacity=".7"><circle cx="40" cy="20" r="1"/><circle cx="120" cy="14" r="1.2"/><circle cx="200" cy="24" r="1"/><circle cx="286" cy="16" r="1.2"/></g>
  <!-- земля двора -->
  <path d="M0 140 H320 V180 H0 Z" fill="#241405"/>
  <!-- юрта слева -->
  <path d="M20 140 V106 Q66 60 112 106 V140 Z" fill="#2a1808" stroke="#c8a56a" stroke-width="2"/>
  <path d="M20 112 Q66 100 112 112" fill="none" stroke="#e8c87a" stroke-width="1.5"/>
  <g fill="none" stroke="#8a6a34" stroke-width="1"><path d="M30 124 l6 -6 6 6 6 -6 6 6 M76 124 l6 -6 6 6 6 -6 6 6"/></g>
  <path d="M56 140 V116 H76 V140 Z" fill="#e8c87a"/>
  <path d="M62 78 H70" stroke="#c8a56a" stroke-width="2"/>
  <!-- армянский дом справа: камень, двускатная кровля, арка -->
  <path d="M206 140 V82 L252 58 L298 82 V140 Z" fill="#2a1808" stroke="#c8a56a" stroke-width="2"/>
  <g stroke="#8a6a34" stroke-width="1"><path d="M206 100 H298 M206 120 H298 M230 82 V100 M270 100 V120 M250 120 V140"/></g>
  <path d="M238 140 V112 Q252 98 266 112 V140 Z" fill="#e8c87a" stroke="#8a6a34" stroke-width="1.5"/>
  <rect x="276" y="90" width="10" height="12" fill="#e8c87a"/>
  <!-- гирлянда фонарей между домами -->
  <path d="M100 88 Q160 112 218 86" fill="none" stroke="#8a6a34" stroke-width="1.2"/>
  <g fill="#e8c87a"><circle cx="124" cy="98" r="3"/><circle cx="146" cy="103" r="3"/><circle cx="170" cy="103" r="3"/><circle cx="194" cy="96" r="3"/></g>
  <g fill="#c0392b"><circle cx="135" cy="101" r="2"/><circle cx="182" cy="100" r="2"/></g>
  <!-- гранатовое дерево -->
  <path d="M308 140 V112" stroke="#8a6a34" stroke-width="2"/>
  <circle cx="308" cy="104" r="11" fill="#2a1808" stroke="#8a6a34" stroke-width="1.4"/>
  <g fill="#c0392b"><circle cx="303" cy="102" r="2.2"/><circle cx="312" cy="108" r="2.2"/></g>
  <!-- общий стол с хлебом -->
  <path d="M130 146 H190 V150 H130 Z" fill="#8a6a34" stroke="#c8a56a" stroke-width="1.4"/>
  <path d="M134 150 V164 M186 150 V164" stroke="#8a6a34" stroke-width="2"/>
  <g fill="#c8a56a"><ellipse cx="148" cy="143" rx="8" ry="3"/><ellipse cx="170" cy="143" rx="7" ry="3"/></g>
  <!-- котёл на треноге с огнём -->
  <g transform="translate(160,168)">
    <path d="M-10 -4 Q0 6 10 -4 Z" fill="#2a1808" stroke="#c8a56a" stroke-width="1.2"/>
    <path d="M-4 6 Q0 0 4 6" fill="#e8c87a"/>
  </g>
  <!-- ковёр у юрты -->
  <path d="M40 158 H100 L96 172 H44 Z" fill="#8a6a34" stroke="#e8c87a" stroke-width="1.2"/>
  <path d="M60 162 l10 4 -10 4 M80 162 l-10 4 10 4" fill="none" stroke="#c0392b" stroke-width="1"/>
</svg>
