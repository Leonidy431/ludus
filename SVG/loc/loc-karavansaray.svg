<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Монастырь-каравансарай — укреплённый двор обители у дороги">
  <title>Монастырь-каравансарай</title>
  <desc>ФОРМА: укреплённый двор обители на Шёлковом пути — стена с воротами и башнями, аркада келий-стойл, склад под двускатной кровлей, малый храм внутри ограды. ДЕЙСТВИЕ: дьякон принимает караваны, даёт ночлег купцам любой веры и слушает их исповедь о пути. ЦЕЛЬ: гостеприимство как служение Христу в страннике. Миссии: 1 Монастырь-каравансарай, 25 Обет гостеприимства, 26 Миссионер-исповедник купцов, 53 Сеть информаторов, 54 Посольство к Папе.</desc>
  <!-- Арт-канон §9.0: умбра+золото, без нимбов. Рисовано вручную: сырьё 99 репо не подходит (правило 0.15). -->
  <defs>
    <linearGradient id="kar-nebo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0e04"/>
      <stop offset="60%" stop-color="#3a2410"/>
      <stop offset="100%" stop-color="#8a6a34"/>
    </linearGradient>
  </defs>
  <rect width="320" height="180" fill="url(#kar-nebo)"/>
  <!-- дальние хребты Тянь-Шаня -->
  <path d="M0 92 L40 60 L70 84 L110 50 L150 80 L190 56 L236 86 L276 58 L320 82 V110 H0 Z" fill="#241405"/>
  <!-- степь перед обителью -->
  <path d="M0 150 Q160 140 320 150 V180 H0 Z" fill="#2a1808"/>
  <!-- малый храм за стеной: четверик, барабан, глава, крест -->
  <g stroke="#c8a56a" stroke-width="1.8" fill="#2a1808">
    <path d="M136 100 V78 H168 V100"/>
    <path d="M144 78 V68 H160 V78"/>
    <path d="M144 68 Q152 54 160 68 Z" fill="#8a6a34"/>
  </g>
  <path d="M152 56 V44 M147 49 h10" stroke="#e8c87a" stroke-width="1.8"/>
  <circle cx="152" cy="88" r="2" fill="#e8c87a"/>
  <!-- склад с двускатной кровлей -->
  <g stroke="#c8a56a" stroke-width="1.6" fill="#2a1808">
    <path d="M214 104 V86 L238 74 L262 86 V104"/>
    <rect x="232" y="92" width="12" height="12" fill="#140a02"/>
  </g>
  <!-- крепостная стена с зубцами и две башни -->
  <path d="M30 150 V104 H290 V150 Z" fill="#241405" stroke="#8a6a34" stroke-width="1.8"/>
  <path d="M30 104 h8 v-4 h8 v4 h8 v-4 h8 v4 h8 v-4 h8 v4 h8 v-4 h8 v4 h8 v-4 h8 v4 h8 v-4 h8 v4" fill="none" stroke="#8a6a34" stroke-width="1.4"/>
  <path d="M186 104 h8 v-4 h8 v4 h8 v-4 h8 v4 h8 v-4 h8 v4 h8 v-4 h8 v4 h8 v-4 h8 v4 h8 v-4 h8 v4" fill="none" stroke="#8a6a34" stroke-width="1.4"/>
  <g fill="#2a1808" stroke="#c8a56a" stroke-width="1.8">
    <path d="M132 150 V96 H146 V150 Z"/>
    <path d="M174 150 V96 H188 V150 Z"/>
  </g>
  <!-- ворота с огнём фонаря: двор открыт страннику -->
  <path d="M146 150 V118 Q160 100 174 118 V150 Z" fill="#140a02" stroke="#e8c87a" stroke-width="1.8"/>
  <circle cx="160" cy="112" r="2.4" fill="#e8c87a"/>
  <circle cx="160" cy="112" r="7" fill="#e8c87a" opacity=".15"/>
  <!-- аркада келий-стойл вдоль стены -->
  <g fill="#140a02" stroke="#c8a56a" stroke-width="1.3">
    <path d="M42 146 V128 Q49 120 56 128 V146 Z"/>
    <path d="M66 146 V128 Q73 120 80 128 V146 Z"/>
    <path d="M90 146 V128 Q97 120 104 128 V146 Z"/>
    <path d="M114 146 V128 Q120 122 126 128 V146 Z"/>
    <path d="M196 146 V128 Q202 122 208 128 V146 Z"/>
    <path d="M218 146 V128 Q225 120 232 128 V146 Z"/>
    <path d="M242 146 V128 Q249 120 256 128 V146 Z"/>
    <path d="M266 146 V128 Q273 120 280 128 V146 Z"/>
  </g>
  <!-- караван у ворот: два верблюда -->
  <g fill="#1a0e04" stroke="#e8c87a" stroke-width="1.3">
    <path d="M196 170 v-8 q2 -8 8 -6 q3 -6 7 0 q3 -3 5 0 l4 -4 l2 3 l-4 5 v10 h-2 v-8 h-14 v8 Z"/>
    <path d="M232 172 v-8 q2 -8 8 -6 q3 -6 7 0 q3 -3 5 0 l4 -4 l2 3 l-4 5 v10 h-2 v-8 h-14 v8 Z"/>
  </g>
  <!-- дорога к воротам -->
  <path d="M160 152 Q150 166 128 180" fill="none" stroke="#8a6a34" stroke-width="1.4" stroke-dasharray="4 3"/>
</svg>
