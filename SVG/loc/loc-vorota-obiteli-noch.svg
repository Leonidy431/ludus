<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Ворота обители ночью — открытая калитка и фонарь привратника">
  <title>Ворота обители ночью</title>
  <desc>Форма: ночь, стены обители, над воротами крест, в створке открыта калитка, привратник держит фонарь, к воротам по тропе идут двое беглецов. Действие: игрок решает принять ищущих убежища, хотя это опасно. Цель: гостеприимство к странникам (Мф. 25:35); обитель как тихая пристань, а не крепость. Миссия: 63 «Миссия-убежище».</desc>
  <!-- Арт-канон §9.0: умбра+золото, без нимбов. -->
  <rect width="320" height="180" fill="#1a0e04"/>
  <!-- звёзды и месяц -->
  <g fill="#e8d9b8" opacity=".7">
    <circle cx="30" cy="20" r="1"/><circle cx="80" cy="36" r="1"/><circle cx="250" cy="18" r="1"/>
    <circle cx="290" cy="42" r="1"/><circle cx="200" cy="30" r="1"/>
  </g>
  <path d="M60 28 A10 10 0 1 0 70 44 A8 8 0 1 1 60 28 Z" fill="#e8c87a" opacity=".8"/>
  <!-- стены обители -->
  <path d="M0 150 V90 H110 V150 M210 150 V90 H320 V150" fill="#2a1808" stroke="#c8a56a" stroke-width="2"/>
  <g stroke="#8a6a34" stroke-width="1" opacity=".7">
    <path d="M0 106 H110 M0 122 H110 M0 138 H110 M210 106 H320 M210 122 H320 M210 138 H320"/>
  </g>
  <!-- надвратная башня -->
  <path d="M110 150 V74 H210 V150" fill="#2a1808" stroke="#c8a56a" stroke-width="2"/>
  <path d="M110 74 L160 54 L210 74 Z" fill="#3a2410" stroke="#c8a56a" stroke-width="2"/>
  <path d="M160 54 V36 M154 42 H166" stroke="#e8c87a" stroke-width="2"/>
  <!-- арка ворот, створки -->
  <path d="M128 150 V104 Q160 78 192 104 V150 Z" fill="#140a02" stroke="#e8c87a" stroke-width="2"/>
  <path d="M160 88 V150" stroke="#8a6a34" stroke-width="1.5"/>
  <!-- открытая калитка — внутри тёплый свет -->
  <rect x="164" y="118" width="16" height="32" fill="#e8c87a" opacity=".55"/>
  <path d="M180 118 L190 114 V146 L180 150" fill="#2a1808" stroke="#c8a56a" stroke-width="1.2"/>
  <!-- привратник с фонарём -->
  <g stroke="#c8a56a" stroke-width="1.5" fill="#1a0e04">
    <circle cx="172" cy="126" r="3"/>
    <path d="M172 129 L166 150 H178 Z"/>
  </g>
  <path d="M178 134 L186 134 V138" stroke="#c8a56a" stroke-width="1.2" fill="none"/>
  <rect x="183" y="138" width="6" height="7" fill="#e8c87a" stroke="#8a6a34" stroke-width="1"/>
  <circle cx="186" cy="141" r="12" fill="#e8c87a" opacity=".14"/>
  <!-- земля и тропа -->
  <path d="M0 150 H320 V180 H0 Z" fill="#241405"/>
  <path d="M172 150 Q200 164 260 176" fill="none" stroke="#8a6a34" stroke-width="1.4" stroke-dasharray="4 3"/>
  <!-- двое ищущих убежища на тропе -->
  <g stroke="#c8a56a" stroke-width="1.4" fill="#1a0e04">
    <circle cx="232" cy="152" r="3"/><path d="M232 155 L227 172 H237 Z"/>
    <circle cx="244" cy="155" r="2.5"/><path d="M244 157.5 L240 172 H248 Z"/>
  </g>
</svg>
