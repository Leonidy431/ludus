<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Школа ремёсел — навес с гончарным кругом, наковальней и досками для письма">
  <title>Школа ремёсел</title>
  <desc>ФОРМА: двор обители под полотняным навесом: гончарный круг с сосудом, малая наковальня на колоде с молотом, скамья с досками для письма, полка с сохнущими горшками. ДЕЙСТВИЕ: братия учит местных детей и сирот гончарству, кузнечному делу и грамоте. ЦЕЛЬ: труд и грамота как дар человеку — «кто не хочет трудиться, тот и не ешь» (2 Фес. 3:10). Миссия: 74 Школа ремёсел.</desc>
  <!-- Арт-канон §9.0: умбра+золото, без нимбов. Рисовано вручную: сырьё 99 репо не подходит (правило 0.15). -->
  <defs>
    <linearGradient id="shkola-remesel-nebo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0e04"/>
      <stop offset="60%" stop-color="#2a1808"/>
      <stop offset="100%" stop-color="#3a2410"/>
    </linearGradient>
  </defs>
  <rect width="320" height="180" fill="url(#shkola-remesel-nebo)"/>
  <!-- стена обители и горы -->
  <path d="M0 96 L50 66 L96 86 L150 58 L210 88 L262 64 L320 84 V110 H0 Z" fill="#241405"/>
  <rect y="100" width="320" height="22" fill="#2a1808" stroke="#8a6a34" stroke-width="1.5"/>
  <!-- двор -->
  <rect y="122" width="320" height="58" fill="#2a1808"/>
  <path d="M0 122 H320" stroke="#8a6a34" stroke-width="1.5"/>
  <!-- навес -->
  <g stroke="#8a6a34" stroke-width="2.4"><path d="M40 160 V62 M280 160 V62 M160 160 V56"/></g>
  <path d="M28 64 L160 50 L292 64 V74 H28 Z" fill="#c8a56a" stroke="#8a6a34" stroke-width="1.5"/>
  <path d="M28 74 q11 8 22 0 q11 8 22 0 q11 8 22 0 q11 8 22 0 q11 8 22 0 q11 8 22 0 q11 8 22 0 q11 8 22 0 q11 8 22 0 q11 8 22 0 q11 8 22 0 q11 8 22 0" fill="#c8a56a" stroke="#8a6a34" stroke-width="1.2"/>
  <!-- гончарный круг с сосудом -->
  <g stroke="#c8a56a" stroke-width="1.8">
    <ellipse cx="86" cy="158" rx="16" ry="4" fill="#2a1808"/>
    <path d="M86 158 V140" fill="none"/>
    <ellipse cx="86" cy="140" rx="12" ry="3" fill="#8a6a34"/>
  </g>
  <path d="M79 139 Q76 128 81 122 H91 Q96 128 93 139 Z" fill="#c8a56a" stroke="#8a6a34" stroke-width="1.3"/>
  <!-- колода и малая наковальня с молотом -->
  <rect x="146" y="140" width="24" height="20" fill="#2a1808" stroke="#8a6a34" stroke-width="1.6"/>
  <path d="M140 132 H176 L170 136 H162 L164 140 H152 L154 136 H146 Z" fill="#8a6a34" stroke="#e8c87a" stroke-width="1.4"/>
  <g transform="rotate(-30 184 128)"><rect x="178" y="122" width="12" height="6" fill="#8a6a34" stroke="#c8a56a" stroke-width="1"/><path d="M184 128 V144" stroke="#c8a56a" stroke-width="2"/></g>
  <!-- скамья с досками для письма -->
  <g stroke="#c8a56a" stroke-width="1.6" fill="none"><path d="M212 148 H264 M216 148 V160 M260 148 V160"/></g>
  <g fill="#8a6a34" stroke="#e8c87a" stroke-width="1.2">
    <rect x="216" y="134" width="20" height="14" rx="1.5"/><rect x="240" y="134" width="20" height="14" rx="1.5"/>
  </g>
  <g stroke="#2a1808" stroke-width="1"><path d="M219 139 H233 M219 143 H230 M243 139 H257 M243 143 H254"/></g>
  <!-- полка с сохнущими горшками -->
  <path d="M290 132 H316" stroke="#c8a56a" stroke-width="1.6"/>
  <g fill="#c8a56a" stroke="#8a6a34" stroke-width="1"><path d="M293 132 Q291 124 295 121 H299 Q303 124 301 132 Z M306 132 Q304 125 308 122 H312 Q316 125 314 132 Z"/></g>
</svg>
