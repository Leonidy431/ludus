<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Монастырский сад и виноградник на террасах под Тянь-Шанем">
  <title>Монастырский виноградник</title>
  <desc>Горный склон, разбитый на террасы с каменными подпорами, ряды лозы с гроздьями, выше малая монастырская церковь, за ней снежный Тянь-Шань. ФОРМА: камень, лоза и терпение нескольких поколений. ДЕЙСТВИЕ: игрок ухаживает за садом и винодельней обители: обрезка, полив, урожай для трапезы и для литургии. ЦЕЛЬ: «Аз есмь лоза, вы же рождие» (Ин. 15:5). Миссия 70.</desc>
  <!-- Арт-канон §9.0: умбра+золото; 2D-виньетка локации -->
  <defs>
    <linearGradient id="sad-nebo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0e04"/>
      <stop offset="60%" stop-color="#3a2410"/>
      <stop offset="100%" stop-color="#8a6a34"/>
    </linearGradient>
  </defs>
  <rect width="320" height="180" fill="url(#sad-nebo)"/>
  <!-- снежный Тянь-Шань -->
  <path d="M0 80 L50 40 L84 66 L130 30 L176 70 L220 38 L270 70 L320 48 V100 H0 Z" fill="#241405"/>
  <g fill="#e8c87a" opacity=".7"><path d="M44 46 L50 40 L56 46 Z"/><path d="M123 37 L130 30 L137 37 Z"/><path d="M214 44 L220 38 L226 44 Z"/></g>
  <!-- склон -->
  <path d="M0 180 V110 Q120 80 320 96 V180 Z" fill="#2a1808"/>
  <!-- малая церковь обители наверху -->
  <g stroke="#c8a56a" stroke-width="1.6" fill="#3a2410">
    <path d="M238 96 V80 H258 V96"/>
    <path d="M242 80 Q248 70 254 80 Z" fill="#8a6a34"/>
  </g>
  <path d="M248 72 V64 M245 67 h6" stroke="#e8c87a" stroke-width="1.6"/>
  <circle cx="248" cy="88" r="1.6" fill="#e8c87a"/>
  <!-- террасы с каменными подпорами -->
  <g fill="#3a2410" stroke="#c8a56a" stroke-width="1.5">
    <path d="M0 124 Q140 104 320 112 V118 Q140 110 0 130 Z"/>
    <path d="M0 146 Q150 126 320 134 V140 Q150 132 0 152 Z"/>
    <path d="M0 168 Q160 148 320 156 V162 Q160 154 0 174 Z"/>
  </g>
  <!-- ряды лозы на кольях -->
  <g stroke="#c8a56a" stroke-width="1.6">
    <path d="M30 120 V110 M80 115 V104 M130 111 V100 M180 110 V99 M230 110 V99 M280 111 V100"/>
    <path d="M40 142 V132 M100 136 V126 M160 133 V123 M220 132 V122 M290 134 V124"/>
  </g>
  <g fill="none" stroke="#e8c87a" stroke-width="1.8">
    <path d="M30 110 Q55 104 80 104 Q105 98 130 100 Q155 96 180 99 Q205 96 230 99 Q255 96 280 100"/>
    <path d="M40 132 Q70 126 100 126 Q130 120 160 123 Q190 120 220 122 Q255 120 290 124"/>
  </g>
  <!-- гроздья на переднем плане -->
  <g fill="#8a6a34" stroke="#e8c87a" stroke-width="1">
    <circle cx="56" cy="160" r="3"/><circle cx="62" cy="160" r="3"/><circle cx="59" cy="165" r="3"/><circle cx="59" cy="170" r="2.6"/>
    <circle cx="196" cy="152" r="3"/><circle cx="202" cy="152" r="3"/><circle cx="199" cy="157" r="3"/>
  </g>
  <path d="M59 157 q6 -8 14 -6 M199 149 q6 -8 14 -6" fill="none" stroke="#c8a56a" stroke-width="1.4"/>
</svg>
