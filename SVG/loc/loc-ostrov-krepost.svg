<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Островная крепость на Иссык-Куле">
  <title>Островная крепость</title>
  <desc>Каменная крепость на скалистом острове посреди Иссык-Куля: стены, башни, узкое окно с огнём, к острову идёт лодка, позади снежный Тянь-Шань. ФОРМА: неприступные стены, где держат пленников. ДЕЙСТВИЕ: игрок добивается выкупа и милости к пленникам, переговорами и заступничеством, а не штурмом. ЦЕЛЬ: «В темнице бех, и приидосте ко Мне» (Мф. 25:36). Миссия 24.</desc>
  <!-- Арт-канон §9.0: умбра+золото; 2D-виньетка локации -->
  <defs>
    <linearGradient id="ostrov-nebo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0e04"/>
      <stop offset="60%" stop-color="#3a2410"/>
      <stop offset="100%" stop-color="#8a6a34"/>
    </linearGradient>
  </defs>
  <rect width="320" height="180" fill="url(#ostrov-nebo)"/>
  <!-- снежные хребты -->
  <path d="M0 92 L40 60 L70 84 L110 52 L150 86 L200 58 L240 84 L280 62 L320 88 V104 H0 Z" fill="#241405"/>
  <g fill="#e8c87a" opacity=".6"><path d="M104 58 L110 52 L116 58 Z"/><path d="M194 64 L200 58 L206 64 Z"/></g>
  <!-- озеро -->
  <rect y="100" width="320" height="80" fill="#0d2a3a"/>
  <g stroke="#1f5a73" stroke-width="1.4" fill="none">
    <path d="M20 118 q10 -4 20 0 M60 150 q10 -4 20 0 M240 124 q10 -4 20 0 M270 156 q10 -4 20 0 M120 164 q10 -4 20 0"/>
  </g>
  <!-- скалистый остров -->
  <path d="M110 136 L130 112 L200 110 L222 136 Z" fill="#2a1808" stroke="#8a6a34" stroke-width="1.6"/>
  <!-- стены и башни крепости -->
  <g fill="#3a2410" stroke="#c8a56a" stroke-width="1.8">
    <path d="M136 114 V92 H196 V114 Z"/>
    <path d="M128 114 V76 H144 V114 Z"/>
    <path d="M188 114 V80 H204 V114 Z"/>
  </g>
  <g fill="#c8a56a">
    <path d="M128 76 v-4 h4 v4 M136 76 v-4 h4 v4 M188 80 v-4 h4 v4 M196 80 v-4 h4 v4"/>
  </g>
  <path d="M140 92 h6 v-3 h6 v3 h6 v-3 h6 v3 h6 v-3 h6 v3 h6 v-3 h6 v3" fill="none" stroke="#c8a56a" stroke-width="1.4"/>
  <!-- узкое окно с огнём — там ждут -->
  <rect x="134" y="88" width="4" height="8" fill="#e8c87a"/>
  <path d="M160 114 V104 Q166 98 172 104 V114 Z" fill="#140a02" stroke="#e8c87a" stroke-width="1.2"/>
  <!-- отражение в воде -->
  <path d="M136 140 H196" stroke="#8a6a34" stroke-width="1.2" opacity=".5"/>
  <!-- лодка переговорщиков -->
  <g transform="translate(64,146)">
    <path d="M0 0 H30 L26 6 H4 Z" fill="#2a1808" stroke="#c8a56a" stroke-width="1.4"/>
    <path d="M15 0 V-14 L24 -2 Z" fill="#c8a56a"/>
    <circle cx="8" cy="-3" r="2.4" fill="#140a02" stroke="#e8c87a" stroke-width="1"/>
  </g>
</svg>
