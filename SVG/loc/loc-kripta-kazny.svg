<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Крипта казны — каменная подклеть с нишами и масляным светильником">
  <title>Крипта казны</title>
  <desc>Форма: сводчатая каменная подклеть: арки, ниши с ларцами и кувшинами монет, один масляный светильник на полке. Действие: казначей миссии ведёт учёт и хранит общее достояние. Цель: честность хранителя — казна общины, не личное сокровище. Миссия: 80 «Хранение монет».</desc>
  <!-- Арт-канон §9.0: умбра+золото, без нимбов. -->
  <rect width="320" height="180" fill="#140a02"/>
  <!-- свод подклети -->
  <path d="M0 0 H320 V40 Q240 6 160 6 Q80 6 0 40 Z" fill="#2a1808" stroke="#8a6a34" stroke-width="1.5"/>
  <!-- три арки-ниши -->
  <g fill="#1a0e04" stroke="#c8a56a" stroke-width="2">
    <path d="M28 150 V84 Q56 54 84 84 V150 Z"/>
    <path d="M128 150 V74 Q160 38 192 74 V150 Z"/>
    <path d="M236 150 V84 Q264 54 292 84 V150 Z"/>
  </g>
  <!-- кладка камня -->
  <g stroke="#3a2410" stroke-width="1.2" fill="none">
    <path d="M0 60 H24 M96 60 H124 M196 60 H232 M296 60 H320 M0 100 H24 M96 100 H124 M196 100 H232 M296 100 H320 M12 60 V100 M108 80 V120 M214 80 V120 M308 60 V100"/>
  </g>
  <!-- полки в нишах: ларцы и кувшины монет -->
  <g stroke="#8a6a34" stroke-width="1.5"><path d="M32 118 H80 M132 110 H188 M240 118 H288"/></g>
  <g fill="#2a1808" stroke="#e8c87a" stroke-width="1.4">
    <rect x="38" y="106" width="16" height="12"/><rect x="58" y="108" width="14" height="10"/>
    <rect x="248" y="106" width="16" height="12"/>
    <path d="M270 118 Q264 110 270 104 H278 Q284 110 278 118 Z"/>
    <path d="M40 150 Q34 140 40 132 H48 Q54 140 48 150 Z"/>
    <path d="M254 150 Q248 140 254 132 H262 Q268 140 262 150 Z"/>
  </g>
  <!-- масляный светильник в центральной нише -->
  <path d="M148 110 Q160 118 172 110 L166 104 H154 Z" fill="#8a6a34" stroke="#e8c87a" stroke-width="1.5"/>
  <path d="M170 106 Q176 104 178 100" fill="none" stroke="#8a6a34" stroke-width="1.5"/>
  <path d="M154 104 Q151 96 154 90 Q158 97 154 104 Z" fill="#e8c87a"/>
  <circle cx="155" cy="96" r="22" fill="#e8c87a" opacity=".1"/>
  <!-- книга учёта у светильника -->
  <path d="M164 150 V126 H186 V150 Z" fill="#2a1808" stroke="#c8a56a" stroke-width="1.5"/>
  <path d="M168 132 H182 M168 138 H182 M168 144 H182" stroke="#8a6a34" stroke-width="1"/>
  <!-- каменный пол -->
  <rect y="150" width="320" height="30" fill="#241405"/>
  <path d="M0 150 H320 M60 150 L40 180 M160 150 V180 M260 150 L280 180" stroke="#3a2410" stroke-width="1.2"/>
</svg>
